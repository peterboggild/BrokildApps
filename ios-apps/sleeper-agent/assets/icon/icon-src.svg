<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Sleeper Agent app icon, 1024x1024, full bleed.
       No rounded corners and no alpha: iOS masks the corners itself, and
       Apple rejects app icons that carry an alpha channel. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0"    stop-color="#161b24"/>
      <stop offset="0.5"  stop-color="#0b0d12"/>
      <stop offset="1"    stop-color="#06070a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#ground)"/>

  <!-- crescent: 460px square, centred at (512, 432) -->
  <svg x="282" y="202" width="460" height="460" viewBox="143 173.5 205.5 205.5">
    <path d="M336 300a92 92 0 1 1-114-114 76 76 0 0 0 114 114z"
          fill="none" stroke="#d9a05b" stroke-width="20"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- four swells beneath it, 400 wide and centred -->
  <path d="M312 800q50-62 100 0t100 0t100 0t100 0"
        fill="none" stroke="#d9a05b" stroke-width="26"
        stroke-linecap="round" opacity=".62"/>
</svg>
