name: Sleeper Agent iOS (TestFlight)

# Builds, signs and uploads the iOS app from a GitHub-hosted macOS runner, so
# that shipping it never requires owning a Mac. See
# ios-apps/sleeper-agent/NO_MAC_ROUTE.md for how to produce the six secrets
# this needs — all of which can be made in a browser plus openssl, on any
# operating system.
#
# NEVER RUN AUTOMATICALLY. Manual dispatch only, deliberately:
#   - macOS runner minutes are free on public repositories but not unlimited
#     in spirit, and this is a slow job;
#   - every upload consumes a build number, and Apple rejects a repeat;
#   - a half-finished commit should not become a TestFlight build.
#
# ⚠️  THIS WORKFLOW HAS NEVER BEEN RUN. It was written on Linux, like the Swift
#     it builds. Expect to fix it on the first attempt. `mode: build-only`
#     exists precisely so the first attempt costs nothing but time.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: build-only
        type: choice
        options:
          - build-only        # compile and archive; no signing, no upload
          - testflight        # sign, export and upload to TestFlight
      build_number:
        description: "Build number (must be higher than every previous upload)"
        required: false
        default: ""

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    # A GitHub-hosted Mac. Free minutes on public repositories.
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      PROJECT_DIR: ios-apps/sleeper-agent
      XCODE_PROJECT: ios-apps/sleeper-agent/ios/App/App.xcodeproj
      SCHEME: App
      BUNDLE_ID: com.peterboggild.sleeperagent

    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain we actually got
        run: |
          echo "macOS:  $(sw_vers -productVersion)"
          echo "Xcode:  $(xcodebuild -version | head -1)"
          echo "SDKs:"; xcodebuild -showsdks | grep -i iphoneos || true
          echo "Node:   $(node --version)"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---------------------------------------------------------------
      # The tests run first. They need no Mac and take about a minute, and
      # there is no sense burning macOS minutes on a build of a broken app.
      # ---------------------------------------------------------------
      - name: Install test tooling
        run: npm install --no-save playwright@1.56.1

      - name: Install Chromium for the test suites
        run: npx playwright install chromium

      - name: Web app regression suite
        run: node health-apps/sleep-noise/test/regression.mjs

      - name: Native bridge suite
        run: node health-apps/sleep-noise/test/native-bridge.mjs

      # ---------------------------------------------------------------
      # Build www/ from the canonical index.html and sync it into the
      # Xcode project. build-www.mjs fails on purpose if the web app has
      # lost a hook the native build needs, or gained a network request.
      # ---------------------------------------------------------------
      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Build www and sync the iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run sync

      - name: Set the build number
        if: inputs.build_number != ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ inputs.build_number }}" \
            ios/App/App/Info.plist 2>/dev/null || true
          agvtool new-version -all "${{ inputs.build_number }}" || true
        continue-on-error: true

      # ---------------------------------------------------------------
      # build-only: prove it compiles. No secrets needed, so this is the
      # right first thing to run and it costs nothing to get wrong.
      # ---------------------------------------------------------------
      - name: Compile (no signing)
        if: inputs.mode == 'build-only'
        run: |
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | xcpretty || xcodebuild \
              -project "$XCODE_PROJECT" -scheme "$SCHEME" \
              -configuration Release -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build

      # ---------------------------------------------------------------
      # Everything below signs and uploads, and only runs on request.
      # ---------------------------------------------------------------
      - name: Check the signing secrets are present
        if: inputs.mode == 'testflight'
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in CERT PROFILE ASC_KEY; do
            if [ -z "${!name}" ]; then echo "missing secret: $name"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "See ios-apps/sleeper-agent/NO_MAC_ROUTE.md for how to create these."
            exit 1
          fi

      - name: Install the signing certificate and profile
        if: inputs.mode == 'testflight'
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A throwaway keychain, unlocked only for this job. The password is
          # random and never leaves the runner, which is destroyed afterwards.
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$CERT_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' \
            /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

          echo "Installed identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive
        if: inputs.mode == 'testflight'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

      - name: Export the .ipa
        if: inputs.mode == 'testflight'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Written here rather than committed: ExportOptions.plist carries a
          # team identifier, and .gitignore keeps signing material out of git.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: inputs.mode == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool looks for the key by name in this directory.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the archive, whatever happened
        if: always() && inputs.mode == 'testflight'
        uses: actions/upload-artifact@v4
        with:
          name: sleeper-agent-archive
          path: ${{ runner.temp }}/App.xcarchive
          retention-days: 7
          if-no-files-found: ignore

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 2>/dev/null || true
