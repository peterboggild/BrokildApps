name: Engines (Linux, headless)

# The benches that are in the repo but run nowhere else.
#
# Each plugin that ships has its own workflow, and those already cover their
# own engine and the shared rack: clone-wars.yml and rite-of-passage.yml both
# trigger on BrokildWorldFX/** and both run the BWFX bench, and
# rite-of-passage.yml runs roptest. Repeating either here would just run the
# same bench a third time on every push to the rack, so this file is only the
# projects nothing else gates:
#
#   Legion   a full bench (113 checks) and no workflow of its own - it has no
#            published zip yet, so no release job exists to carry it
#   DSW      no bench, so a compile gate: the host and both shipped
#            experiments must still build
#   Marmalade 120  its bench (24 checks) and spicecheck, which runs the
#            whole amp against ngspice from the same warmed-up state - no
#            release yet, so nothing else runs either
#
# All are plain C++17 with no JUCE and no audio device, so they cost a few
# minutes between them (spicecheck is most of it). When Legion ships and gains a release
# workflow, move its bench there and this file becomes DSW alone.

on:
  push:
    paths:
      - "vst3-apps/legion/plugin/**"
      - "vst3-apps/marmalade-120/plugin/**"
      - "vst3-apps/marmalade-50/plugin/**"
      - "dsw/**"
      - ".github/workflows/engines.yml"
  pull_request:
    paths:
      - "vst3-apps/legion/plugin/**"
      - "vst3-apps/marmalade-120/plugin/**"
      - "vst3-apps/marmalade-50/plugin/**"
      - "dsw/**"
      - ".github/workflows/engines.yml"
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  legion:
    name: Legion bench (vocal harmoniser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the bench
        working-directory: vst3-apps/legion/plugin
        run: |
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Release
          cmake --build test/build --parallel
      - name: Run the bench
        working-directory: vst3-apps/legion/plugin/test
        run: ./build/legiontest

  dsw:
    name: DSW host + experiment plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The host is a headless HTTP server - the browser is the GUI - so it
      # needs no display here.
      - name: Build the host and its plugins
        working-directory: dsw
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: The bundles the host loads must exist
        working-directory: dsw
        run: |
          test -x dsw
          test -f plugins/gray-scott/gray-scott.so
          test -f plugins/wave-tank/wave-tank.so

  marmalade:
    name: Marmalade 120 bench + solver vs ngspice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Build the bench
        working-directory: vst3-apps/marmalade-120/plugin
        run: |
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Release
          cmake --build test/build --parallel
      - name: Run the bench
        working-directory: vst3-apps/marmalade-120/plugin
        run: ./test/build/mmtest
      - name: The solver against ngspice
        working-directory: vst3-apps/marmalade-120/plugin
        run: TMPDIR="$RUNNER_TEMP" ./test/build/spicecheck

  marmalade50:
    name: Marmalade 50 bench + split + solver vs ngspice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Build the bench
        working-directory: vst3-apps/marmalade-50/plugin
        run: |
          cmake -S test -B test/build -DCMAKE_BUILD_TYPE=Release
          cmake --build test/build --parallel
      - name: Run the bench
        working-directory: vst3-apps/marmalade-50/plugin
        run: ./test/build/mm50test
      - name: The split solve against the whole circuit
        working-directory: vst3-apps/marmalade-50/plugin
        run: ./test/build/mm50split
      - name: The whole circuit against ngspice
        working-directory: vst3-apps/marmalade-50/plugin
        run: TMPDIR="$RUNNER_TEMP" ./test/build/mm50spice
