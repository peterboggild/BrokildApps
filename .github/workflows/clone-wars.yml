name: Clone Wars VST3 (win64)

on:
  push:
    paths:
      - "vst3-apps/clone-wars/plugin/**"
      - "BrokildWorldFX/**"        # the shared BWFX rack is compiled in
      - ".github/workflows/clone-wars.yml"
  # A manual dispatch additionally publishes the house-style release zip
  # (VST3 + standalone + manual + readme) as the Clone-Wars-VST3-win64.zip
  # asset on the `downloads` release - what the site's download button serves -
  # and records its size and sha256 in vst3-apps/clone-wars/app.json.
  # (Zips are not committed any more: since 2026-09-23 every plug-in download
  # is a release asset and vst3-apps/*/*.zip is gitignored.)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-test:
    name: Engine sanity (Linux, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run BWFX bench (the shared world rack)
        working-directory: BrokildWorldFX/test
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I../src -I../modules \
              bench.cpp ../src/bwfx_json.cpp ../src/bwfx_rack.cpp ../src/bwfx_macros.cpp \
              ../modules/bwfx_conv.cpp ../modules/bwfx_modules.cpp \
              ../modules/bwfx_spectra.cpp -o bwfxtest
          ./bwfxtest
      - name: Build and run render test
        working-directory: vst3-apps/clone-wars/plugin/test
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I../Source/Core \
              -I../../../../BrokildWorldFX/src -I../../../../BrokildWorldFX/modules \
              render_test.cpp ../Source/Core/cw_core.cpp \
              ../../../../BrokildWorldFX/src/bwfx_json.cpp \
              ../../../../BrokildWorldFX/src/bwfx_rack.cpp \
              ../../../../BrokildWorldFX/src/bwfx_macros.cpp \
              ../../../../BrokildWorldFX/modules/bwfx_conv.cpp \
              ../../../../BrokildWorldFX/modules/bwfx_modules.cpp \
              ../../../../BrokildWorldFX/modules/bwfx_spectra.cpp -o render_test
          mkdir -p wavs
          ./render_test wavs
      - name: Run DSP quality audit (aliasing, THD, clicks, DC, headroom)
        working-directory: vst3-apps/clone-wars/plugin/test
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I../Source/Core \
              audit.cpp ../Source/Core/cw_core.cpp -o audit
          ./audit
      - uses: actions/upload-artifact@v4
        with:
          name: clone-wars-test-renders
          path: vst3-apps/clone-wars/plugin/test/wavs/*.wav
          retention-days: 14

  windows-build:
    name: Plugin build (Windows)
    runs-on: windows-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v5
      - name: Fetch WebView2 SDK (NuGet)
        working-directory: vst3-apps/clone-wars/plugin
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory webview2
      - name: Configure (fetches JUCE 8)
        working-directory: vst3-apps/clone-wars/plugin
        # No -G: the runner's default generator is whichever Visual Studio is
        # installed (the 2026 images dropped VS 2022, so naming a year breaks).
        run: >
          cmake -S . -B build -A x64
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/vst3-apps/clone-wars/plugin/webview2"
      - name: Build Release
        working-directory: vst3-apps/clone-wars/plugin
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        working-directory: vst3-apps/clone-wars/plugin
        run: |
          $out = "package/Clone-Wars-VST3-win64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse "build/CloneWars_artefacts/Release/VST3/Clone Wars.vst3" "$out/"
          Copy-Item "build/CloneWars_artefacts/Release/Standalone/Clone Wars.exe" "$out/"
          Copy-Item "../Clone-Wars-Manual.pdf" "$out/"
          Copy-Item "../README.txt" "$out/"
      - uses: actions/upload-artifact@v4
        with:
          name: Clone-Wars-VST3-win64
          path: vst3-apps/clone-wars/plugin/package/**
          retention-days: 30
      - name: Publish the release zip to the downloads release (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: vst3-apps/clone-wars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PowerShell 7 (.NET Core) writes forward slashes in entry names
          Compress-Archive -Path "plugin/package/Clone-Wars-VST3-win64" -DestinationPath "Clone-Wars-VST3-win64.zip" -Force
          gh release upload downloads "Clone-Wars-VST3-win64.zip" --clobber --repo "${{ github.repository }}"
          # what a stranger downloads must be what was built: fetch it back and compare
          $url = "https://github.com/${{ github.repository }}/releases/download/downloads/Clone-Wars-VST3-win64.zip"
          Start-Sleep -Seconds 5
          Invoke-WebRequest $url -OutFile fetched.zip
          $want = (Get-FileHash "Clone-Wars-VST3-win64.zip" -Algorithm SHA256).Hash.ToLower()
          $got  = (Get-FileHash "fetched.zip" -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "the public asset ($got) is not the built zip ($want)" }
          $bytes = (Get-Item "Clone-Wars-VST3-win64.zip").Length
          # record size + hash in app.json, editing the text so formatting survives
          $j = Get-Content app.json -Raw
          $j = [regex]::Replace($j, '("name"\s*:\s*"Clone-Wars-VST3-win64\.zip"[\s\S]*?"bytes"\s*:\s*)\d+', ('${1}' + $bytes))
          $j = [regex]::Replace($j, '("name"\s*:\s*"Clone-Wars-VST3-win64\.zip"[\s\S]*?"sha256"\s*:\s*")[0-9a-f]+', ('${1}' + $want))
          [IO.File]::WriteAllText("$PWD/app.json", $j, (New-Object Text.UTF8Encoding($false)))
          Remove-Item fetched.zip, "Clone-Wars-VST3-win64.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { "app.json already current"; exit 0 }
          git commit -m "Clone Wars: download re-published from CI ($bytes bytes) [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
