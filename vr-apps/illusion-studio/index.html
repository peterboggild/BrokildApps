<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Illusion Studio</title>
<style>
:root{
  --bg:#0d0e11; --panel:#16181d; --panel2:#1d2027; --line:#2a2e37; --text:#e4e6eb; --dim:#9aa1ad;
  --acc:#e0b13a; --acc2:#8c55d6; --danger:#d9534f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100vh;overflow:hidden}
#side{width:360px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#side header b{font-size:15px;letter-spacing:.3px}
#side header .logo{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--acc) 0 25%,var(--acc2) 0 50%,var(--acc) 0 75%,var(--acc2) 0)}
#panels{overflow-y:auto;flex:1;padding-bottom:40px}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:9px 14px;font-weight:600;background:var(--panel2);list-style:none;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'▸';display:inline-block;width:14px;color:var(--dim)}
details[open]>summary::before{content:'▾'}
summary .sub{font-weight:400;color:var(--dim);margin-left:6px}
.body{padding:8px 12px 12px}
.row{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:6px;margin:3px 0}
.row label{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.two{grid-template-columns:118px 1fr}
input[type=range]{width:100%;accent-color:var(--acc)}
input.num{width:58px;background:#0f1114;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:2px 4px;font-size:12px}
select,input[type=text]{width:100%;background:#0f1114;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:3px 5px;font-size:12.5px}
input[type=color]{width:100%;height:24px;border:1px solid var(--line);background:#0f1114;border-radius:4px;padding:1px}
button{background:#262a33;color:var(--text);border:1px solid #363b47;border-radius:5px;padding:5px 9px;cursor:pointer;font-size:12.5px}
button:hover{background:#2f3440}
button.primary{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.small{padding:2px 7px;font-size:12px}
button.danger:hover{background:var(--danger);border-color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.list{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li:hover{background:#20232b}
.li.sel{background:#2b2615;outline:1px solid var(--acc)}
.li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tag{color:var(--dim);font-size:11px}
.li input[type=checkbox]{margin:0}
.chk{display:flex;align-items:center;gap:6px;margin:4px 0;color:var(--text)}
.hint{color:var(--dim);font-size:12px;margin:4px 0 6px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0}
.sw label{font-size:10.5px;color:var(--dim);text-align:center;display:block}
.sep{height:1px;background:var(--line);margin:8px 0}
h4{margin:8px 0 4px;font-size:12px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
#view{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0;background:
  repeating-conic-gradient(#121318 0 25%, #0f1014 0 50%) 0 0/24px 24px}
#c{display:block;box-shadow:0 0 0 1px #000,0 8px 30px rgba(0,0,0,.6)}
#status{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:12px;background:rgba(10,10,14,.75);padding:4px 8px;border-radius:5px;pointer-events:none}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);font-size:16px}
#busy.on{display:flex}
#vrBtn{position:absolute;right:14px;top:12px;font-size:14px;padding:8px 14px}
#vrBtn[hidden]{display:none}
button[disabled]{opacity:.45;cursor:default}
@media (max-width:760px){#app{flex-direction:column-reverse}#side{width:100%;height:50vh}#view{height:50vh}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
  "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"
}}
</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <header><span class="logo"></span><b>Illusion Studio</b><span style="color:var(--dim);font-size:12px">self-moving surfaces</span></header>
    <div id="panels"></div>
  </aside>
  <main id="view"><canvas id="c"></canvas><button id="vrBtn" class="primary" hidden>Enter VR</button><div id="status">loading…</div><div id="busy">Rendering…</div></main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2, D2R = Math.PI / 180;
const Q = new URLSearchParams(location.search);

/* =====================================================================
   Palettes and pattern presets
   Every look has five colours: bg (grout / mid tone), a + b (tile fills),
   light + dark (the asymmetric edges that drive the drift illusion).
   ===================================================================== */
const PALETTES = {
  'Purple & gold': { bg:'#c99b2e', a:'#6b2a96', b:'#9b4fcc', light:'#ffffff', dark:'#16101b' },
  'Ruby & gold':   { bg:'#c99b2e', a:'#8c1f3e', b:'#bf3c63', light:'#ffffff', dark:'#1a0b10' },
  'Kitaoka':       { bg:'#7d8a36', a:'#2342b8', b:'#e8d41f', light:'#ffffff', dark:'#000000' },
  'Red & green':   { bg:'#2f8f3f', a:'#c2272d', b:'#e65a50', light:'#ffffff', dark:'#0d0d0d' },
  'Blue & orange': { bg:'#ec8b25', a:'#1c4ea6', b:'#4a82dc', light:'#ffffff', dark:'#0c1020' },
  'Teal & coral':  { bg:'#ee7a62', a:'#11706e', b:'#25a8a3', light:'#ffffff', dark:'#06201f' },
  'Pink & lime':   { bg:'#a8d13c', a:'#cf2f7d', b:'#ec66a6', light:'#ffffff', dark:'#1a0710' },
  'Ice':           { bg:'#93bfe2', a:'#1b3d6e', b:'#3c6eb0', light:'#ffffff', dark:'#050a14' },
  'Greyscale':     { bg:'#808080', a:'#3d3d3d', b:'#bdbdbd', light:'#ffffff', dark:'#000000' },
  'Ink & paper':   { bg:'#e9e2d0', a:'#2b3a8c', b:'#46527a', light:'#ffffff', dark:'#000000' },
};

const LOOK_PRESETS = {
  'Hex drift':          { pattern:'tiles', lattice:'hex', shape:'hex', fill:'solid', cell:0.75, gap:0.22, edge:0.07, round:0.04, rowH:1, tilt:0, altTilt:false, angle:135, altRows:false, band:1 },
  'Hex split drift':    { pattern:'tiles', lattice:'hex', shape:'hex', fill:'split', cell:0.75, gap:0.2, edge:0.06, round:0.05, rowH:1, tilt:0, altTilt:false, angle:90, altRows:false, band:1 },
  'Rotating snakes':    { pattern:'tiles', lattice:'brick', shape:'ellipse', fill:'steps', cell:0.8, gap:0.06, edge:0.09, round:0, rowH:0.72, tilt:0, altTilt:false, angle:0, altRows:true, band:1, palette:'Kitaoka' },
  'Fraser–Wilcox':      { pattern:'tiles', lattice:'brick', shape:'ellipse', fill:'gradient', cell:0.8, gap:0.14, edge:0, round:0, rowH:0.8, tilt:0, altTilt:false, angle:0, altRows:true, band:2, palette:'Greyscale' },
  'Pinna–Brelstaff':    { pattern:'tiles', lattice:'square', shape:'rect', fill:'solid', cell:0.6, gap:0.42, edge:0.06, round:0.02, rowH:1, tilt:30, altTilt:true, angle:135, altRows:false, band:2, palette:'Greyscale' },
  'Square drift':       { pattern:'tiles', lattice:'square', shape:'rect', fill:'split', cell:0.7, gap:0.2, edge:0.07, round:0.08, rowH:1, tilt:0, altTilt:false, angle:45, altRows:true, band:3 },
  'Brick drift':        { pattern:'tiles', lattice:'brick', shape:'rect', fill:'solid', cell:0.8, gap:0.14, edge:0.06, round:0.05, rowH:0.5, tilt:0, altTilt:false, angle:0, altRows:true, band:1 },
  'Bubble drift':       { pattern:'tiles', lattice:'hex', shape:'ellipse', fill:'split', cell:0.7, gap:0.16, edge:0.06, round:0, rowH:1, tilt:0, altTilt:false, angle:0, altRows:true, band:2 },
  'Diamond drift':      { pattern:'tiles', lattice:'brick', shape:'diamond', fill:'solid', cell:0.8, gap:0.12, edge:0.06, round:0, rowH:0.5, tilt:0, altTilt:false, angle:90, altRows:false, band:1 },
  'Ouchi':              { pattern:'ouchi', cell:0.5, p1:3, p2:10, palette:'Greyscale' },
  'Enigma':             { pattern:'enigma', cell:0.12, p1:5, p2:24, palette:'Ink & paper' },
  'Scintillating grid': { pattern:'scint', cell:1.0, p1:0.16, p2:0.12, palette:'Greyscale' },
  'Café wall':          { pattern:'cafe', cell:0.8, p1:0.08, p2:0.5, rowH:1, palette:'Greyscale' },
};

function makeLook(presetName = 'Hex drift', paletteName = 'Purple & gold', over = {}) {
  const L = {
    pattern:'tiles', lattice:'hex', shape:'hex', fill:'solid', cell:0.75, gap:0.22, edge:0.07, round:0.04,
    rowH:1, tilt:0, altTilt:false, angle:135, altRows:false, band:1, rot90:false, p1:3, p2:10,
    preset: presetName, palette: paletteName, colors: { ...PALETTES[paletteName] },
  };
  applyLookPreset(L, presetName, true);
  if (paletteName) { L.palette = paletteName; L.colors = { ...PALETTES[paletteName] }; }
  Object.assign(L, over);
  return L;
}
function applyLookPreset(L, name, skipPalette = false) {
  const P = LOOK_PRESETS[name]; if (!P) return;
  for (const [k, v] of Object.entries(P)) if (k !== 'palette') L[k] = v;
  L.preset = name;
  if (P.palette && !skipPalette) { L.palette = P.palette; L.colors = { ...PALETTES[P.palette] }; }
}
const clone = (o) => JSON.parse(JSON.stringify(o));

/* =====================================================================
   Item (space/object) and distortion types
   ===================================================================== */
const TYPES = {
  floor:   { label:'Floor / hole', space:true, cast:true, def:{ size:60, hole:true, holeR:2.0, rim:3.0, depth:12, throat:1, hx:0, hz:0 },
             ui:[['size','Size (radius)',10,150,1],['hole','Through-hole','bool'],['holeR','Hole radius',0.3,10,0.05],['rim','Rim width',0.2,15,0.05],
                 ['depth','Hole depth',0.5,40,0.1],['throat','Throat cell width',0.3,3,0.01],['hx','Hole x',-20,20,0.05],['hz','Hole z',-20,20,0.05]] },
  tunnel:  { label:'Tunnel', space:true, cast:false, def:{ radius:3, length:120 }, ui:[['radius','Radius',0.5,20,0.05],['length','Length',5,400,1]] },
  room:    { label:'Room', space:true, cast:false, def:{ w:18, h:9, d:18 }, ui:[['w','Width',4,80,0.1],['h','Height',2,40,0.1],['d','Depth',4,80,0.1]] },
  dome:    { label:'Dome', space:true, cast:false, def:{ radius:30 }, ui:[['radius','Radius',5,150,0.5]] },
  sphere:  { label:'Sphere', def:{ radius:1.5, map:'mercator' },
             ui:[['radius','Radius',0.1,15,0.01],['map','Mapping','select',[['mercator','Conformal (cells keep shape)'],['equirect','Latitude–longitude']]]] },
  torus:   { label:'Torus', def:{ R:2, r:0.7 }, ui:[['R','Ring radius',0.3,15,0.01],['r','Tube radius',0.05,6,0.01]] },
  cylinder:{ label:'Cylinder', def:{ radius:1, height:3, caps:true }, ui:[['radius','Radius',0.1,10,0.01],['height','Height',0.1,30,0.05],['caps','Caps','bool']] },
  cube:    { label:'Box', def:{ sx:2, sy:2, sz:2 }, ui:[['sx','Size x',0.1,30,0.05],['sy','Size y',0.1,30,0.05],['sz','Size z',0.1,30,0.05]] },
  cone:    { label:'Cone', def:{ radius:1.2, height:2.5 }, ui:[['radius','Base radius',0.1,10,0.01],['height','Height',0.1,30,0.05]] },
};
const DTYPES = {
  bump:   { label:'Bump / dent',   def:{ radius:2, amp:1 } },
  ripple: { label:'Ripple',        def:{ radius:12, amp:0.4, wavelength:2.5, phase:0 } },
  wave:   { label:'Wave',          def:{ amp:0.4, wavelength:4, angle:0, phase:0 } },
  twist:  { label:'Twist',         def:{ axis:'y', rate:10 } },
  bulge:  { label:'Bulge / pinch', def:{ radius:3, amp:0.4 } },
};

let uid = 1;
function nextName(type) {
  const base = TYPES[type].label.split(' ')[0];
  let n = 1; while (state && state.items && state.items.some(i => i.name === `${base} ${n}`)) n++;
  return `${base} ${n}`;
}
function newItem(type, over = {}) {
  const T = TYPES[type];
  const it = { id:'i' + (uid++), type, name:'', visible:true, cast: !!(T.space ? T.cast : true), reverse:false,
               ownLook:false, look:null, params:{ ...T.def }, pos:[0,0,0], rot:[0,0,0] };
  for (const [k, v] of Object.entries(over)) { if (k === 'params') Object.assign(it.params, v); else it[k] = v; }
  if (!it.name) it.name = nextName(type);
  return it;
}
function newDist(type, over = {}) {
  const d = { id:'d' + (uid++), type, enabled:true, target:'all', c:[0,0,0], radius:3, amp:0.5, wavelength:3, angle:0, phase:0, axis:'y', rate:10,
              ...clone(DTYPES[type].def) };
  Object.assign(d, over);
  return d;
}

const ENV_DEFAULT = { bg:'#231d12', fog:0, keyAz:135, keyEl:55, key:1.0, amb:0.75, shadows:true, soft:4, gloss:0.55,
                      ao:true, aoInt:0.9, aoRadius:0.8, pr:1.5,
                      vrQuality:1, vrSpeed:1.5, vrTurn:30, vrPanel:1, mrSpaces:false };
const EXPORT_DEFAULT = { format:'square', rotate:false, native:true, cw:16, ch:9, size:3000, quality:0.92 };

/* =====================================================================
   Scene presets
   ===================================================================== */
const SCENES = {
  'Ball by a wormhole': () => {
    const floor = newItem('floor', { name:'Floor', params:{ size:60, hole:true, holeR:1.0, rim:2.3, depth:7, throat:0.6, hx:1.8, hz:-0.2 } });
    const ball = newItem('sphere', { name:'Ball', pos:[-2.7,1.7,0.3], rot:[0,25,0], params:{ radius:1.7 }, reverse:true,
                                     ownLook:true, look:makeLook('Hex drift','Ruby & gold',{ cell:0.72 }) });
    return { look:makeLook('Hex drift','Purple & gold',{ cell:0.72 }), items:[floor, ball], dists:[],
             env:{ ...ENV_DEFAULT }, cam:{ pos:[0,10.5,3.4], target:[0,0,0], fov:45 } };
  },
  'Wormhole (two sheets)': () => {
    const a = newItem('floor', { name:'Upper sheet', cast:false, params:{ size:17, hole:true, holeR:2, rim:7, depth:7, throat:0.7 } });
    const b = newItem('floor', { name:'Lower sheet', cast:false, reverse:true, pos:[0,-14,0], rot:[180,0,0], params:{ size:17, hole:true, holeR:2, rim:7, depth:7, throat:0.7 } });
    return { look:makeLook('Hex drift','Blue & orange',{ cell:0.9 }), items:[a,b], dists:[],
             env:{ ...ENV_DEFAULT, bg:'#0b0d14', fog:0, keyEl:70, amb:0.9, key:0.6 }, cam:{ pos:[27,-4,17], target:[0,-7,0], fov:50 } };
  },
  'Infinite tunnel': () => {
    const t = newItem('tunnel', { name:'Tunnel', params:{ radius:3, length:160 } });
    const s = newItem('sphere', { name:'Ball', pos:[0,-1.6,60], params:{ radius:1.2 }, ownLook:true, look:makeLook('Hex drift','Purple & gold',{ cell:0.5 }) });
    const tw = newDist('twist', { axis:'z', rate:1.2, target:t.id });
    return { look:makeLook('Brick drift','Red & green',{ cell:0.8 }), items:[t,s], dists:[tw],
             env:{ ...ENV_DEFAULT, bg:'#000000', fog:0.035, keyEl:80, key:0.5, amb:1.0, ao:true }, cam:{ pos:[0,0.3,77], target:[0,-0.3,60], fov:70 } };
  },
  'Room of objects': () => {
    const room = newItem('room', { name:'Room', params:{ w:20, h:10, d:24 } });
    const sp = newItem('sphere', { name:'Snake sphere', pos:[-3.2,1.5,1.2], params:{ radius:1.5 }, ownLook:true, look:makeLook('Rotating snakes','Kitaoka',{ cell:0.6 }) });
    const to = newItem('torus', { name:'Torus', pos:[3,0.6,0.8], params:{ R:1.6, r:0.6 }, ownLook:true, look:makeLook('Square drift','Pink & lime',{ cell:0.45 }) });
    const cu = newItem('cube', { name:'Box', pos:[0.2,1.1,-3.5], rot:[0,30,0], params:{ sx:2.2, sy:2.2, sz:2.2 }, ownLook:true, look:makeLook('Brick drift','Blue & orange',{ cell:0.5 }) });
    const co = newItem('cone', { name:'Cone', pos:[4.4,1.25,-3.6], params:{ radius:1.2, height:2.5 }, ownLook:true, look:makeLook('Hex drift','Ruby & gold',{ cell:0.45 }) });
    const cy = newItem('cylinder', { name:'Cylinder', pos:[-4.6,1.5,-3.8], params:{ radius:1, height:3 }, ownLook:true, look:makeLook('Pinna–Brelstaff','Greyscale',{ cell:0.45 }) });
    return { look:makeLook('Hex drift','Teal & coral',{ cell:0.8 }), items:[room,sp,to,cu,co,cy], dists:[],
             env:{ ...ENV_DEFAULT, bg:'#101010', amb:0.8, key:0.8, keyAz:140, keyEl:60 }, cam:{ pos:[0.5,5.2,10.8], target:[0,1.2,-1.5], fov:60 } };
  },
  'Ripple pond': () => {
    const f = newItem('floor', { name:'Pond', params:{ size:60, hole:false } });
    const t = newItem('torus', { name:'Ring', pos:[0,2.6,0], rot:[70,0,0], params:{ R:2.1, r:0.55 }, reverse:true });
    const s = newItem('sphere', { name:'Ball', pos:[4.2,1.6,2.2], params:{ radius:1 }, ownLook:true, look:makeLook('Hex drift','Purple & gold',{ cell:0.5 }) });
    const r = newDist('ripple', { target:f.id, radius:14, amp:0.45, wavelength:3 });
    return { look:makeLook('Rotating snakes','Kitaoka',{ cell:0.8 }), items:[f,t,s], dists:[r],
             env:{ ...ENV_DEFAULT, bg:'#14170c', fog:0.02 }, cam:{ pos:[0,9,13], target:[0,0.5,0], fov:45 } };
  },
  'Dome and ball': () => {
    const d = newItem('dome', { name:'Dome', params:{ radius:28 } });
    const f = newItem('floor', { name:'Floor', params:{ size:28, hole:false }, reverse:true });
    const s = newItem('sphere', { name:'Ball', pos:[0,2,0], params:{ radius:2 }, ownLook:true, look:makeLook('Hex drift','Ice',{ cell:0.7 }) });
    return { look:makeLook('Fraser–Wilcox','Greyscale',{ cell:0.9 }), items:[d,f,s], dists:[],
             env:{ ...ENV_DEFAULT, bg:'#000000', amb:0.85 }, cam:{ pos:[0,4,12], target:[0,2.5,0], fov:55 } };
  },
};

/* =====================================================================
   GLSL pattern library (injected into MeshStandardMaterial)
   ===================================================================== */
const GLSL = /* glsl */`
uniform int uPat; uniform int uLat; uniform int uShape; uniform int uFill;
uniform vec2 uMul; uniform float uRot90;
uniform float uGap; uniform float uEdge; uniform float uRound; uniform float uRowH;
uniform float uTilt; uniform float uAltTilt; uniform float uAltRows; uniform float uBand;
uniform float uP1; uniform float uP2;
uniform vec2 uDir;
uniform vec3 uBg; uniform vec3 uA; uniform vec3 uB; uniform vec3 uLight; uniform vec3 uDark;

float il_cov(float d, float aa){ return clamp(0.5 - d / aa, 0.0, 1.0); }
float il_sq(float x, float aa){ return clamp((0.25 - abs(fract(x) - 0.5)) / max(aa, 1e-4), -1.0, 1.0); }
float il_hex(vec2 p, float r){           // hexagon with flat sides facing +-x (pointy top)
  const vec3 k = vec3(-0.866025404, 0.5, 0.577350269);
  p = abs(p.yx);
  p -= 2.0 * min(dot(k.xy, p), 0.0) * k.xy;
  p -= vec2(clamp(p.x, -k.z * r, k.z * r), r);
  return length(p) * sign(p.y);
}
float il_box(vec2 p, vec2 b){ vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
float il_rowH(){ return uLat == 0 ? 0.8660254 : uRowH; }
vec2 il_half(){
  float g = uGap * 0.5;
  return max(vec2(0.5 - g, (uLat == 0 ? 0.5 : il_rowH() * 0.5) - g), vec2(0.01));
}
float il_shape(vec2 q, vec2 b){
  float rr = min(uRound, 0.95 * min(b.x, b.y));
  if (uShape == 0) { float r = min(b.x, b.y); return il_hex(q, r - rr) - rr; }
  if (uShape == 1) return il_box(q, b - rr) - rr;
  if (uShape == 2) return (length(q / b) - 1.0) * min(b.x, b.y);
  vec2 k = abs(q) / b; return (k.x + k.y - 1.0) * (b.x * b.y) / length(b);
}

vec3 il_tiles(vec2 p, float aa){
  float H = il_rowH();
  float off = (uLat == 1) ? 0.0 : 0.5;
  vec2 b = il_half();
  float R = max(b.x, b.y);
  float r0 = floor(p.y / H + 0.5);
  float dD = 1e5, dL = 1e5, dF = 1e5;
  vec2 qF = vec2(0.0), dirF = uDir;
  for (int j = -1; j <= 1; j++) {
    float r = r0 + float(j);
    float o = mod(r, 2.0) * off;

        if (ax === 'y') { t = dy; a1 = dx; a2 = dz; } else if (ax === 'z') { t = dz; a1 = dx; a2 = dy; } else { t = dx; a1 = dy; a2 = dz; }
        const ang = d.rate * D2R * t, c = Math.cos(ang), s = Math.sin(ang);
        const b1 = a1 * c - a2 * s, b2 = a1 * s + a2 * c;
        if (ax === 'y') { pos[o] = cx + b1; pos[o+2] = cz + b2; }
        else if (ax === 'z') { pos[o] = cx + b1; pos[o+1] = cy + b2; }
        else { pos[o+1] = cy + b1; pos[o+2] = cz + b2; }
        continue;
      }
    }
    pos[o] = x + nrm[o] * f; pos[o+1] = y + nrm[o+1] * f; pos[o+2] = z + nrm[o+2] * f;
  }
}

/* =====================================================================
   Renderer, scene, lights
   ===================================================================== */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:false });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 3000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = false;
controls.addEventListener('change', () => requestRender());
controls.addEventListener('end', () => { saveCam(); scheduleSave(); });

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.75);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
scene.add(key, key.target);

let composer = null, gtao = null, aoState = 'idle';
async function initAO() {
  if (aoState !== 'idle') return;
  aoState = 'loading';
  try {
    const [{ EffectComposer }, { RenderPass }, { OutputPass }, { GTAOPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
      import('three/addons/postprocessing/GTAOPass.js'),
    ]);
    const sz = renderer.getDrawingBufferSize(new THREE.Vector2());
    const rt = new THREE.WebGLRenderTarget(sz.x, sz.y, { type:THREE.HalfFloatType, samples:4 });
    composer = new EffectComposer(renderer, rt);
    composer.addPass(new RenderPass(scene, camera));
    gtao = new GTAOPass(scene, camera, sz.x, sz.y);
    gtao.output = GTAOPass.OUTPUT.Default;
    composer.addPass(gtao);
    composer.addPass(new OutputPass());
    aoState = 'ready';
    layout(); updateEnv(); requestRender();
  } catch (e) {
    console.warn('Ambient occlusion unavailable:', e);
    aoState = 'failed'; composer = null;
    setStatus('Ambient occlusion unavailable on this browser — rendering without it.');
  }
}
function updateAOParams() {
  if (!gtao) return;
  gtao.blendIntensity = state.env.aoInt;
  try {
    gtao.updateGtaoMaterial({ radius:state.env.aoRadius, distanceExponent:1, thickness:1, scale:1, samples:16 });
    gtao.updatePdMaterial({ lumaPhi:10, depthPhi:2, normalPhi:3, radius:4, rings:2, samples:16 });
  } catch (e) { /* older/newer API: keep defaults */ }
}
const useAO = () => state.env.ao && aoState === 'ready' && composer;

/* =====================================================================
   State
   ===================================================================== */
let state = null;
const objs = new Map();          // item id -> { group, meshes:[{mesh, wrap}] }
const dirty = new Set();
let renderQueued = false, rebuildAll = false;

function loadState(s) {
  for (const [, o] of objs) disposeObj(o);
  objs.clear();
  VR.hoverItem = null;
  if (VR.session) { VR.placeIn = 3; VR.placeMode = 'viewpoint'; UI.dirty = true; }
  state = s;
  state.sel = state.sel || (state.items[0] && state.items[0].id) || null;
  state.selDist = state.selDist || (state.dists[0] && state.dists[0].id) || null;
  state.env = { ...ENV_DEFAULT, ...(state.env || {}) };
  state.exp = { ...EXPORT_DEFAULT, ...(state.exp || {}) };
  if (state.exp.aspect && !(state.exp.format && state.exp.format !== 'square' )) {   // scenes saved before named formats
    const m = LEGACY_ASPECT[state.exp.aspect]; if (m) { state.exp.format = m[0]; state.exp.rotate = m[1]; }
  }
  delete state.exp.aspect;
  let maxId = 0;
  for (const x of [...state.items, ...state.dists]) maxId = Math.max(maxId, parseInt(String(x.id).slice(1)) || 0);
  uid = Math.max(uid, maxId + 1);
  for (const it of state.items) dirty.add(it.id);
  applyCam(state.cam);
  updateEnv();
  layout();
  renderPanels();
  requestRender();
}

function disposeObj(o) {
  scene.remove(o.group);
  for (const m of o.meshes) { m.mesh.geometry.dispose(); m.mesh.material.dispose(); }
}

function rebuildItem(it) {
  let o = objs.get(it.id);
  const oldMats = o ? o.meshes.map(m => m.mesh.material) : [];
  if (o) { scene.remove(o.group); for (const m of o.meshes) m.mesh.geometry.dispose(); }
  o = { group:new THREE.Group(), meshes:[] };
  objs.set(it.id, o);
  const M = itemMatrix(it);
  const nm = new THREE.Matrix3().setFromMatrix4(M);
  const dists = state.dists.filter(d => distApplies(d, it));
  const parts = buildParts(it);
  parts.forEach((g, pi) => {
    // orientation from the rest shape
    let n = fixSeamsAndNormalize(g, accumNormals(g.pos, g.idx));
    let s = 0;
    for (let k = 0; k < g.pos.length; k += 3 * 7) {
      const r = g.ref(g.pos[k], g.pos[k+1], g.pos[k+2]);
      s += n[k] * r[0] + n[k+1] * r[1] + n[k+2] * r[2];
    }
    if (s < 0) {
      for (let t = 0; t < g.idx.length; t += 3) { const tmp = g.idx[t+1]; g.idx[t+1] = g.idx[t+2]; g.idx[t+2] = tmp; }
      for (let k = 0; k < n.length; k++) n[k] = -n[k];
    }
    // to world
    const v = new THREE.Vector3();
    for (let k = 0; k < g.pos.length; k += 3) {
      v.set(g.pos[k], g.pos[k+1], g.pos[k+2]).applyMatrix4(M); g.pos[k] = v.x; g.pos[k+1] = v.y; g.pos[k+2] = v.z;
      v.set(n[k], n[k+1], n[k+2]).applyMatrix3(nm).normalize(); n[k] = v.x; n[k+1] = v.y; n[k+2] = v.z;
    }
    if (dists.length) {
      for (const d of dists) applyDistortion(g.pos, n, d);
      n = fixSeamsAndNormalize(g, accumNormals(g.pos, g.idx));
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(g.pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(n, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(g.uv, 2));
    geo.setIndex(new THREE.BufferAttribute(g.idx, 1));
    geo.computeBoundingBox(); geo.computeBoundingSphere();
    const mat = oldMats[pi] || makeMaterial();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    mesh.userData.itemId = it.id;
    o.group.add(mesh);
    o.meshes.push({ mesh, wrap:g.wrap });
  });
  for (let i = parts.length; i < oldMats.length; i++) oldMats[i].dispose();
  scene.add(o.group);
  refreshItemLook(it);
}

function lookOf(it) { return it.ownLook && it.look ? it.look : state.look; }
function refreshItemLook(it) {
  const o = objs.get(it.id); if (!o) return;
  o.group.visible = it.visible && !(VR.mode === 'ar' && TYPES[it.type].space && !state.env.mrSpaces);
  for (const m of o.meshes) {
    applyLook(m.mesh.material, lookOf(it), m.wrap, it.reverse, state.env.gloss);
    m.mesh.castShadow = it.cast && state.env.shadows;
  }
}
function refreshAllLooks() { for (const it of state.items) refreshItemLook(it); requestRender(); }

function markItem(it) { dirty.add(it.id); requestRender(); scheduleSave(); }
function markAll() { rebuildAll = true; requestRender(); scheduleSave(); }

function requestRender() {
  if (renderQueued || VR.session) return;
  renderQueued = true;
  requestAnimationFrame(frame);
}
function frame() {
  renderQueued = false;
  if (VR.session) return;            // the headset loop renders while in VR
  processDirty();
  draw();
}
function processDirty() {
  if (rebuildAll) { for (const it of state.items) dirty.add(it.id); rebuildAll = false; }
  if (dirty.size) {
    for (const id of dirty) { const it = state.items.find(i => i.id === id); if (it) rebuildItem(it); }
    dirty.clear();
    for (const [id, o] of objs) if (!state.items.some(i => i.id === id)) { disposeObj(o); objs.delete(id); }
    updateShadowBox();
  }
}
function draw() { if (useAO() && !renderer.xr.isPresenting) composer.render(); else renderer.render(scene, camera); }

function updateShadowBox() {
  const box = new THREE.Box3(); let any = false;
  for (const it of state.items) {
    if (!it.visible) continue;
    const o = objs.get(it.id); if (!o) continue;
    if (it.type === 'floor') {
      if (!it.params.hole) continue;
      const M = itemMatrix(it), A = it.params.holeR + it.params.rim + 1;
      const c = new THREE.Vector3(it.params.hx, 0, it.params.hz).applyMatrix4(M);
      box.expandByPoint(c.clone().addScalar(A)); box.expandByPoint(c.clone().addScalar(-A));
      box.expandByPoint(new THREE.Vector3(it.params.hx, -it.params.depth, it.params.hz).applyMatrix4(M));
      any = true; continue;
    }
    if (TYPES[it.type].space) continue;
    for (const m of o.meshes) box.union(m.mesh.geometry.boundingBox);
    any = true;
  }
  if (!any) box.set(new THREE.Vector3(-6,-1,-6), new THREE.Vector3(6,4,6));
  box.expandByScalar(2);
  const ctr = box.getCenter(new THREE.Vector3());
  const rad = box.getSize(new THREE.Vector3()).length() / 2;
  const e = state.env;
  const dir = new THREE.Vector3(Math.cos(e.keyEl*D2R) * Math.cos(e.keyAz*D2R), Math.sin(e.keyEl*D2R), Math.cos(e.keyEl*D2R) * Math.sin(e.keyAz*D2R));
  key.position.copy(ctr).addScaledVector(dir, rad * 2);
  key.target.position.copy(ctr);
  const sc = key.shadow.camera;
  sc.left = -rad; sc.right = rad; sc.top = rad; sc.bottom = -rad; sc.near = 0.1; sc.far = rad * 4;
  sc.updateProjectionMatrix();
  key.target.updateMatrixWorld();
}

function updateEnv() {
  const e = state.env;
  const ar = VR.mode === 'ar';      // mixed reality: the room shows through
  scene.background = ar ? null : new THREE.Color(e.bg);
  scene.fog = !ar && e.fog > 0 ? new THREE.FogExp2(e.bg, e.fog) : null;
  hemi.intensity = e.amb;
  key.intensity = e.key;
  key.castShadow = e.shadows;
  key.shadow.radius = e.soft;
  if (e.ao && aoState === 'idle') initAO();
  updateAOParams();
  if (state.items) { for (const it of state.items) refreshItemLook(it); updateShadowBox(); }
  requestRender();
}

/* camera */
function applyCam(c) {
  if (!c) return;
  camera.position.set(...c.pos); controls.target.set(...c.target);
  userFov = c.fov || 45; setAspect(camera.aspect); controls.update();
}
function saveCam() {
  state.cam = { pos:camera.position.toArray(), target:controls.target.toArray(), fov:userFov };
}
/* The field-of-view setting spans the LONG side of the frame, so a wide banner is a horizontal slice of the same view. */
let userFov = 45;

  camera.aspect = a;
  camera.fov = a > 1 ? 2 * Math.atan(Math.tan(userFov * D2R / 2) / a) / D2R : userFov;
  camera.updateProjectionMatrix();

const FORMAT_BY_ID = Object.fromEntries(FORMATS.map(f => [f.id, f]));
const LEGACY_ASPECT = { '1:1':['square',false], '4:3':['r43',false], '3:4':['r43',true], '3:2':['r32',false], '2:3':['r32',true],
  '16:9':['r169',false], '9:16':['r169',true], 'A4 landscape':['a4',true], 'A4 portrait':['a4',false] };
function curFormat() { return FORMAT_BY_ID[state.exp.format] || FORMAT_BY_ID.square; }
function formatBase(f = curFormat()) {
  const x = state.exp;
  let [a, b] = f.r || f.mm || f.px || [Math.max(0.1, x.cw), Math.max(0.1, x.ch)];
  if (x.rotate) [a, b] = [b, a];
  return [a, b];
}
function exportAspect() { const [a, b] = formatBase(); return a / b; }

function layout() {
  if (!state || renderer.xr.isPresenting) return;
  const view = document.getElementById('view');
  const W = view.clientWidth - 32, H = view.clientHeight - 32;
  const A = exportAspect();
  let cw = W, ch = W / A; if (ch > H) { ch = H; cw = H * A; }
  cw = Math.max(50, Math.floor(cw)); ch = Math.max(50, Math.floor(ch));
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  const pr = Math.min(window.devicePixelRatio || 1, state.env.pr);
  renderer.setPixelRatio(pr);
  renderer.setSize(cw, ch, false);
  if (composer) { composer.setPixelRatio(pr); composer.setSize(cw, ch); }
  setAspect(cw / ch);
  requestRender();
}
new ResizeObserver(() => layout()).observe(document.getElementById('view'));

/* =====================================================================
   Export
   ===================================================================== */
function exportDims() {
  const f = curFormat(), x = state.exp;
  if (f.px && x.native) {
    let [w, h] = formatBase(f);
    const k = f.x2 ? 2 : 1;
    const s = Math.min(k, MAX_EXPORT / Math.max(w, h));
    return [Math.round(w * s), Math.round(h * s)];
  }
  const A = exportAspect(), L = Math.round(Math.min(MAX_EXPORT, x.size));
  return A >= 1 ? [L, Math.round(L / A)] : [Math.round(L * A), L];
}
function exportInfo() {
  const f = curFormat(), [w, h] = exportDims();
  let s = `${w} × ${h} px`;
  if (f.mm) {
    const [a, b] = formatBase(f);
    const dpi = Math.round(w / (a / 25.4));
    const big = Math.max(a, b) >= 800;     // banners and posters are seen from a distance
    const note = big ? (dpi < 25 ? ' (coarse even from a distance)' : ' (normal for a banner seen from a few metres)')
                     : (dpi < 150 ? ' (low for print)' : dpi < 250 ? ' (fine at arm’s length)' : '');
    s += ` · ${dpi} dpi${note}`;
  } else if (f.px) {
    const [nw, nh] = formatBase(f);
    if (state.exp.native) s += (f.x2 ? ` · 2× of ${nw}×${nh} for sharp screens` : ' · recommended size') + (Math.max(nw, nh) * (f.x2 ? 2 : 1) > MAX_EXPORT ? ` (capped at ${MAX_EXPORT} px)` : '');
  }
  return s;
}
function maxRenderSize() {
  const gl = renderer.getContext();
  const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  return Math.min(gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), vp[0], vp[1], renderer.capabilities.maxTextureSize);
}
function setShadowSize(n) {
  if (key.shadow.mapSize.x === n) return;
  key.shadow.mapSize.set(n, n);
  if (key.shadow.map) { key.shadow.map.dispose(); key.shadow.map = null; }
}
async function exportJPG(opts = {}) {
  let [w, h] = exportDims();
  const mx = maxRenderSize();
  if (Math.max(w, h) > mx) { const s = mx / Math.max(w, h); w = Math.floor(w * s); h = Math.floor(h * s); setStatus(`GPU limit: export reduced to ${w}×${h}`); }
  const busy = document.getElementById('busy'); busy.classList.add('on');
  await new Promise(r => setTimeout(r, 30));
  const prevPR = renderer.getPixelRatio();
  let url = null;
  try {
    if (dirty.size || rebuildAll) frame();
    setShadowSize(4096);
    renderer.setPixelRatio(1);
    renderer.setSize(w, h, false);
    if (useAO()) {
      const samples = Math.max(w, h) > 2000 ? 2 : 4;
      for (const rt of [composer.renderTarget1, composer.renderTarget2]) { rt.samples = samples; rt.dispose(); }
      composer.setPixelRatio(1); composer.setSize(w, h);
    }
    setAspect(w / h);
    draw();
    url = renderer.domElement.toDataURL('image/jpeg', state.exp.quality);
  } catch (e) {
    console.error(e); setStatus('Export failed: ' + e.message);
  } finally {
    if (composer) for (const rt of [composer.renderTarget1, composer.renderTarget2]) { rt.samples = 4; rt.dispose(); }
    setShadowSize(2048);
    renderer.setPixelRatio(prevPR);
    layout(); draw();
    busy.classList.remove('on');
  }
  if (url && url.length > 100 && opts.download !== false) {
    const a = document.createElement('a');
    a.href = url; a.download = `illusion-${state.exp.format}-${w}x${h}.jpg`;
    document.body.append(a); a.click(); a.remove();
    setStatus(`Exported ${w}×${h} JPG (${(url.length * 0.75 / 1048576).toFixed(1)} MB)`);
  }
  return url;
}

/* save / load */
function serial() {
  saveCam();
  return JSON.stringify({ app:'IllusionStudio', v:1, look:state.look, items:state.items, dists:state.dists, env:state.env, cam:state.cam, exp:state.exp }, null, 1);
}
let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem('illusionStudio.v1', serial()); } catch (e) {} }, 600);
}
function downloadText(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'application/json' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function loadFromJSON(text) {
  const s = JSON.parse(text);
  if (!s.items || !s.look) throw new Error('not an Illusion Studio scene');
  s.dists = s.dists || [];
  loadState(s);
}

   UI
   ===================================================================== */
const openSec = { vr:false, scene:true, item:true, look:true, dist:false, light:false, exp:true, help:false };
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const decimals = (step) => { const s = String(step); return s.includes('.') ? s.split('.')[1].length : 0; };
function slider(label, obj, k, min, max, step, cb) {
  const rng = h('input', { type:'range', min, max, step });
  const num = h('input', { type:'number', class:'num', step });
  const fmt = () => { num.value = (+obj[k]).toFixed(decimals(step)); };
  rng.value = obj[k]; fmt();
  rng.addEventListener('input', () => { obj[k] = parseFloat(rng.value); fmt(); cb(); });
  num.addEventListener('change', () => { const v = parseFloat(num.value); if (isFinite(v)) { obj[k] = v; rng.value = v; } fmt(); cb(); });
  return h('div', { class:'row' }, h('label', { title:label }, label), rng, num);
}
function check(label, obj, k, cb) {
  const c = h('input', { type:'checkbox' }); c.checked = !!obj[k];
  c.addEventListener('change', () => { obj[k] = c.checked; cb(); });
  return h('label', { class:'chk' }, c, label);
}
function select(label, opts, get, set) {
  const s = h('select', {});
  for (const o of opts) { const [v, t] = Array.isArray(o) ? o : [o, o]; s.append(h('option', { value:v }, t)); }
  s.value = get();
  s.addEventListener('change', () => set(s.value));
  return h('div', { class:'row two' }, h('label', {}, label), s);
}
function section(id, title, sub, ...content) {
  const d = h('details', { open:openSec[id] }, h('summary', {}, title, sub ? h('span', { class:'sub' }, sub) : null), h('div', { class:'body' }, ...content));
  d.addEventListener('toggle', () => { openSec[id] = d.open; });
  return d;
}
function setStatus(t) { document.getElementById('status').textContent = t; }

function renderPanels() {
  const root = document.getElementById('panels');
  const scrollTop = root.scrollTop;
  root.innerHTML = '';
  root.append(vrSection(), scenePanel(), itemPanel(), lookPanel(), distPanel(), lightPanel(), exportPanel(), helpPanel());
  root.scrollTop = scrollTop;
}

function scenePanel() {
  let presetSel = Object.keys(SCENES)[0];
  const list = h('div', { class:'list' });
  for (const it of state.items) {
    const vis = h('input', { type:'checkbox', title:'Visible' }); vis.checked = it.visible;
    vis.addEventListener('click', (e) => e.stopPropagation());
    vis.addEventListener('change', () => { it.visible = vis.checked; refreshItemLook(it); updateShadowBox(); requestRender(); scheduleSave(); });
    const dup = h('button', { class:'small', title:'Duplicate', onclick:(e) => {
      e.stopPropagation();
      const c = clone(it); c.id = 'i' + (uid++); c.name = it.name + ' copy'; c.pos[0] += 1;
      state.items.push(c); state.sel = c.id; markItem(c); renderPanels();
    } }, '⧉');
    const del = h('button', { class:'small danger', title:'Delete', onclick:(e) => {
      e.stopPropagation();
      state.items = state.items.filter(i => i !== it);
      for (const d of state.dists) if (d.target === it.id) d.target = 'all';
      if (state.sel === it.id) state.sel = state.items[0]?.id || null;
      requestRender(); dirty.add('__gc'); scheduleSave(); renderPanels();
    } }, '✕');
    list.append(h('div', { class:'li' + (state.sel === it.id ? ' sel' : ''), onclick:() => { state.sel = it.id; renderPanels(); } },
      vis, h('span', { class:'nm' }, it.name), h('span', { class:'tag' }, TYPES[it.type].label + (it.ownLook ? ' · own look' : '')), dup, del));
  }
  let addType = 'sphere';
  const addSel = h('select', { style:'flex:1' });
  addSel.append(h('optgroup', { label:'Spaces' }, ...Object.entries(TYPES).filter(([, t]) => t.space).map(([k, t]) => h('option', { value:k }, t.label))));
  addSel.append(h('optgroup', { label:'Objects' }, ...Object.entries(TYPES).filter(([, t]) => !t.space).map(([k, t]) => h('option', { value:k }, t.label))));
  addSel.value = addType; addSel.addEventListener('change', () => addType = addSel.value);
  const addBtn = h('button', { onclick:() => {
    const T = TYPES[addType]; const it = newItem(addType);
    if (!T.space) { const sz = it.params.radius || it.params.r || (it.params.sy || 2) / 2 || 1; it.pos = [0, (addType === 'torus' ? it.params.r : sz) + 0.01, 0];
      if (addType === 'cylinder' || addType === 'cone') it.pos[1] = it.params.height / 2; }
    state.items.push(it); state.sel = it.id; markItem(it); renderPanels();
  } }, '+ Add');
  const sceneSel = h('select', { style:'flex:1' }, ...Object.keys(SCENES).map(k => h('option', { value:k }, k)));
  sceneSel.addEventListener('change', () => presetSel = sceneSel.value);
  return section('scene', 'Scene', `${state.items.length} items`,
    h('div', { class:'btns' }, sceneSel, h('button', { onclick:() => { if (confirm(`Replace the current scene with "${presetSel}"?`)) loadState(SCENES[presetSel]()); } }, 'Load preset')),
    list,
    h('div', { class:'btns' }, addSel, addBtn),
    h('div', { class:'hint' }, 'Spaces surround the view (floor with hole, tunnel, room, dome). Objects sit in them. Click a row to edit it.'));
}

function itemPanel() {
  const it = state.items.find(i => i.id === state.sel);
  if (!it) return section('item', 'Selected item', '— none', h('div', { class:'hint' }, 'Add or select an item.'));
  const T = TYPES[it.type];
  const cb = () => markItem(it);
  const name = h('input', { type:'text', value:it.name });
  name.addEventListener('change', () => { it.name = name.value || it.name; renderPanels(); scheduleSave(); });
  const rows = [h('div', { class:'row two' }, h('label', {}, 'Name'), name)];
  for (const u of T.ui) {
    const [k, label, a, b, c] = u;
    if (a === 'bool') rows.push(check(label, it.params, k, () => { cb(); renderPanels(); }));
    else if (a === 'select') rows.push(select(label, b, () => it.params[k], (v) => { it.params[k] = v; cb(); }));
    else rows.push(slider(label, it.params, k, a, b, c, cb));
  }
  const R = T.space ? 60 : 25;
  rows.push(h('h4', {}, 'Placement'));
  ['x','y','z'].forEach((ax, i) => rows.push(slider('Position ' + ax, it.pos, i, -R, R, 0.05, cb)));
  ['x','y','z'].forEach((ax, i) => rows.push(slider('Rotation ' + ax + ' (°)', it.rot, i, -180, 180, 1, cb)));
  rows.push(h('h4', {}, 'Surface'));
  rows.push(check('Reverse drift direction', it, 'reverse', () => { refreshItemLook(it); requestRender(); scheduleSave(); }));
  rows.push(check('Casts shadow', it, 'cast', () => { refreshItemLook(it); requestRender(); scheduleSave(); }));
  rows.push(check('Own pattern & colours (instead of the global look)', it, 'ownLook', () => {
    if (it.ownLook && !it.look) it.look = clone(state.look);
    refreshItemLook(it); requestRender(); scheduleSave(); renderPanels();
  }));
  return section('item', 'Selected item', `— ${it.name}`, ...rows);
}

    rows.push(check('Alternate drift per row band (counter-motion)', L, 'altRows', apply));

function exportPanel() {
  const x = state.exp;
  const f = curFormat();
  const dims = h('div', { class:'hint', style:'color:var(--text)' });
  const upd = () => { dims.textContent = exportInfo(); };
  upd();
  const file = h('input', { type:'file', accept:'.json,application/json', style:'display:none' });
  file.addEventListener('change', async () => {
    const fl = file.files[0]; if (!fl) return;
    try { loadFromJSON(await fl.text()); setStatus('Loaded ' + fl.name); } catch (e) { alert('Could not load: ' + e.message); }
  });
  const changed = () => { upd(); layout(); scheduleSave(); };
  // format picker with groups
  const fsel = h('select', {});
  const groups = {};
  for (const fm of FORMATS) {
    if (!groups[fm.group]) { groups[fm.group] = h('optgroup', { label:fm.group }); fsel.append(groups[fm.group]); }
    const dimTxt = fm.px ? ` · ${fm.px[0]}×${fm.px[1]}` : '';
    groups[fm.group].append(h('option', { value:fm.id }, fm.name + dimTxt));
  }
  fsel.value = f.id;
  fsel.addEventListener('change', () => {
    const nf = FORMAT_BY_ID[fsel.value];
    x.format = nf.id; x.rotate = false;
    if (nf.px) x.native = true;
    if (nf.mm) x.size = MAX_EXPORT;
    changed(); renderPanels();
  });
  const rows = [h('div', { class:'row two' }, h('label', {}, 'Format'), fsel)];
  if (f.id === 'custom') {
    rows.push(slider('Ratio width', x, 'cw', 0.5, 40, 0.1, changed));
    rows.push(slider('Ratio height', x, 'ch', 0.5, 40, 0.1, changed));
  }
  const [ba, bb] = formatBase(f);
  if (!(f.r && f.r[0] === f.r[1]) && !(f.px && f.px[0] === f.px[1]))
    rows.push(check(`Rotate 90° (now ${ba >= bb ? 'landscape' : 'portrait'})`, x, 'rotate', () => { changed(); renderPanels(); }));
  if (f.px) rows.push(check(f.x2 ? `Use 2× the nominal size (${f.px[0] * 2} × ${f.px[1] * 2} px)` : `Use the recommended size (${f.px[0]} × ${f.px[1]} px)`, x, 'native', () => { changed(); renderPanels(); }));
  if (!(f.px && x.native)) rows.push(slider('Long side (px)', x, 'size', 300, MAX_EXPORT, 50, () => { upd(); scheduleSave(); }));
  rows.push(dims);
  return section('exp', 'Export & files', `— ${f.name.split(' · ')[0]}`,
    ...rows,
    slider('JPG quality', x, 'quality', 0.5, 1, 0.01, scheduleSave),
    h('div', { class:'btns' }, h('button', { class:'primary', onclick:() => exportJPG() }, 'Export JPG')),
    h('div', { class:'sep' }),
    h('div', { class:'btns' },
      h('button', { onclick:() => downloadText('illusion-scene.json', serial()) }, 'Save scene…'),
      h('button', { onclick:() => file.click() }, 'Load scene…'), file),
    h('div', { class:'hint' }, 'The preview frame has the export aspect ratio: what you see is what is rendered, at full resolution.'));
}

/* =====================================================================
   VR and mixed reality (WebXR)
   Everything that belongs to the user (camera, controllers, hands, the panel, the wrist button) lives in
   the "dolly" group. The dolly's scale is 1/S, so S is how big the world looks to you:
   S < 1 is a dollhouse on a table, S = 1 is life size, S > 1 makes you small among giant objects.
   ===================================================================== */
const V3 = THREE.Vector3, UP = new V3(0, 1, 0);
const VR = {
  supported:{ vr:false, ar:false }, deps:null, session:null, mode:null,
  dolly:new THREE.Group(), S:1, yaw:0,
  hands:[], grab:null, pick:null, placeIn:0, placeMode:'viewpoint', lastRebuild:0, rigReady:false,
  panel:null, wrist:null, wristCtx:null, wristTex:null, frames:0, tPrev:0,
  ray:new THREE.Raycaster(), hoverItem:null, wristT:0, savedCam:null,
};
VR.dolly.name = 'user-rig';
scene.add(VR.dolly);
VR.dolly.add(camera);
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
const r3 = (v) => Math.round(v * 1000) / 1000;

function loadXRDeps() {
  if (!VR.depsP) VR.depsP = Promise.all([
    import('three/addons/webxr/XRControllerModelFactory.js'),
    import('three/addons/webxr/XRHandModelFactory.js'),
    import('three-mesh-bvh'),
  ]).then(([cm, hm, bvh]) => {
    THREE.BufferGeometry.prototype.computeBoundsTree = bvh.computeBoundsTree;
    THREE.BufferGeometry.prototype.disposeBoundsTree = bvh.disposeBoundsTree;
    THREE.Mesh.prototype.raycast = bvh.acceleratedRaycast;
    VR.deps = { cm, hm, bvh };
    return VR.deps;
  });
  return VR.depsP;
}

/* ---------- rig placement ---------- */
function setDolly(p, yaw, S) {
  VR.S = clampN(S, 0.004, 250); VR.yaw = yaw;
  VR.dolly.position.copy(p);
  VR.dolly.quaternion.setFromAxisAngle(UP, yaw);
  VR.dolly.scale.setScalar(1 / VR.S);
  VR.dolly.updateMatrixWorld(true);
}
function placeLocalAt(localPt, worldPt, yaw, S) {        // choose the rig so that localPt (in your space) sits on worldPt
  S = clampN(S, 0.004, 250);
  const off = localPt.clone().multiplyScalar(1 / S).applyQuaternion(new THREE.Quaternion().setFromAxisAngle(UP, yaw));
  setDolly(worldPt.clone().sub(off), yaw, S);
}
const localToWorld = (v) => v.clone().applyMatrix4(VR.dolly.matrixWorld);
const headLocal = () => camera.position.clone();
const headYaw = () => new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ').y;

function focusBox() {      // the part of the scene worth framing: objects, the hole of a floor, a stretch of tunnel, rooms, domes

/* ---------- controllers, hands and input ---------- */
function setupRig() {
  if (VR.rigReady) return;
  VR.rigReady = true;
  makePanel();
  const cmf = new VR.deps.cm.XRControllerModelFactory(), hmf = new VR.deps.hm.XRHandModelFactory();
  for (let i = 0; i < 2; i++) {
    const ctrl = renderer.xr.getController(i), grip = renderer.xr.getControllerGrip(i), hand = renderer.xr.getHand(i);
    grip.add(cmf.createControllerModel(grip));
    hand.add(hmf.createHandModel(hand, 'mesh'));
    VR.dolly.add(ctrl, grip, hand);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(0, 0, 0), new V3(0, 0, -1)]),
      new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.8, fog:false, toneMapped:false }));
    line.frustumCulled = false;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.006, 14, 10), new THREE.MeshBasicMaterial({ color:0xffffff, fog:false, toneMapped:false, depthTest:false }));
    dot.renderOrder = 20;
    ctrl.add(line, dot);
    const hs = { i, pid:'h' + i, ctrl, grip, hand, line, dot, src:null, isHand:false, handed:null, mode:null, modeBy:null, hover:null,
                 btn:{}, poking:false, nearPanel:false, drag:null, turnLatch:false };
    ctrl.addEventListener('connected', (e) => { hs.src = e.data; hs.isHand = !!e.data.hand; hs.handed = e.data.handedness; UI.dirty = true; });
    ctrl.addEventListener('disconnected', () => { endMode(hs); hs.src = null; });
    ctrl.addEventListener('selectstart', () => onPress(hs, 'select'));
    ctrl.addEventListener('selectend', () => onRelease(hs, 'select'));
    ctrl.addEventListener('squeezestart', () => onPress(hs, 'squeeze'));
    ctrl.addEventListener('squeezeend', () => onRelease(hs, 'squeeze'));
    VR.hands.push(hs);
  }
}

function onPress(hs, kind) {
  if (!VR.session || hs.mode) return;
  if (kind === 'squeeze') { startWorld(hs, kind); return; }
  if (hs.isHand && (hs.nearPanel || hs.poking)) return;            // a finger at the panel pokes; no pinch-clicks there
  const hv = hs.hover;
  if (hv && hv.kind === 'panel') {
    const w = uiDown(hs.pid, hv.px, hv.py);
    if (w && w.t === 'title') {                                     // hold the title bar: the panel follows your hand
      UI.cap.delete(hs.pid);
      VR.panel.updateMatrix();
      hs.panelRel = hs.ctrl.matrix.clone().invert().multiply(VR.panel.matrix);
      hs.mode = 'panelmove'; hs.modeBy = kind; return;
    }
    hs.mode = 'ui'; hs.modeBy = kind; hs.uiLast = [hv.px, hv.py]; return;
  }
  if (hv && hv.kind === 'wrist') { togglePanel(); return; }
  if (VR.pick && hv && hv.kind === 'item') {
    const d = state.dists.find(x => x.id === VR.pick.id);
    if (d) { d.c = hv.point.toArray().map(r3); markAll(); }
    VR.pick = null; UI.dirty = true; return;
  }
  if (hv && hv.kind === 'item' && !hv.space) {
    state.sel = hv.it.id; UI.dirty = true;
    startDrag(hs, hv.it); hs.modeBy = kind; return;
  }
  startWorld(hs, kind);
}
function onRelease(hs, kind) { if (hs.modeBy === kind) endMode(hs); }
function endMode(hs) {
  if (hs.mode === 'ui') uiUp(hs.pid, ...(hs.uiLast || []));
  if (hs.mode === 'object') finishDrag(hs);
  if (hs.mode === 'world') VR.grab = null;
  hs.mode = null; hs.modeBy = null;
}
function startWorld(hs, kind) { hs.mode = 'world'; hs.modeBy = kind; VR.grab = null; }

function startDrag(hs, it) {
  const M0 = itemMatrix(it);
  hs.ctrl.updateMatrixWorld(true);
  hs.drag = { it, M0, M0inv:M0.clone().invert(), rel:hs.ctrl.matrixWorld.clone().invert().multiply(M0),
              p0:new V3().setFromMatrixPosition(hs.ctrl.matrixWorld), push:0, started:false, M:null };
  hs.mode = 'object';
}
function updateDrag(hs) {
  const dr = hs.drag; if (!dr) return;
  const C = hs.ctrl.matrixWorld;
  if (!dr.started) {
    if (new V3().setFromMatrixPosition(C).distanceTo(dr.p0) * VR.S < 0.012 && dr.push === 0) return;
    dr.started = true;
  }
  dr.M = C.clone().multiply(new THREE.Matrix4().makeTranslation(0, 0, -dr.push)).multiply(dr.rel);
  const o = objs.get(dr.it.id); if (!o) return;
  o.group.matrixAutoUpdate = false;
  o.group.matrix.multiplyMatrices(dr.M, dr.M0inv);
  o.group.matrixWorldNeedsUpdate = true;
}
function finishDrag(hs) {
  const dr = hs.drag; hs.drag = null;
  if (!dr || !dr.started || !dr.M) return;
  const p = new V3(), q = new THREE.Quaternion(), s = new V3();
  dr.M.decompose(p, q, s);
  const e = new THREE.Euler().setFromQuaternion(q, 'XYZ');
  dr.it.pos = p.toArray().map(r3);
  dr.it.rot = [e.x, e.y, e.z].map(a => Math.round(a / D2R * 10) / 10);
  markItem(dr.it); UI.dirty = true;                 // the moved group stays in place until the rebuilt one replaces it
}

function panelPlanePx(o, d) {
  const n = new V3(0, 0, 1).transformDirection(VR.panel.matrixWorld);
  const P = new V3().setFromMatrixPosition(VR.panel.matrixWorld);
  const den = n.dot(d); if (Math.abs(den) < 1e-6) return null;
  const t = n.dot(P.clone().sub(o)) / den; if (t < 0) return null;
  const lp = VR.panel.worldToLocal(o.clone().addScaledVector(d, t));
  return [(lp.x / UI.PW + 0.5) * UI.W, (0.5 - lp.y / UI.PH) * UI.H];
}

function handPoke(hs, t) {
  const tip = hs.hand.joints && hs.hand.joints['index-finger-tip'];
  if (!tip || !tip.visible) { if (hs.poking) { uiUp(hs.pid); hs.poking = false; } return; }
  const tw = tip.getWorldPosition(new V3());
  const owner = handBy('left') || VR.hands[0];
  if (VR.wrist.visible && hs !== owner && t - VR.wristT > 800) {
    const wp = new V3().setFromMatrixPosition(VR.wrist.matrixWorld);
    if (wp.distanceTo(tw) * VR.S < 0.03) { VR.wristT = t; togglePanel(); }
  }
  if (!VR.panel.visible) return;
  const lp = VR.panel.worldToLocal(tw.clone()), z = lp.z * VR.panel.scale.x;
  const inside = Math.abs(lp.x) < UI.PW / 2 + 0.02 && Math.abs(lp.y) < UI.PH / 2 + 0.02;
  hs.nearPanel = inside && z < 0.12 && z > -0.08;
  const px = (lp.x / UI.PW + 0.5) * UI.W, py = (0.5 - lp.y / UI.PH) * UI.H;
  if (!hs.poking) {
    if (inside && z < 0.01 && z > -0.04) { hs.poking = true; uiDown(hs.pid, px, py); }
    else if (hs.nearPanel) uiHover(hs.pid, px, py);
  } else if (z > 0.022 || !inside) { uiUp(hs.pid, px, py); hs.poking = false; }
  else uiMove(hs.pid, px, py);
}

function updateWrist() {
  const L = handBy('left') || VR.hands.find(x => x.src);
  let base = null, off;
  if (L && L.isHand) {
    const j = L.hand.joints && L.hand.joints.wrist;
    if (j && j.visible) { base = j.matrix; off = new THREE.Matrix4().makeRotationX(-Math.PI / 2).setPosition(0, 0.035, 0.03); }
  } else if (L && L.grip.visible) {
    base = L.grip.matrix; off = new THREE.Matrix4().makeRotationX(-1.0).setPosition(0, 0.045, 0.075);
  }
  VR.wrist.visible = !!base;
  if (base) { VR.wrist.matrix.multiplyMatrices(base, off); VR.wrist.matrixWorldNeedsUpdate = true; }
}

function vrInput(dt, t) {
  VR.dolly.updateMatrixWorld(true);
  updateWrist();
  VR.dolly.updateMatrixWorld(true);
  const meshes = pickables(true);
  const wristOwner = handBy('left') || VR.hands[0];
  let hoverIt = null, wristHot = false;
  VR.hoverPoint = null;
  for (const hs of VR.hands) {
    if (!hs.src) { hs.line.visible = false; hs.dot.visible = false; continue; }
    const gp = hs.src.gamepad;
    if (gp && gp.buttons) {
      const yb = !!(gp.buttons[5] && gp.buttons[5].pressed);
      if (yb && !hs.btn.y) togglePanel();
      hs.btn.y = yb;
    }
    hs.nearPanel = false;
    if (hs.isHand) handPoke(hs, t);
    const o = new V3().setFromMatrixPosition(hs.ctrl.matrixWorld);
    const d = new V3(0, 0, -1).transformDirection(hs.ctrl.matrixWorld);
    VR.ray.set(o, d); VR.ray.firstHitOnly = true;
    let hv = null;
    if (hs.mode === 'ui') {
      const pp = panelPlanePx(o, d);
      if (pp) { hs.uiLast = pp; uiMove(hs.pid, pp[0], pp[1]); }
      const hit = VR.ray.intersectObject(VR.panel, false)[0];
      hv = { kind:'panel', dist:hit ? hit.distance : 0.5 / VR.S };
    } else if (hs.mode === 'panelmove') {
      VR.panel.matrix.multiplyMatrices(hs.ctrl.matrix, hs.panelRel);
      VR.panel.matrix.decompose(VR.panel.position, VR.panel.quaternion, VR.panel.scale);
      hv = { kind:'panel', dist:(VR.ray.intersectObject(VR.panel, false)[0] || { distance:0.3 / VR.S }).distance };
    } else if (hs.mode === 'object') {
      updateDrag(hs);
      const dpos = new V3().setFromMatrixPosition(hs.drag && hs.drag.M ? hs.drag.M : (hs.drag ? hs.drag.M0 : new THREE.Matrix4()));
      hv = { kind:'drag', dist:Math.max(0.02 / VR.S, dpos.distanceTo(o)) };
    } else if (!(hs.isHand && (hs.nearPanel || hs.poking))) {
      if (VR.panel.visible) {
        const hit = VR.ray.intersectObject(VR.panel, false)[0];
        if (hit && hit.uv) hv = { kind:'panel', px:hit.uv.x * UI.W, py:(1 - hit.uv.y) * UI.H, dist:hit.distance };
      }
      if (VR.wrist.visible && hs !== wristOwner) {
        const hit = VR.ray.intersectObject(VR.wrist, false)[0];
        if (hit && (!hv || hit.distance < hv.dist)) hv = { kind:'wrist', dist:hit.distance };
      }
      if (!hv && hs.mode !== 'world') {
        const hit = VR.ray.intersectObjects(meshes, false)[0];
        if (hit) {
          const it = state.items.find(i => i.id === hit.object.userData.itemId);
          if (it) hv = { kind:'item', it, space:!!TYPES[it.type].space, point:hit.point.clone(), dist:hit.distance };
        }
      }
    }
    hs.hover = hv;
    if (hs.mode !== 'ui' && !hs.poking && !(hs.isHand && hs.nearPanel)) {
      if (hv && hv.kind === 'panel' && hs.mode !== 'panelmove') uiHover(hs.pid, hv.px, hv.py); else uiHover(hs.pid, null);
    }
    if (hv && hv.kind === 'item') { if (!hv.space) hoverIt = hv.it; VR.hoverPoint = hv.point; }
    if (hv && hv.kind === 'wrist') wristHot = true;
    // ray visuals (lengths in your own metres)
    const len = hv ? hv.dist * VR.S : (hs.isHand ? 0.35 : 2.5);
    hs.line.visible = !(hs.isHand && (hs.nearPanel || hs.poking));
    hs.line.scale.set(1, 1, Math.max(0.01, len));
    hs.dot.visible = hs.line.visible && !!hv;
    hs.dot.position.set(0, 0, -len);
    const col = !hv ? (hs.mode === 'world' ? 0xc9a7ff : 0xffffff)
      : hv.kind === 'item' ? (VR.pick ? 0x7fe3ff : hv.space ? 0xcccccc : 0xf2c14e)
      : hv.kind === 'drag' ? 0xf2c14e : 0xffffff;
    hs.line.material.color.setHex(col); hs.dot.material.color.setHex(col);
  }
  setHoverItem(hoverIt);
  if (wristHot !== !!VR.wristHot) drawWrist(wristHot);
  uiRepeat(performance.now());

  // world grabs: one hand moves the world, two hands also scale and turn it
  const W = VR.hands.filter(x => x.src && x.mode === 'world');
  if (W.length >= 2) {
    const [a, b] = W, la = a.ctrl.position.clone(), lb = b.ctrl.position.clone();
    if (!VR.grab || VR.grab.n !== 2) VR.grab = { n:2, Wa:localToWorld(la), Wb:localToWorld(lb) };
    const g = VR.grab, dW = g.Wb.clone().sub(g.Wa), dL = lb.clone().sub(la);
    const S = clampN(dL.length() / Math.max(1e-6, dW.length()), 0.004, 250);
    const yaw = Math.atan2(dW.x, dW.z) - Math.atan2(dL.x, dL.z);
    placeLocalAt(la.clone().add(lb).multiplyScalar(0.5), g.Wa.clone().add(g.Wb).multiplyScalar(0.5), yaw, S);
    UI.needsDraw = UI.needsDraw || VR.panel.visible;
  } else if (W.length === 1) {
    const a = W[0], la = a.ctrl.position.clone();
    if (!VR.grab || VR.grab.n !== 1 || VR.grab.h !== a) VR.grab = { n:1, h:a, Wa:localToWorld(la) };
    placeLocalAt(la, VR.grab.Wa, VR.yaw, VR.S);
  }

  // sticks: left flies (where you look), right turns and rises; at the panel it scrolls, while dragging it pushes/pulls
  const sp = state.env.vrSpeed;
  const stick = (hs) => { const ax = hs && hs.src && hs.src.gamepad && hs.src.gamepad.axes; if (!ax) return [0, 0]; const x = ax.length >= 4 ? ax[2] : ax[0] || 0, y = ax.length >= 4 ? ax[3] : ax[1] || 0; return [Math.abs(x) > 0.15 ? x : 0, Math.abs(y) > 0.15 ? y : 0]; };
  const Lh = handBy('left'), Rh = handBy('right');
  for (const hs of [Lh, Rh]) {
    if (!hs) continue;
    const [x, y] = stick(hs);
    if (hs.mode === 'object' && hs.drag) { hs.drag.push = Math.max(-0.5, hs.drag.push - y * sp * dt); continue; }
    if (hs === Rh && (hs.mode === 'ui' || (hs.hover && hs.hover.kind === 'panel'))) { if (y) scrollBy(y * 1100 * dt); continue; }
    if (hs === Lh) {
      if (!x && !y) continue;
      const f = new V3(0, 0, -1).applyQuaternion(camera.quaternion), r = new V3(1, 0, 0).applyQuaternion(camera.quaternion);
      const mv = f.multiplyScalar(-y).add(r.multiplyScalar(x)).multiplyScalar(sp * dt)
        .applyQuaternion(VR.dolly.quaternion).multiplyScalar(1 / VR.S);
      VR.dolly.position.add(mv); VR.dolly.updateMatrixWorld(true); VR.grab = null;
    } else {
      if (y) { VR.dolly.position.y += -y * sp * dt / VR.S; VR.dolly.updateMatrixWorld(true); VR.grab = null; }
      const snap = state.env.vrTurn;
      if (!snap) { if (x) { turnBy(-x * 1.6 * dt); VR.grab = null; } }
      else if (Math.abs(x) > 0.7 && !hs.turnLatch) { hs.turnLatch = true; turnBy(-Math.sign(x) * snap * D2R); VR.grab = null; }
      else if (Math.abs(x) < 0.3) hs.turnLatch = false;
    }
  }
}

function xrLoop(t) {
  const dt = clampN((t - (VR.tPrev || t)) / 1000, 0.001, 0.1); VR.tPrev = t;
  VR.frames++;
  if (VR.placeIn > 0 && --VR.placeIn === 0) {
    if (VR.placeMode === 'dollhouse') vrDollhouse(); else vrViewpoint();
    if (!VR.panel.visible) openPanel();
    VR.placeMode = 'viewpoint';
  }
  vrInput(dt, t);
  if ((rebuildAll || dirty.size) && t - VR.lastRebuild > 70) { processDirty(); VR.lastRebuild = t; }
  if (VR.panel.visible && (UI.dirty || UI.needsDraw)) { if (UI.dirty) uiRefresh(); else uiDraw(); }
  renderer.render(scene, camera);
}

async function enterXR(kind) {
  if (VR.session || !navigator.xr) return;
  try {
    const depsP = loadXRDeps();
    const session = await navigator.xr.requestSession(kind === 'ar' ? 'immersive-ar' : 'immersive-vr',
      { optionalFeatures:['local-floor', 'bounded-floor', 'hand-tracking'] });
    await depsP;
    saveCam(); VR.savedCam = clone(state.cam);
    setupRig();
    renderer.xr.setReferenceSpaceType('local-floor');
    renderer.xr.setFramebufferScaleFactor(state.env.vrQuality);
    await renderer.xr.setSession(session);
    try { renderer.xr.setFoveation(1); } catch (e) { /* optional */ }
    VR.session = session; VR.mode = kind; VR.frames = 0; VR.tPrev = 0;
    VR.placeIn = 3; VR.placeMode = kind === 'ar' ? 'dollhouse' : 'viewpoint';
    UI.tab = 'view'; UI.dirty = true;
    session.addEventListener('end', onXREnd);
    if (kind === 'ar') renderer.setClearAlpha(0);
    updateEnv(); refreshAllLooks();
    renderer.setAnimationLoop(xrLoop);
    setStatus(kind === 'ar' ? 'In mixed reality' : 'In VR');
    updateVRButton();
  } catch (e) {
    console.warn('XR start failed', e);
    setStatus(`Could not start ${kind === 'ar' ? 'mixed reality' : 'VR'}: ${e.message || e}`);
  }
}
function onXREnd() {
  renderer.setAnimationLoop(null);
  for (const hs of VR.hands) { endMode(hs); hs.line.visible = false; hs.dot.visible = false; }
  setHoverItem(null);
  if (VR.panel) VR.panel.visible = false;
  if (VR.wrist) VR.wrist.visible = false;
  VR.session = null; VR.mode = null; VR.pick = null; VR.grab = null;
  VR.dolly.position.set(0, 0, 0); VR.dolly.quaternion.identity(); VR.dolly.scale.set(1, 1, 1); VR.S = 1; VR.yaw = 0;
  VR.dolly.updateMatrixWorld(true);
  renderer.setClearAlpha(1);
  processDirty();
  updateEnv(); refreshAllLooks();
  applyCam(state.cam || VR.savedCam);
  layout(); renderPanels(); updateVRButton();
  setStatus('Back from the headset');
  requestRender();
}

/* desktop side: availability, buttons */
function checkXRSupport() {
  if (!navigator.xr) return;
  Promise.all([
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false),
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
  ]).then(([v, a]) => {
    VR.supported = { vr:!!v, ar:!!a };
    if (v || a) { openSec.vr = true; loadXRDeps().catch((e) => console.warn('XR helpers failed to load', e)); }
    renderPanels(); updateVRButton();
  });
}
function updateVRButton() {
  const b = document.getElementById('vrBtn'); if (!b) return;
  b.hidden = !(VR.supported.vr || VR.supported.ar) || !!VR.session;
  b.textContent = VR.supported.vr ? 'Enter VR' : 'Enter mixed reality';
}
function vrSection() {
  const s = VR.supported;
  const rows = [
    h('div', { class:'hint' }, s.vr || s.ar ? 'A headset is ready.'
      : 'No headset found. Open this page in the Meta Quest browser (it has to come from an https address), or use a PC headset with Chrome.'),
    h('div', { class:'btns' },
      h('button', { class:'primary', disabled:!s.vr, onclick:() => enterXR('vr') }, 'Enter VR'),
      h('button', { disabled:!s.ar, onclick:() => enterXR('ar') }, 'Enter mixed reality')),
    slider('VR render quality', state.env, 'vrQuality', 0.5, 1.5, 0.05, scheduleSave),
    h('div', { class:'hint' }, 'In the headset: Y / B or the button on your left wrist opens the panel. Trigger or pinch uses it; with hand tracking you can also poke it. ',
      'Point at an object and hold the trigger to carry it. Grip, or trigger in empty space, grabs the world; two hands scale and turn it. ',
      'Left stick flies, right stick turns and rises. The View tab switches between dollhouse, life size and ant.'),
  ];
  return section('vr', 'VR & mixed reality', s.vr ? '— headset ready' : '', ...rows);
}
function vrWidgetLocal(label, tab) {      // test helper: where a panel widget sits, in your own (rig) space
  if (tab && UI.tab !== tab) { UI.tab = tab; UI.dirty = true; }
  if (UI.dirty) uiRefresh();
  const fixed = UI.fixed.find(x => x.label === label), w = fixed || UI.items.find(x => x.label === label);
  if (!w) return null;
  if (!fixed) {                             // scroll it into view first
    const sc = UI.scroll[UI.tab] || 0;
    if (w.y < sc || w.y + w.h > sc + CONTENT_H) { UI.scroll[UI.tab] = clampN(w.y - 20, 0, maxScroll()); uiDraw(); }
  }
  const cy = (fixed ? w.y : CONTENT_Y + w.y - (UI.scroll[UI.tab] || 0)) + w.h / 2;
  const lp = new V3(((w.x + w.w / 2) / UI.W - 0.5) * UI.PW, (0.5 - cy / UI.H) * UI.PH, 0);
  VR.panel.updateMatrix();
  return lp.applyMatrix4(VR.panel.matrix).toArray();
}

/* =====================================================================
   Boot
   ===================================================================== */
function boot() {
  let s = null;
  const preset = Q.get('preset');
  if (preset != null) {
    const keys = Object.keys(SCENES);
    s = SCENES[keys[+preset] || preset] ? SCENES[keys[+preset] || preset]() : null;
  } else {
    try { const t = localStorage.getItem('illusionStudio.v1'); if (t) { const p = JSON.parse(t); if (p.items && p.look) s = p; } } catch (e) {}
  }
  if (!s) s = SCENES['Ball by a wormhole']();
  if (Q.get('ao') === '0') s.env = { ...(s.env || {}), ao:false };
  if (Q.get('look') && LOOK_PRESETS[Q.get('look')]) applyLookPreset(s.look, Q.get('look'));
  if (Q.get('format') && FORMAT_BY_ID[Q.get('format')]) s.exp = { ...(s.exp || {}), format:Q.get('format'), native:true, rotate:Q.get('rotate') === '1' };
  loadState(s);
  setStatus('Drag to orbit · wheel to zoom · Export JPG up to 3000 px');
  window.__illusion = { state:() => state, exportJPG, renderer, frame, VR, UI, vrWidgetLocal, enterXR };
  document.getElementById('vrBtn').addEventListener('click', () => enterXR(VR.supported.vr ? 'vr' : 'ar'));
  checkXRSupport();
  if (Q.get('selftest') === 'export') setTimeout(async () => {
    state.exp.size = 3000;
    const t0 = performance.now();
    const url = await exportJPG({ download:false });
    const img = new Image();
    img.onload = () => console.log(`SELFTEST export ${img.naturalWidth}x${img.naturalHeight} ${(url.length * 0.75 / 1048576).toFixed(2)}MB ${(performance.now() - t0).toFixed(0)}ms`);
    img.onerror = () => console.log('SELFTEST export decode failed');
    img.src = url || '';
    if (!url) console.log('SELFTEST export returned nothing');
    else { const a = document.createElement('img'); a.src = url; a.style.cssText = 'position:fixed;right:0;top:0;width:420px;z-index:9;border:2px solid red'; document.body.append(a); }
  }, 1500);
}
boot();
</script>
