<style>
  :root {
    --bg: #07090d; --panel: #0f141b; --panel2: #161d27; --line: #263140; --ink: #dfe7ef; --dim: #8a98a8;
    --accent: #6fb7ff; --green: #47c07a; --amber: #e8b04a; --red: #e45d5d; --na: #5d6878;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 22px; letter-spacing: 0.02em; }
  header .sub { color: var(--dim); font-size: 14px; }
  .grow { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ctrl label { color: var(--dim); font-size: 13px; }
  button, select, input { font: inherit; color: var(--ink); }
  .btn, .chip, .tab, #levels button, #langBtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .btn:hover, .chip:hover, .tab:hover, #levels button:hover, #langBtn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .on { background: #1d3550 !important; border-color: var(--accent) !important; }
  .danger { color: #f0a0a0; }
  select { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .m0 { padding: 8px 20px; color: var(--dim); font-size: 13px; border-bottom: 1px solid var(--line); }
  main { display: grid; grid-template-columns: 360px minmax(0, 1fr) 400px; grid-template-areas: "panel view ledger"; gap: 0; }
  #panel { grid-area: panel; border-right: 1px solid var(--line); padding: 14px 18px 30px; }
  #ledger { grid-area: ledger; padding: 14px 20px 30px; border-left: 1px solid var(--line); }
  #viewcol { grid-area: view; position: relative; }
  #view { position: sticky; top: 0; height: calc(100vh - 170px); min-height: 480px; background: #000; overflow: hidden; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .v-overlay { position: absolute; inset: 0; pointer-events: none; }
  .v-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .v-lines line { stroke: rgba(220, 230, 240, 0.55); stroke-width: 1; }
  .v-labels { position: absolute; inset: 0; }
  .v-label { position: absolute; left: 0; top: 0; font-size: 12px; color: #dfe7ef; white-space: nowrap; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  .v-label.sel { color: #9fd0ff; font-weight: 600; }
  .v-label.slot { color: #8ff0b0; }
  .v-label.layer.left { translate: -100% 0; }
  .v-label.layer { white-space: normal; width: 195px; line-height: 1.3; background: rgba(8, 12, 18, 0.72); border: 1px solid #2a3646; border-radius: 5px; padding: 2px 7px; font-size: 12.5px; }
  .v-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: auto; }
  .v-btn { background: rgba(15, 20, 27, 0.82); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--ink); }
  .v-btn:hover { border-color: var(--accent); }
  .v-btn.vrbtn { background: #1d3550; border-color: var(--accent); font-weight: 600; }
  .v-ex { display: flex; align-items: center; gap: 6px; background: rgba(15, 20, 27, 0.82); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 13px; color: var(--dim); }
  .v-ex input { width: 110px; accent-color: var(--accent); }
  .v-exv { color: var(--accent); min-width: 2.4em; }
  .v-info { position: absolute; left: 10px; bottom: 10px; background: rgba(8, 12, 18, 0.78); border: 1px solid #222c38; border-radius: 8px; padding: 8px 11px; font-size: 13px; min-width: 210px; }
  .v-title { font-weight: 600; margin-bottom: 4px; }
  .v-row { display: flex; justify-content: space-between; gap: 14px; }
  .v-k { color: var(--dim); }
  .v-note { position: absolute; right: 10px; top: 52px; max-width: min(420px, 55%); font-size: 12px; color: #a9b6c4; background: rgba(8, 12, 18, 0.7); border-radius: 8px; padding: 7px 10px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .row { padding: 7px 0; border-bottom: 1px solid #1a222d; }
  .rowhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .rowhead label { color: var(--ink); }
  .val { width: 9.5em; text-align: right; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 1px 4px; color: var(--accent); }
  .val:hover, .val:focus { border-color: var(--line); outline: none; }
  .sline { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .sline input[type=range] { flex: 1; accent-color: var(--accent); }
  .pm { width: 30px; height: 28px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); cursor: pointer; font-size: 17px; line-height: 1; touch-action: none; }
  .readout { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .rl { color: var(--dim); }
  .rv { text-align: right; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 6px currentColor; }
  .chips label { display: block; margin-bottom: 5px; }
  .chipbox { display: flex; flex-wrap: wrap; gap: 6px; }
  .warn { margin: 8px 0; padding: 7px 10px; border-left: 3px solid var(--amber); background: #2a2213; color: #f0d6a0; font-size: 13px; }
  .note { color: var(--dim); font-size: 14px; }
  .picker { display: flex; align-items: center; gap: 10px; }
  .picker select { flex: 1; }
  .moon { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin: 10px 0; }
  .moonhead { display: flex; justify-content: space-between; align-items: center; }
  .sysrow { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; display: grid; gap: 6px; }
  .sysrow.on { border-color: var(--accent); }
  .sysrow .name { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; }
  .sysinfo { color: var(--dim); font-size: 13px; }
  .sysbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  h2 { margin: 0 0 2px; font-size: 20px; }
  .for { margin: 0 0 12px; color: var(--dim); }
  .lamps { display: grid; gap: 6px; margin-bottom: 14px; }
  .lamp { display: grid; grid-template-columns: 18px 18px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .lamp .tn { color: var(--dim); }
  .lamp .ts { color: var(--dim); font-size: 13px; text-align: right; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--na); display: inline-block; }
  .green .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .amber .dot { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .red .dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .tier h3 { font-size: 15px; margin: 16px 0 6px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .lrow { padding: 7px 10px; border-radius: 7px; margin: 4px 0; background: var(--panel); border-left: 3px solid var(--na); }
  .lrow.green { border-left-color: var(--green); } .lrow.amber { border-left-color: var(--amber); } .lrow.red { border-left-color: var(--red); }
  .ltop { display: grid; grid-template-columns: 14px 1fr auto 70px; gap: 8px; align-items: center; }
  .lname { font-weight: 600; }
  .lval { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .lst { color: var(--dim); font-size: 12px; text-align: right; }
  .lwhy { color: #b8c4d0; font-size: 13px; margin: 3px 0 0 22px; }
  .lsrc { color: var(--dim); font-size: 12px; margin: 2px 0 0 22px; font-style: italic; }
  .contested { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px dashed var(--amber); color: var(--amber);
    background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(232,176,74,0.12) 4px 8px); }
  .subhead { margin: 18px 0 6px; font-size: 14px; color: var(--ink); }
  .chartbox { margin: 4px 0 8px; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .grid { stroke: #1e2835; stroke-width: 1; }
  .chart .ax { fill: var(--dim); font-size: 10px; }
  .chart .lab { fill: #a9b6c4; font-size: 10px; }
  .chart .icel { fill: #9fd0ff; }
  .chart .zero { stroke: #5d6878; stroke-dasharray: 3 3; }
  .chart .ice { stroke: #6fb7ff; stroke-dasharray: 2 3; opacity: 0.7; }
  .chart .band { fill: rgba(232, 176, 74, 0.22); stroke: none; }
  .chart .mean { fill: none; stroke: #e8b04a; stroke-width: 2; }
  .chart .noair { fill: rgba(228, 93, 93, 0.08); }
  .chart .shore { stroke: #e45d5d; stroke-width: 1.5; }
  .chart .body { fill: #0f141b; stroke: #8a98a8; stroke-width: 1.2; }
  .chart .body.air { fill: #6fb7ff; stroke: #6fb7ff; }
  .chart .bl { fill: #8a98a8; font-size: 9.5px; }
  .chart .you { fill: #47c07a; stroke: #fff; stroke-width: 1.5; }
  .chart .youl { fill: #dfe7ef; font-size: 11px; font-weight: 600; }
  .legend { font-size: 12px; color: var(--dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 14px; height: 8px; margin-right: 3px; vertical-align: 0; }
  .legend .sw.mean { background: #e8b04a; height: 2px; vertical-align: 3px; }
  .legend .sw.band { background: rgba(232, 176, 74, 0.35); }
  .legend .sw.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.2px solid #8a98a8; }
  .legend .sw.dot.air { background: #6fb7ff; border-color: #6fb7ff; }
  .legend .sw.dot.you { background: #47c07a; border-color: #fff; }
  .lrow { cursor: pointer; }
  .lrow:hover { background: #131a23; }
  .lrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lrow.open { background: #121922; }
  .card { cursor: default; margin: 8px 0 2px 22px; padding: 8px 10px; border-radius: 7px; background: #0b1017; border: 1px solid var(--line); display: grid; gap: 6px; }
  .cpart { display: grid; grid-template-columns: 1fr; gap: 1px; font-size: 13px; }
  .ck { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .cv { color: #d2dbe4; }
  .contested-views .view { margin: 2px 0; padding: 4px 8px; border-left: 2px dashed var(--amber); color: #e6d4ac; font-size: 13px;
    background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(232,176,74,0.07) 4px 8px); }
  .card .btn { justify-self: start; font-size: 13px; }
  .esi { color: var(--dim); font-size: 12.5px; margin: -6px 0 6px; }
  .cardhint { color: var(--dim); font-size: 12.5px; margin: 0 0 4px; }
  .v-cmap { position: fixed; inset: 3vh 2vw; background: #07090d; border: 1px solid var(--line); border-radius: 10px; overflow: auto; z-index: 50; pointer-events: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .v-cmclose { position: sticky; float: right; top: 6px; right: 6px; margin: 6px; z-index: 2; }
  .v-cmbody { padding: 8px 12px 14px; }
  .cm-head { font-size: 14px; margin: 4px 0 6px; }
  .cm-hint { display: block; color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .cmap { width: 100%; min-width: 980px; max-width: 1500px; height: auto; display: block; margin: 0 auto; }
  .cm-col { fill: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: 0.03em; }
  .cm-edge { fill: none; stroke: #2c3a4c; stroke-width: 1.3; }
  .cm-edge.on { stroke: #6fb7ff; stroke-width: 2; }
  .cm-edge.dim { opacity: 0.25; }
  .cm-edge.pulse { stroke: #8ff0b0; stroke-width: 2; stroke-dasharray: 6 10; animation: cmpulse 1.2s linear 2; }
  @keyframes cmpulse { from { stroke-dashoffset: 32; } to { stroke-dashoffset: 0; } }
  .cm-node { cursor: pointer; }
  .cm-node rect { fill: #111821; stroke: #3a4757; stroke-width: 1.3; }
  .cm-node.green rect { stroke: var(--green); } .cm-node.amber rect { stroke: var(--amber); } .cm-node.red rect { stroke: var(--red); }
  .cm-node.sel rect { fill: #1d3550; stroke-width: 2.2; }
  .cm-node.changed rect { fill: #14261c; }
  .cm-node.dim { opacity: 0.3; }
  .cm-l { fill: #c4cfdb; font-size: 11px; }
  .cm-v { fill: #ffffff; font-size: 12px; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .cm-edge.pulse { animation: none; } }
  footer { padding: 12px 20px 22px; color: var(--dim); font-size: 13px; border-top: 1px solid var(--line); }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1d3550; border: 1px solid var(--accent); padding: 8px 14px; border-radius: 8px; }
  @media (max-width: 1250px) {
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "view view" "panel ledger"; }
    #view { position: relative; height: 62vh; }
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-areas: "view" "panel" "ledger"; }
    #view { height: 70vh; }
    .v-note { display: none; }
    #panel { border-right: 0; border-bottom: 1px solid var(--line); }
    #ledger { border-left: 0; }
    header, .m0, #panel, #ledger, footer { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
  <header>
    <div><h1>Planet Designer</h1><div class="sub" id="sub"></div></div>
    <div class="grow"></div>
    <div class="ctrl"><label id="presetLabel"></label><select id="preset"></select></div>
    <div class="ctrl"><label id="levelLabel"></label><span id="levels">
      <button data-level="explorer"></button> <button data-level="student"></button> <button data-level="scientist"></button></span></div>
    <div class="ctrl">
      <button class="btn" id="shareBtn"></button><button class="btn" id="exportBtn"></button>
      <button class="btn" id="importBtn"></button><button class="btn danger" id="resetBtn"></button>
      <button id="langBtn"></button>
    </div>
    <input type="file" id="file" accept=".json,application/json" hidden />
  </header>
  <div class="m0" id="m0"></div>
  <main>
    <div id="panel"></div>
    <div id="viewcol"><div id="view"></div></div>
    <div id="ledger"></div>
  </main>
  <footer id="foot"></footer>
  <div id="toast" hidden></div>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
  <script type="module" src="main.js?v=5"></script>
</body>
</html>
