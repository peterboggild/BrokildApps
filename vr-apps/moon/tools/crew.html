<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Crew close-up</title>
<!-- Development view of the crewmen (not linked from the site): the Command Module Pilot as you see him from the
     Commander's couch, lit as in the cabin, with the crew's life running. tools/shot-crew.cjs drives it.
     URL: ?fov=deg (zoom from your eye point)  &at=x,y,z (look at, crewman frame)  &talk (a made-up voice)
          &look=you|panel  &still (no life: the crewman as built)  &lm (the LMP standing, from the CDR's station) -->
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>html, body { margin: 0; height: 100%; background: #111; } canvas { display: block; }</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { makeCrewman } from '../src/cabin.js?v=19';
import { makeCrewLife } from '../src/crew-life.js?v=19';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3833);
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 70), innerWidth / innerHeight, 0.01, 20);
scene.add(camera);

/* the crewman where he sits, you at the origin (the Commander's eyes), lights as in the Command Module */
const lm = q.has('lm');
const man = makeCrewman(lm ? { variant: 1, standing: true } : { variant: 0 });
if (lm) { man.position.set(-0.9, 0, 0); man.rotation.y = Math.PI; }
else man.position.set(0.65, 0, 0);
scene.add(man);
scene.add(new THREE.HemisphereLight(0xfff2dd, 0x2a2824, lm ? 2.6 : 0.55));
const f1 = new THREE.PointLight(0xffe6c4, lm ? 4.5 : 1.1, 3.5, lm ? 1 : 1.5); f1.position.set(0.1, 0.55, 0.05);
const f2 = new THREE.PointLight(0xffe6c4, lm ? 4.0 : 0.8, 3.5, lm ? 1 : 1.5); f2.position.set(1.2, 0.5, 0.05);
scene.add(f1, f2);
const at = (q.get('at') || '0,0,0.06').split(',').map(Number);
const target = man.localToWorld(new THREE.Vector3(...at));
camera.lookAt(target);

/* a made-up voice for the jaw: syllables of 120-250 ms */
const fakeRadio = {
  talking: who => q.has('talk') ? { ch: 'intercom' } : null,
  level: who => { if (!q.has('talk')) return 0; const t = performance.now() / 1000; return Math.max(0, Math.sin(t * 23) * Math.sin(t * 7.1 + 1)) * 0.18; }
};
const life = q.has('still') ? null : makeCrewLife([{ man, who: lm ? 'LMP' : 'CMP' }]);
if (life && q.get('look')) life.force(q.get('look'));
let last = performance.now(), frames = 0;
renderer.setAnimationLoop(now => {
  if (life) life.update(now / 1000, { viewer: camera, radio: fakeRadio });
  renderer.render(scene, camera); frames++;
});
window.__crew = { THREE, scene, camera, renderer, man, life, get frames() { return frames; } };
</script>
</body>
</html>
