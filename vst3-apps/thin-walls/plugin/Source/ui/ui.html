/* ==================================================================== */
/*  LIGHT SYNC (protocol section 9, page preference per profile)         */
/*                                                                       */
/*  A room's pendants follow the sound in that room (FOLLOW) or pulse on */
/*  the host's beat (BEAT). The factor multiplies the lamp's light, its  */
/*  glowing shade and the bloom that comes off it; at SYNC 0 it is 1.0,  */
/*  an exact multiply, so the lamps and the idle rule are today's.       */
/* ==================================================================== */
const SYNC_KEY = "thinwalls.lightsync";
const SYNC = { s:0.2, mode:"follow", win:false, tgt:[0,0,0], L:[0,0,0], beat:null, beatAt:0, last:0,
               exp:null };
try {
  const o = JSON.parse(localStorage.getItem(SYNC_KEY) || "null");
  if (o && typeof o === "object"){
    if (typeof o.s === "number" && isFinite(o.s)) SYNC.s = clamp01(o.s);
    if (o.mode === "beat" || o.mode === "follow") SYNC.mode = o.mode;
    SYNC.win = !!o.win;
  }
} catch(e){}
function syncSave(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify({ s:SYNC.s, mode:SYNC.mode, win:SYNC.win })); } catch(e){} }
/*  The slider's curve: LOW (0.2) moves the lamps by a few percent, the top of
    the travel is theatre - dim to half in silence, up to double on a hit. */
function syncAmt(){ const s = SYNC.s; return s * s * 0.5 + s * 0.5; }
function beatPlaying(b){ return !!(b && b.playing && b.bpm > 0); }
/*  A pulse on every beat: exp(-5 * phase), the phase carried forward between
    scenes at bpm/60 per second so it does not step at the 30 Hz scene rate. */
function beatPulseAt(ppq){ const f = ppq - Math.floor(ppq); return Math.exp(-5 * f); }
function syncTargets(now){
  if (SYNC.mode === "beat" && beatPlaying(SYNC.beat)){
    const b = SYNC.beat;
    const p = beatPulseAt(b.ppq + (now - SYNC.beatAt) / 1000 * b.bpm / 60);
    return [p, p, p];
  }
  return SYNC.tgt;
}
/*  Attack fast, release in about a tenth of a second: the lamps rise with a
    hit and settle rather than stepping every scene. */
function syncSmooth(L, tgt, dt){
  for (let r = 0; r < 3; r++){
    const t = tgt[r] || 0, tau = t > L[r] ? 0.018 : 0.10;
    L[r] += (t - L[r]) * (1 - Math.exp(-Math.max(0, dt) / tau));
    if (L[r] < 1e-4 && t === 0) L[r] = 0;
  }
}
function syncStep(now){
  const dt = SYNC.last ? Math.min(0.1, (now - SYNC.last) / 1000) : 0.016;
  SYNC.last = now;
  syncSmooth(SYNC.L, syncTargets(now), dt);
}
function lampK(r){
  if (SYNC.s <= 0) return 1;
  const L = EXP.active && SYNC.exp ? SYNC.exp[r] : SYNC.L[r];
  const e = syncAmt();
  return (1 - 0.5 * e) + 1.5 * e * L;
}
function winK(){ return SYNC.win ? lampK(2) : 1; }
/*  Moving means: the slider is up AND there is something to follow - sound in
    a room, a lamp still settling, or a beat playing. Silence goes idle. */
function syncActive(){
  if (SYNC.s <= 0 || EXP.active) return false;
  if (SYNC.mode === "beat" && beatPlaying(SYNC.beat)) return true;
  for (let r = 0; r < 3; r++) if (SYNC.tgt[r] > 0.001 || SYNC.L[r] > 0.002) return true;
  return false;
}
function syncUniforms(loc){
  if (!gl) return;
  if (loc.k) gl.uniform1fv(loc.k, [lampK(0), lampK(1), lampK(2)]);
  if (loc.w) gl.uniform1f(loc.w, winK());
}
/*  The follower sits between about 0.2 (a held sound) and 0.9 (an onset);
    stretched so that range spans the lamps' whole travel. 0 stays 0. */
function syncShape(v){ v = +v; return isFinite(v) ? clamp01((v - 0.12) / 0.5) : 0; }
function syncOnScene(d){
  if (Array.isArray(d.light)) for (let r = 0; r < 3; r++) SYNC.tgt[r] = syncShape(d.light[r]);
  if (d.beat && typeof d.beat === "object"){ SYNC.beat = { bpm:+d.beat.bpm || 0, ppq:+d.beat.ppq || 0, playing:!!d.beat.playing }; SYNC.beatAt = nowMs(); }
  if (syncActive()) invalidate("pov");
}
Object.assign(HINT, {
  sync:     ["LIGHT SYNC", "How much the lamps follow the sound. 0 is off - the lamps are exactly as they always were. LOW (the default) breathes a few percent; all the way up the lamps dim in silence and flare on every hit. Remembered on this computer."],
  syncfollow:["FOLLOW", "Each room's pendants follow the sound IN THAT ROOM: a hit flashes, a held note glows, and a room the sound cannot reach stays steady. Uses the engine's own measure of each room."],
  syncbeat: ["BEAT", "The pendants pulse on the host's beat while its transport is playing. With the transport stopped, or no host clock, they follow the sound instead."],
  syncwin:  ["WINDOW", "Let the hall's daylight window join in. Off by default - daylight does not usually dance."]
});
function buildSyncControls(g){
  const hd = mk("h2", "sub", g); hd.textContent = "Light sync";
  const row = mk("div", "row", g);
  const lab = mk("label", "lab", row); lab.textContent = "SYNC";
  const sl = mk("input", "sl", row);
  sl.type = "range"; sl.min = "0"; sl.max = "1"; sl.step = "0.01"; sl.id = "syncS";
  hintOn(sl, "sync");
  const val = mk("span", "val", row); val.id = "syncVal";
  sl.addEventListener("input", () => { SYNC.s = clamp01(parseFloat(sl.value)); syncSave(); updateSyncUI(); invalidate("pov"); });
  const br = mk("div", "btnrow", g);
  const bF = mk("button", "b", br); bF.type = "button"; bF.id = "syncFollow"; bF.textContent = "Follow"; hintOn(bF, "syncfollow");
  const bB = mk("button", "b", br); bB.type = "button"; bB.id = "syncBeat"; bB.textContent = "Beat"; hintOn(bB, "syncbeat");
  const bW = mk("button", "b", br); bW.type = "button"; bW.id = "syncWin"; bW.textContent = "Window"; hintOn(bW, "syncwin");
  bF.addEventListener("click", () => { SYNC.mode = "follow"; syncSave(); updateSyncUI(); invalidate("pov"); });
  bB.addEventListener("click", () => { SYNC.mode = "beat"; syncSave(); updateSyncUI(); invalidate("pov"); });
  bW.addEventListener("click", () => { SYNC.win = !SYNC.win; syncSave(); updateSyncUI(); invalidate("pov"); });
  updateSyncUI();
}
function updateSyncUI(){
  const sl = document.getElementById("syncS");
  if (!sl) return;
  if (document.activeElement !== sl) sl.value = String(SYNC.s);
  document.getElementById("syncVal").textContent = SYNC.s <= 0 ? "off" : Math.round(SYNC.s * 100) + "%";
  document.getElementById("syncFollow").classList.toggle("on", SYNC.mode === "follow");
  document.getElementById("syncBeat").classList.toggle("on", SYNC.mode === "beat");
  document.getElementById("syncWin").classList.toggle("on", SYNC.win);
}

/* ==================================================================== */
/*  WALL PICTURES (protocol section 10)                                  */
/* ==================================================================== */
const PIC_MAX = 8;
const PIC_UNIT = 14;                       /* the texture unit the pictures are drawn with */
const PIC_SIZES = [["S", 0.4], ["M", 0.7], ["L", 1.0], ["XL", 1.5]];
const PIC_FRAMES = ["THIN BLACK", "OAK", "GILT", "CANVAS"];
const PIC_KINDS = ["PRINT", "ACOUSTIC PANEL"];
const PIC_WALLNAME = ["west", "east", "south", "north"];
let pics = [];                             /* [{id, room, wall, along, z, w, aspect, frame, kind}] */
const picImg = {};                         /* id -> {jpg, img, ok, aspect, avg, tex} */
let picSel = -1, picArm = null, picDrag = null;
const picDef = { w:0.7, frame:1, kind:0 };
let PIC_RANGES = [], PIC_TEX_START = -1, PIC_TEX_END = -1;
let picSendTmr = 0, picLastSend = -1e9;
let planPicsDrawn = [];

function picWall(room, wall){
  const r = ROOMS[room];
  if (wall === 0) return { p0:[r.x0, r.y0], dir:[0,1], n:[1,0],  len:r.y1 - r.y0, axis:"y", coord:r.x0, low:r.y0, h:r.h };
  if (wall === 1) return { p0:[r.x1, r.y0], dir:[0,1], n:[-1,0], len:r.y1 - r.y0, axis:"y", coord:r.x1, low:r.y0, h:r.h };
  if (wall === 2) return { p0:[r.x0, r.y0], dir:[1,0], n:[0,1],  len:r.x1 - r.x0, axis:"x", coord:r.y0, low:r.x0, h:r.h };
  return               { p0:[r.x0, r.y1], dir:[1,0], n:[0,-1], len:r.x1 - r.x0, axis:"x", coord:r.y1, low:r.x0, h:r.h };
}
/*  Where a picture really hangs: on the room's own wall, or - where that wall
    is broken - on the panel under its centre, at that panel's angle. */
function picPlace(it){
  const W = picWall(it.room, it.wall);
  const P = [W.p0[0] + W.dir[0] * it.along, W.p0[1] + W.dir[1] * it.along];
  let c = P, t = W.dir;
  const poly = roomPoly(it.room);
  let best = null, bd = 1e9;
  for (let e = 0; e < poly.length; e++){
    const a = poly[e], b = poly[(e + 1) % poly.length];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < 1e-4) continue;
    const ux = dx / L, uy = dy / L;
    if (Math.abs(ux * W.dir[0] + uy * W.dir[1]) < 0.5) continue;       /* a side wall, not this one */
    let k = ((P[0] - a[0]) * ux + (P[1] - a[1]) * uy);
    k = Math.max(0, Math.min(L, k));
    const q = [a[0] + ux * k, a[1] + uy * k];
    const d = Math.hypot(q[0] - P[0], q[1] - P[1]);
    if (d < bd){ bd = d; best = { q:q, u:[ux, uy] }; }
  }
  if (best && bd < 0.9){
    c = best.q;
    t = (best.u[0] * W.dir[0] + best.u[1] * W.dir[1]) >= 0 ? best.u : [-best.u[0], -best.u[1]];
  }
  let n = [-t[1], t[0]];
  if (n[0] * W.n[0] + n[1] * W.n[1] < 0) n = [-n[0], -n[1]];
  const h = it.w * it.aspect;
  const d = it.kind === 1 ? 0.05 : (it.frame === 3 ? 0.035 : 0.012);
  return { c:c, t:t, n:n, zc:it.z, w:it.w, h:h, d:d, W:W };
}
/*  Inside the wall's extent, under the ceiling, off the floor, and clear of
    every door opening in that wall (the architrave included). */
function picClamp(it){
  const W = picWall(it.room, it.wall);
  it.aspect = Math.max(0.2, Math.min(5, +it.aspect || 0.75));
  it.w = Math.max(0.2, Math.min(2.0, W.len - 0.2, (W.h - 0.35) / it.aspect, +it.w || 0.7));
  const h = it.w * it.aspect;
  const lo = it.w / 2 + 0.05, hi = W.len - it.w / 2 - 0.05;
  it.along = Math.max(lo, Math.min(hi, +it.along || W.len / 2));
  it.z = Math.max(h / 2 + 0.15, Math.min(W.h - h / 2 - 0.08, +it.z || 1.5));
  for (const d of DOORS){
    if (d.axis !== W.axis || Math.abs(d.wall - W.coord) > 1e-3) continue;
    const a0 = d.s0 - W.low - 0.12, a1 = d.s1 - W.low + 0.12;
    const overlap = it.along + it.w / 2 > a0 && it.along - it.w / 2 < a1;
    if (!overlap || it.z - h / 2 > DOOR_H + 0.12) continue;
    const left = a0 - it.w / 2 - 0.01, right = a1 + it.w / 2 + 0.01;
    const okL = left >= lo, okR = right <= hi;
    if (okL && (!okR || Math.abs(left - it.along) <= Math.abs(right - it.along))) it.along = left;
    else if (okR) it.along = right;
    else it.z = Math.min(W.h - h / 2 - 0.05, DOOR_H + 0.18 + h / 2);
  }
  it.frame = Math.max(0, Math.min(3, it.frame | 0));
  it.kind = it.kind ? 1 : 0;
  return it;
}
function picItemsOut(){
  return pics.map(p => ({ id:p.id, room:p.room, wall:p.wall, along:Math.round(p.along * 1000) / 1000,
    z:Math.round(p.z * 1000) / 1000, w:Math.round(p.w * 1000) / 1000, aspect:Math.round(p.aspect * 10000) / 10000,
    frame:p.frame, kind:p.kind }));
}
function picSendNow(){
  if (picSendTmr){ clearTimeout(picSendTmr); picSendTmr = 0; }
  picLastSend = nowMs();
  NB.send({ k:"pics", items:picItemsOut() });
}
function picSendSoon(){
  const dt = nowMs() - picLastSend;
  if (dt >= 34){ picSendNow(); return; }
  if (!picSendTmr) picSendTmr = setTimeout(picSendNow, Math.max(1, 34 - dt));
}
function picChanged(final){
  meshDirty = true;
  invalidate("both");
  updatePicUI();
  if (final) picSendNow(); else picSendSoon();
}

/* ---- images ---- */
function picImageFromJpg(id, jpg){
  if (!id || typeof jpg !== "string" || !jpg) return;
  const rec = picImg[id] = picImg[id] || {};
  if (rec.jpg === jpg && rec.img) return;
  rec.jpg = jpg; rec.ok = false;
  if (rec.tex && gl){ gl.deleteTexture(rec.tex); }
  rec.tex = null;
  const im = new Image();
  im.onload = () => {
    rec.ok = true;
    rec.aspect = im.naturalHeight / Math.max(1, im.naturalWidth);
    try {
      const c = document.createElement("canvas"); c.width = 16; c.height = 16;
      const g2 = c.getContext("2d"); g2.drawImage(im, 0, 0, 16, 16);
      const d = g2.getImageData(0, 0, 16, 16).data; let r = 0, gg = 0, b = 0;
      for (let i = 0; i < d.length; i += 4){ r += d[i]; gg += d[i+1]; b += d[i+2]; }
      const n = d.length / 4;
      rec.avg = [Math.pow(r / n / 255, 2.2), Math.pow(gg / n / 255, 2.2), Math.pow(b / n / 255, 2.2)];
    } catch(e){ rec.avg = [0.4, 0.4, 0.4]; }
    CX.boxGen = -1;
    meshDirty = true;
    invalidate("both");
  };
  im.src = "data:image/jpeg;base64," + jpg;
  rec.img = im;
}
function picTex(id){
  const rec = picImg[id];
  if (!gl) return null;
  if (rec && rec.tex) return rec.tex;
  if (!rec || !rec.ok){
    if (!CX.picGrey){
      CX.picGrey = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, CX.picGrey);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([150, 146, 138, 255]));
    }
    return CX.picGrey;
  }
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, rec.img);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  rec.tex = t;
  return t;
}
/*  LOAD: the page shrinks the picture itself (max 1024 px a side, JPEG 0.9)
    and hands it to native ONCE; after that only the layout travels. */
function picLoadFile(file){
  if (!file) return;
  if (pics.length >= PIC_MAX){ noticeEl.textContent = PIC_MAX + " pictures is the limit - delete one first"; return; }
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    URL.revokeObjectURL(url);
    const k = Math.min(1, 1024 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
    const g2 = c.getContext("2d");
    g2.fillStyle = "#fff"; g2.fillRect(0, 0, c.width, c.height);
    g2.drawImage(im, 0, 0, c.width, c.height);
    const jpg = c.toDataURL("image/jpeg", 0.9).split(",")[1];
    const id = "p" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    picImageFromJpg(id, jpg);
    picImg[id].aspect = c.height / c.width;
    NB.send({ k:"picAdd", id:id, jpg:jpg });
    picArm = id;
    picSel = -1;
    noticeEl.textContent = "click a wall in the plan or in the 3D view to hang it";
    updatePicUI();
  };
  im.onerror = () => { URL.revokeObjectURL(url); noticeEl.textContent = "that file is not an image the page can read"; };
  im.src = url;
}
function picHang(room, wall, along, z){
  if (!picArm || pics.length >= PIC_MAX) return -1;
  const rec = picImg[picArm];
  const it = picClamp({ id:picArm, room:room, wall:wall, along:along, z:z || 1.55, w:picDef.w,
                        aspect:rec && rec.aspect ? rec.aspect : 0.75, frame:picDef.frame, kind:picDef.kind });
  pics.push(it);
  picSel = pics.length - 1;
  picArm = null;
  noticeEl.textContent = "hung on the " + ROOMS[room].name + " " + PIC_WALLNAME[wall] + " wall - drag it to move it";
  picChanged(true);
  return picSel;
}
function picDelete(){
  if (picSel < 0) return;
  pics.splice(picSel, 1);
  picSel = -1;
  picChanged(true);
}
function picSetSel(k, v){
  if (picSel >= 0){ const it = pics[picSel]; it[k] = v; picClamp(it); picChanged(true); }
  else { picDef[k] = v; updatePicUI(); }
}
function picSanitize(items){
  const out = [];
  for (const q of (items || [])){
    if (!q || !q.id) continue;
    const room = q.room | 0, wall = q.wall | 0;
    if (room < 0 || room > 2 || wall < 0 || wall > 3) continue;
    out.push(picClamp({ id:String(q.id), room:room, wall:wall, along:+q.along, z:+q.z, w:+q.w, aspect:+q.aspect,
                        frame:q.frame | 0, kind:q.kind | 0 }));
    if (out.length >= PIC_MAX) break;
  }
  return out;
}
/*  From native (initialState, a preset, a project): replace, send nothing. */
function applyPicsNative(items, images){
  if (images && typeof images === "object") for (const id in images) picImageFromJpg(id, images[id]);
  pics = picSanitize(items);
  if (picSel >= pics.length) picSel = -1;
  picDrag = null;
  meshDirty = true;
  invalidate("both");
  updatePicUI();
}

/* ---- the POV mesh ---- */
function picBar(center, t3, n3, hu, hv, hw, mat, kind, room){
  boxOriented(center, t3, n3, [0,0,1], hu, hv, hw, mat, [kind,kind,kind,kind,kind,kind], room, 2);
}
function buildPictureMesh(){
  PIC_RANGES = []; PIC_TEX_START = -1; PIC_TEX_END = -1;
  if (!pics.length) return;
  const F = pics.map(picPlace);
  /* frames first: ordinary material kinds, drawn with the rest of the room */
  pics.forEach((it, i) => {
    const f = F[i], t3 = [f.t[0], f.t[1], 0], n3 = [f.n[0], f.n[1], 0];
    const at = (u, v, z) => [f.c[0] + f.t[0]*u + f.n[0]*v, f.c[1] + f.t[1]*u + f.n[1]*v, f.zc + z];
    if (it.frame === 3) return;                          /* canvas: the picture wraps its own edge */
    const fw = it.frame === 0 ? 0.018 : 0.055;
    const kind = it.frame === 0 ? 11 : (it.frame === 1 ? 41 : 13);
    const dep = f.d + (it.frame === 0 ? 0.012 : 0.022);
    const W = f.w / 2, H = f.h / 2;
    /* four bars of the moulding, mitred square */
    picBar(at(0, dep/2, H + fw/2),  t3, n3, W + fw, dep/2, fw/2, 0, kind, it.room);
    picBar(at(0, dep/2, -H - fw/2), t3, n3, W + fw, dep/2, fw/2, 0, kind, it.room);
    picBar(at(-W - fw/2, dep/2, 0), t3, n3, fw/2, dep/2, H, 0, kind, it.room);
    picBar(at( W + fw/2, dep/2, 0), t3, n3, fw/2, dep/2, H, 0, kind, it.room);
    if (it.frame !== 0){
      /* the bevel: a narrower, prouder lip on the inside edge of oak and gilt */
      const lw = fw * 0.34, ld = dep + 0.014;
      picBar(at(0, ld/2, H + lw/2),  t3, n3, W + lw, ld/2, lw/2, 0, kind, it.room);
      picBar(at(0, ld/2, -H - lw/2), t3, n3, W + lw, ld/2, lw/2, 0, kind, it.room);
      picBar(at(-W - lw/2, ld/2, 0), t3, n3, lw/2, ld/2, H, 0, kind, it.room);
      picBar(at( W + lw/2, ld/2, 0), t3, n3, lw/2, ld/2, H, 0, kind, it.room);
    }
  });
  /* then the textured faces, one run per picture, drawn with its own texture */
  PIC_TEX_START = M.n;
  pics.forEach((it, i) => {
    const f = F[i], start = M.n;
    const R = [-f.n[1], f.n[0]];                  /* the viewer's right, facing the wall */
    const P = (u, v, z) => [f.c[0] + R[0]*u + f.n[0]*v, f.c[1] + R[1]*u + f.n[1]*v, f.zc + z];
    const W = f.w / 2, H = f.h / 2, D = f.d, n3 = [f.n[0], f.n[1], 0], m = it.kind;
    quadUV(P(-W, D, -H), P(W, D, -H), P(W, D, H), P(-W, D, H), [0,0], [1,0], [1,1], [0,1], n3, m, 60, it.room);
    if (it.frame === 3){
      /* the canvas wraps: its sides carry the outermost strip of the picture */
      const e = 0.03;
      quadUV(P(-W, 0, H), P(W, 0, H), P(W, D, H), P(-W, D, H), [0,1-e], [1,1-e], [1,1], [0,1], [0,0,1], m, 60, it.room);
      quadUV(P(-W, 0, -H), P(W, 0, -H), P(W, D, -H), P(-W, D, -H), [0,e], [1,e], [1,0], [0,0], [0,0,-1], m, 60, it.room);
      quadUV(P(-W, 0, -H), P(-W, 0, H), P(-W, D, H), P(-W, D, -H), [e,0], [e,1], [0,1], [0,0], [-R[0],-R[1],0], m, 60, it.room);
      quadUV(P(W, 0, -H), P(W, 0, H), P(W, D, H), P(W, D, -H), [1-e,0], [1-e,1], [1,1], [1,0], [R[0],R[1],0], m, 60, it.room);
    } else {
      /* the board's edge, hidden by the frame; flat colour from the picture's edge */
      quadUV(P(-W, 0, H), P(W, 0, H), P(W, D, H), P(-W, D, H), [0,1], [1,1], [1,1], [0,1], [0,0,1], m, 60, it.room);
    }
    PIC_RANGES.push({ id:it.id, start:start, count:M.n - start });
  });
  PIC_TEX_END = M.n;
}
/*  The opaque draw, split round the pictures so each one can have its own
    texture. With no pictures this is the single call it always was. */
function drawOpaque(picLoc){
  const opq = Math.min(MESH_OPAQUE, vertsUploaded);
  if (!PIC_RANGES.length || PIC_TEX_START < 0 || PIC_TEX_END > opq){ gl.drawArrays(gl.TRIANGLES, 0, opq); return; }
  gl.drawArrays(gl.TRIANGLES, 0, PIC_TEX_START);
  gl.activeTexture(gl.TEXTURE0 + PIC_UNIT);
  if (picLoc) gl.uniform1i(picLoc, PIC_UNIT);
  for (const r of PIC_RANGES){
    gl.bindTexture(gl.TEXTURE_2D, picTex(r.id));
    gl.drawArrays(gl.TRIANGLES, r.start, r.count);
  }
  gl.activeTexture(gl.TEXTURE0);
  if (opq > PIC_TEX_END) gl.drawArrays(gl.TRIANGLES, PIC_TEX_END, opq - PIC_TEX_END);
}

/* ---- the plan ---- */
function drawPicturesPlan(c){
  planPicsDrawn = [];
  if (!pics.length) return;
  const s = PF.s;
  pics.forEach((it, i) => {
    const f = picPlace(it), rec = picImg[it.id];
    const cx = f.c[0] + f.n[0] * 0.05, cy = f.c[1] + f.n[1] * 0.05;
    const th = Math.max(5, 0.08 * s), len = f.w * s;
    c.save();
    c.translate(PX(cx), PY(cy));
    c.rotate(-Math.atan2(f.t[1], f.t[0]));
    if (rec && rec.ok){
      const iw = rec.img.naturalWidth, ih = rec.img.naturalHeight;
      c.drawImage(rec.img, 0, ih * 0.38, iw, ih * 0.24, -len / 2, -th / 2, len, th);
    } else { c.fillStyle = "#8a8378"; c.fillRect(-len / 2, -th / 2, len, th); }
    c.lineWidth = i === picSel ? 2.4 : 1;
    c.strokeStyle = i === picSel ? "#c07a1c" : (it.kind ? "#2f7a74" : "#2b2a27");
    c.strokeRect(-len / 2 - 0.5, -th / 2 - 0.5, len + 1, th + 1);
    c.restore();
    planPicsDrawn.push(it.id);
  });
}
function picHitPlan(wx, wy){
  let best = -1, bd = 0.16;
  pics.forEach((it, i) => {
    const f = picPlace(it);
    const a = [f.c[0] - f.t[0]*f.w/2, f.c[1] - f.t[1]*f.w/2], b = [f.c[0] + f.t[0]*f.w/2, f.c[1] + f.t[1]*f.w/2];
    const d = nearSeg(wx, wy, a[0], a[1], b[0], b[1]);
    if (d < bd){ bd = d; best = i; }
  });
  return best;
}
/*  The nearest wall segment within 0.4 m, preferring the room the click is
    inside - the two faces of a party wall belong to two different rooms. */
function picWallAtPlan(wx, wy){
  let best = null;
  for (let room = 0; room < 3; room++){
    const r = ROOMS[room];
    const inside = wx >= r.x0 - 0.05 && wx <= r.x1 + 0.05 && wy >= r.y0 - 0.05 && wy <= r.y1 + 0.05;
    for (let wall = 0; wall < 4; wall++){
      const W = picWall(room, wall);
      const b = [W.p0[0] + W.dir[0]*W.len, W.p0[1] + W.dir[1]*W.len];
      const d = nearSeg(wx, wy, W.p0[0], W.p0[1], b[0], b[1]);
      const side = (wx - W.p0[0]) * W.n[0] + (wy - W.p0[1]) * W.n[1];
      if (d > 0.4 || side < -0.05) continue;
      const score = d + (inside ? 0 : 1);
      if (!best || score < best.score){
        const along = (wx - W.p0[0]) * W.dir[0] + (wy - W.p0[1]) * W.dir[1];
        best = { room:room, wall:wall, along:along, score:score };
      }
    }
  }
  return best;
}
planCv.addEventListener("pointerdown", e => {
  if (e.button !== undefined && e.button !== 0) return;
  if (!PF) PF = planFit();
  const w = planToWorld(e.clientX, e.clientY);
  if (picArm){
    const hit = picWallAtPlan(w[0], w[1]);
    e.stopImmediatePropagation(); e.preventDefault();
    if (!hit){ noticeEl.textContent = "click on or near a wall to hang the picture"; return; }
    picHang(hit.room, hit.wall, hit.along, 1.55);

  }

  e.stopImmediatePropagation(); e.preventDefault();

}, true);

/* ---- the POV ---- */
function picRayHit(ray){
  let best = -1, bt = 1e9;
  pics.forEach((it, i) => {
    const f = picPlace(it);
    const n3 = [f.n[0], f.n[1], 0];
    const dn = dot3(ray.d, n3);
    if (dn >= -1e-4) return;
    const P0 = [f.c[0] + f.n[0]*f.d, f.c[1] + f.n[1]*f.d, f.zc];
    const t = dot3(sub(P0, ray.o), n3) / dn;
    if (t <= 0 || t >= bt) return;
    const p = add3(ray.o, mul3(ray.d, t));
    const u = (p[0] - f.c[0]) * f.t[0] + (p[1] - f.c[1]) * f.t[1];
    if (Math.abs(u) <= f.w/2 + 0.06 && Math.abs(p[2] - f.zc) <= f.h/2 + 0.06){ bt = t; best = i; }
  });
  return best >= 0 ? { i:best, t:bt } : null;
}
function picWallRay(ray){
  let best = null, bt = 1e9;
  for (let room = 0; room < 3; room++) for (let wall = 0; wall < 4; wall++){
    const W = picWall(room, wall);
    const n3 = [W.n[0], W.n[1], 0], dn = dot3(ray.d, n3);
    if (dn >= -1e-4) continue;
    const t = ((W.p0[0] - ray.o[0]) * W.n[0] + (W.p0[1] - ray.o[1]) * W.n[1]) / dn;
    if (t <= 0.05 || t >= bt) continue;
    const p = add3(ray.o, mul3(ray.d, t));
    const along = (p[0] - W.p0[0]) * W.dir[0] + (p[1] - W.p0[1]) * W.dir[1];
    if (along < 0 || along > W.len || p[2] < 0 || p[2] > W.h) continue;
    /* an open doorway lets the ray through to the room beyond */
    let hole = false;
    for (const d of DOORS){
      if (d.axis !== W.axis || Math.abs(d.wall - W.coord) > 1e-3) continue;
      const a = along + W.low;
      if (a > d.s0 && a < d.s1 && p[2] < DOOR_H) hole = true;
    }
    if (hole) continue;
    bt = t; best = { room:room, wall:wall, along:along, z:p[2], t:t };
  }
  return best;
}
povCv.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const ray = povRay(e.clientX, e.clientY);
  if (!ray) return;
  if (picArm){
    const hit = picWallRay(ray);
    e.stopImmediatePropagation(); e.preventDefault();
    if (!hit){ noticeEl.textContent = "point at a wall to hang the picture"; return; }
    picHang(hit.room, hit.wall, hit.along, hit.z);
    return;
  }
  const h = picRayHit(ray);
  if (!h) return;
  const wh = picWallRay(ray);
  if (wh && wh.t + 0.02 < h.t) return;                /* a wall in front of it: not yours to grab */
  e.stopImmediatePropagation(); e.preventDefault();
  picSel = h.i;
  const it = pics[h.i];
  const W = picWall(it.room, it.wall);
  const dn = dot3(ray.d, [W.n[0], W.n[1], 0]);
  const t = ((W.p0[0] - ray.o[0]) * W.n[0] + (W.p0[1] - ray.o[1]) * W.n[1]) / dn;
  const p = add3(ray.o, mul3(ray.d, t));
  picDrag = { view:"pov", i:h.i, moved:false,
              offA:it.along - ((p[0] - W.p0[0]) * W.dir[0] + (p[1] - W.p0[1]) * W.dir[1]), offZ:it.z - p[2] };
  try { povCv.setPointerCapture(e.pointerId); } catch(_){}

}, true);
window.addEventListener("pointermove", e => {
  if (!picDrag) return;

    const dn = dot3(ray.d, [W.n[0], W.n[1], 0]);
    if (dn >= -1e-4) return;
    const t = ((W.p0[0] - ray.o[0]) * W.n[0] + (W.p0[1] - ray.o[1]) * W.n[1]) / dn;
    const p = add3(ray.o, mul3(ray.d, t));

NB.on("initialState", d => {

  document.getElementById("buildTag").textContent = buildId;
  for (const p of (d.params || [])){
    if (!(p.id in V)) continue;                 /* a parameter this page predates */
    const was = SPEC[p.id] || {};
    /*  Keep what the page already knows where the message is thinner than the
        page's own table - a choice parameter that arrives with no step count
        must not turn its selector into an empty box. */
    SPEC[p.id] = { name:p.name || was.name || p.id,
                   stepped:!!p.stepped || !!was.stepped,
                   steps:(p.steps | 0) > 1 ? (p.steps | 0) : (was.steps | 0),
                   choices:p.choices ? String(p.choices).split("|") : (was.choices || null) };
    V[p.id] = clamp01(p.v);

/*  30 Hz. Almost all of it is the same picture as last time, and redrawing an
    unchanged picture is what the idle rule forbids - so the geometry-bearing
    part is hashed and only a real change costs a draw. The speaker's glow is
    the one exception and it is rate-limited and gated on there being signal. */
let lastGlowPaint = -1e9, glowWasOn = false;
function sceneSignature(d){
  let s = "";
  if (d.sources) for (const q of d.sources)
    s += (q.pos ? q.pos.map(n=>n.toFixed(3)).join(",") : "") + "/" + q.yaw + "/" + q.type + "/" + q.active + ";";
  if (d.lis) s += "|" + d.lis.map(n=>n.toFixed(3)).join(",");
  s += "|" + d.lisRoom;
  if (d.rt) s += "|" + d.rt.map(r=>r.map(n=>n.toFixed(3)).join("/")).join(";");
  /*  The plan polygons are geometry, so a room whose wall has moved has to
      cost a redraw - and one whose has not, still none. */
  if (d.plan) for (const poly of d.plan){
    s += "|";
    if (poly) for (const q of poly) s += q[0].toFixed(3) + "," + q[1].toFixed(3) + ";";
  }
  if (d.paths){
    for (const p of d.paths){
      s += "|" + p.t + ":" + p.s + ":" + (typeof p.db === "number" ? p.db.toFixed(2) : "");
      if (p.pts) for (const q of p.pts) s += ";" + q[0].toFixed(3) + "," + q[1].toFixed(3);
    }
  }
  return s;
}
NB.on("scene", d => {
  if (!d) return;
  scene = d;
  syncOnScene(d);
  if (typeof d.in === "number") inDb = d.in;
  if (typeof d.out === "number") outDb = d.out;
  if (typeof d.drr === "number") drrDb = d.drr;
  updateLevels();
  updateHud();
  const sig = sceneSignature(d);
  if (sig !== sceneSig){ sceneSig = sig; invalidate("both"); }
  /* the radiation cue: at most 10 redraws a second, and none at all in silence */
  const lvl = Math.max(0, Math.min(1, (inDb + 60) / 54));
  const on = inDb > -60;
  if (on){
    const t = nowMs();
    if (t - lastGlowPaint >= 100){
      lastGlowPaint = t; glow = lvl; glowWasOn = true; invalidate("pov");
    }
  } else if (glowWasOn){
    glowWasOn = false; glow = 0; invalidate("pov");      /* one last frame to clear it */
  }
});

/*  The public face for a probe, and for me when something looks wrong. The
    page's state lives inside this closure and is otherwise unreadable, which
    leaves guessing as the only tool. */
window.__TW = {
  state(){ const o = {}; for (const id in V) o[id] = V[id]; return o; },
  setParam(id, v){ setNative(id, v); },       /* as if it came from native: no send */
  scene(){ return scene; },
  render(){
    /*  A frame already asked for has nothing left to do once this has drawn
        everything, so cancel it - which also makes `pending` below mean
        exactly "a redraw is owed", with no stale bookings in it. */
    if (rafId){ try { cancelAnimationFrame(rafId); } catch(e){} rafId = 0; }
    drawPov(); drawPlan();
    dirtyPov = false; dirtyPlan = false;
  },
  errors: window.__err,
  /*  Where the plan actually lands on its canvas. A probe that recomputes this
      for itself is a second copy of the layout, and the two drift the first
      time the margins change - which is exactly what happened. */
  planFit(){ if (!PF) PF = planFit(); return { s:PF.s, ox:PF.ox, oy:PF.oy, leg:PF.leg }; },
  /*  The bounds of the vertices the 3D view is ACTUALLY built from, read off
      the buffer rather than recomputed - the picture alone cannot tell a wall
      that moved from a corner-darkening box that moved with it, and a hook
      that reported the polygon would be reporting the intention. Never builds
      anything: a mesh built here and not uploaded would leave the GPU showing
      the one before it. */
  meshBox(){
    if (!M.n) return null;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < M.n; i++){
      const x = M.pos[i*3], y = M.pos[i*3+1];
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    return [x0, y0, x1, y1];
  },
  /*  The room as it is actually being drawn - the engine's polygon when there
      is one, the page's own when there is not - and the split point a probe
      has to aim at to take hold of a broken wall. Both live in this closure
      and are otherwise unreadable. */
  roomPoly(i){ return roomPoly(i).map(p => [p[0], p[1]]); },
  foldPoint(i, k){ return foldPoint(i, k); },
  /*  What the plan WROTE this time round, recorded where the text is drawn.
      A hook that reported what the page meant to draw could say CONCAVE on a
      sheet with nothing on it. */
  planNotes(){ return planNotes.slice(); },
  get draws(){ return drawCount; },
  /*  True when a redraw is owed. The draw counter alone cannot tell a page
      that scheduled nothing from one whose animation frame simply has not
      arrived yet, and headless Chrome does not always produce frames. */
  get pending(){ return !!rafId; },
  get glow(){ return glow; },
  get renderer(){ return glMode; },
  get pitch(){ return pitchDeg; },
  get rays(){ return showRays; },
  /*  The door handles: where they are, what the pointer is on, and what a
      given point on the canvas would pick. The picking lives in this closure
      and is otherwise unreadable from outside, which leaves guessing. */
  get hoverDoor(){ return hoverDoor ? hoverDoor.id : null; },
  get doorAnim(){ return doorAnimActive(); },
  handlePos(id){ const d = DOORS.filter(x => x.id === id)[0]; return d ? handlePos(d) : null; },
  pick(x, y){ const h = pickHandle(x, y); return h ? { id:h.d.id, t:h.t, dist:h.dist } : null; },
  /*  Where a world point lands on the 3D canvas, in CSS pixels relative to
      the page - the inverse of the ray, so a probe can aim at a handle
      without keeping its own copy of the camera. */
  project(p){
    const r = povCv.getBoundingClientRect();
    const yaw = LYAW()*Math.PI/180, pit = pitchDeg*Math.PI/180;
    const cp = Math.cos(pit), sp = Math.sin(pit);
    const f  = [Math.cos(yaw)*cp, Math.sin(yaw)*cp, sp];
    const rt = [Math.sin(yaw), -Math.cos(yaw), 0];
    const up = crs(rt, f);
    const e = [LX(), LY(), EAR_Z];
    const v = [p[0]-e[0], p[1]-e[1], p[2]-e[2]];
    const z = dot3(v, f);
    if (z <= 0.01) return null;
    const th = Math.tan(fovDeg*Math.PI/360), asp = r.width / r.height;
    const ndcX = dot3(v, rt) / (z * th * asp);
    const ndcY = dot3(v, up) / (z * th);
    return [r.left + (ndcX*0.5 + 0.5) * r.width, r.top + (0.5 - ndcY*0.5) * r.height];
  },
  get selsrc(){ return selSrc; },
  selectSource(i){ selectSource(i, false); },
  wav(){ return { name:wav.name, playing:wav.playing, seconds:wav.seconds, gain:wav.gain }; },
  /*  Furniture. furn() is the layout as the page holds it; setFurn applies one
      exactly as a native `furn` event would (no message back). The rest is
      read-only: which piece is selected, where its turn handle is, what the
      plan actually drew this time round, and how many vertices the 3D view
      is built from - the evidence a probe needs, all of it otherwise locked
      inside this closure. */
  furn(){ return furn.map(it => ({ t:it.t, x:it.x, y:it.y, yaw:it.yaw })); },
  setFurn(items){ applyFurnNative(items || []); },
  furnCat(){ return furnCat.map(c => Object.assign({}, c)); },
  get furnSel(){ return furnSel; },
  selectFurn(i){ furnSelect(i); },
  get furnArmed(){ return furnPlace; },
  furnHandle(i){ const it = furn[i]; return it ? furnHandlePos(it) : null; },
  furnRoom(i){ const it = furn[i]; return it ? furnRoom(it) : -1; },
  planFurn(){ return planFurnDrawn.slice(); },
  get verts(){ return M.n; },
  sync(){ return { s:SYNC.s, mode:SYNC.mode, win:SYNC.win, L:SYNC.L.slice(), tgt:SYNC.tgt.slice(), k:[lampK(0), lampK(1), lampK(2)],
                   active:syncActive(), stored:(function(){ try { return localStorage.getItem(SYNC_KEY); } catch(e){ return null; } })() }; },
  setSync(o){ if (o){ if (typeof o.s === "number") SYNC.s = clamp01(o.s); if (o.mode) SYNC.mode = o.mode === "beat" ? "beat" : "follow"; if (o.win !== undefined) SYNC.win = !!o.win; } syncSave(); updateSyncUI(); invalidate("pov"); },
  syncSettle(){ const t = syncTargets(nowMs()); for (let r = 0; r < 3; r++) SYNC.L[r] = t[r]; },
  pics(){ return pics.map(p => Object.assign({}, p)); },
  setPics(items, images){ applyPicsNative(items || [], images || null); },
  get picSel(){ return picSel; },
  get picArmed(){ return picArm; },
  selectPic(i){ picSel = (i >= 0 && i < pics.length) ? i : -1; updatePicUI(); invalidate("both"); },
  picPlace(i){ const it = pics[i]; if (!it) return null; const p = picPlace(it); return { c:p.c, t:p.t, n:p.n, zc:p.zc, w:p.w, h:p.h, d:p.d }; },
  picReady(id){ const r = picImg[id]; return !!(r && r.ok); },
  planPics(){ return planPicsDrawn.slice(); },
  fsSource(){ return FS; },
  swapFS(src){
    if (!gl) return "no gl";
    const fs2 = compile(gl, gl.FRAGMENT_SHADER, src || FS), vs2 = compile(gl, gl.VERTEX_SHADER, VS);
    if (!fs2 || !vs2) return "compile failed";
    const p = gl.createProgram();
    gl.attachShader(p, vs2); gl.attachShader(p, fs2);
    ["aPos","aNrm","aTan","aUV","aInfo"].forEach((n, i) => gl.bindAttribLocation(p, i, n));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return "link failed";
    prog = p; gl.useProgram(prog);
    for (const n in U) U[n] = gl.getUniformLocation(prog, n);
    return "ok";
  },
  /*  Cinematic and export: the state that is otherwise locked in this
      closure, and a bench that times a mode frame by frame. */
  cine(){ return { on:CX.on, q:CX.q, ok:CX.ok, why:CX.why, mode:CX.mode || null, pn:CX.pn, converged:CX.converged,
                   ms:CX.ftMs, samples:CX.samples, target:CX.rw + "x" + CX.rh, flags:CX.flags.slice(),
                   stored:(function(){ try { return localStorage.getItem(CINE_KEY); } catch(e){ return null; } })(), compileMs:CX.compileMs || null }; },
  setCine(on, q){ cineSet(on, q); },
  cineHold(on){ CX.hold = !!on; CX.pkey = ""; invalidate("pov"); },
  cineBench(mode, n){ return cineBench(mode, n); },
  rec(){ return Object.assign({}, recSt); },
  get exporting(){ return EXP.active || EXP.waitingPlan; },
  expOpt(o){ if (o) Object.assign(expOpt, o); return Object.assign({}, expOpt); },
  get pitchFov(){ return [pitchDeg, fovDeg]; },
  bg: { pov:FOG.map(v => Math.round(Math.pow(v, 1/2.2) * 255)), plan:PAPER }
};

/*  Draw once so the panel is never blank, then stop. From here on nothing is
    drawn until something a view depends on actually changes. */
drawPov();
drawPlan();
document.getElementById("glName").textContent = glMode === "webgl2" ? "WEBGL2" : "2D FALLBACK";

/*  Announced on EVERY boot, which clears the processor's "the panel has the
    state" flag - without it a reload the editor never sees leaves the
    processor believing the old acknowledgement and this page waits forever. */
NB.send({ k:"hello" });
</script>
