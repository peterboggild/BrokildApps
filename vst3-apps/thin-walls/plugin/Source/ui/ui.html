<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thin Walls</title>
<script>
/*  FIRST thing in the document, deliberately. A listener installed at the end of
    <body> cannot catch anything that threw before it was installed - and the
    failure mode it exists to detect is exactly "the script died on line one and
    nothing ran", which then reports as "no JS errors". */
window.__err = [];
window.addEventListener("error", function (e) {
  window.__err.push((e.message || "error") + " @ " + (e.filename || "?") + ":" + (e.lineno || 0));
});
window.addEventListener("unhandledrejection", function (e) {
  window.__err.push("unhandled rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
</script>
<!-- probe-stub -->
<style>
/*  An inline style beats the hidden attribute, and so does any author rule with
    a display of its own. Stated once, at the top, so nothing further down can
    quietly un-hide something. */
[hidden]{ display:none !important; }

:root{
  --ink:#0d0b0a;
  --shell:#161311;
  --shell2:#1d1917;
  --line:#2e2724;
  --brass:#d8a45c;
  --brass1:#e2b170;
  --brass2:#8a6636;
  --warm:#f0d2a4;
  --dim:#9a8a78;
  --paper:#efe7d6;
  --paperInk:#2b2a27;
  --ok:#8fd4a8;
  --tipbg:#221d19;
}
*{ box-sizing:border-box; }
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:var(--ink); color:var(--warm);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:13px;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
#app{
  position:absolute; inset:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto auto;
  background:
    radial-gradient(1200px 700px at 30% 0%, #241d18 0%, #120f0d 60%, #0b0908 100%);
}

/* ---------------------------------------------------------------- header */
#top{
  display:flex; align-items:baseline; gap:14px;
  padding:8px 16px 7px 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1a1613 0%, #120f0d 100%);
}
#top h1{
  margin:0;
  font-family:"Futura","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  font-size:21px; font-weight:600; letter-spacing:.42em;
  background:linear-gradient(180deg,#f6dcae 0%, #d9a45c 40%, #9c7440 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 1px 0 rgba(0,0,0,.6);
  white-space:nowrap;
}
#by{
  font-size:11px; letter-spacing:.20em; color:#8d7a63; text-transform:uppercase;
  white-space:nowrap;
}
#topfill{ flex:1 1 auto; height:1px; background:linear-gradient(90deg,transparent,var(--line)); }
#topright{ display:flex; gap:14px; align-items:baseline; font-family:Consolas,"SF Mono",monospace; font-size:11px; color:#8d7a63; }
#topright b{ color:var(--brass1); font-weight:600; }

/* ----------------------------------------------------------------- views */
#views{
  display:grid;
  grid-template-columns:58fr 42fr;
  min-height:0; gap:0;
}
#povWrap, #planWrap{ position:relative; min-width:0; min-height:0; overflow:hidden; }
/* the same colour the GL context clears to, so a sub-pixel rounding gap at the
   edge of the drawing buffer cannot show as a black seam */
#povWrap{ background:#100c0d; border-right:1px solid var(--line); }
#planWrap{ background:#141110; display:flex; align-items:stretch; }
canvas{ display:block; width:100%; height:100%; }
#pov{ cursor:grab; touch-action:none; }
#pov.look{ cursor:grabbing; }
#pov.handle{ cursor:pointer; }
#pov.handling{ cursor:grabbing; }
#plan{ touch-action:none; }

#hud{
  position:absolute; left:12px; top:12px; pointer-events:none;
  font-family:Consolas,"SF Mono",monospace; font-size:11px; line-height:1.55;
  color:#e7cfa6; text-shadow:0 1px 3px rgba(0,0,0,.95);
  background:linear-gradient(180deg,rgba(12,9,8,.72),rgba(12,9,8,.42));
  border:1px solid rgba(216,164,92,.22); border-left:2px solid var(--brass2);
  padding:7px 11px 7px 9px; border-radius:2px;
  letter-spacing:.04em;
}
#hud .k{ color:#8d7a63; }
#hud .v{ color:#f3d9ac; }
#xhair{
  position:absolute; left:50%; top:50%; width:15px; height:15px; margin:-8px 0 0 -8px;
  pointer-events:none; opacity:.34;
}
#xhair::before,#xhair::after{
  content:""; position:absolute; background:#ffe4b4;
}
#xhair::before{ left:7px; top:0; width:1px; height:15px; }
#xhair::after{ left:0; top:7px; width:15px; height:1px; }
#povTip{
  position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
  pointer-events:none; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:#b39a78; text-shadow:0 1px 3px #000;
  transition:opacity .5s ease;
}
#glName{
  position:absolute; right:10px; top:10px; pointer-events:none;
  font-family:Consolas,"SF Mono",monospace; font-size:10px; color:#6d5d4b; letter-spacing:.1em;
}

/* -------------------------------------------------------------- controls */
#ctrls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(196px,1fr));
  gap:9px 12px;
  padding:9px 14px 8px 14px;
  border-top:1px solid var(--line);
  background:linear-gradient(180deg,#191512 0%, #131110 100%);
  /*  The strip may take half the window, but never so much that the two views
      are squeezed into a letterbox - at 900x600 an uncapped strip left them
      157 px tall. It scrolls instead. */
  max-height:min(50vh, calc(100vh - 320px));
  overflow-y:auto; overflow-x:hidden;
}
/*  A short window is the one case where the strip and the views fight. The
    rows get tighter rather than the strip getting a scrollbar, and the strip
    never grows sideways, so there is no horizontal scroll at any size. */
@media (max-height:760px){
  #ctrls{ gap:7px 10px; padding:7px 12px 6px 12px; }
  .grp{ padding:4px 7px 5px 7px; }
  .grp > h2{ margin-bottom:4px; padding-bottom:2px; }
  .row{ height:20px; }
  .btnrow{ margin-bottom:4px; }
}
.grp{
  border:1px solid #241f1c; border-radius:3px;
  background:linear-gradient(180deg,#1c1815 0%,#171412 100%);
  padding:5px 8px 7px 8px; min-width:0;
}
.grp > h2{
  margin:0 0 5px 0; font-size:9.5px; font-weight:700; letter-spacing:.24em;
  color:#9c7a45; text-transform:uppercase;
  border-bottom:1px solid #241f1c; padding-bottom:3px;
}
.row{ display:grid; grid-template-columns:60px minmax(0,1fr) 52px; align-items:center; gap:6px; height:23px; }
.row.door{ grid-template-columns:44px 18px minmax(0,1fr) 44px; }
.row.sel{ grid-template-columns:60px minmax(0,1fr); }
/*  Two groups describe a ROOM rather than a control, and a room has three
    surfaces and two walls that can be broken - neither fits a 196 px column.
    They take two, and give it back on a window narrow enough that two tracks
    do not exist, where a span wider than the grid would force an implicit
    column and scroll the strip sideways. */
.grp.wide{ grid-column:span 2; }
@media (max-width:560px){ .grp.wide{ grid-column:auto; } }
.matgrid{ display:grid; grid-template-columns:50px repeat(3,minmax(0,1fr)); gap:3px 6px; align-items:center; }
.mathead{ font-size:8.5px; letter-spacing:.15em; color:#8a7a66; text-transform:uppercase; text-align:center; white-space:nowrap; }
.matroom{ font-size:10px; letter-spacing:.07em; color:#a08f7a; white-space:nowrap; }
/*  A broken wall is TWO numbers - how far the split point is pushed and where
    along the wall it sits - and they are one gesture in the plan, so they are
    one row here. */
.row.fold{ grid-template-columns:54px minmax(0,1fr) 52px minmax(0,1fr) 34px; }
.row.fold .val{ font-size:9.5px; }
.row.fold.bent .lab{ color:#d07a52; }
.lab{ font-size:10px; letter-spacing:.07em; color:#a08f7a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.val{
  font-family:Consolas,"SF Mono",monospace; font-size:10.5px; color:#e8cd9f;
  text-align:right; white-space:nowrap; overflow:hidden;
}

/* custom slider - appearance:none so nothing browser-default survives */
input.sl{
  -webkit-appearance:none; appearance:none;
  width:100%; height:16px; background:transparent; margin:0; outline:none; cursor:pointer;
}
input.sl::-webkit-slider-runnable-track{
  height:5px; border-radius:3px;
  background:linear-gradient(180deg,#0d0b0a,#191513);
  border:1px solid #2b2522;
}
input.sl::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:11px; height:15px; margin-top:-6px; border-radius:2px;
  background:linear-gradient(180deg,#f0cd97 0%,#c79a5c 48%,#8a6636 100%);
  border:1px solid #533b1d;
  box-shadow:0 1px 2px rgba(0,0,0,.7);
}
input.sl:focus::-webkit-slider-thumb{ box-shadow:0 0 0 2px rgba(226,177,112,.35); }
input.sl::-moz-range-track{ height:5px; border-radius:3px; background:#191513; border:1px solid #2b2522; }
input.sl::-moz-range-thumb{ width:11px; height:15px; border-radius:2px; background:#c79a5c; border:1px solid #533b1d; }

select.sel{
  -webkit-appearance:none; appearance:none;
  width:100%; height:20px; padding:0 18px 0 7px;
  font-family:"Segoe UI",system-ui,sans-serif; font-size:10.5px; letter-spacing:.06em;
  color:#e8cd9f; background:linear-gradient(180deg,#221d19,#171311);
  border:1px solid #332b26; border-radius:2px; outline:none; cursor:pointer;
}
select.sel:focus{ border-color:#7a5a2e; }
.selwrap{ position:relative; min-width:0; }
.selwrap::after{
  content:""; position:absolute; right:6px; top:8px; pointer-events:none;
  border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid #9c7a45;
}

button.b{
  font-family:"Segoe UI",system-ui,sans-serif; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:#d8bd90;
  background:linear-gradient(180deg,#272019,#191411);
  border:1px solid #382e26; border-radius:2px;
  padding:4px 8px; cursor:pointer; outline:none; white-space:nowrap;
}
button.b:hover{ border-color:#6d5128; color:#f4dcae; }
button.b:active{ background:#141110; }
button.b.on{
  color:#1a1208; border-color:#c79a5c;
  background:linear-gradient(180deg,#f0cd97,#b98a4c);
  font-weight:700;
}
button.dbtn{
  font-family:Consolas,monospace; font-size:9.5px; line-height:1;
  width:18px; height:18px; padding:0; text-align:center;
  color:#8d7a63; background:#141110; border:1px solid #332b26; border-radius:2px; cursor:pointer;
}
button.dbtn.on{ color:#1a1208; background:linear-gradient(180deg,#f0cd97,#b98a4c); border-color:#c79a5c; }
.btnrow{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:5px; }
.srctabs{ gap:4px; }
button.b.srctab{
  flex:1 1 0; min-width:0; padding:3px 0; text-align:center;
  font-family:Consolas,monospace; font-size:11px; letter-spacing:0;
}
/* a source whose input is OFF: its tab says so without a second control */
button.b.srctab.silent{ color:#6b5c4a; }
button.b.srctab.silent.on{ color:#3a2c18; }
/*  A disabled control is dimmed as a whole row, label and readout with it -
    DIRECTIVITY belongs to a PURE source and a LOUDSPEAKER carries its own
    pattern, so leaving it live and inert would be the worse lie. */
.row.off{ opacity:.38; }
.row.off input.sl{ cursor:not-allowed; }
.pos{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:2px 8px; }
.ro{
  font-family:Consolas,"SF Mono",monospace; font-size:10px; color:#c9b18b;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:help;
}
.ro i{ color:#7d6b57; font-style:normal; }

/* ------------------------------------------------------------- furniture */
button.b:disabled{ opacity:.36; cursor:not-allowed; }
button.b:disabled:hover{ border-color:#382e26; color:#d8bd90; }
button.b.warn{ color:#ffe0cc; border-color:#b0482a; background:linear-gradient(180deg,#5c2616,#3a170e); }
.ftray{ display:grid; grid-template-columns:repeat(auto-fill,minmax(33px,1fr)); gap:4px; margin-bottom:5px; }
button.b.fitem{ height:29px; padding:0; min-width:0; display:flex; align-items:center; justify-content:center; letter-spacing:0; }
button.b.fitem canvas{ width:30px; height:21px; pointer-events:none; }
.frow{ display:flex; align-items:center; gap:5px; height:23px; min-width:0; }
.frow .fname{
  flex:1 1 auto; min-width:0; font-family:Consolas,"SF Mono",monospace; font-size:10.5px; color:#e8cd9f;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.frow .fname.none{ color:#7d6b57; }
.frow.turn{ display:grid; grid-template-columns:44px 38px minmax(0,1fr) 38px 46px; gap:5px; }
button.b.fs{ padding:3px 5px; letter-spacing:.06em; }
#furnRead{ margin-top:2px; }

/* ---------------------------------------------------------------- status */
#status{
  display:flex; align-items:center; gap:16px;
  padding:3px 16px 4px 16px; height:23px;
  border-top:1px solid var(--line); background:#0d0b0a;
  font-family:Consolas,"SF Mono",monospace; font-size:10.5px; color:#8d7a63;
  white-space:nowrap; overflow:hidden;
}
#notice{ color:#cdae7d; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; }
#statfill{ flex:1 1 auto; }
#levels b{ color:#c9b18b; font-weight:400; }

/* ------------------------------------------------------------------- tip */
#tip{
  position:fixed; z-index:99; max-width:290px; pointer-events:none;
  padding:6px 9px; border-radius:3px;
  background:var(--tipbg); border:1px solid #4a3a26;
  box-shadow:0 6px 18px rgba(0,0,0,.72);
  font-size:11px; line-height:1.45; color:#ecd6b0;
}
#tip b{ display:block; color:#f0c584; letter-spacing:.11em; font-size:9.5px; text-transform:uppercase; margin-bottom:2px; font-weight:700; }
/* ------------------------------------------------------------ cinematic */
#cineBox{ display:flex; gap:5px; align-items:center; align-self:center; }
#cineBox .selwrap{ width:92px; }
#recBox{ display:flex; gap:6px; align-items:center; align-self:center; }
#recTime{ font-family:Consolas,"SF Mono",monospace; font-size:10.5px; color:#c9b18b; white-space:nowrap; min-width:86px; }
#bRec.on{ color:#ffe0cc; border-color:#b0482a; background:linear-gradient(180deg,#8a2c16,#5a1a0c); }
#expPop{ position:fixed; z-index:80; width:300px; padding:8px 10px 8px 10px;
  border:1px solid #4a3a26; border-radius:3px; background:linear-gradient(180deg,#221d19,#171311);
  box-shadow:0 10px 26px rgba(0,0,0,.8); }
#expPop > h2{ margin:0 0 6px 0; font-size:9.5px; font-weight:700; letter-spacing:.24em; color:#9c7a45; text-transform:uppercase;
  border-bottom:1px solid #241f1c; padding-bottom:3px; }
@media (max-width:1100px){ #by{ display:none; } }
#cineHud{
  position:absolute; right:10px; bottom:9px; pointer-events:none;
  font-family:Consolas,"SF Mono",monospace; font-size:10px; color:#b39a78; letter-spacing:.08em;
  text-shadow:0 1px 3px #000; background:rgba(12,9,8,.45); padding:2px 6px; border-radius:2px;
}
/* ---------------------------------------------------- record and export */
.pgrid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 12px; }
.row.xrow{ grid-template-columns:40px minmax(0,1fr) 66px; }
.grp > h2.sub{ margin-top:9px; }
.xbar{ height:4px; margin:3px 0 3px 0; background:#0d0b0a; border:1px solid #2b2522; border-radius:2px; overflow:hidden; }
.xbar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#8a6636,#e2b170); }
#recTime{ margin-left:4px; }
#expNote{ margin-top:1px; }
#expModal{ position:fixed; inset:0; z-index:90; background:rgba(8,6,5,.72); display:flex; align-items:center; justify-content:center; }
#expModal .xbox{ width:min(420px,86vw); padding:14px 16px 12px 16px; border:1px solid #4a3a26; border-radius:3px;
  background:linear-gradient(180deg,#221d19,#171311); box-shadow:0 10px 30px rgba(0,0,0,.8); }
#expModal h3{ margin:0 0 8px 0; font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:#d8a45c; }
#expModal .xstage{ font-family:Consolas,monospace; font-size:11px; color:#e8cd9f; margin-bottom:6px; }
#expModal .xbar{ height:6px; margin-bottom:10px; }
</style>
</head>
<body>
<div id="app">

  <header id="top">
    <div id="brand"><h1>THIN WALLS</h1></div>
    <span id="by">a Brokild apartment</span>
    <span id="topfill"></span>
    <div id="cineBox">
      <button class="b" id="bCine" type="button">Cinematic</button>
      <div class="selwrap"><select class="sel" id="cineQ"><option value="high">HIGH 1.5x</option><option value="ultra">ULTRA 2x</option></select></div>
    </div>
    <div id="recBox">
      <button class="b" id="bRec" type="button">Rec</button>
      <span id="recTime">0:00.0</span>
      <button class="b" id="bExpOpen" type="button">Export</button>
    </div>
    <div id="topright">
      <span>BUILD <b id="buildTag">--</b></span>
    </div>
  </header>

  <main id="views">
    <section id="povWrap">
      <canvas id="pov"></canvas>
      <div id="hud"></div>
      <div id="xhair"></div>
      <div id="glName"></div>
      <div id="cineHud" hidden></div>
      <div id="povTip">drag to look &middot; W A S D to walk</div>
    </section>
    <section id="planWrap">
      <canvas id="plan"></canvas>
    </section>
  </main>

  <footer id="ctrls"></footer>

  <div id="status">
    <span id="notice">ready</span>
    <span id="statfill"></span>
    <span id="levels"></span>
  </div>

</div>
<div id="tip" hidden></div>
<script>
/* ======================================================================
   THIN WALLS - control panel page.
   A pure VIEW. The APVTS owns every value; nothing here is authoritative
   except the page-only camera pitch and the showrays preference.
   ====================================================================== */
"use strict";

/* ---------------------------------------------------------- the apartment
   Hard-coded from PROTOCOL.md section 1. Metres, x east, y north, z up. */
const ROOMS = [
  { i:0, name:"LARGE", sub:"living room", x0:0, x1:6,  y0:0, y1:5,   h:2.8 },
  { i:1, name:"SMALL", sub:"box room",    x0:3, x1:6,  y0:5, y1:8.5, h:2.5 },
  { i:2, name:"GIANT", sub:"hall",        x0:6, x1:18, y0:0, y1:9,   h:5.0 }
];
const APT_W = 18, APT_H = 9;
const DOOR_W = 0.90, DOOR_H = 2.05, EAR_Z = 1.65;

/*  axis "x": the door lies on a wall of constant y, its span runs along x.
    axis "y": wall of constant x, span along y.
    hinge/free are span coordinates; the leaf swings from closedAng to openAng
    (degrees, measured in the plan from +x, counter-clockwise) into `into`. */
const DOORS = [
  { i:0, id:"door1", tag:"S-L", name:"SMALL - LARGE", rooms:[1,0], axis:"x", wall:5.0,
    s0:4.05, s1:4.95, hinge:4.05, free:4.95, closedAng:0,   openAng:90, into:1 },
  { i:1, id:"door2", tag:"L-G", name:"LARGE - GIANT", rooms:[0,2], axis:"y", wall:6.0,
    s0:2.05, s1:2.95, hinge:2.05, free:2.95, closedAng:90,  openAng:0,  into:2 },
  { i:2, id:"door3", tag:"S-G", name:"SMALL - GIANT", rooms:[1,2], axis:"y", wall:6.0,
    s0:6.05, s1:6.95, hinge:6.95, free:6.05, closedAng:-90, openAng:0,  into:2 }
];
/*  The page's OWN default list, used only until initialState arrives - from
    then on the choices are whatever native sent. Nothing downstream counts
    the entries of this array, so the engine may grow the list without the
    page being told twice. */
const MATS = ["ABSORBING","FURNISHED","PLASTER","TILED","STUDIO"];
/*  The floor and the ceiling carry one entry the walls do not: AS WALLS, at
    index 0 and the default, meaning exactly that. A patch that never touches
    them is the patch it was before they existed. */
const SURF_MATS = ["AS WALLS"].concat(MATS);
/*  What a material LOOKS like, keyed by NAME. An index-keyed table hands a
    new material the appearance of whatever used to sit at its index, which
    is wrong silently; an unknown name gets a deliberately neutral surface
    instead. `shade` is the code the fragment shader knows about. */
const MAT_LOOK = {
  ABSORBING:{ shade:0, wash:"rgba(150,60,48,.13)",   amb:0.55 },
  FURNISHED:{ shade:1, wash:"rgba(176,124,58,.13)",  amb:0.82 },
  PLASTER:  { shade:2, wash:"rgba(120,122,128,.11)", amb:1.00 },
  TILED:    { shade:3, wash:"rgba(74,126,148,.13)",  amb:1.10 },
  STUDIO:   { shade:0, wash:"rgba(96,104,120,.13)",  amb:0.70 }
};
const MAT_LOOK_DEFAULT = { shade:1, wash:"rgba(150,146,138,.11)", amb:0.85 };
const SRCTYPES = ["PURE","LOUDSPEAKER"];
const INPUTS = ["OFF","MAIN L","MAIN R","MAIN L+R","AUX L","AUX R","AUX L+R"];
const NSRC = 4;
/*  Protocol section 3, in real units; the normalised defaults are derived so
    the two cannot disagree. */
const SRC_DEF = [
  { x:3.0,  y:2.5, z:1.2, yaw:0,   type:1, dir:0,   inp:3, lvl:0.8 },
  { x:1.5,  y:1.0, z:1.2, yaw:45,  type:1, dir:0,   inp:0, lvl:0.8 },
  { x:4.5,  y:7.0, z:1.2, yaw:270, type:0, dir:0.5, inp:0, lvl:0.8 },
  { x:12.0, y:4.5, z:1.6, yaw:180, type:0, dir:0,   inp:0, lvl:0.8 }
];

/*  The 19 host parameters, in TW_SPECS order. Defaults are the NORMALISED
    values; a choice default given as an index in the protocol table is
    written here already divided by (steps - 1). */
const SPECS = [];
for (let n = 1; n <= NSRC; n++){
  const d = SRC_DEF[n-1];

/* ------------------------------------------------------------- unit maps */
const clamp01 = v => v < 0 ? 0 : (v > 1 ? 1 : v);
/*  n is 1..4 everywhere, matching the parameter ids, so there is never a
    question of whether a given index is zero based. selSrc alone is 0..3,
    because that is what the protocol puts on the wire. */
const SXn   = n => V["s"+n+"x"] * APT_W;
const SYn   = n => V["s"+n+"y"] * APT_H;
const SZn   = n => 0.2 + V["s"+n+"z"] * 2.2;
const SYAWn = n => V["s"+n+"yaw"] * 360;
/*  A choice parameter travels as index/(steps-1), and how many steps there
    are is whatever native SAID - never a number typed here. The page boots on
    its own table and adopts the real one from initialState, so a list that
    grows in the engine grows here too, with no edit. */
function choiceList(id){
  const sp = SPEC[id] || {};
  return (sp.choices && sp.choices.length) ? sp.choices : [];
}
function choiceN(id){
  const sp = SPEC[id] || {};
  return Math.max(2, (sp.steps | 0) > 1 ? (sp.steps | 0) : choiceList(id).length);
}
function choiceIdx(id){
  const n = choiceN(id);
  return Math.min(n - 1, Math.max(0, Math.round(clamp01(V[id]) * (n - 1))));
}
function choiceName(id){ return choiceList(id)[choiceIdx(id)] || ""; }
const srcTypeIdx = n => choiceIdx("s"+n+"type");
const srcDir = n => clamp01(V["s"+n+"dir"]);
const srcInIdx = n => choiceIdx("s"+n+"in");
const srcActive = n => srcInIdx(n) > 0;
const srcLvlDb = n => -24 + V["s"+n+"lvl"] * 30;
const LX = () => V.lisx * APT_W,  LY = () => V.lisy * APT_H;
const LYAW = () => V.lisyaw * 360;
const dbOf = v => -24 + v * 30;
const matName = r => choiceName("mat" + (r + 1)) || MATS[0];
const matLook = r => MAT_LOOK[matName(r)] || MAT_LOOK_DEFAULT;
const matShade = r => matLook(r).shade;                    /* what the shader knows */
const apert = d => clamp01(V[d.id]);

function roomAt(x, y){
  for (const r of ROOMS) if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) return r.i;
  return -1;
}
function roomOfPoint(x, y){                 /* never -1: falls back to the nearest */
  const r = roomAt(x, y);
  if (r >= 0) return r;
  let best = 0, bd = 1e9;
  for (const q of ROOMS){
    const cx = Math.min(Math.max(x, q.x0), q.x1), cy = Math.min(Math.max(y, q.y0), q.y1);
    const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
    if (d < bd){ bd = d; best = q.i; }
  }
  return best;
}
function clampIntoApartment(x, y, m){
  m = m === undefined ? 0.18 : m;
  if (roomAt(x, y) >= 0){
    const r = ROOMS[roomAt(x, y)];
    return [Math.min(Math.max(x, r.x0 + m), r.x1 - m), Math.min(Math.max(y, r.y0 + m), r.y1 - m)];
  }
  let bx = x, by = y, bd = 1e9;
  for (const r of ROOMS){
    const cx = Math.min(Math.max(x, r.x0 + m), r.x1 - m), cy = Math.min(Math.max(y, r.y0 + m), r.y1 - m);
    const d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
    if (d < bd){ bd = d; bx = cx; by = cy; }
  }
  return [bx, by];
}
/* the strip of the doorway the leaf has uncovered, in span coordinates */
function opening(d){
  const w = DOOR_W * apert(d);
  return d.free > d.hinge ? [d.free - w, d.free] : [d.free, d.free + w];
}
function leafAngle(d){ return (d.closedAng + apert(d) * (d.openAng - d.closedAng)) * Math.PI / 180; }
function hingePt(d){ return d.axis === "x" ? [d.hinge, d.wall] : [d.wall, d.hinge]; }
function doorCentre(d){
  const c = (d.s0 + d.s1) / 2;
  return d.axis === "x" ? [c, d.wall] : [d.wall, c];
}

/* ============================================================ broken walls
   Two walls of each room can be split in two and the split point pushed out
   of the room, or into it. Which two: the ones that carry no doorway, so a
   fold can never collide with a door. Wall numbering is the protocol's -
   0 west (x0), 1 east (x1), 2 south (y0), 3 north (y1).

   The polygon is built the way Geometry.h builds it, deliberately: corners
   anticlockwise from the south-west, edges south / east / north / west, the
   split vertex inserted after its own edge's START corner and only when the
   push is not flat. So the shape the page draws with no engine behind it is
   the shape the engine would have sent, to the last decimal - which is what
   lets a drag follow the pointer at once and still be a pure view.
   ==================================================================== */
const BREAK_WALL = [[0,2], [0,3], [1,3]];       /* LARGE, SMALL, GIANT */
const EDGE_WALL  = [2, 1, 3, 0];                /* which wall each edge is */
const EDGE_OUT   = [[0,-1], [1,0], [0,1], [-1,0]];   /* and its outward normal */
const WALL_NAME  = ["west", "east", "south", "north"];
const FOLD_KEY   = ["a", "b"];
const FOLD_FLAT  = 1e-4;                        /* metres; Geometry.h's own bound */
const FOLD_PUSH  = v => (clamp01(v) - 0.5) * 1.2;    /* metres, +-0.6 */
const FOLD_ALONG = v => 0.15 + clamp01(v) * 0.7;     /* 0.15 .. 0.85 of the wall */
const foldId  = (i, k) => "fold"  + (i + 1) + FOLD_KEY[k];
const foldPId = (i, k) => "foldp" + (i + 1) + FOLD_KEY[k];
const foldPush  = (i, k) => FOLD_PUSH(V[foldId(i, k)]);
const foldAlong = (i, k) => FOLD_ALONG(V[foldPId(i, k)]);
const foldFlat  = (i, k) => Math.abs(foldPush(i, k)) < FOLD_FLAT;
const foldConcave = (i, k) => foldPush(i, k) < -FOLD_FLAT;
const foldWallName = (i, k) => WALL_NAME[BREAK_WALL[i][k]];
function roomCorners(r){ return [[r.x0,r.y0], [r.x1,r.y0], [r.x1,r.y1], [r.x0,r.y1]]; }
/*  The edge a fold lives on: its two corners in traversal order and the way
    out. `along` is measured from a towards b, which for the west wall runs
    NORTH to south - the traversal's direction, not the axis's. */
function foldEdge(i, k){
  const r = ROOMS[i], cs = roomCorners(r);
  const e = EDGE_WALL.indexOf(BREAK_WALL[i][k]);
  return { e:e, a:cs[e], b:cs[(e + 1) & 3], out:EDGE_OUT[e] };
}
function foldPoint(i, k){
  const g = foldEdge(i, k), t = foldAlong(i, k), d = foldPush(i, k);
  return [g.a[0] + (g.b[0] - g.a[0])*t + g.out[0]*d,
          g.a[1] + (g.b[1] - g.a[1])*t + g.out[1]*d];
}
/* the point on the FLAT wall the fold came off, which is the handle's track */
function foldBase(i, k){
  const g = foldEdge(i, k), t = foldAlong(i, k);
  return [g.a[0] + (g.b[0] - g.a[0])*t, g.a[1] + (g.b[1] - g.a[1])*t];
}
function foldPolyOf(i){
  const cs = roomCorners(ROOMS[i]), out = [];
  for (let e = 0; e < 4; e++){
    out.push(cs[e]);
    const w = EDGE_WALL[e];
    const k = BREAK_WALL[i][0] === w ? 0 : (BREAK_WALL[i][1] === w ? 1 : -1);
    if (k >= 0 && !foldFlat(i, k)) out.push(foldPoint(i, k));
  }
  return out;
}
/*  What both views are built from. The ENGINE's polygon when it has sent one -
    it is the authority and may know something this page does not - and the
    page's own otherwise, which is the same arithmetic and is what a headless
    page, an older engine and a live drag all fall back on. */
function roomPoly(i){
  const p = scene && scene.plan && scene.plan[i];
  if (p && p.length >= 3) return p;
  return foldPolyOf(i);
}
function polyArea(p){
  let a = 0;
  for (let i = 0; i < p.length; i++){
    const j = (i + 1) % p.length;
    a += p[i][0]*p[j][1] - p[j][0]*p[i][1];
  }
  return Math.abs(a) / 2;
}
/*  Which EDGES of a polygon belong to a concave fold, so they can be drawn in
    the warning colour. The split vertex is matched by POSITION rather than by
    index, because the polygon may have come from the engine, and then the page
    does not know where in the list it put it. */
function concaveEdges(i, poly){
  const out = new Array(poly.length).fill(false);
  for (let k = 0; k < 2; k++){
    if (!foldConcave(i, k)) continue;
    const p = foldPoint(i, k);
    let best = -1, bd = 0.05;
    for (let v = 0; v < poly.length; v++){
      const d = Math.hypot(poly[v][0] - p[0], poly[v][1] - p[1]);
      if (d < bd){ bd = d; best = v; }
    }
    if (best >= 0){ out[(best - 1 + poly.length) % poly.length] = true; out[best] = true; }
  }
  return out;
}
/* every concave fold there is, named the way the plan names it */
function concaveList(){
  const out = [];
  for (let i = 0; i < ROOMS.length; i++)
    for (let k = 0; k < 2; k++)
      if (foldConcave(i, k)) out.push(ROOMS[i].name + " " + foldWallName(i, k));
  return out;
}
/*  A room has three surfaces now. The floor and the ceiling answer AS WALLS by
    handing back the wall material, so every consumer asks the same question
    and none of them has to know about the extra entry. */
function surfName(room, which){
  const id = which + (room + 1);
  const i = choiceIdx(id);
  return i <= 0 ? matName(room) : (choiceList(id)[i] || matName(room));
}
const flrName = r => surfName(r, "flr");
const celName = r => surfName(r, "cel");
const lookOfName = nm => MAT_LOOK[nm] || MAT_LOOK_DEFAULT;
const flrShade = r => lookOfName(flrName(r)).shade;
const celShade = r => lookOfName(celName(r)).shade;

/* ==================================================================== */
/*  drawing schedule                                                     */
/*  Nothing is drawn unless something a view depends on has changed.     */
/*  Idle means literally no animation frame is pending and the counter   */
/*  below does not move.                                                 */
/* ==================================================================== */
let dirtyPov = false, dirtyPlan = false, rafId = 0, lastFrameT = 0;
let meshDirty = true;
let drawCount = 0;

function invalidate(which){
  if (which !== "plan") dirtyPov = true;
  if (which !== "pov")  dirtyPlan = true;
  schedule();
}
function schedule(){
  if (rafId) return;
  try { rafId = requestAnimationFrame(frame); } catch(e){ rafId = 0; }
}
function frame(t){
  rafId = 0;
  if (EXP.active) return;            /* an export draws its own frames; nothing else may */
  const now = (typeof t === "number") ? t : nowMs();
  stepWalk(now);
  if (SYNC.s > 0) syncStep(now);
  if (dirtyPov){ drawPov(); dirtyPov = false; }
  if (dirtyPlan){ drawPlan(); dirtyPlan = false; }
  /*  The ONLY thing that keeps the loop alive is a key actually being held.
      Everything else invalidates on the event that changed it and stops. */
  if (walkActive() || doorAnimActive()){ dirtyPov = true; dirtyPlan = true; schedule(); }
  /*  Cinematic keeps the 3D view alive - dust, flicker, the photo converging -
      until the photo is done. Off, cineLoop() is false and nothing changes. */
  else if (cineLoop() || syncActive()){ dirtyPov = true; schedule(); }
}
function nowMs(){ try { return performance.now(); } catch(e){ return Date.now(); } }

/* which views a parameter touches - a level fader touches neither, and so
   moving one must cost exactly zero draw calls */
const MESH_IDS = { door1:1, door2:1, door3:1, mat1:1, mat2:1, mat3:1 };
for (let n = 1; n <= NSRC; n++)
  for (const suf of ["x","y","z","yaw","type","dir","in"]) MESH_IDS["s"+n+suf] = 1;
/*  A surface and a broken wall both change the room itself, so both views and
    the mesh follow. (mat1..3 are already in the table above.) */
for (let n = 1; n <= 3; n++){
  MESH_IDS["flr"+n] = 1; MESH_IDS["cel"+n] = 1;
  for (const k of ["a","b"]){ MESH_IDS["fold"+n+k] = 1; MESH_IDS["foldp"+n+k] = 1; }
}
const VIEW_IDS = Object.assign({ lisx:1, lisy:1, lisyaw:1 }, MESH_IDS);
const PLAN_ONLY_IDS = { earspan:1 };     /* the ears are drawn at their real spacing */
function touchViews(id){
  if (MESH_IDS[id]) meshDirty = true;
  if (VIEW_IDS[id]) invalidate("both");
  else if (PLAN_ONLY_IDS[id]) invalidate("plan");
}

/* ==================================================================== */
/*  parameter plumbing                                                   */
/* ==================================================================== */
const pend = {};
let flushRaf = 0, flushTmr = 0;

function doFlush(){
  if (flushRaf){ try{ cancelAnimationFrame(flushRaf); }catch(e){} flushRaf = 0; }
  if (flushTmr){ clearTimeout(flushTmr); flushTmr = 0; }
  for (const id in pend){ NB.send({ k:"p", id:id, v:pend[id] }); delete pend[id]; }
}
/*  One p per parameter per frame. The timer is a belt-and-braces flush for
    contexts where requestAnimationFrame does not tick (a headless probe);
    whichever arrives first cancels the other. */
function queueP(id, v){
  pend[id] = v;
  if (!flushRaf){ try { flushRaf = requestAnimationFrame(doFlush); } catch(e){ flushRaf = 0; } }
  if (!flushTmr) flushTmr = setTimeout(doFlush, 24);
}

function setUser(id, v){               /* the user moved it: send */
  v = clamp01(v);
  if (SPEC[id] && SPEC[id].stepped){
    const n = SPEC[id].steps;
    v = Math.round(v * (n - 1)) / (n - 1);
  }
  if (V[id] === v) { updateControl(id); return; }
  V[id] = v;
  updateControl(id);
  touchViews(id);
  queueP(id, v);
}
function setNative(id, v){             /* it arrived from native: do NOT send */
  if (!(id in V)) return;
  if (EXP.active){ EXP.liveV[id] = clamp01(v); return; }   /* the live state is parked while frames are drawn */
  V[id] = clamp01(v);
  updateControl(id);
  touchViews(id);
}

/* ==================================================================== */
/*  the control strip                                                    */
/* ==================================================================== */
const ctrls = document.getElementById("ctrls");
const EL = {};                        /* id -> {input, val, btn, sel} */

function mk(tag, cls, parent){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (parent) parent.appendChild(e);
  return e;
}
function hintOn(el, key){
  const h = HINT[key];
  if (!h) return el;
  el.setAttribute("data-tip", h[1]);
  el.setAttribute("data-tiptitle", h[0]);
  return el;
}
function group(title){
  const g = mk("div", "grp", ctrls);
  const h = mk("h2", null, g);
  h.textContent = title;
  return g;
}
/*  hintKey is separate from the id because four sources share one set of
    explanations: the id is s3yaw, the hint is "syaw". */
function sliderRow(g, id, label, cls, hintKey){
  const row = mk("div", "row" + (cls ? " " + cls : ""), g);
  const lab = mk("label", "lab", row);
  lab.textContent = label;
  let btn = null;
  if (cls === "door"){
    btn = mk("button", "dbtn", row);
    btn.type = "button";
    btn.setAttribute("data-door", id);
    hintOn(btn, "doorbtn");
    btn.addEventListener("click", () => {
      gesture(id, () => setUser(id, V[id] > 0.5 ? 0 : 1));
    });
  }
  addSlider(row, id, hintKey || id, btn);
  return row;
}
/*  The fader itself and everything that talks to native, lifted out of
    sliderRow so a row that is NOT the ordinary label-slider-value shape can
    still carry one - the broken-wall rows carry two. */
function addSlider(row, id, hintKey, btn){
  const sl = mk("input", "sl", row);
  sl.type = "range"; sl.min = "0"; sl.max = "1"; sl.step = "0.001";
  sl.setAttribute("data-id", id);
  hintOn(sl, hintKey || id);
  const val = mk("span", "val", row);
  let down = false;
  sl.addEventListener("pointerdown", () => { down = true; NB.send({ k:"touch", id:id, down:true }); });
  const up = () => { if (!down) return; down = false; doFlush(); NB.send({ k:"touch", id:id, down:false }); };
  sl.addEventListener("pointerup", up);
  sl.addEventListener("pointercancel", up);
  window.addEventListener("pointerup", up);
  sl.addEventListener("input", () => setUser(id, parseFloat(sl.value)));
  EL[id] = { input:sl, val:val, btn:btn || null };
  return { sl:sl, val:val };
}
/*  One select, bound, wherever it is put. selectRow builds the ordinary row
    around it; the material grid puts three of them on a line of their own. */
function addSelect(parent, id, hintKey){
  const wrap = mk("div", "selwrap", parent);
  const sel = mk("select", "sel", wrap);
  sel.setAttribute("data-id", id);
  hintOn(sel, hintKey || id);
  const ch = (SPEC[id] && SPEC[id].choices) || [];
  ch.forEach((c, i) => { const o = mk("option", null, sel); o.value = String(i); o.textContent = c; });
  sel.addEventListener("change", () => {
    const n = Math.max(2, SPEC[id].steps | 0, sel.options.length);
    gesture(id, () => setUser(id, parseInt(sel.value, 10) / (n - 1)));
  });
  EL[id] = { input:sel, val:null, sel:sel };
  return sel;
}
function selectRow(g, id, label, hintKey){
  const row = mk("div", "row sel", g);
  const lab = mk("label", "lab", row);
  lab.textContent = label;
  addSelect(row, id, hintKey || id);
  return row;
}
function readout(parent, id, label, hintKey){
  const r = mk("div", "ro", parent);
  r.setAttribute("data-id", id);
  r.setAttribute("data-ro", "1");
  hintOn(r, hintKey || id);
  const i = mk("i", null, r);
  i.textContent = label + " ";
  const s = mk("span", null, r);
  EL[id] = { input:null, val:s, ro:r };
  return r;
}
function gesture(id, fn){
  NB.send({ k:"touch", id:id, down:true });
  fn();
  doFlush();
  NB.send({ k:"touch", id:id, down:false });
}

function buildControls(){
  const gd = group("Doors");
  DOORS.forEach(d => sliderRow(gd, d.id, d.tag, "door"));
  const note = mk("div", "ro", gd);
  note.style.marginTop = "2px";
  note.textContent = "click a door in the plan to toggle";

  /*  Nine choices, three per room. Laid out as a grid with the surface names
      across the top rather than as nine loose selectors: which room a choice
      belongs to has to be readable without reading the label. */
  const gm = group("Materials");
  gm.classList.add("wide");
  const grid = mk("div", "matgrid", gm);
  mk("div", null, grid);
  for (const h of ["Walls", "Floor", "Ceiling"]){
    const e = mk("div", "mathead", grid); e.textContent = h;
  }
  for (let n = 1; n <= 3; n++){
    const lab = mk("div", "matroom", grid); lab.textContent = ROOMS[n-1].name;
    addSelect(grid, "mat"+n);
    addSelect(grid, "flr"+n);
    addSelect(grid, "cel"+n);
  }
  const mnote = mk("div", "ro", gm);
  mnote.style.marginTop = "4px";
  mnote.textContent = "floor and ceiling default to AS WALLS";

  buildFoldGroup();
  buildSourceGroup();

  const gl = group("Levels and head");
  gl.classList.add("wide");
  sliderRow(gl, "direct", "DIRECT");
  sliderRow(gl, "early", "EARLY");
  sliderRow(gl, "reverb", "REVERB");
  sliderRow(gl, "mix", "MIX");
  sliderRow(gl, "output", "OUTPUT");
  sliderRow(gl, "earspan", "EAR SPAN");

  /*  One column, not two: four buttons and three readouts do not need 400 px,
      and the furniture group below does. Rebalanced rather than crammed. */
  const gv = group("View and files");
  const br = mk("div", "btnrow", gv);
  const bRays = mk("button", "b", br); bRays.type = "button"; bRays.id = "bRays"; bRays.textContent = "Rays";
  hintOn(bRays, "rays");
  bRays.addEventListener("click", () => setRays(!showRays));
  const bDef = mk("button", "b", br); bDef.type = "button"; bDef.textContent = "Default";
  hintOn(bDef, "def");
  bDef.addEventListener("click", () => NB.send({ k:"presetDefault" }));
  const bSave = mk("button", "b", br); bSave.type = "button"; bSave.textContent = "Save";
  hintOn(bSave, "save");
  bSave.addEventListener("click", () => NB.send({ k:"presetSave" }));
  const bLoad = mk("button", "b", br); bLoad.type = "button"; bLoad.textContent = "Load";
  hintOn(bLoad, "load");
  bLoad.addEventListener("click", () => NB.send({ k:"presetLoad" }));

  const pos = mk("div", "pos", gv);
  readout(pos, "lisx", "YOU X");
  readout(pos, "lisy", "YOU Y");
  readout(pos, "lisyaw", "YOU");
  const hintPos = mk("div", "ro", gv);
  hintPos.style.marginTop = "3px";
  hintPos.textContent = "set in the views";
  buildSyncControls(gv);

  buildWavGroup();
  buildFurnGroup();
  buildPicsSection(document.getElementById("grpFurn"));
  buildRecGroup();
}

/*  ------------------------------------------------------- broken walls
    Two rows per room, one per breakable wall, each carrying BOTH of that
    wall's numbers: how far the split point is pushed and where along the wall
    it sits. They are one gesture in the plan, so they are one line here. */
function buildFoldGroup(){
  const g = group("Broken walls");
  g.classList.add("wide");
  for (let n = 1; n <= 3; n++){
    for (let k = 0; k < 2; k++){
      const kk = FOLD_KEY[k];
      const row = mk("div", "row fold", g);
      row.setAttribute("data-fold", String(n) + kk);
      const lab = mk("label", "lab", row);
      lab.textContent = ROOMS[n-1].name + " " + foldWallName(n-1, k).charAt(0).toUpperCase();
      addSlider(row, "fold"+n+kk, "fold"+n+kk);
      addSlider(row, "foldp"+n+kk, "foldp"+n+kk);
    }
  }
  const note = mk("div", "ro", g);
  note.id = "foldNote";
  note.style.marginTop = "3px";
  note.textContent = "push out to scatter  .  drag the marker in the plan";
}

/* ------------------------------------------------------- the test signal
   Not host parameters: three bridge messages and one event back, so Peter can
   audition the apartment with no DAW around it. The file loops AS the source
   while it plays. Deliberately no data-id - that attribute is reserved for the
   APVTS parameters and the probe counts them against the protocol's table. */
let wav = { name:"", playing:0, seconds:0, gain:0.75 };
function buildWavGroup(){
  const g = group("Test signal");
  const br = mk("div", "btnrow", g);
  const bOpen = mk("button", "b", br); bOpen.type = "button"; bOpen.id = "bWavOpen"; bOpen.textContent = "Load";
  bOpen.setAttribute("data-wav", "open");
  hintOn(bOpen, "wavload");
  bOpen.addEventListener("click", () => NB.send({ k:"wavOpen" }));
  const bPlay = mk("button", "b", br); bPlay.type = "button"; bPlay.id = "bWavPlay"; bPlay.textContent = "Play";
  bPlay.setAttribute("data-wav", "play");
  hintOn(bPlay, "wavplay");
  bPlay.addEventListener("click", () => {
    wav.playing = wav.playing ? 0 : 1;
    NB.send({ k:"wavPlay", v:wav.playing });
    updateWav();
  });

  const row = mk("div", "row", g);
  const lab = mk("label", "lab", row); lab.textContent = "LEVEL";
  const sl = mk("input", "sl", row);
  sl.type = "range"; sl.min = "0"; sl.max = "1"; sl.step = "0.001"; sl.id = "wavGain";
  sl.setAttribute("data-wav", "gain");
  hintOn(sl, "wavgain");
  sl.addEventListener("input", () => {
    wav.gain = parseFloat(sl.value);
    NB.send({ k:"wavGain", v:wav.gain });
    updateWav();
  });
  const val = mk("span", "val", row); val.id = "wavGainVal";

  const f = mk("div", "ro", g);
  f.id = "wavFile";
  f.setAttribute("data-wav", "file");
  hintOn(f, "wavfile");
  updateWav();
}
function updateWav(){
  const b = document.getElementById("bWavPlay");
  if (b){ b.classList.toggle("on", !!wav.playing); b.textContent = wav.playing ? "Stop" : "Play"; }
  const sl = document.getElementById("wavGain");
  if (sl && document.activeElement !== sl) sl.value = String(wav.gain);
  const v = document.getElementById("wavGainVal");
  if (v){ const d = -40 + wav.gain * 40; v.textContent = d.toFixed(1) + " dB"; }
  const f = document.getElementById("wavFile");
  if (f) f.textContent = wav.name ? (wav.name + "  " + wav.seconds.toFixed(1) + " s") : "no file loaded";
}

/* ---------------------------------------------------------- the sources
   One panel, four sources. All FOUR sets of rows are built and all but the
   selected one carries `hidden` - so every parameter always has a real
   control bound to it, and switching source is a class toggle rather than a
   re-bind. A re-bound control is a control whose id has to be kept in step
   with the selection in four other places. */
function buildSourceGroup(){
  const g = group("Source");
  const tabs = mk("div", "btnrow srctabs", g);
  for (let n = 1; n <= NSRC; n++){
    const b = mk("button", "b srctab", tabs);
    b.type = "button";
    b.setAttribute("data-srctab", String(n - 1));
    b.textContent = String(n);
    hintOn(b, "srctab");
    b.addEventListener("click", () => selectSource(n - 1, true));
  }
  for (let n = 1; n <= NSRC; n++){
    const set = mk("div", "srcset", g);
    set.setAttribute("data-srcset", String(n - 1));
    selectRow(set, "s"+n+"in", "INPUT", "sin");
    selectRow(set, "s"+n+"type", "TYPE", "stype");
    sliderRow(set, "s"+n+"z", "HEIGHT", null, "sz");
    sliderRow(set, "s"+n+"yaw", "FACING", null, "syaw");
    sliderRow(set, "s"+n+"dir", "DIRECT.", null, "sdir");
    sliderRow(set, "s"+n+"lvl", "LEVEL", null, "slvl");
    const pos = mk("div", "pos", set);
    readout(pos, "s"+n+"x", "X", "sx");
    readout(pos, "s"+n+"y", "Y", "sy");
  }
}
function selectSource(i, send){
  selSrc = Math.max(0, Math.min(NSRC - 1, i | 0));
  for (const e of document.querySelectorAll("[data-srcset]"))
    e.hidden = (parseInt(e.getAttribute("data-srcset"), 10) !== selSrc);
  refreshSrcTabs();
  applySourceCapabilities();
  if (send) NB.send({ k:"selsrc", v:selSrc });
  meshDirty = true;                    /* the selection ring moves */
  invalidate("both");
}
function refreshSrcTabs(){
  for (const b of document.querySelectorAll("[data-srctab]")){
    const i = parseInt(b.getAttribute("data-srctab"), 10);
    b.classList.toggle("on", i === selSrc);
    b.classList.toggle("silent", !srcActive(i + 1));
  }
}
/*  DIRECTIVITY belongs to a PURE source; a LOUDSPEAKER carries its own
    measured pattern, so the control is disabled rather than left live and
    doing nothing. An AUX input the host has not connected is still offered -
    it is how you find out the bus exists - but it says so. */
function applySourceCapabilities(){
  for (let n = 1; n <= NSRC; n++){
    const ls = srcTypeIdx(n) === 1;
    const e = EL["s"+n+"dir"];
    if (e && e.input){
      e.input.disabled = ls;
      const row = e.input.closest(".row");
      if (row) row.classList.toggle("off", ls);
    }
    if (e && e.val) e.val.textContent = ls ? "n/a" : Math.round(srcDir(n)*100) + "%";
    const s = EL["s"+n+"in"];
    if (s && s.sel){
      const list = choiceList("s"+n+"in");
      for (const o of s.sel.options){
        const idx = parseInt(o.value, 10);
        const nm = list[idx] || INPUTS[idx] || "";
        /*  Which entries are AUX is read off the NAME, not off an index -
            the position of the AUX block is not a promise the protocol makes. */
        o.textContent = nm + (/^AUX/i.test(nm) && !auxConnected ? "  (not connected)" : "");
      }
    }
  }
}

function fmtDb(v){ const d = dbOf(v); return (d >= 0 ? "+" : "") + d.toFixed(1) + " dB"; }
function updateControl(id){
  const e = EL[id];
  if (!e) return;
  const v = V[id];
  if (e.input && e.input.tagName === "INPUT" && document.activeElement !== e.input) e.input.value = String(v);
  if (e.sel){
    syncChoices(id);
    /*  A degenerate step count would put -0 in the value and leave the
        selector showing nothing at all, which reads as a broken control. */
    const n = Math.max(2, SPEC[id].steps | 0, e.sel.options.length);
    e.sel.value = String(Math.min(n - 1, Math.max(0, Math.round(clamp01(v) * (n - 1)))));
  }
  if (e.btn) e.btn.classList.toggle("on", v > 0.5);
  if (e.val){
    let t = "";
    const m = /^s([1-4])(x|y|z|yaw|dir|lvl)$/.exec(id);
    if (m){
      const n = m[1];
      if (m[2] === "x") t = SXn(n).toFixed(2) + " m";
      else if (m[2] === "y") t = SYn(n).toFixed(2) + " m";
      else if (m[2] === "z") t = SZn(n).toFixed(2) + " m";
      else if (m[2] === "yaw") t = Math.round(SYAWn(n)) + " deg";
      else if (m[2] === "dir") t = srcTypeIdx(n) === 1 ? "n/a" : Math.round(v * 100) + "%";
      else t = fmtDb(v);
    }
    else if (id === "lisyaw") t = Math.round(LYAW()) + " deg";
    else if (id === "lisx") t = (v * APT_W).toFixed(2) + " m";
    else if (id === "lisy") t = (v * APT_H).toFixed(2) + " m";
    else if (id === "earspan") t = (EARSPAN_M(v) * 100).toFixed(1) + " cm";
    else if (id === "mix") t = Math.round(v * 100) + "%";
    else if (/^fold[1-3][ab]$/.test(id)){
      const d = FOLD_PUSH(v);
      t = Math.abs(d) < FOLD_FLAT ? "flat" : ((d > 0 ? "+" : "") + d.toFixed(2) + " m");
    }
    else if (/^foldp[1-3][ab]$/.test(id)) t = Math.round(FOLD_ALONG(v) * 100) + "%";
    else if (id.indexOf("door") === 0) t = Math.round(v * 100) + "%";
    else t = fmtDb(v);
    e.val.textContent = t;
  }
  if (/^fold[1-3][ab]$/.test(id)){
    const m3 = /^fold([1-3])([ab])$/.exec(id);
    const row = document.querySelector('[data-fold="' + m3[1] + m3[2] + '"]');
    if (row) row.classList.toggle("bent", foldConcave(parseInt(m3[1],10) - 1, m3[2] === "b" ? 1 : 0));
  }
  if (/^s[1-4]type$/.test(id)) applySourceCapabilities();
  if (/^s[1-4]in$/.test(id)) refreshSrcTabs();
  if (/^s[1-4](x|y)$/.test(id) || id === "lisx" || id === "lisy" || id === "lisyaw") updateHud();
}
/*  The options are built when the panel is, which is BEFORE native has said
    what the choices are. If the list that arrives is longer - a material the
    engine has gained - the selector has to grow with it, or the new entry is
    unreachable and the page reports the wrong name for every value above it. */
function syncChoices(id){
  const e = EL[id];
  if (!e || !e.sel) return;
  const ch = choiceList(id);
  const want = Math.max(ch.length, choiceN(id));
  let same = e.sel.options.length === want;
  if (same) for (let i = 0; i < want; i++)
    if (e.sel.options[i].textContent.indexOf(ch[i] || "") !== 0){ same = false; break; }
  if (same) return;
  const keep = e.sel.value;
  while (e.sel.options.length) e.sel.remove(0);
  for (let i = 0; i < want; i++){
    const o = mk("option", null, e.sel);
    o.value = String(i); o.textContent = ch[i] || ("OPTION " + (i+1));
  }
  if (keep !== "" && (keep | 0) < want) e.sel.value = keep;
}
function updateAllControls(){ for (const s of SPECS) updateControl(s.id); applySourceCapabilities(); }

function setRays(on){
  showRays = !!on;
  const b = document.getElementById("bRays");
  if (b) b.classList.toggle("on", showRays);
  NB.send({ k:"showrays", v:showRays ? 1 : 0 });
  invalidate("plan");
}

/* ------------------------------------------------------------- tooltips */
const tipEl = document.getElementById("tip");
function showTip(el){
  const t = el.getAttribute("data-tip");
  if (!t) return;
  const title = el.getAttribute("data-tiptitle") || "";
  tipEl.innerHTML = "";
  if (title){ const b = mk("b", null, tipEl); b.textContent = title; }
  const p = mk("span", null, tipEl);
  p.textContent = t;
  tipEl.hidden = false;
  tipEl.style.left = "0px"; tipEl.style.top = "0px";
  const r = el.getBoundingClientRect();
  const tr = tipEl.getBoundingClientRect();
  let x = r.left + r.width / 2 - tr.width / 2;
  x = Math.min(Math.max(x, 6), Math.max(6, window.innerWidth - tr.width - 6));
  /*  ABOVE the control, its bottom edge a clear 10 px above the control's top.
      The controls live in a strip at the foot of the window with the two views
      over them, so there is always room; the branch below is the guard, and it
      still cannot overlap because it starts 10 px past the bottom edge. */
  let y = r.top - tr.height - 10;
  if (y < 6) y = r.bottom + 10;
  tipEl.style.left = Math.round(x) + "px";
  tipEl.style.top = Math.round(y) + "px";
}
function hideTip(){ tipEl.hidden = true; }
document.addEventListener("pointerover", e => {
  const el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (el) showTip(el); else hideTip();
});
document.addEventListener("pointerdown", e => {
  const el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!el) hideTip();
});
document.addEventListener("focusin", e => {
  const el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (el) showTip(el);
});
document.addEventListener("focusout", hideTip);

/* ------------------------------------------------------------------ HUD */
const hudEl = document.getElementById("hud");
const noticeEl = document.getElementById("notice");
const levelsEl = document.getElementById("levels");
const ROOMNAME = ["LARGE", "SMALL", "GIANT"];
function updateHud(){
  const lx = LX(), ly = LY();
  const lr = roomOfPoint(lx, ly);
  let h = '<span class="k">YOU IN </span><span class="v">' + ROOMNAME[lr] + "</span><br>";
  /*  One line per source: where it is and how far. An OFF source still gets a
      line, marked, because knowing which of the four is silent is half of
      what you come to this readout for. */
  for (let n = 1; n <= NSRC; n++){
    const sx = SXn(n), sy = SYn(n);
    const d = Math.sqrt((sx-lx)*(sx-lx) + (sy-ly)*(sy-ly) + (SZn(n)-EAR_Z)*(SZn(n)-EAR_Z));
    const on = srcActive(n);
    const sel = (n - 1 === selSrc) ? "&gt;" : "&nbsp;";
