/* ------------------------------------------------------------ mesh build */
/* where the four pendants hang, in plan. Deliberately off the source's own
   default spot so the speaker is not standing inside a lamp. */
const LAMPS = [[2.15,3.45],[4.50,6.75],[9.50,3.20],[14.50,5.80]];

const M = { pos:[], nrm:[], tan:[], uv:[], info:[], n:0 };
const sub = (a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const crs = (a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot3 = (a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function nrm3(a){ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; }
const add3 = (a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul3 = (a,s)=>[a[0]*s,a[1]*s,a[2]*s];

/*  ALPHA is the fourth channel of aInfo: an inactive source is drawn ghosted
    rather than hidden, so it can still be seen and dragged. Everything with
    alpha below 1 is built AFTER the opaque geometry and drawn in a second
    pass with blending on and depth writes off. */
let curAlpha = 1;
function addV(p,n,t,uv,mat,kind,room){
  M.pos.push(p[0],p[1],p[2]); M.nrm.push(n[0],n[1],n[2]); M.tan.push(t[0],t[1],t[2]);
  M.uv.push(uv[0],uv[1]); M.info.push(mat,kind,room,curAlpha); M.n++;
}
function axisTan(n){
  if (Math.abs(n[2]) > 0.5) return [1,0,0];
  if (Math.abs(n[0]) > 0.5) return [0,1,0];
  return [1,0,0];
}
/*  mode 0 = world-axis projected uv (everything axis aligned),
    mode 1 = local metres from corner a, mode 2 = local metres from the centre. */
function quad(a,b,c,d,mat,kind,room,mode){
  const n = nrm3(crs(sub(b,a), sub(d,a)));
  let t, o;
  if (!mode){ t = axisTan(n); o = [0,0,0]; }
  else { t = nrm3(sub(b,a)); o = mode === 2 ? mul3(add3(a,c),0.5) : a; }
  const bt = crs(n,t);
  const f = p => { const q = sub(p,o); return [dot3(q,t), dot3(q,bt)]; };
  const ua=f(a), ub=f(b), uc=f(c), ud=f(d);
  addV(a,n,t,ua,mat,kind,room); addV(b,n,t,ub,mat,kind,room); addV(c,n,t,uc,mat,kind,room);
  addV(a,n,t,ua,mat,kind,room); addV(c,n,t,uc,mat,kind,room); addV(d,n,t,ud,mat,kind,room);
}
/* a rectangle in a vertical plane. axis "x": plane y = coord, span u along x. */
function rectV(axis, coord, u0, u1, z0, z1, want, mat, kind, room){
  const P = (u,z) => axis === "x" ? [u,coord,z] : [coord,u,z];
  let a=P(u0,z0), b=P(u1,z0), c=P(u1,z1), d=P(u0,z1);
  if (dot3(crs(sub(b,a),sub(d,a)), want) < 0){ const t=b; b=d; d=t; }
  quad(a,b,c,d,mat,kind,room,0);
}
function rectH(z, x0, x1, y0, y1, want, mat, kind, room){
  let a=[x0,y0,z], b=[x1,y0,z], c=[x1,y1,z], d=[x0,y1,z];
  if (dot3(crs(sub(b,a),sub(d,a)), want) < 0){ const t=b; b=d; d=t; }
  quad(a,b,c,d,mat,kind,room,0);
}
function wallWithHoles(axis, coord, s0, s1, h, want, holes, mat, room){
  holes = holes.slice().sort((p,q)=>p.s0-q.s0);
  let u = s0;
  for (const ho of holes){
    if (ho.s0 > u + 1e-4) rectV(axis, coord, u, ho.s0, 0, h, want, mat, 0, room);
    if (h > DOOR_H + 1e-4) rectV(axis, coord, ho.s0, ho.s1, DOOR_H, h, want, mat, 0, room);
    u = ho.s1;
  }
  if (u < s1 - 1e-4) rectV(axis, coord, u, s1, 0, h, want, mat, 0, room);
}
function holesOn(axis, coord, s0, s1){
  return DOORS.filter(d => d.axis === axis && Math.abs(d.wall - coord) < 1e-4 && d.s0 >= s0 - 1e-4 && d.s1 <= s1 + 1e-4);
}
/*  Every face states the outward normal it WANTS and the winding is corrected
    to match. The speaker's own basis is the camera-style forward/right/up,
    which is LEFT handed - taken on trust it turns the cabinet inside out and
    puts the loudspeaker's baffle on the back, where back-face culling then
    hides it. Cheaper to check than to remember. */
function faceQuad(a, b, c, d, want, mat, kind, room, mode){
  if (dot3(crs(sub(b,a), sub(d,a)), want) < 0){ const t = b; b = d; d = t; }
  quad(a, b, c, d, mat, kind, room, mode);
}
function boxOriented(c, au, av, aw, hu, hv, hw, mat, kinds, room, mode){
  const U2 = mul3(au,hu), Vv = mul3(av,hv), W = mul3(aw,hw);
  const P = (su,sv,sw) => add3(c, add3(mul3(U2,su), add3(mul3(Vv,sv), mul3(W,sw))));
  const md = mode === undefined ? 2 : mode;
  const nu = nrm3(au), nv = nrm3(av), nw = nrm3(aw);
  const neg = v => [-v[0],-v[1],-v[2]];
  /* +u, -u, +v, -v, +w, -w */
  faceQuad(P(1,-1,-1),P(1,1,-1),P(1,1,1),P(1,-1,1),      nu,      mat,kinds[0],room,md);
  faceQuad(P(-1,1,-1),P(-1,-1,-1),P(-1,-1,1),P(-1,1,1),  neg(nu), mat,kinds[1],room,md);
  faceQuad(P(1,1,-1),P(-1,1,-1),P(-1,1,1),P(1,1,1),      nv,      mat,kinds[2],room,md);
  faceQuad(P(-1,-1,-1),P(1,-1,-1),P(1,-1,1),P(-1,-1,1),  neg(nv), mat,kinds[3],room,md);
  faceQuad(P(-1,-1,1),P(1,-1,1),P(1,1,1),P(-1,1,1),      nw,      mat,kinds[4],room,md);
  faceQuad(P(-1,1,-1),P(1,1,-1),P(1,-1,-1),P(-1,-1,-1),  neg(nw), mat,kinds[5],room,md);
}
function coneRing(cx, cy, zTop, zBot, rTop, rBot, seg, mat, kind, room){
  for (let i=0;i<seg;i++){
    const a0 = i/seg*Math.PI*2, a1 = (i+1)/seg*Math.PI*2;
    const p0=[cx+Math.cos(a0)*rTop, cy+Math.sin(a0)*rTop, zTop];
    const p1=[cx+Math.cos(a1)*rTop, cy+Math.sin(a1)*rTop, zTop];
    const p2=[cx+Math.cos(a1)*rBot, cy+Math.sin(a1)*rBot, zBot];
    const p3=[cx+Math.cos(a0)*rBot, cy+Math.sin(a0)*rBot, zBot];
    /* wound so the skin faces OUT - the other way round a lamp shade is only
       visible from inside itself */
    quad(p0,p3,p2,p1, mat, kind, room, 1);
  }
}
function disc(cx, cy, z, r, seg, down, mat, kind, room){
  const n = [0,0, down ? -1 : 1], t = [1,0,0], bt = crs(n,t);
  for (let i=0;i<seg;i++){
    let a0 = i/seg*Math.PI*2, a1 = (i+1)/seg*Math.PI*2;
    if (down){ const s=a0; a0=a1; a1=s; }
    const c=[cx,cy,z], p1=[cx+Math.cos(a0)*r, cy+Math.sin(a0)*r, z], p2=[cx+Math.cos(a1)*r, cy+Math.sin(a1)*r, z];
    const f = p => [ (p[0]-cx)*t[0]+(p[1]-cy)*t[1], (p[0]-cx)*bt[0]+(p[1]-cy)*bt[1] ];
    addV(c,n,t,f(c),mat,kind,room); addV(p1,n,t,f(p1),mat,kind,room); addV(p2,n,t,f(p2),mat,kind,room);
  }
}
function sphere(cx, cy, cz, r, seg, rings, mat, kind, room){
  for (let j=0;j<rings;j++){
    const t0 = j/rings*Math.PI, t1 = (j+1)/rings*Math.PI;
    for (let i=0;i<seg;i++){
      const p0 = i/seg*Math.PI*2, p1 = (i+1)/seg*Math.PI*2;
      const S = (t,p)=>[cx+r*Math.sin(t)*Math.cos(p), cy+r*Math.sin(t)*Math.sin(p), cz+r*Math.cos(t)];
      quad(S(t0,p0),S(t1,p0),S(t1,p1),S(t0,p1), mat, kind, room, 1);   /* outward */
    }
  }
}

function pendant(x, y, zc, mat, room){
  ceilingRose(x, y, zc, mat, room);
  boxOriented([x,y,zc-0.20],[1,0,0],[0,1,0],[0,0,1],0.014,0.014,0.17, mat,[11,11,11,11,11,11], room);
  coneRing(x,y, zc-0.37, zc-0.55, 0.075, 0.235, 16, mat, 12, room);
  disc(x,y, zc-0.554, 0.225, 16, true, mat, 7, room);
  /* the bulb itself, just inside the shade - it is what the bloom comes from */
  sphere(x, y, zc-0.505, 0.055, 12, 8, mat, 7, room);
}

/* ------------------------------------------------------------ the handle
   A LEVER, not a knob. At three metres a 5 cm knob is a speck, and the point
   of this thing is that you can see it is a handle and reach for it. One on
   each face of the leaf, on the side away from the hinge, at 1.05 m - the
   height a handle is actually mounted at.

   HANDLE_U is the ONE number that says where it is; the picking rectangle
   below is written against it, so the thing you grab and the thing you see
   cannot drift apart. */
const HANDLE_U = 0.75;          /* along the leaf, from the hinge */
const HANDLE_Z = 1.05;          /* off the floor */
const LEAF_T   = 0.022;         /* the leaf's own half thickness */
const HANDLE_CU = 0.705, HANDLE_HU = 0.125, HANDLE_HZ = 0.090;   /* the grab target */
const HANDLE_REACH = 2.5;       /* metres; past this it is not yours to turn */
let hoverDoor = null;           /* the door whose handle the pointer is on */

function doorHandle(d, dir, per, hp, mat){
  const hot = hoverDoor === d;
  const k = hot ? 15 : 14, kk = [k,k,k,k,k,k];
  /*  The lever lies back towards the hinge and falls a little as it goes -
      a bar straight across the door reads as a peg, and the droop is what
      says "press me down" at a glance. Its own basis, so the whole thing is
      one straight box rather than a stair of little ones. */
  const la = nrm3([-dir[0], -dir[1], -0.30]);
  const lw = nrm3(crs(la, per));
  for (const side of [1, -1]){
    const at = t => [hp[0] + dir[0]*HANDLE_U + per[0]*side*t,
                     hp[1] + dir[1]*HANDLE_U + per[1]*side*t, HANDLE_Z];
    /*  Each face is lit by the room it FACES, not by the room the leaf swings
        into: with the door shut those are different, and the side you are
        looking at would otherwise be lit by a lamp in the next room. */
    const rm = roomOfPoint(hp[0] + dir[0]*HANDLE_U + per[0]*side*0.30,
                           hp[1] + dir[1]*HANDLE_U + per[1]*side*0.30);
    /* the rose, a plate lying flat on the leaf */
    boxOriented(at(LEAF_T + 0.006), dir, per, [0,0,1], 0.036, 0.006, 0.062, mat, kk, rm, 2);
    /* the neck standing out of it */
    boxOriented(at(LEAF_T + 0.028), dir, per, [0,0,1], 0.024, 0.016, 0.024, mat, kk, rm, 2);
    /* the lever itself */
    const root = at(LEAF_T + 0.044);
    const L = 0.150;
    boxOriented([root[0] + la[0]*L/2, root[1] + la[1]*L/2, root[2] + la[2]*L/2],
                la, per, lw, L/2, 0.015, 0.017, mat, kk, rm, 2);
    /* and a thumb-stop at the free end, turned down */
    boxOriented([root[0] + la[0]*(L+0.012), root[1] + la[1]*(L+0.012), root[2] + la[2]*(L+0.012) - 0.014],
                dir, per, [0,0,1], 0.016, 0.015, 0.026, mat, kk, rm, 2);
  }
}

/*  A floor or a ceiling that is no longer a rectangle: a fan from the
    polygon's own centroid. A fan is only valid on a shape the centroid can
    see all of, and this one is - the deepest a fold can bite is 0.6 m into a
    room at least 3 m across, so the centroid is never behind an edge. The uv
    is world x,y exactly as rectH's mode 0 gave it, so the boards do not
    shift when a wall moves. */
function polyDeck(poly, z, want, mat, kind, room){
  let cx = 0, cy = 0;
  for (const p of poly){ cx += p[0]; cy += p[1]; }
  cx /= poly.length; cy /= poly.length;
  const n = nrm3(want), t = axisTan(n), bt = crs(n, t);
  const f = p => [dot3(p, t), dot3(p, bt)];
  for (let i = 0; i < poly.length; i++){
    const j = (i + 1) % poly.length;
    const A = [cx, cy, z];
    let B = [poly[i][0], poly[i][1], z], C = [poly[j][0], poly[j][1], z];
    if (dot3(crs(sub(B, A), sub(C, A)), want) < 0){ const sw = B; B = C; C = sw; }
    addV(A, n, t, f(A), mat, kind, room);
    addV(B, n, t, f(B), mat, kind, room);
    addV(C, n, t, f(C), mat, kind, room);
  }
}
/*  One edge of the plan, standing up to the ceiling. An edge still parallel
    to an axis takes the path it always did, doorways cut out of it and all -
    which is every edge of an unbroken room, and every edge of a broken one
    that is not a panel, since the two breakable walls are the two that carry
    no door. A panel gets a plain quad with its own basis: axisTan would hand
    a non-axis normal a tangent that is not perpendicular to it and the
    texture would come out sheared. */
function wallSeg(a, b, h, mat, room){
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L = Math.hypot(dx, dy);
  if (L < 1e-4) return;
  const inw = [-dy/L, dx/L, 0];              /* the polygon runs anticlockwise */
  if (Math.abs(dy) < 1e-6){
    const s0 = Math.min(a[0], b[0]), s1 = Math.max(a[0], b[0]);
    wallWithHoles("x", a[1], s0, s1, h, inw, holesOn("x", a[1], s0, s1), mat, room);
    return;
  }
  if (Math.abs(dx) < 1e-6){
    const s0 = Math.min(a[1], b[1]), s1 = Math.max(a[1], b[1]);
    wallWithHoles("y", a[0], s0, s1, h, inw, holesOn("y", a[0], s0, s1), mat, room);
    return;
  }
  quad([b[0],b[1],0], [a[0],a[1],0], [a[0],a[1],h], [b[0],b[1],h], mat, 0, room, 1);
}

function buildMesh(){
  M.pos.length = 0; M.nrm.length = 0; M.tan.length = 0; M.uv.length = 0; M.info.length = 0; M.n = 0;

  for (const r of ROOMS){
    const mat = matShade(r.i);
    /*  The floor and the ceiling have their own materials now, and the room
        is its plan polygon rather than its rectangle - one wall per EDGE, so
        a broken wall is simply two edges and nothing downstream knows. */
    const poly = roomPoly(r.i);
    polyDeck(poly, 0,   [0,0,1],  flrShade(r.i), 1, r.i);
    polyDeck(poly, r.h, [0,0,-1], celShade(r.i), 2, r.i);
    for (let e = 0; e < poly.length; e++)
      wallSeg(poly[e], poly[(e + 1) % poly.length], r.h, mat, r.i);
  }

  for (const d of DOORS){
    const m0 = matShade(d.rooms[0]);
    const rv = 0.075, arw = 0.11, aoff = 0.078;
    /* the reveal: jambs and head face the opening, so one set serves both rooms */
    if (d.axis === "x"){
      rectV("y", d.s0, d.wall-rv, d.wall+rv, 0, DOOR_H, [1,0,0],  m0, 3, d.rooms[0]);
      rectV("y", d.s1, d.wall-rv, d.wall+rv, 0, DOOR_H, [-1,0,0], m0, 3, d.rooms[0]);
      rectH(DOOR_H, d.s0, d.s1, d.wall-rv, d.wall+rv, [0,0,-1], m0, 3, d.rooms[0]);
      /* architrave on each face, facing into the room on that side */
      for (const side of [1,-1]){
        const room = side > 0 ? roomOfPoint((d.s0+d.s1)/2, d.wall+0.3) : roomOfPoint((d.s0+d.s1)/2, d.wall-0.3);
        const y = d.wall + side*aoff, want = [0,side,0];
        rectV("x", y, d.s0-arw, d.s0, 0, DOOR_H+arw, want, m0, 3, room);
        rectV("x", y, d.s1, d.s1+arw, 0, DOOR_H+arw, want, m0, 3, room);
        rectV("x", y, d.s0, d.s1, DOOR_H, DOOR_H+arw, want, m0, 3, room);
      }
    } else {
      rectV("x", d.s0, d.wall-rv, d.wall+rv, 0, DOOR_H, [0,1,0],  m0, 3, d.rooms[0]);
      rectV("x", d.s1, d.wall-rv, d.wall+rv, 0, DOOR_H, [0,-1,0], m0, 3, d.rooms[0]);
      rectH(DOOR_H, d.wall-rv, d.wall+rv, d.s0, d.s1, [0,0,-1], m0, 3, d.rooms[0]);
      for (const side of [1,-1]){
        const room = roomOfPoint(d.wall + side*0.3, (d.s0+d.s1)/2);
        const x = d.wall + side*aoff, want = [side,0,0];
        rectV("y", x, d.s0-arw, d.s0, 0, DOOR_H+arw, want, m0, 3, room);
        rectV("y", x, d.s1, d.s1+arw, 0, DOOR_H+arw, want, m0, 3, room);
        rectV("y", x, d.s0, d.s1, DOOR_H, DOOR_H+arw, want, m0, 3, room);
      }
    }
    /* the leaf, swung on its hinge */
    const ang = leafAngle(d), hp = hingePt(d);
    const dir = [Math.cos(ang), Math.sin(ang), 0];
    const per = [-dir[1], dir[0], 0];
    const cen = [hp[0] + dir[0]*DOOR_W/2, hp[1] + dir[1]*DOOR_W/2, 1.02];
    boxOriented(cen, dir, per, [0,0,1], DOOR_W/2, 0.022, 1.005, m0, [3,3,4,4,3,3], d.into, 2);
    doorHandle(d, dir, per, hp, m0);
  }

  /* lamps - one table, so the fitting you can see and the light it casts can
     never drift apart */
  pendant(LAMPS[0][0], LAMPS[0][1], ROOMS[0].h, matShade(0), 0);
  pendant(LAMPS[1][0], LAMPS[1][1], ROOMS[1].h, matShade(1), 1);
  pendant(LAMPS[2][0], LAMPS[2][1], ROOMS[2].h, matShade(2), 2);
  pendant(LAMPS[3][0], LAMPS[3][1], ROOMS[2].h, matShade(2), 2);

  /* the hall's high window, facing south into the room */
  const wx0 = 10.0, wx1 = 13.2, wz0 = 3.0, wz1 = 4.6, wy = 9.0;
  rectV("x", wy-0.03, wx0, wx1, wz0, wz1, [0,-1,0], matShade(2), 8, 2);
  rectV("x", wy-0.07, wx0-0.10, wx0, wz0-0.10, wz1+0.10, [0,-1,0], matShade(2), 3, 2);
  rectV("x", wy-0.07, wx1, wx1+0.10, wz0-0.10, wz1+0.10, [0,-1,0], matShade(2), 3, 2);
  rectV("x", wy-0.07, wx0, wx1, wz1, wz1+0.10, [0,-1,0], matShade(2), 3, 2);
  rectV("x", wy-0.07, wx0, wx1, wz0-0.10, wz0, [0,-1,0], matShade(2), 3, 2);
  for (let i=1;i<=2;i++){
    const mx = wx0 + (wx1-wx0)*i/3;
    rectV("x", wy-0.07, mx-0.035, mx+0.035, wz0, wz1, [0,-1,0], matShade(2), 3, 2);
  }

  /*  Opaque geometry ends here. Everything after this line is blended, drawn
      in a second pass with depth writes off, so a ghosted source cannot
      punch a hole through the room behind it. */
  buildSources(false);
  MESH_OPAQUE = M.n;
  buildSources(true);
  meshDirty = false;
}
let MESH_OPAQUE = 0;

/* the source models live in the next block */

/* ------------------------------------------------------------- matrices */
function matMul(a,b){
  const o = new Float32Array(16);
  for (let i=0;i<4;i++) for (let j=0;j<4;j++){
    let s = 0;
    for (let k=0;k<4;k++) s += a[i+4*k]*b[k+4*j];
    o[i+4*j] = s;
  }
  return o;
}
function perspective(fovy, asp, near, far){
  const t = 1/Math.tan(fovy/2);
  const o = new Float32Array(16);
  o[0]=t/asp; o[5]=t; o[10]=(far+near)/(near-far); o[11]=-1; o[14]=2*far*near/(near-far);
  return o;
}
function viewMat(eye, yawRad, pitchRad){
  const cp = Math.cos(pitchRad), sp = Math.sin(pitchRad);
  const f = [Math.cos(yawRad)*cp, Math.sin(yawRad)*cp, sp];
  const r = [Math.sin(yawRad), -Math.cos(yawRad), 0];
  const u = crs(r,f);
  const o = new Float32Array(16);
  o[0]=r[0]; o[4]=r[1]; o[8]=r[2];
  o[1]=u[0]; o[5]=u[1]; o[9]=u[2];
  o[2]=-f[0]; o[6]=-f[1]; o[10]=-f[2];
  o[12]=-dot3(r,eye); o[13]=-dot3(u,eye); o[14]=dot3(f,eye);
  o[15]=1;
  return o;
}

/* --------------------------------------------------------------- lights */
function buildLights(){
  const lamps = [
    { p:LAMPS[0].concat([ROOMS[0].h-0.55]), c:[1.00,0.70,0.36], i:2.1, room:0, sh:1 },
    { p:LAMPS[1].concat([ROOMS[1].h-0.55]), c:[1.00,0.64,0.32], i:1.5, room:1, sh:1 },
    { p:LAMPS[2].concat([ROOMS[2].h-0.55]), c:[1.00,0.72,0.40], i:3.6, room:2, sh:1 },
    { p:LAMPS[3].concat([ROOMS[2].h-0.55]), c:[1.00,0.68,0.36], i:3.6, room:2, sh:1 },
    { p:[11.6,8.7,3.8], c:[0.34,0.46,0.78], i:4.2, room:2, sh:0 }
  ];
  /*  Only a source that is actually fed casts the radiation cue. A ghosted
      one is a placement marker, not a thing making sound. */
  for (let n = 1; n <= 4; n++){
    if (!srcActive(n)) continue;
    const r = roomOfPoint(SXn(n), SYn(n));
    lamps.push({ p:[SXn(n), SYn(n), Math.min(Math.max(SZn(n),0.3), ROOMS[r].h-0.3)],
                 c:[1.00,0.52,0.22], i:0.30 + 2.2*glow, room:r, sh:0 });
  }
  const out = lamps.map(l => ({ p:l.p, c:mul3(l.c,l.i), room:l.room, pri:l.i, sh:l.sh }));
  for (const d of DOORS){
    const a = apert(d);
    if (a <= 0.02) continue;
    const dc = doorCentre(d), cp = [dc[0], dc[1], 1.05];
    for (const l of lamps){
      let other = -1;
      if (d.rooms[0] === l.room) other = d.rooms[1];
      else if (d.rooms[1] === l.room) other = d.rooms[0];
      if (other < 0) continue;
      const dd = Math.hypot(l.p[0]-cp[0], l.p[1]-cp[1], l.p[2]-cp[2]);
      const att = 1/(1 + 0.30*dd + 0.085*dd*dd);
      const k = a * att * 1.3;
      if (l.i * k < 0.05) continue;
      out.push({ p:cp, c:mul3(l.c, l.i*k), room:other, pri:l.i*k, sh:0 });
    }
  }
  out.sort((p,q)=>q.pri-p.pri);
  return out.slice(0,12);
}

/* ==================================================================== */
/*  the sources, drawn as objects rather than as markers                 */
/*                                                                       */
/*  Two models, both built from the same primitives as the room:         */
/*  LOUDSPEAKER is a two-way studio monitor - MDF cabinet with chamfered */
/*  baffle edges, a 6.5 inch woofer sunk into the baffle with a rubber   */
/*  surround and a dust cap, a 1 inch dome in a shallow waveguide, a     */
/*  front port, a badge, rubber feet, and a real back: recessed terminal */
/*  plate and a block of heatsink fins, so walking round it is worth it. */
/*  PURE is a 12 cm matte ball on a microphone stand.                    */
/* ==================================================================== */

/* a ring of quads standing in a plane, used for cone walls and recesses */
function ringBetween(c, au, av, aw, r0, d0, r1, d1, seg, mat, kind, room, flip){
  for (let i = 0; i < seg; i++){
    const a0 = i/seg*Math.PI*2, a1 = (i+1)/seg*Math.PI*2;
    const P = (ang, r, d) => add3(c, add3(mul3(av, Math.cos(ang)*r),
                                  add3(mul3(aw, Math.sin(ang)*r), mul3(au, d))));
    const p0 = P(a0, r0, d0), p1 = P(a1, r0, d0), p2 = P(a1, r1, d1), p3 = P(a0, r1, d1);
    if (flip) quad(p0, p1, p2, p3, mat, kind, room, 1);
    else quad(p0, p3, p2, p1, mat, kind, room, 1);
  }
}
/* a filled disc standing in a plane, facing +au */
function discFacing(c, au, av, aw, r, seg, mat, kind, room){
  const n = nrm3(au), t = nrm3(av), bt = crs(n, t);
  for (let i = 0; i < seg; i++){
    const a0 = i/seg*Math.PI*2, a1 = (i+1)/seg*Math.PI*2;
    const P = ang => add3(c, add3(mul3(av, Math.cos(ang)*r), mul3(aw, Math.sin(ang)*r)));
    const p1 = P(a0), p2 = P(a1);
    const f = p => { const q = sub(p, c); return [dot3(q,t), dot3(q,bt)]; };
    addV(c,n,t,[0,0],mat,kind,room); addV(p1,n,t,f(p1),mat,kind,room); addV(p2,n,t,f(p2),mat,kind,room);
  }
}
/* a shallow dome (half an ellipsoid) rising out of a plane along +au */
function dome(c, au, av, aw, r, hgtD, seg, rings, mat, kind, room){
  for (let j = 0; j < rings; j++){
    const t0 = j/rings*Math.PI/2, t1 = (j+1)/rings*Math.PI/2;
    for (let i = 0; i < seg; i++){
      const p0 = i/seg*Math.PI*2, p1 = (i+1)/seg*Math.PI*2;
      const S = (t,p) => add3(c, add3(mul3(av, Math.cos(t)*Math.cos(p)*r),
                              add3(mul3(aw, Math.cos(t)*Math.sin(p)*r), mul3(au, Math.sin(t)*hgtD))));
      quad(S(t0,p0), S(t0,p1), S(t1,p1), S(t1,p0), mat, kind, room, 1);
    }
  }
}

function buildMonitor(sx, sy, zc, yaw, room, mat){
  const fwd = [Math.cos(yaw), Math.sin(yaw), 0];
  const rgt = [Math.sin(yaw), -Math.cos(yaw), 0];
  const up  = [0,0,1];
  const HU = 0.145, HV = 0.115, HW = 0.185;        /* half depth, width, height */
  const C  = [sx, sy, zc];
  const P = (u,v,w) => [ C[0] + fwd[0]*u + rgt[0]*v, C[1] + fwd[1]*u + rgt[1]*v, C[2] + w ];
  const CH = 0.020;                                 /* baffle chamfer */

  /* ---- cabinet: five plain faces, the front left for the baffle ------- */
  const K = 20;
  quad(P(-HU,HV,-HW), P(-HU,-HV,-HW), P(-HU,-HV,HW), P(-HU,HV,HW), mat, K, room, 2);   /* back  */
  quad(P(HU-CH,HV,-HW), P(-HU,HV,-HW), P(-HU,HV,HW), P(HU-CH,HV,HW), mat, K, room, 2); /* left  */
  quad(P(-HU,-HV,-HW), P(HU-CH,-HV,-HW), P(HU-CH,-HV,HW), P(-HU,-HV,HW), mat, K, room, 2);
  quad(P(-HU,-HV,HW), P(HU-CH,-HV,HW), P(HU-CH,HV,HW), P(-HU,HV,HW), mat, K, room, 2); /* top   */
  quad(P(-HU,HV,-HW), P(HU-CH,HV,-HW), P(HU-CH,-HV,-HW), P(-HU,-HV,-HW), mat, K, room, 2);

  /* ---- the baffle, inset, with four chamfer strips round it ----------- */
  const BV = HV - CH, BW = HW - CH;
  quad(P(HU,-BV,-BW), P(HU,BV,-BW), P(HU,BV,BW), P(HU,-BV,BW), mat, 20, room, 2);
  quad(P(HU-CH,HV,-HW), P(HU,BV,-BW), P(HU,BV,BW), P(HU-CH,HV,HW), mat, 20, room, 1);
  quad(P(HU,-BV,-BW), P(HU-CH,-HV,-HW), P(HU-CH,-HV,HW), P(HU,-BV,BW), mat, 20, room, 1);
  quad(P(HU,-BV,BW), P(HU,BV,BW), P(HU-CH,HV,HW), P(HU-CH,-HV,HW), mat, 20, room, 1);
  quad(P(HU-CH,-HV,-HW), P(HU,-BV,-BW), P(HU,BV,-BW), P(HU-CH,HV,-HW), mat, 20, room, 1);

  /* ---- the 6.5 inch woofer, sunk into the baffle ---------------------- */
  const WC = P(HU, 0, -0.050), RW = 0.083;
  ringBetween(WC, fwd, rgt, up, RW, 0.001, RW*0.90, -0.012, 24, mat, 22, room, false); /* surround */
  ringBetween(WC, fwd, rgt, up, RW*0.90, -0.012, RW*0.80, 0.004, 24, mat, 22, room, true);
  ringBetween(WC, fwd, rgt, up, RW*0.80, 0.004, 0.022, -0.048, 24, mat, 21, room, true); /* cone */
  dome(WC, fwd, rgt, up, 0.024, 0.014, 20, 4, mat, 23, room);                            /* dust cap */
  ringBetween(WC, fwd, rgt, up, RW+0.009, 0.002, RW, 0.001, 24, mat, 20, room, false);   /* trim ring */

  /* ---- the 1 inch dome tweeter in its waveguide ----------------------- */
  const TC = P(HU, 0, 0.108);
  ringBetween(TC, fwd, rgt, up, 0.044, 0.001, 0.019, -0.017, 20, mat, 24, room, true);
  dome(TC, fwd, rgt, up, 0.0155, 0.009, 18, 3, mat, 23, room);

  /* ---- the front bass port -------------------------------------------- */
  const PC = P(HU, 0, -0.146);
  ringBetween(PC, fwd, rgt, up, 0.024, 0.0, 0.024, -0.055, 14, mat, 25, room, true);
  discFacing(add3(PC, mul3(fwd, -0.055)), fwd, rgt, up, 0.024, 14, mat, 25, room);

  /* ---- a badge ---------------------------------------------------------*/
  const BC = P(HU + 0.0015, 0, 0.160);
  quad(add3(BC, add3(mul3(rgt,-0.030), [0,0,-0.006])),
       add3(BC, add3(mul3(rgt, 0.030), [0,0,-0.006])),
       add3(BC, add3(mul3(rgt, 0.030), [0,0, 0.006])),
       add3(BC, add3(mul3(rgt,-0.030), [0,0, 0.006])), mat, 26, room, 2);

  /* ---- the back: a recessed terminal plate and a heatsink ------------- */
  const back = -HU - 0.0015;
  const TP = P(back, 0, -0.085);
  quad(add3(TP, add3(mul3(rgt, 0.055), [0,0,-0.048])),
       add3(TP, add3(mul3(rgt,-0.055), [0,0,-0.048])),
       add3(TP, add3(mul3(rgt,-0.055), [0,0, 0.048])),
       add3(TP, add3(mul3(rgt, 0.055), [0,0, 0.048])), mat, 27, room, 2);
  for (const dv of [-0.026, 0.026])
    ringBetween(add3(TP, mul3(rgt, dv)), mul3(fwd,-1), rgt, up, 0.011, 0.002, 0.011, -0.010, 10, mat, 23, room, true);
  for (let i = 0; i < 6; i++){
    const w0 = 0.020 + i*0.0205;
    const F = P(back, 0, w0);
    quad(add3(F, add3(mul3(rgt,-0.058), [0,0,-0.0045])),
         add3(F, add3(mul3(rgt, 0.058), [0,0,-0.0045])),
         add3(F, add3(mul3(rgt, 0.058), [0,0, 0.0045])),
         add3(F, add3(mul3(rgt,-0.058), [0,0, 0.0045])), mat, 28, room, 2);
    quad(add3(F, add3(mul3(rgt,-0.058), [0,0, 0.0045])),
         add3(F, add3(mul3(rgt, 0.058), [0,0, 0.0045])),
         add3(add3(F, mul3(fwd, 0.012)), add3(mul3(rgt, 0.058), [0,0, 0.0045])),
         add3(add3(F, mul3(fwd, 0.012)), add3(mul3(rgt,-0.058), [0,0, 0.0045])), mat, 28, room, 1);
  }

  /* ---- rubber feet ------------------------------------------------------*/
  for (const du of [-0.09, 0.09]) for (const dv of [-0.075, 0.075]){
    const F = P(du, dv, -HW - 0.011);
    coneRing(F[0], F[1], F[2]+0.011, F[2], 0.016, 0.018, 8, mat, 29, room);
    disc(F[0], F[1], F[2], 0.018, 8, true, mat, 29, room);
  }
}

function buildPureSource(sx, sy, zc, yaw, dir, room, mat){
  const R = 0.06;                                   /* a 12 cm ball */
  sphere(sx, sy, zc, R, 18, 12, mat, 31, room);
  /*  the stand: a weighted base, a telescopic tube in two diameters and a
      little boom clip under the ball */
  const base = 0.010;
  disc(sx, sy, base, 0.135, 18, false, mat, 30, room);
  coneRing(sx, sy, base, 0.002, 0.135, 0.150, 18, mat, 30, room);
  const clip = zc - R - 0.030;
  const mid = Math.max(base + 0.05, clip * 0.55);
  coneRing(sx, sy, mid, base, 0.0135, 0.0175, 10, mat, 30, room);
  if (clip > mid) coneRing(sx, sy, clip, mid, 0.0095, 0.0135, 10, mat, 30, room);
  coneRing(sx, sy, clip + 0.012, clip - 0.004, 0.021, 0.021, 10, mat, 30, room);
  coneRing(sx, sy, zc - R + 0.012, clip + 0.010, 0.0075, 0.0075, 8, mat, 30, room);
  /*  the cardioid, when there is one: a blade standing off the nose of the
      ball. A decal painted on a sphere cannot be read from the side, and the
      direction is the whole point of the control. */
  if (dir > 0.02){
    const fwd = [Math.cos(yaw), Math.sin(yaw), 0];
    const rgt = [Math.sin(yaw), -Math.cos(yaw), 0];
    const L = 0.055 + 0.075 * dir;
    const A = [sx + fwd[0]*(R+0.004), sy + fwd[1]*(R+0.004), zc];
    const B = [A[0] + fwd[0]*L, A[1] + fwd[1]*L, zc];
    const wide = 0.018 + 0.020*dir;
    for (const s of [1,-1]){
      const n = [0,0,s];
      const p0 = [A[0]+rgt[0]*wide, A[1]+rgt[1]*wide, zc];
      const p1 = [A[0]-rgt[0]*wide, A[1]-rgt[1]*wide, zc];
      addV(B,n,fwd,[0,0],mat,26,room);
      if (s > 0){ addV(p0,n,fwd,[wide,0],mat,26,room); addV(p1,n,fwd,[-wide,0],mat,26,room); }
      else { addV(p1,n,fwd,[-wide,0],mat,26,room); addV(p0,n,fwd,[wide,0],mat,26,room); }
    }
  }
}

/*  A thin ring on the floor under whichever source the SOURCE panel is
    editing - the one piece of chrome in the 3D view, and the only way to see
    at a glance which of four the knobs belong to. */
function buildSelectRing(sx, sy, room){
  const r = 0.30, w = 0.028, z = 0.004;
  for (let i = 0; i < 28; i++){
    const a0 = i/28*Math.PI*2, a1 = (i+1)/28*Math.PI*2;
    const P = (a, rr) => [sx + Math.cos(a)*rr, sy + Math.sin(a)*rr, z];
    quad(P(a0, r-w), P(a1, r-w), P(a1, r+w), P(a0, r+w), 0, 32, room, 1);
  }
}

function buildSources(ghostPass){
  for (let n = 1; n <= 4; n++){
    const on = srcActive(n);
    if (ghostPass === on) continue;             /* one pass each, never both */
    const sx = SXn(n), sy = SYn(n);
    const room = roomOfPoint(sx, sy), mat = matShade(room);
    const yaw = SYAWn(n) * Math.PI / 180;
    curAlpha = on ? 1 : 0.34;
    if (srcTypeIdx(n) === 1){
      const zc = Math.min(Math.max(SZn(n), 0.20), ROOMS[room].h - 0.24);
      buildMonitor(sx, sy, zc, yaw, room, mat);
      /*  If it is off the floor it is standing on something - a slim pillar
          stand, not a plinth the width of the cabinet. */
      const foot = zc - 0.185;
      if (foot > 0.10){
        coneRing(sx, sy, foot, 0.030, 0.036, 0.050, 12, mat, 30, room);
        disc(sx, sy, 0.030, 0.150, 16, false, mat, 30, room);
        coneRing(sx, sy, 0.030, 0.006, 0.150, 0.165, 16, mat, 30, room);
      }
    } else {
      const zc = Math.min(Math.max(SZn(n), 0.22), ROOMS[room].h - 0.16);
      buildPureSource(sx, sy, zc, yaw, srcDir(n), room, mat);
    }
    if (n - 1 === selSrc && ghostPass === false) { /* drawn opaque, always visible */ }
    curAlpha = 1;
  }
  /*  The ring goes in the blended pass so it reads over the floor without
      fighting it for depth. */
  if (ghostPass){
    const n = selSrc + 1;
    curAlpha = 0.85;
    buildSelectRing(SXn(n), SYn(n), roomOfPoint(SXn(n), SYn(n)));
    curAlpha = 1;
  }
}

/* a ceiling rose and a warm bloom disc under each pendant */
function ceilingRose(x, y, zc, mat, room){
  disc(x, y, zc - 0.004, 0.19, 16, true, mat, 3, room);
  coneRing(x, y, zc - 0.004, zc - 0.030, 0.19, 0.12, 16, mat, 3, room);
  coneRing(x, y, zc - 0.030, zc - 0.036, 0.12, 0.055, 16, mat, 3, room);
}

/* ------------------------------------------------------------- GL setup */
function compile(g, type, src){
  const s = g.createShader(type);
  g.shaderSource(s, src); g.compileShader(s);
  if (!g.getShaderParameter(s, g.COMPILE_STATUS)){
    window.__err.push("shader: " + g.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function initGL(){
  try {
    gl = povCv.getContext("webgl2", {
      antialias:true, depth:true, alpha:false,
      /*  so a probe (and a screenshot) can read the picture back after the
          frame is done - without it a read returns black whatever was drawn */
      preserveDrawingBuffer:true,
      powerPreference:"high-performance"
    });
  } catch(e){ gl = null; }
  if (!gl){ glMode = "fallback"; return false; }
  const vs = compile(gl, gl.VERTEX_SHADER, VS);
  const fs = compile(gl, gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs){ gl = null; glMode = "fallback"; return false; }
  prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, "aPos"); gl.bindAttribLocation(prog, 1, "aNrm");
  gl.bindAttribLocation(prog, 2, "aTan"); gl.bindAttribLocation(prog, 3, "aUV");
  gl.bindAttribLocation(prog, 4, "aInfo");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    window.__err.push("link: " + gl.getProgramInfoLog(prog));
    gl = null; glMode = "fallback"; return false;
  }
  gl.useProgram(prog);
  const names = ["uMVP","uCam","uLightN","uLightPos","uLightCol","uLightRoom","uLightShade",
                 "uRoomMin","uRoomMax","uAmb","uFog","uFogK","uGlow","uRes"];
  for (const n of names) U[n] = gl.getUniformLocation(prog, n);
  vao = gl.createVertexArray();
  vbo = gl.createBuffer();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  const STR = 15*4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, STR, 0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, STR, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, STR, 24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 2, gl.FLOAT, false, STR, 36);
  gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.FLOAT, false, STR, 44);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.frontFace(gl.CCW);
  gl.clearColor(FOG[0], FOG[1], FOG[2], 1);
  glMode = "webgl2";
  /*  uRoomMin / uRoomMax are uploaded per FRAME, in drawPov - a wall pushed
      out of the room puts geometry outside the rectangle, and the corner
      darkening measures its distance from that box: left at the rectangle
      the pushed panel would shade to black at exactly the point that was
      moved. */
  return true;
}
let vertsUploaded = 0;
function uploadMesh(){
  const n = M.n;
  const buf = new Float32Array(n*15);
  for (let i=0;i<n;i++){
    const o = i*15;
    buf[o]   = M.pos[i*3];   buf[o+1] = M.pos[i*3+1]; buf[o+2] = M.pos[i*3+2];
    buf[o+3] = M.nrm[i*3];   buf[o+4] = M.nrm[i*3+1]; buf[o+5] = M.nrm[i*3+2];
    buf[o+6] = M.tan[i*3];   buf[o+7] = M.tan[i*3+1]; buf[o+8] = M.tan[i*3+2];
    buf[o+9] = M.uv[i*2];    buf[o+10]= M.uv[i*2+1];
    buf[o+11]= M.info[i*4];  buf[o+12]= M.info[i*4+1];
    buf[o+13]= M.info[i*4+2]; buf[o+14]= M.info[i*4+3];
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, buf, gl.DYNAMIC_DRAW);
  vertsUploaded = n;
}

function sizeCanvas(cv){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(2, Math.round(cv.clientWidth * dpr));
  const h = Math.max(2, Math.round(cv.clientHeight * dpr));
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; return true; }
  return false;
}

function drawPov(){
  drawCount++;
  sizeCanvas(povCv);
  if (glMode === "pending") initGL();
  if (!gl){ drawPovFallback(); return; }
  if (meshDirty || vertsUploaded === 0){ buildMesh(); uploadMesh(); }
  const w = povCv.width, h = povCv.height;
  gl.viewport(0,0,w,h);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);
  gl.bindVertexArray(vao);

  const eye = [LX(), LY(), EAR_Z];
  const P = perspective(fovDeg*Math.PI/180, w/h, 0.04, 90);
  const Vm = viewMat(eye, LYAW()*Math.PI/180, pitchDeg*Math.PI/180);
  gl.uniformMatrix4fv(U.uMVP, false, matMul(P, Vm));
  gl.uniform3f(U.uCam, eye[0], eye[1], eye[2]);
  gl.uniform3f(U.uFog, FOG[0], FOG[1], FOG[2]);
  gl.uniform1f(U.uFogK, 0.042);
  gl.uniform1f(U.uGlow, glow);
  gl.uniform2f(U.uRes, w, h);

  /*  The box each room's corner darkening is measured against: the plan
      polygon's own bounds, so a wall pushed OUT is still inside its room. */
  const rmn = new Float32Array(9), rmx = new Float32Array(9);
  ROOMS.forEach((r, i) => {
    const poly = roomPoly(i);
    let x0 = r.x0, x1 = r.x1, y0 = r.y0, y1 = r.y1;
    for (const q of poly){
      x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]);
      y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
    }
    rmn[i*3] = x0; rmn[i*3+1] = y0; rmn[i*3+2] = 0;
    rmx[i*3] = x1; rmx[i*3+1] = y1; rmx[i*3+2] = r.h;
  });
  gl.uniform3fv(U.uRoomMin, rmn);
  gl.uniform3fv(U.uRoomMax, rmx);

  const amb = new Float32Array(9);
  for (let i=0;i<3;i++){
    const k = matLook(i).amb * 0.042;
    amb[i*3] = k*1.06; amb[i*3+1] = k*0.94; amb[i*3+2] = k*0.88;
  }
  amb[6] *= 1.15; amb[7] *= 1.15; amb[8] *= 1.35;    /* the hall's window keeps it cooler */
  gl.uniform3fv(U.uAmb, amb);

  const L = buildLights();
  const lp = new Float32Array(36), lc = new Float32Array(36), lr = new Float32Array(12), ls = new Float32Array(12);
  for (let i=0;i<L.length;i++){
    lp[i*3]=L[i].p[0]; lp[i*3+1]=L[i].p[1]; lp[i*3+2]=L[i].p[2];
    lc[i*3]=L[i].c[0]; lc[i*3+1]=L[i].c[1]; lc[i*3+2]=L[i].c[2];
    lr[i]=L[i].room; ls[i]=L[i].sh ? 1 : 0;
  }
  gl.uniform3fv(U.uLightPos, lp);
  gl.uniform3fv(U.uLightCol, lc);
  gl.uniform1fv(U.uLightRoom, lr);
  gl.uniform1fv(U.uLightShade, ls);
  gl.uniform1i(U.uLightN, L.length);

  /*  Opaque first with depth writes on, then the ghosted sources and the
      selection ring blended with depth writes OFF - otherwise a translucent
      cabinet punches a hole in the wall behind it. */
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.drawArrays(gl.TRIANGLES, 0, Math.min(MESH_OPAQUE, vertsUploaded));
  if (vertsUploaded > MESH_OPAQUE){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.drawArrays(gl.TRIANGLES, MESH_OPAQUE, vertsUploaded - MESH_OPAQUE);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
}

/*  If WebGL2 cannot be had (some headless configurations), the view still has
    to say something true rather than sit blank. A flat plan-projection of the
    room you are standing in, drawn on a 2D context. */
function drawPovFallback(){
  const c = povCv.getContext("2d");
  if (!c) return;
  const w = povCv.width, h = povCv.height;
  const g = c.createLinearGradient(0,0,0,h);
  g.addColorStop(0, "#241b15"); g.addColorStop(0.55, "#140f0c"); g.addColorStop(1, "#0a0807");
  c.fillStyle = g; c.fillRect(0,0,w,h);
  const rm = ROOMS[roomOfPoint(LX(), LY())];
  const s = Math.min(w/(rm.x1-rm.x0+2), h/(rm.y1-rm.y0+2));
  const ox = w/2 - ((rm.x0+rm.x1)/2)*s, oy = h/2 + ((rm.y0+rm.y1)/2)*s;
  c.save();
  c.strokeStyle = "#7a5c33"; c.lineWidth = Math.max(2, s*0.06);
  c.strokeRect(ox+rm.x0*s, oy-rm.y1*s, (rm.x1-rm.x0)*s, (rm.y1-rm.y0)*s);
  c.fillStyle = "rgba(160,110,50,.10)";
  c.fillRect(ox+rm.x0*s, oy-rm.y1*s, (rm.x1-rm.x0)*s, (rm.y1-rm.y0)*s);
  for (const d of DOORS){
    const o = opening(d);
    c.strokeStyle = "#e0b06a"; c.lineWidth = Math.max(3, s*0.09);
    c.beginPath();
    if (d.axis === "x"){ c.moveTo(ox+o[0]*s, oy-d.wall*s); c.lineTo(ox+o[1]*s, oy-d.wall*s); }
    else { c.moveTo(ox+d.wall*s, oy-o[0]*s); c.lineTo(ox+d.wall*s, oy-o[1]*s); }
    c.stroke();
  }
  for (let n = 1; n <= NSRC; n++){
    c.fillStyle = srcActive(n) ? "#ff9a3c" : "rgba(255,154,60,.35)";
    c.beginPath(); c.arc(ox+SXn(n)*s, oy-SYn(n)*s, Math.max(5,s*0.18), 0, 7); c.fill();
  }
  c.fillStyle = "#f6e3bd";
  c.beginPath(); c.arc(ox+LX()*s, oy-LY()*s, Math.max(5,s*0.16), 0, 7); c.fill();
  c.restore();
  const fs = Math.max(11, Math.round(h*0.028));
  c.fillStyle = "#c8a878"; c.font = "600 " + fs + "px Consolas, monospace";
  c.textAlign = "center";
  c.fillText("3D VIEW UNAVAILABLE - NO WEBGL2 CONTEXT", w/2, fs*2.0);
  c.fillStyle = "#8d7a63"; c.font = (fs*0.8) + "px Consolas, monospace";
  c.fillText("showing a flat sketch of " + ROOMS[roomOfPoint(LX(),LY())].name + " instead", w/2, fs*3.3);
}

/* ==================================================================== */
/*  the plan - an architect's drawing on paper                           */
/* ==================================================================== */
const PAPER = [239, 231, 214];
/*  Strip reserved at the foot of the plan for the key. Fixed at 64 px it eats
    a quarter of a short panel, so it shrinks with the canvas. */
function planLeg(h){ return Math.min(64, Math.max(30, h * 0.15)); }
/*  A path now carries the source it belongs to, so HUE says which source and
    the line STYLE says which kind - the two questions are independent and a
    single colour axis cannot answer both. */
const SRC_HUE = [[200,70,30], [38,104,168], [34,132,86], [136,74,164]];
const SRC_CSS = SRC_HUE.map(c => "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")");
function rayStyle(t){
  if (t === "direct") return { w:0.058, dash:null, lift:0.00 };
  if (t === "r1")     return { w:0.034, dash:null, lift:0.22 };
  if (t === "r2")     return { w:0.026, dash:null, lift:0.40 };
  if (t === "portal") return { w:0.040, dash:[7,3], lift:0.10 };
  return { w:0.028, dash:[4,4], lift:0.34 };        /* leaf and wall */
}
function srcRgba(s, a, lift){
  const c = SRC_HUE[s & 3];
  const f = x => Math.round(x + (238 - x) * (lift || 0));
  return "rgba(" + f(c[0]) + "," + f(c[1]) + "," + f(c[2]) + "," + a + ")";
}

function planFit(){
  const w = planCv.clientWidth || 1, h = planCv.clientHeight || 1;
  const m = 14, leg = planLeg(h);
  const s = Math.max(4, Math.min((w - 2*m) / APT_W, (h - 2*m - leg) / APT_H));
  const ox = (w - APT_W*s) / 2;
  /* the drawing and its key are centred as ONE block, so the key sits under
     the plan rather than adrift at the bottom of the sheet */
  const oy = m + Math.max(0, (h - 2*m - (APT_H*s + leg)) / 2);
  return { s:s, ox:ox, oy:oy, w:w, h:h, leg:leg };
}
let PF = null;
const PX = x => PF.ox + x * PF.s;
const PY = y => PF.oy + (APT_H - y) * PF.s;
function planToWorld(cx, cy){
  const r = planCv.getBoundingClientRect();
  const x = (cx - r.left - PF.ox) / PF.s;
  const y = APT_H - (cy - r.top - PF.oy) / PF.s;
  return [x, y];
}

/*  What the plan actually WROTE on the paper this time round - pushed where
    the text is drawn, not where it is decided, so a note that is in here is a
    note that reached the sheet. */
let planNotes = [];
function drawPlan(){
  drawCount++;
  planNotes = [];
  sizeCanvas(planCv);
  const c = planCv.getContext("2d");
  if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  PF = planFit();
  const W = PF.w, H = PF.h, s = PF.s;

  /* paper */
  c.fillStyle = "rgb(" + PAPER[0] + "," + PAPER[1] + "," + PAPER[2] + ")";
  c.fillRect(0, 0, W, H);
  const vg = c.createRadialGradient(W*0.5, H*0.42, Math.min(W,H)*0.2, W*0.5, H*0.5, Math.max(W,H)*0.78);
  vg.addColorStop(0, "rgba(255,252,244,.55)");
  vg.addColorStop(1, "rgba(150,132,102,.20)");
  c.fillStyle = vg; c.fillRect(0, 0, W, H);

  /* grid, half metre faint, whole metre stronger */
  c.lineWidth = 1;
  for (let i = 0; i <= APT_W*2; i++){
    const x = PX(i/2);
    c.strokeStyle = (i % 2) ? "rgba(90,86,74,.075)" : "rgba(90,86,74,.15)";
    c.beginPath(); c.moveTo(x, PY(APT_H)); c.lineTo(x, PY(0)); c.stroke();
  }
  for (let i = 0; i <= APT_H*2; i++){
    const y = PY(i/2);
    c.strokeStyle = (i % 2) ? "rgba(90,86,74,.075)" : "rgba(90,86,74,.15)";
    c.beginPath(); c.moveTo(PX(0), y); c.lineTo(PX(APT_W), y); c.stroke();
  }

  /*  Room washes, tinted by the WALL material - four walls against one floor
      and one ceiling, so the walls are what the room is. Each is its own plan
      polygon, so a broken wall really does change the shape on the paper. */
  for (const r of ROOMS){
    c.fillStyle = matLook(r.i).wash;
    polyPath(c, roomPoly(r.i));
    c.fill();
  }
  /* the solid block is not part of the apartment - hatch it */
  c.save();
  c.beginPath(); c.rect(PX(0), PY(8.5), 3*s, 3.5*s); c.clip();
  c.strokeStyle = "rgba(70,66,58,.20)"; c.lineWidth = 1;
  for (let i = -4; i < 12; i++){
    c.beginPath(); c.moveTo(PX(i*0.5), PY(8.5)); c.lineTo(PX(i*0.5 + 3.5), PY(5)); c.stroke();
  }
  c.restore();

  /* walls: every segment the 3D view builds, minus the doorways */
  c.strokeStyle = "#1f1e1b";
  c.lineWidth = Math.max(1.6, s*0.115);
  c.lineCap = "butt";
  /*  One stroke per polygon edge. An edge still on a wall plane keeps the
      doorway-cutting path; a panel is a plain line. The two panels either
      side of a CONCAVE break are drawn in the warning colour, because a wall
      bent into the room focuses rather than scatters. */
  for (const r of ROOMS){
    const poly = roomPoly(r.i);
    const bent = concaveEdges(r.i, poly);
    for (let e = 0; e < poly.length; e++){
      c.strokeStyle = bent[e] ? WARN_INK : "#1f1e1b";
      planSeg(c, poly[e], poly[(e + 1) % poly.length]);
    }
    c.strokeStyle = "#1f1e1b";
  }

  /* doors: the architect's quarter circle plus the leaf where it is */
  for (const d of DOORS){
    const hp = hingePt(d), ang = leafAngle(d);
    const a0 = d.closedAng * Math.PI/180, a1 = ang;
    c.strokeStyle = "rgba(40,38,34,.32)"; c.lineWidth = 1;
    c.setLineDash([3,3]);
    c.beginPath();
    c.arc(PX(hp[0]), PY(hp[1]), DOOR_W*s, -Math.max(a0,a1), -Math.min(a0,a1));
    c.stroke();
    c.setLineDash([]);
    /* the opening itself, drawn as a gap in the wall with a light sill */
    const o = opening(d);
    c.strokeStyle = "rgba(120,150,120,.55)"; c.lineWidth = Math.max(1.4, s*0.07);
    c.beginPath();
    if (d.axis === "x"){ c.moveTo(PX(o[0]), PY(d.wall)); c.lineTo(PX(o[1]), PY(d.wall)); }
    else { c.moveTo(PX(d.wall), PY(o[0])); c.lineTo(PX(d.wall), PY(o[1])); }
    c.stroke();
    /* the leaf */
    const tip = [hp[0] + Math.cos(ang)*DOOR_W, hp[1] + Math.sin(ang)*DOOR_W];
    c.strokeStyle = "#5a4224"; c.lineWidth = Math.max(2, s*0.075);
    c.lineCap = "round";
    c.beginPath(); c.moveTo(PX(hp[0]), PY(hp[1])); c.lineTo(PX(tip[0]), PY(tip[1])); c.stroke();
    c.fillStyle = "#5a4224";
    c.beginPath(); c.arc(PX(hp[0]), PY(hp[1]), Math.max(2, s*0.055), 0, 7); c.fill();
    c.lineCap = "butt";
    /* percentage, small, beside the hinge */
    c.fillStyle = "rgba(60,56,48,.72)";
    c.font = Math.max(8, Math.round(s*0.30)) + "px Consolas, monospace";
    c.textAlign = "center"; c.textBaseline = "middle";
    const lc = doorCentre(d);
    const off = d.axis === "x" ? [0, -0.42] : [-0.46, 0];
    c.fillText(Math.round(apert(d)*100) + "%", PX(lc[0]+off[0]), PY(lc[1]+off[1]));
  }

  drawFoldHandles(c);

  /*  Room names go in the TOP-LEFT corner of each room, the way an architect
      writes them - the centre is where the head and the speaker live, and a
      label under a draggable glyph is a label nobody can read. */
  for (const r of ROOMS){
    const x = PX(r.x0) + s*0.28, y = PY(r.y1) + s*0.34;
    let ln = 0;
    const line = (txt, col, font) => {
      c.fillStyle = col; c.font = font;
      c.fillText(txt, x, y + ln*Math.max(9, s*0.36));
      ln++;
    };
    c.textAlign = "left"; c.textBaseline = "top";
    line(r.name, "rgba(38,36,32,.88)", "600 " + Math.max(9, Math.round(s*0.40)) + "px 'Segoe UI', system-ui, sans-serif");
    /*  Below about 24 px to the metre the five lines are taller than the room
        they name and start colliding with the glyphs; the name and the tail
        are the two worth keeping. */
    if (s >= 24){
      line(r.sub, "rgba(70,66,58,.62)", Math.max(8, Math.round(s*0.27)) + "px 'Segoe UI', system-ui, sans-serif");
      /*  A broken room is no longer W x D, so it states the area its polygon
          actually has - which is the thing a pushed-out wall changes, and the
          only honest way to say "the room got bigger". */
      const poly = roomPoly(r.i);
      const dims = poly.length > 4
        ? (polyArea(poly).toFixed(1) + " m2  h " + r.h.toFixed(1))
        : ((r.x1-r.x0).toFixed(1) + " x " + (r.y1-r.y0).toFixed(1) + " m  h " + r.h.toFixed(1));
      line(dims, "rgba(70,66,58,.74)", Math.max(8, Math.round(s*0.26)) + "px Consolas, monospace");
      /*  The surfaces, and only the ones that are saying something of their
          own - AS WALLS is the default and a line repeating it three times is
          a line nobody reads. */
      let surf = matName(r.i);
      if (choiceIdx("flr" + (r.i+1)) > 0) surf += "  flr " + flrName(r.i);
      if (choiceIdx("cel" + (r.i+1)) > 0) surf += "  cel " + celName(r.i);
      line(surf, "rgba(60,56,48,.60)", Math.max(8, Math.round(s*0.26)) + "px Consolas, monospace");
    }
    if (scene && scene.rt && scene.rt[r.i]){
      const t = scene.rt[r.i];
      line("RT60 " + (t[1] !== undefined ? t[1].toFixed(2) : "--") + " s",
           "rgba(168,58,26,.90)", "600 " + Math.max(8, Math.round(s*0.26)) + "px Consolas, monospace");
    }
  }

  if (showRays) drawRays(c);
  drawSources(c);
  drawListener(c);
  drawLegend(c, W, H);
}

const WARN_INK = "#a8381a";
function polyPath(c, poly){
  c.beginPath();
  c.moveTo(PX(poly[0][0]), PY(poly[0][1]));
  for (let i = 1; i < poly.length; i++) c.lineTo(PX(poly[i][0]), PY(poly[i][1]));
  c.closePath();
}
/*  One edge of a room. If it still lies on a wall plane it goes through
    planWall, which cuts the doorways out of it; otherwise it is a panel of a
    broken wall and there is nothing to cut. */
function planSeg(c, a, b){
  if (Math.abs(a[1] - b[1]) < 1e-6){ planWall(c, "x", a[1], Math.min(a[0],b[0]), Math.max(a[0],b[0])); return; }
  if (Math.abs(a[0] - b[0]) < 1e-6){ planWall(c, "y", a[0], Math.min(a[1],b[1]), Math.max(a[1],b[1])); return; }
  c.beginPath(); c.moveTo(PX(a[0]), PY(a[1])); c.lineTo(PX(b[0]), PY(b[1])); c.stroke();
}
/*  The split point of every breakable wall, drawn as something to take hold
    of: a diamond sitting on the wall, with a dashed leader back to the flat
    wall it came off so the push reads as a distance. Concave ones wear the
    warning colour and say what they are. */
function drawFoldHandles(c){
  const s = PF.s;
  for (let i = 0; i < ROOMS.length; i++){
    for (let k = 0; k < 2; k++){
      const p = foldPoint(i, k), conc = foldConcave(i, k), flat = foldFlat(i, k);
      const x = PX(p[0]), y = PY(p[1]);
      const rr = Math.max(3.4, s * 0.12);
      if (!flat){
        const b = foldBase(i, k);
        c.strokeStyle = conc ? "rgba(168,56,26,.55)" : "rgba(44,74,120,.45)";
        c.lineWidth = 1; c.setLineDash([2,3]);
        c.beginPath(); c.moveTo(PX(b[0]), PY(b[1])); c.lineTo(x, y); c.stroke();
        c.setLineDash([]);
      }
      c.fillStyle = conc ? "rgba(214,110,70,.92)" : "rgba(246,238,222,.94)";
      c.strokeStyle = conc ? WARN_INK : "#2c4a78";
      c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(x, y - rr); c.lineTo(x + rr, y); c.lineTo(x, y + rr); c.lineTo(x - rr, y);
      c.closePath(); c.fill(); c.stroke();
      if (conc){
        const g = foldEdge(i, k);
        const tx = p[0] - g.out[0]*0.62, ty = p[1] - g.out[1]*0.62;
        c.fillStyle = WARN_INK;
        c.font = "600 " + Math.max(8, Math.round(s*0.25)) + "px Consolas, monospace";
        c.textAlign = "center"; c.textBaseline = "middle";
        c.fillText("CONCAVE", PX(tx), PY(ty));
        planNotes.push("CONCAVE " + ROOMS[i].name + " " + foldWallName(i, k));
      }
    }
  }
}

function planWall(c, axis, coord, s0, s1){
  const holes = holesOn(axis, coord, s0, s1).slice().sort((a,b)=>a.s0-b.s0);
  let u = s0;
  const seg = (a, b) => {
    if (b - a < 1e-4) return;
    c.beginPath();
    if (axis === "x"){ c.moveTo(PX(a), PY(coord)); c.lineTo(PX(b), PY(coord)); }
    else { c.moveTo(PX(coord), PY(a)); c.lineTo(PX(coord), PY(b)); }
    c.stroke();
  };
  for (const h of holes){ seg(u, h.s0); u = h.s1; }
  seg(u, s1);
}

function drawRays(c){
  if (!scene || !scene.paths) return;
  const order = { r2:0, r1:1, wall:2, leaf:3, portal:4, direct:5 };
  const ps = scene.paths.slice().sort((a,b)=>(order[a.t]||0)-(order[b.t]||0));
  for (const p of ps){
    if (!p.pts || p.pts.length < 2) continue;      /* a kind with no points is not drawn */
    const st = rayStyle(p.t);
    const s = (typeof p.s === "number") ? (p.s & 3) : 0;
    const db = (typeof p.db === "number") ? p.db : -12;
    const a = Math.max(0.09, Math.min(0.95, 1 - (-db) / 42));
    c.strokeStyle = srcRgba(s, a, st.lift);
    c.lineWidth = Math.max(1, PF.s * st.w);
    c.setLineDash(st.dash || []);
    c.beginPath();
    c.moveTo(PX(p.pts[0][0]), PY(p.pts[0][1]));
    for (let i=1;i<p.pts.length;i++) c.lineTo(PX(p.pts[i][0]), PY(p.pts[i][1]));
    c.stroke();
    c.setLineDash([]);
    c.fillStyle = srcRgba(s, a, st.lift);
    for (let i=1;i<p.pts.length-1;i++){
      c.beginPath(); c.arc(PX(p.pts[i][0]), PY(p.pts[i][1]), Math.max(1.4, PF.s*0.055), 0, 7); c.fill();
    }
  }
}

/*  All four, ghosted when their input is OFF - still drawn, still draggable,
    because placing a source you have not yet fed is a normal thing to do. */
function drawSources(c){
  for (let n = 1; n <= NSRC; n++) if (n - 1 !== selSrc) drawOneSource(c, n);
  drawOneSource(c, selSrc + 1);                  /* the selected one on top */
}
function drawOneSource(c, n){
  const s = PF.s, yaw = SYAWn(n)*Math.PI/180;
  const x = PX(SXn(n)), y = PY(SYn(n));
  const on = srcActive(n), sel = (n - 1 === selSrc);
  const hue = SRC_HUE[n-1];
  const rgb = a => "rgba(" + hue[0] + "," + hue[1] + "," + hue[2] + "," + a + ")";
  const A = on ? 1 : 0.40;                       /* the ghost */
  c.save();
  if (sel){                                      /* a halo, so which one the panel edits is never in doubt */
    c.fillStyle = rgb(0.13 * (on ? 1 : 0.7));
    c.beginPath(); c.arc(x, y, s*0.50, 0, 7); c.fill();
    c.strokeStyle = rgb(0.55); c.lineWidth = 1.4;
    c.setLineDash([3,3]);
    c.beginPath(); c.arc(x, y, s*0.50, 0, 7); c.stroke();
    c.setLineDash([]);
  }
  c.translate(x, y); c.rotate(-yaw);
  if (srcTypeIdx(n) === 0){
    /*  PURE: a stand seen from above - a ring on a cross - plus a cardioid
        petal whose reach IS the directivity. */
    const d = srcDir(n);
    if (d > 0.02){
      c.fillStyle = rgb(0.16 * A);
      c.beginPath();
      for (let i = 0; i <= 48; i++){
        const th = -Math.PI + i/48*Math.PI*2;
        const r = s * (0.22 + 0.62*d) * (1 - d + d*(0.5 + 0.5*Math.cos(th)));
        const px = Math.cos(th)*r, py = -Math.sin(th)*r;
        if (i) c.lineTo(px, py); else c.moveTo(px, py);
      }
      c.closePath(); c.fill();
    }
    c.strokeStyle = rgb(0.75*A); c.lineWidth = Math.max(1, s*0.032);
    for (let i = 0; i < 3; i++){                  /* the tripod legs */
      const th = i/3*Math.PI*2 + Math.PI/2;
      c.beginPath(); c.moveTo(0,0);
      c.lineTo(Math.cos(th)*s*0.24, -Math.sin(th)*s*0.24); c.stroke();
    }
    c.fillStyle = "rgba(246,238,222," + A + ")";
    c.strokeStyle = rgb(A); c.lineWidth = Math.max(1.2, s*0.040);
    c.beginPath(); c.arc(0, 0, s*0.115, 0, 7); c.fill(); c.stroke();
  } else {
    /*  LOUDSPEAKER: the cabinet in plan, baffle toward the facing arrow. */
    c.fillStyle = "rgba(246,238,222," + A + ")";
    c.strokeStyle = rgb(A); c.lineWidth = Math.max(1.2, s*0.042);
    c.beginPath(); c.rect(-s*0.145, -s*0.115, s*0.29, s*0.23);
    c.fill(); c.stroke();
    c.fillStyle = rgb(0.80*A);                    /* the baffle edge */
    c.fillRect(s*0.105, -s*0.115, s*0.040, s*0.23);
    c.beginPath(); c.arc(s*0.02, 0, s*0.058, 0, 7); c.fill();
  }
  /* the facing arrow, which is also the handle you turn it by */
  c.strokeStyle = rgb(0.85*A); c.lineWidth = Math.max(1.2, s*0.036);
  c.beginPath(); c.moveTo(s*0.20, 0); c.lineTo(s*0.60, 0); c.stroke();
  c.fillStyle = rgb(0.85*A);
  c.beginPath(); c.moveTo(s*0.78, 0); c.lineTo(s*0.56, -s*0.095); c.lineTo(s*0.56, s*0.095); c.closePath(); c.fill();
  c.restore();
  /* the heading handle */
  if (0.80*s > 20){
    const hx = PX(SXn(n) + Math.cos(yaw)*0.80), hy = PY(SYn(n) + Math.sin(yaw)*0.80);
    c.fillStyle = rgb(0.24*A); c.strokeStyle = rgb(0.85*A); c.lineWidth = 1.2;
    c.beginPath(); c.arc(hx, hy, Math.max(3.5, s*0.13), 0, 7); c.fill(); c.stroke();
  }
  c.fillStyle = on ? "rgba(52,48,42,.88)" : "rgba(90,84,74,.60)";
  c.font = (sel ? "600 " : "") + Math.max(8, Math.round(s*0.27)) + "px Consolas, monospace";
  c.textAlign = "center"; c.textBaseline = "top";
  c.fillText(n + (on ? ("  " + SZn(n).toFixed(2) + " m") : "  off"), x, y + s*0.30);
}

function drawListener(c){
  const x = PX(LX()), y = PY(LY()), s = PF.s, yaw = LYAW()*Math.PI/180;
  const r = s*0.22;
  c.save();
  c.translate(x, y); c.rotate(-yaw);
  /* the ears, at their real spacing - past a head's width they become a
     spaced pair on a bar, which is exactly what the parameter is doing */
  const half = EARSPAN_M(V.earspan) / 2 * s;
  if (half > r*1.15){
    c.strokeStyle = "#26262a"; c.lineWidth = Math.max(1.4, s*0.05);
    c.beginPath(); c.moveTo(0, -half); c.lineTo(0, half); c.stroke();
  }
  c.fillStyle = "#26262a";
  c.beginPath(); c.ellipse(0, -half, r*0.17, r*0.32, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(0,  half, r*0.17, r*0.32, 0, 0, 7); c.fill();
  /* head */
  c.fillStyle = "#f4ecdc"; c.strokeStyle = "#26262a"; c.lineWidth = 1.6;
  c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.stroke();
  /* nose */
  c.fillStyle = "#26262a";
  c.beginPath(); c.moveTo(r*1.32, 0); c.lineTo(r*0.55, -r*0.30); c.lineTo(r*0.55, r*0.30); c.closePath(); c.fill();
  /* field of view */
  c.fillStyle = "rgba(40,70,120,.13)";
  const fv = fovDeg*Math.PI/180*0.9;
  c.beginPath(); c.moveTo(0,0); c.arc(0, 0, s*2.4, -fv/2, fv/2); c.closePath(); c.fill();
  c.restore();
  /* heading handle */
  const hx = PX(LX() + Math.cos(yaw)*0.95), hy = PY(LY() + Math.sin(yaw)*0.95);
  c.strokeStyle = "rgba(40,60,100,.55)"; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(x, y); c.lineTo(hx, hy); c.stroke();
  c.fillStyle = "rgba(60,90,150,.35)"; c.strokeStyle = "#2c4a78"; c.lineWidth = 1.2;
  c.beginPath(); c.arc(hx, hy, Math.max(3.5, s*0.13), 0, 7); c.fill(); c.stroke();
  c.fillStyle = "rgba(44,74,120,.9)";
  c.font = "600 " + Math.max(8, Math.round(s*0.26)) + "px Consolas, monospace";
  c.textAlign = "center"; c.textBaseline = "bottom";
  c.fillText("YOU", x, y - s*0.34);
}

function drawLegend(c, W, H){
  /*  Directly under the drawing, not at the foot of the canvas - the plan is
      width-limited, so pinning the key to the bottom leaves a hand's width of
      blank paper between the two and they stop reading as one sheet. */
  const y0 = Math.min(H - PF.leg + 4, PY(0) + 14);
  c.textAlign = "left"; c.textBaseline = "middle";
  c.font = "10px Consolas, monospace";
  let x = 12;
  c.fillStyle = "rgba(60,56,48,.85)";
  c.fillText(showRays ? "PATHS" : "PATHS OFF", x, y0 + 8);
  x += 60;
  if (showRays){
    /*  Hue says WHICH SOURCE, line style says WHICH KIND. Two keys, because
        one legend mixing the two would have to show 24 swatches. */
    for (let n = 1; n <= NSRC; n++){
      const lbl = String(n);
      const wNeed = 14 + c.measureText(lbl).width + 10;
      if (x + wNeed > W - 8) break;
      c.strokeStyle = SRC_CSS[n-1]; c.lineWidth = 2.6;
      c.beginPath(); c.moveTo(x, y0+8); c.lineTo(x+12, y0+8); c.stroke();
      c.fillStyle = srcActive(n) ? "rgba(60,56,48,.85)" : "rgba(60,56,48,.40)";
      c.fillText(lbl, x+16, y0+8);
      x += wNeed;
    }
    x += 8;
    const kinds = [["direct",null,2.6],["refl",null,1.2],["doorway",[7,3],1.8],["through",[4,4],1.4]];
    for (const k of kinds){
      const wNeed = 20 + c.measureText(k[0]).width + 12;
      if (x + wNeed > W - 8) break;         /* check BEFORE drawing, not after */
      c.strokeStyle = "rgba(70,66,58,.80)"; c.lineWidth = k[2];
      c.setLineDash(k[1] || []);
      c.beginPath(); c.moveTo(x, y0+8); c.lineTo(x+16, y0+8); c.stroke();
      c.setLineDash([]);
      c.fillStyle = "rgba(60,56,48,.80)";
      c.fillText(k[0], x+20, y0+8);
      x += wNeed;
    }
  }
  c.fillStyle = "rgba(70,66,58,.80)";
  c.font = "10px Consolas, monospace";
  const n = selSrc + 1;
  const posYou = "YOU " + LX().toFixed(2) + ", " + LY().toFixed(2) + " m  " + Math.round(LYAW()) + " deg";
  const posSrc = "SRC " + n + " " + SXn(n).toFixed(2) + ", " + SYn(n).toFixed(2) + ", " +
                 SZn(n).toFixed(2) + " m  " + Math.round(SYAWn(n)) + " deg";
  const one = posYou + "      " + posSrc;
  let helpY = y0 + 44;
  if (c.measureText(one).width < W - 24) c.fillText(one, 12, y0 + 28);
  else { c.fillText(posYou, 12, y0 + 28); c.fillText(posSrc, 12, y0 + 42); helpY = y0 + 56; }
  /* the help line only if it fits whole - a sentence cut off mid-word reads
     as a fault rather than as a narrow window */
  const help = "click a source to select it  .  drag it to move, drag its dot to turn  .  click a door to toggle, drag it to set";
  /*  and only if the line fits the sheet BOTH ways - a sentence sliced by the
      bottom edge reads as a fault, exactly as one sliced by the right edge
      does, and a short panel is where that happens */
  /*  A wall bent INTO the room is worth more than a reminder of how to drag
      things, so it takes that line when there is one. */
  const bent = concaveList();
  if (helpY + 5 <= H){
    if (bent.length){
      c.fillStyle = WARN_INK;
      const full = "CONCAVE: " + bent.join(", ") + " - bent INTO the room, which focuses sound at a point. Flat is better.";
      const mid  = "CONCAVE: " + bent.join(", ") + " - focuses sound at a point; flat is better";
      const txt = c.measureText(full).width < W - 24 ? full
                : (c.measureText(mid).width < W - 24 ? mid : "CONCAVE WALL - focuses sound");
      c.fillText(txt, 12, helpY);
      planNotes.push(txt);
    } else {
      c.fillStyle = "rgba(70,66,58,.55)";
      const shortHelp = "click a source to select, drag to move";
      const txt = c.measureText(help).width < W - 24 ? help
                : (c.measureText(shortHelp).width < W - 24 ? shortHelp : null);
      if (txt) c.fillText(txt, 12, helpY);
    }
  }
}

/* ==================================================================== */
/*  walking and looking                                                  */
/* ==================================================================== */
const WALK = 2.3;                    /* m/s */
const TURN = 105;                    /* deg/s on the arrow keys */
const keys = {};
let walkTouching = false, lastWalkT = 0;

function walkActive(){
  return !!(keys.w || keys.a || keys.s || keys.d || keys.up || keys.down || keys.left || keys.right);
}
/*  At least R inside a polygon: inside it at all, and no closer than R to any
    of its edges. For an unbroken room that is exactly the shrunk rectangle it
    used to be; for a broken one it follows the panels in BOTH directions - you
    can walk into a wall that was pushed out, and you cannot walk through one
    that was pushed in. */
function insideBy(poly, x, y, R){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const a = poly[i], b = poly[j];
    if (((a[1] > y) !== (b[1] > y)) &&
        (x < (b[0]-a[0]) * (y-a[1]) / (b[1]-a[1]) + a[0])) inside = !inside;
  }
  if (!inside) return false;
  for (let i = 0; i < poly.length; i++){
    const a = poly[i], b = poly[(i + 1) % poly.length];
    if (nearSeg(x, y, a[0], a[1], b[0], b[1]) < R) return false;
  }
  return true;
}
function walkable(x, y){
  const R = 0.30;
  for (const r of ROOMS) if (insideBy(roomPoly(r.i), x, y, R)) return true;
  for (const d of DOORS){
    if (apert(d) < 0.5) continue;                /* the protocol's own rule */
    const o = opening(d), m = 0.12;
    if (o[1] - o[0] < 0.30) continue;
    if (d.axis === "x"){ if (Math.abs(y - d.wall) < 0.45 && x > o[0]+m && x < o[1]-m) return true; }
    else { if (Math.abs(x - d.wall) < 0.45 && y > o[0]+m && y < o[1]-m) return true; }
  }
  return false;
}
function tryMove(dx, dy){
  let x = LX(), y = LY(), moved = false;
  if (dx && walkable(x+dx, y)){ x += dx; moved = true; }
  if (dy && walkable(x, y+dy)){ y += dy; moved = true; }
  if (!moved) return false;
  V.lisx = clamp01(x / APT_W); V.lisy = clamp01(y / APT_H);
  updateControl("lisx"); updateControl("lisy");
  queueP("lisx", V.lisx); queueP("lisy", V.lisy);
  return true;
}
function beginWalkGesture(){
  if (walkTouching) return;

  NB.send({ k:"touch", id:"lisy", down:true });
  NB.send({ k:"touch", id:"lisyaw", down:true });
}
function endWalkGesture(){
  if (!walkTouching) return;
  walkTouching = false;
  doFlush();
  NB.send({ k:"touch", id:"lisx", down:false });
  NB.send({ k:"touch", id:"lisy", down:false });
  NB.send({ k:"touch", id:"lisyaw", down:false });
}
function stepWalk(now){
  if (!walkActive()){ lastWalkT = 0; return; }
  const dt = lastWalkT ? Math.min(0.1, (now - lastWalkT) / 1000) : 0.016;
  lastWalkT = now;
  applyWalk(dt);
}
function applyWalk(dt){
  const yaw = LYAW() * Math.PI / 180;
  const fx = Math.cos(yaw), fy = Math.sin(yaw);
  const rx = Math.sin(yaw), ry = -Math.cos(yaw);
  let f = 0, r = 0, t = 0;
  if (keys.w || keys.up) f += 1;
  if (keys.s || keys.down) f -= 1;
  if (keys.a) r -= 1;
  if (keys.d) r += 1;
  if (keys.left) t += 1;
  if (keys.right) t -= 1;
  if (t){
    const nv = (((V.lisyaw + t*TURN*dt/360) % 1) + 1) % 1;
    V.lisyaw = nv; updateControl("lisyaw"); queueP("lisyaw", nv);
  }
  if (f || r){
    const l = Math.hypot(f, r) || 1;
    const dx = (fx*f + rx*r) / l * WALK * dt;
    const dy = (fy*f + ry*r) / l * WALK * dt;
    tryMove(dx, dy);
  }
  invalidate("both");
}
function keyName(e){
  const k = (e.key || "").toLowerCase();
  if (k === "w" || k === "a" || k === "s" || k === "d") return k;
  if (k === "arrowup") return "up";
  if (k === "arrowdown") return "down";
  if (k === "arrowleft") return "left";
  if (k === "arrowright") return "right";
  return null;
}
/*  The ONE case where W A S D and the arrows are not movement: somewhere text
    is genuinely being typed. A range, a checkbox or a button is an INPUT that
    nobody types into, and a SELECT is exactly the control that used to eat
    the arrow keys - so neither of those keeps them. There is no text field on
    this panel today; the guard is here so adding one does not break walking. */
function textEntry(e){
  const t = e.target;
  if (!t || !t.tagName) return false;
  if (t.isContentEditable) return true;
  const n = t.tagName.toUpperCase();
  if (n === "TEXTAREA") return true;
  if (n !== "INPUT") return false;
  const ty = (t.type || "text").toLowerCase();

function movementKey(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return null;     /* a shortcut is not a step */
  return keyName(e);
}
/*  CAPTURE phase, at the WINDOW: the very first thing in the event path, so
    the page sees the key before the focused control does and can take it away. Peter kept getting trapped in a menu -
    once a select or a slider had the focus the browser gave it the arrows and
    W A S D, and walking simply stopped. Nothing else is swallowed: Tab,
    Escape, Enter and Space never reach this. */
window.addEventListener("keydown", e => {
  const k = movementKey(e);
  if (!k || textEntry(e)) return;
  e.preventDefault();
  e.stopPropagation();
  /*  Drop the focus the first time a movement key arrives, so the next key
      has nothing to fight and the focus ring stops claiming the control is
      still armed. */
  const a = document.activeElement;
  if (a && a !== document.body && a.blur) { try { a.blur(); } catch(_){} }
  if (!keys[k]){
    keys[k] = true;
    beginWalkGesture();
    lastWalkT = nowMs();

        waiting for a frame that a headless context may never produce. */
    applyWalk(0.028);

}, true);
window.addEventListener("keyup", e => {

}, true);
window.addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  endWalkGesture();
});

let looking = false, lookX = 0, lookY = 0;

/* ==================================================================== */
/*  plan dragging                                                        */
/* ==================================================================== */
let pdrag = null;                    /* {what, id[], door, moved, x0, y0} */

function nearSeg(px, py, ax, ay, bx, by){
  const vx = bx-ax, vy = by-ay;
  const L = vx*vx + vy*vy;
  let t = L > 0 ? ((px-ax)*vx + (py-ay)*vy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax+vx*t), py - (ay+vy*t));
}
/*  Hit testing is done in PIXELS, not metres. A grab radius written in world
    units grows as the plan shrinks, and on a small panel the heading handle -
    which is only 0.8 m from the glyph it belongs to - swallowed the glyph
    itself, so dragging the speaker turned it instead. */
function hitPlan(wx, wy){
  const s = PF ? PF.s : 30;
  const px = (ax, ay) => Math.hypot((wx-ax)*s, (wy-ay)*s);
  const lyaw = LYAW()*Math.PI/180;
  const lh = [LX()+Math.cos(lyaw)*0.95, LY()+Math.sin(lyaw)*0.95];
  /*  A handle is only offered when it is far enough from its own body to be
      aimed at; below that the plan is too small for two targets.
      The SELECTED source is tested first so that four sources standing on top
      of one another can still be told apart - pick one, then drag it. */
  const order = [];
  for (let n = 1; n <= NSRC; n++) order.push(n);
  order.sort((a,b) => (b-1 === selSrc ? 1 : 0) - (a-1 === selSrc ? 1 : 0));
  for (const n of order){
    const yaw = SYAWn(n)*Math.PI/180;
    const h = [SXn(n)+Math.cos(yaw)*0.80, SYn(n)+Math.sin(yaw)*0.80];
    if (0.80*s > 20 && px(h[0], h[1]) < 12) return { what:"syaw", n:n };
  }
  if (0.95*s > 20 && px(lh[0], lh[1]) < 12) return { what:"lisyaw" };
  for (const n of order) if (px(SXn(n), SYn(n)) < 15) return { what:"src", n:n };
  if (px(LX(), LY()) < 15) return { what:"lis" };
  /*  The break markers sit ON a wall, where a source almost never is, so they
      are offered AFTER the things that live in the middle of the room - a
      speaker parked against a wall must still be the thing you pick up. */
  for (let i = 0; i < ROOMS.length; i++)
    for (let k = 0; k < 2; k++){
      const p = foldPoint(i, k);
      if (px(p[0], p[1]) < 13) return { what:"fold", room:i, k:k };
    }
  for (const d of DOORS){
    const hp = hingePt(d);
    const a = leafAngle(d), c0 = d.closedAng*Math.PI/180;
    const tip = [hp[0]+Math.cos(a)*DOOR_W, hp[1]+Math.sin(a)*DOOR_W];
    const ctip = [hp[0]+Math.cos(c0)*DOOR_W, hp[1]+Math.sin(c0)*DOOR_W];
    const lim = Math.max(0.16, 11 / s);
    if (nearSeg(wx, wy, hp[0], hp[1], tip[0], tip[1]) < lim ||
        nearSeg(wx, wy, hp[0], hp[1], ctip[0], ctip[1]) < lim) return { what:"door", door:d };
  }
  return null;
}
/*  A value the hand is setting: written, drawn and sent, and skipped outright
    when it has not actually moved - so a drag straight out of the room leaves
    the split position bit-identical rather than sending a stream of noise. */
function setDragged(id, v){
  v = clamp01(v);
  if (V[id] === v) return;
  V[id] = v;
  updateControl(id);
  queueP(id, v);
}
function doorApertureFrom(d, wx, wy){
  const hp = hingePt(d);
  const ang = Math.atan2(wy - hp[1], wx - hp[0]);
  const c0 = d.closedAng * Math.PI/180, o1 = d.openAng * Math.PI/180;
  /* the fraction of the way from the closed angle to the open one */
  let rel = ang - c0;
  while (rel > Math.PI) rel -= 2*Math.PI;
  while (rel < -Math.PI) rel += 2*Math.PI;
  const span = o1 - c0;
  return Math.max(0, Math.min(1, rel / span));
}
planCv.addEventListener("pointerdown", e => {
  if (e.button !== undefined && e.button !== 0) return;
  if (!PF) PF = planFit();
  const w = planToWorld(e.clientX, e.clientY);
  const hit = hitPlan(w[0], w[1]);
  if (!hit) return;
  pdrag = { what:hit.what, door:hit.door, n:hit.n, room:hit.room, k:hit.k,
            moved:false, cx:e.clientX, cy:e.clientY };
  /*  Touching a source picks it up AND selects it - the panel below follows
      whatever your hand is on, which is the only arrangement that does not
      need explaining. */
  if (hit.n) selectSource(hit.n - 1, true);
  const ids = hit.what === "src"  ? ["s"+hit.n+"x", "s"+hit.n+"y"]
            : hit.what === "syaw" ? ["s"+hit.n+"yaw"]
            : hit.what === "lis"  ? ["lisx","lisy"]
            : hit.what === "door" ? [hit.door.id]
            /*  one marker, two parameters: the gesture is opened on both, so
                whichever way the hand goes the host has a gesture for it */
            : hit.what === "fold" ? [foldId(hit.room, hit.k), foldPId(hit.room, hit.k)]

window.addEventListener("pointermove", e => {

  if (pdrag.what === "src"){
    const n = pdrag.n;
    const p = clampIntoApartment(w[0], w[1], 0.22);
    V["s"+n+"x"] = clamp01(p[0]/APT_W); V["s"+n+"y"] = clamp01(p[1]/APT_H);
    updateControl("s"+n+"x"); updateControl("s"+n+"y");
    queueP("s"+n+"x", V["s"+n+"x"]); queueP("s"+n+"y", V["s"+n+"y"]);
    meshDirty = true; invalidate("both");
  } else if (pdrag.what === "lis"){
    const p = clampIntoApartment(w[0], w[1], 0.22);
    V.lisx = clamp01(p[0]/APT_W); V.lisy = clamp01(p[1]/APT_H);
    updateControl("lisx"); updateControl("lisy");
    queueP("lisx", V.lisx); queueP("lisy", V.lisy);
    invalidate("both");
  } else if (pdrag.what === "syaw" || pdrag.what === "lisyaw"){
    const src = pdrag.what === "syaw";
    const id = src ? ("s" + pdrag.n + "yaw") : "lisyaw";
    const cx = src ? SXn(pdrag.n) : LX();
    const cy = src ? SYn(pdrag.n) : LY();
    let a = Math.atan2(w[1]-cy, w[0]-cx) * 180 / Math.PI;
    if (a < 0) a += 360;
    const nv = clamp01(a/360);
    V[id] = nv; updateControl(id);
    queueP(id, nv);
    if (src) meshDirty = true;
    invalidate("both");
  } else if (pdrag.what === "fold"){
    /*  The pointer decomposed on the wall's own two axes: how far ALONG it,
        which is the split position, and how far OUT of the room, which is the
        push. One marker carries both, which is what "drag it perpendicular,
        drag it along" asks for - and because each move sets an absolute value
        from where the pointer IS, a drag that ends back on the wall line ends
        with the position it started with. */
    const i = pdrag.room, k = pdrag.k, g = foldEdge(i, k);
    const ax = g.b[0] - g.a[0], ay = g.b[1] - g.a[1];
    const L = Math.hypot(ax, ay) || 1;
    const dxw = w[0] - g.a[0], dyw = w[1] - g.a[1];
    const along = (dxw*ax + dyw*ay) / (L*L);            /* 0..1 down the wall */
    const outm  = dxw*g.out[0] + dyw*g.out[1];          /* metres out of it */
    setDragged(foldPId(i, k), (along - 0.15) / 0.7);
    setDragged(foldId(i, k), outm / 1.2 + 0.5);
    meshDirty = true; invalidate("both");
  } else if (pdrag.what === "door"){
    const a = doorApertureFrom(pdrag.door, w[0], w[1]);
    V[pdrag.door.id] = a; updateControl(pdrag.door.id);
    queueP(pdrag.door.id, a);
    meshDirty = true; invalidate("both");
  }
});
const endPlanDrag = e => {
  if (!pdrag) return;
  const p = pdrag; pdrag = null;
  try { planCv.releasePointerCapture(e.pointerId); } catch(_){}
  if (!p.moved && p.what === "door"){
    const id = p.door.id;
    const nv = V[id] > 0.5 ? 0 : 1;
    V[id] = nv; updateControl(id); queueP(id, nv);
    meshDirty = true; invalidate("both");
  }
  doFlush();
  for (const id of (p.ids || [])) NB.send({ k:"touch", id:id, down:false });
