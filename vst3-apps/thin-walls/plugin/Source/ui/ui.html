window.addEventListener("pointerup", endPlanDrag);
window.addEventListener("pointercancel", endPlanDrag);

/* ==================================================================== */
/*  the door handles, in the 3D view                                     */
/*                                                                       */
/*  Everything here is analytic. The leaf is a rectangle whose position   */
/*  follows from the hinge and the aperture, so a ray can be tested       */
/*  against it with arithmetic - there is no picking pass on the GPU and  */
/*  there does not need to be one.                                        */
/* ==================================================================== */

/*  The camera IS the listener, so the ray starts at the ear. The basis is
    the one viewMat builds, spelled out again rather than inverted out of the
    matrix: two lines, and no question about handedness. */
function povRay(clientX, clientY){
  const r = povCv.getBoundingClientRect();
  if (r.width < 4 || r.height < 4) return null;
  const ndcX = ((clientX - r.left) / r.width) * 2 - 1;
  const ndcY = 1 - ((clientY - r.top) / r.height) * 2;
  const yaw = LYAW()*Math.PI/180, pit = pitchDeg*Math.PI/180;
  const cp = Math.cos(pit), sp = Math.sin(pit);
  const f  = [Math.cos(yaw)*cp, Math.sin(yaw)*cp, sp];
  const rt = [Math.sin(yaw), -Math.cos(yaw), 0];
  const up = crs(rt, f);
  const th = Math.tan(fovDeg*Math.PI/360), asp = r.width / r.height;
  const d = nrm3([ f[0] + rt[0]*ndcX*th*asp + up[0]*ndcY*th,
                   f[1] + rt[1]*ndcX*th*asp + up[1]*ndcY*th,
                   f[2] + rt[2]*ndcX*th*asp + up[2]*ndcY*th ]);
  return { o:[LX(), LY(), EAR_Z], d:d };
}

/*  The interior walls, as segments. A handle two metres away with a wall in
    between is not reachable however close it is, and grabbing one through a
    wall is exactly the accident this prevents. */
const INNER_WALLS = [
  { axis:"x", coord:5.0, s0:0,   s1:6.0 },
  { axis:"y", coord:6.0, s0:0,   s1:9.0 },
  { axis:"y", coord:3.0, s0:5.0, s1:8.5 }
];
function wallBetween(x0, y0, x1, y1){
  /*  the last few centimetres are dropped: the handle SITS on the wall plane
      when the door is shut, and an endpoint that lands exactly on a wall
      would otherwise count as crossing it. */
  const ex = x0 + (x1-x0)*0.97, ey = y0 + (y1-y0)*0.97;
  for (const w of INNER_WALLS){
    const a0 = w.axis === "x" ? y0 : x0;
    const a1 = w.axis === "x" ? ey : ex;
    if ((a0 - w.coord) * (a1 - w.coord) >= 0) continue;        /* same side */
    const t = (w.coord - a0) / (a1 - a0);
    const u = (w.axis === "x" ? x0 + (ex-x0)*t : y0 + (ey-y0)*t);
    if (u < w.s0 || u > w.s1) continue;                         /* off the end */
    /*  A DOORWAY is a hole in the wall whatever the leaf is doing - the mesh
        cuts the full span out and the leaf fills it - so the span, not the
        aperture, is what you can see through. The leaf in it may be in the
        way, but the leaf is the thing being picked. */
    let through = false;
    for (const d of DOORS){
      if (d.axis !== w.axis || Math.abs(d.wall - w.coord) > 1e-4) continue;
      if (u > d.s0 && u < d.s1) through = true;
    }
    if (!through) return true;
  }
  return false;
}

/*  Where the handle is, in the world, for a given door. */
function handlePos(d){
  const a = leafAngle(d), hp = hingePt(d);
  return [hp[0] + Math.cos(a)*HANDLE_U, hp[1] + Math.sin(a)*HANDLE_U, HANDLE_Z];
}

/*  Ray against the leaf's own plane, then the handle rectangle on it. Both
    faces carry a handle and the leaf is 4 cm thick, so the mid-plane stands
    for both of them. */
function pickHandle(clientX, clientY){
  const ray = povRay(clientX, clientY);
  if (!ray) return null;
  let best = null;
  for (const d of DOORS){
    const a = leafAngle(d), hp = hingePt(d);
    const co = Math.cos(a), si = Math.sin(a);
    const nx = -si, ny = co;                       /* the leaf's normal */
    const den = ray.d[0]*nx + ray.d[1]*ny;
    if (Math.abs(den) < 1e-4) continue;            /* edge on */
    const t = ((hp[0]-ray.o[0])*nx + (hp[1]-ray.o[1])*ny) / den;
    if (t <= 0.05) continue;                       /* behind you */
    const px = ray.o[0]+ray.d[0]*t, py = ray.o[1]+ray.d[1]*t, pz = ray.o[2]+ray.d[2]*t;
    const u = (px-hp[0])*co + (py-hp[1])*si;
    if (Math.abs(u - HANDLE_CU) > HANDLE_HU) continue;
    if (Math.abs(pz - HANDLE_Z) > HANDLE_HZ) continue;
    const h = handlePos(d);
    const dist = Math.hypot(h[0]-ray.o[0], h[1]-ray.o[1], h[2]-ray.o[2]);
    if (dist > HANDLE_REACH) continue;             /* out of reach */
    if (wallBetween(ray.o[0], ray.o[1], h[0], h[1])) continue;
    if (!best || t < best.t) best = { d:d, t:t, dist:dist };
  }
  return best;
}

function setHover(d){
  if (hoverDoor === d) return;
  hoverDoor = d;
  povCv.classList.toggle("handle", !!d && !hdrag);
  meshDirty = true;
  invalidate("pov");
}

/*  Dragging: the handle travels on a circle about the hinge, so the pointer
    is put on that circle rather than on a flat plane. A plane at handle
    height stops working the moment you look up; a cylinder is what the
    handle actually moves on and works from any angle. */
function apertureFromRay(d, ray){
  const hp = hingePt(d);
  const ox = ray.o[0]-hp[0], oy = ray.o[1]-hp[1];
  const dx = ray.d[0], dy = ray.d[1];
  const A = dx*dx + dy*dy;
  let px = ox, py = oy;
  if (A > 1e-9){
    const B = ox*dx + oy*dy;
    const C = ox*ox + oy*oy - HANDLE_U*HANDLE_U;
    const disc = B*B - A*C;
    let t;
    if (disc > 0){
      const r = Math.sqrt(disc);
      const t1 = (-B - r)/A, t2 = (-B + r)/A;
      t = t1 > 0.05 ? t1 : (t2 > 0.05 ? t2 : -B/A);
    } else {
      /*  past the edge of the swing the ray misses the circle entirely; the
          closest approach keeps the door FOLLOWING the pointer instead of
          sticking where it was. */
      t = -B/A;
    }
    t = Math.max(0.05, t);
    px = ox + dx*t; py = oy + dy*t;
  }
  return doorApertureFrom(d, hp[0]+px, hp[1]+py);
}

/*  One place that knows whether a host gesture is open on a door, so a drag
    that hands over to the click animation cannot leave one hanging. */
const doorGesture = {};
function doorTouch(id, down){
  if (down){
    if (doorGesture[id]) return;
    doorGesture[id] = 1;
    NB.send({ k:"touch", id:id, down:true });
  } else {
    if (!doorGesture[id]) return;
    delete doorGesture[id];
    doFlush();
    NB.send({ k:"touch", id:id, down:false });
  }
}
function setDoor(d, v){
  const id = d.id;
  V[id] = clamp01(v);
  updateControl(id);
  queueP(id, V[id]);
  meshDirty = true;
  invalidate("both");
}

/*  A click with no movement throws the door or slams it, and it SWINGS -
    a leaf that teleports from shut to open reads as a bug rather than as a
    door. Driven off a timer, not an animation frame: a headless context
    produces no frames at all, and the same code has to run there. */
const doorAnim = {};
let doorAnimTmr = 0;
function doorAnimActive(){ for (const k in doorAnim) return true; return false; }
function startDoorAnim(d, to){
  doorTouch(d.id, true);
  doorAnim[d.id] = { d:d, from:V[d.id], to:clamp01(to), u:0, last:nowMs(), ms:340 };
  if (!doorAnimTmr) doorAnimTmr = setTimeout(doorAnimTick, 16);
}
function doorAnimTick(){
  doorAnimTmr = 0;
  const now = nowMs();
  for (const id in doorAnim){
    const a = doorAnim[id];
    /*  The step is the real elapsed time, BOUNDED at both ends: never less
        than a nominal frame, so a context whose clock does not advance still
        gets a swing rather than a stall; and never more than 40 ms, so a
        window that was stalled resumes the swing instead of teleporting the
        door to the far end of it. The same reason the walk clamps its own dt. */
    const step = Math.min(40, Math.max(16, now - a.last));
    a.last = now;
    a.u += a.ms > 0 ? step / a.ms : 1;
    let u = a.u;
    if (u > 1) u = 1;
    const e = u*u*(3 - 2*u);                       /* still at both ends */
    setDoor(a.d, a.from + (a.to - a.from) * e);
    if (u >= 1){ delete doorAnim[id]; doorTouch(id, false); }
  }
  if (doorAnimActive()) doorAnimTmr = setTimeout(doorAnimTick, 16);
}

let hdrag = null;                    /* {d, moved, cx, cy} */
povCv.addEventListener("pointermove", e => {
  if (looking || hdrag) return;
  const hit = pickHandle(e.clientX, e.clientY);
  setHover(hit ? hit.d : null);
});
povCv.addEventListener("pointerleave", () => { if (!hdrag) setHover(null); });
window.addEventListener("pointermove", e => {
  if (!hdrag) return;
  if (Math.abs(e.clientX - hdrag.cx) > 3 || Math.abs(e.clientY - hdrag.cy) > 3) hdrag.moved = true;
  const ray = povRay(e.clientX, e.clientY);
  if (!ray) return;
  setDoor(hdrag.d, apertureFromRay(hdrag.d, ray));
});
const endHandleDrag = e => {
  if (!hdrag) return;
  const h = hdrag; hdrag = null;
  try { povCv.releasePointerCapture(e.pointerId); } catch(_){}
  povCv.classList.remove("handling");
  povCv.classList.toggle("handle", !!hoverDoor);
  if (!h.moved) startDoorAnim(h.d, V[h.d.id] > 0.5 ? 0 : 1);   /* the gesture stays open */
  else doorTouch(h.d.id, false);
};
window.addEventListener("pointerup", endHandleDrag);
window.addEventListener("pointercancel", endHandleDrag);

/* ==================================================================== */
/*  native traffic                                                       */
/* ==================================================================== */
NB.on("initialState", d => {
  if (!d) return;
  buildId = d.build || "--";
  document.getElementById("buildTag").textContent = buildId;
  for (const p of (d.params || [])){
    if (!(p.id in V)) continue;                 /* a parameter this page predates */
    const was = SPEC[p.id] || {};
    /*  Keep what the page already knows where the message is thinner than the
        page's own table - a choice parameter that arrives with no step count
        must not turn its selector into an empty box. */
    SPEC[p.id] = { name:p.name || was.name || p.id,
                   stepped:!!p.stepped || !!was.stepped,
                   steps:(p.steps | 0) > 1 ? (p.steps | 0) : (was.steps | 0),
                   choices:p.choices ? String(p.choices).split("|") : (was.choices || null) };
    V[p.id] = clamp01(p.v);
  }
  if (d.showrays !== undefined){
    showRays = !!d.showrays;
    const b = document.getElementById("bRays");
    if (b) b.classList.toggle("on", showRays);
  }
  if (d.auxConnected !== undefined) auxConnected = d.auxConnected ? 1 : 0;
  if (d.selsrc !== undefined) selectSource(d.selsrc | 0, false);
  if (d.wav) applyWav(d.wav);
  updateAllControls();
  refreshSrcTabs();
  updateHud();
  meshDirty = true;
  invalidate("both");
  NB.send({ k:"stateack" });
});

NB.on("hostParam", d => {
  if (!d || !d.params) return;
  for (const p of d.params) setNative(p.id, p.v);
});

NB.on("notice", d => {
  if (!d) return;
  noticeEl.textContent = String(d.text === undefined ? d : d.text);
});

NB.on("wav", d => { if (d) applyWav(d); });
function applyWav(d){
  wav.name = d.name || "";
  wav.playing = d.playing ? 1 : 0;
  wav.seconds = (typeof d.seconds === "number") ? d.seconds : 0;
  if (typeof d.gain === "number") wav.gain = clamp01(d.gain);
  updateWav();
}

/*  30 Hz. Almost all of it is the same picture as last time, and redrawing an
    unchanged picture is what the idle rule forbids - so the geometry-bearing
    part is hashed and only a real change costs a draw. The speaker's glow is
    the one exception and it is rate-limited and gated on there being signal. */
let lastGlowPaint = -1e9, glowWasOn = false;
function sceneSignature(d){
  let s = "";
  if (d.sources) for (const q of d.sources)
    s += (q.pos ? q.pos.map(n=>n.toFixed(3)).join(",") : "") + "/" + q.yaw + "/" + q.type + "/" + q.active + ";";
  if (d.lis) s += "|" + d.lis.map(n=>n.toFixed(3)).join(",");
  s += "|" + d.lisRoom;
  if (d.rt) s += "|" + d.rt.map(r=>r.map(n=>n.toFixed(3)).join("/")).join(";");
  /*  The plan polygons are geometry, so a room whose wall has moved has to
      cost a redraw - and one whose has not, still none. */
  if (d.plan) for (const poly of d.plan){
    s += "|";
    if (poly) for (const q of poly) s += q[0].toFixed(3) + "," + q[1].toFixed(3) + ";";
  }
  if (d.paths){
    for (const p of d.paths){
      s += "|" + p.t + ":" + p.s + ":" + (typeof p.db === "number" ? p.db.toFixed(2) : "");
      if (p.pts) for (const q of p.pts) s += ";" + q[0].toFixed(3) + "," + q[1].toFixed(3);
    }
  }
  return s;
}
NB.on("scene", d => {
  if (!d) return;
  scene = d;
  if (typeof d.in === "number") inDb = d.in;
  if (typeof d.out === "number") outDb = d.out;
  if (typeof d.drr === "number") drrDb = d.drr;
  updateLevels();
  updateHud();
  const sig = sceneSignature(d);
  if (sig !== sceneSig){ sceneSig = sig; invalidate("both"); }
  /* the radiation cue: at most 10 redraws a second, and none at all in silence */
  const lvl = Math.max(0, Math.min(1, (inDb + 60) / 54));
  const on = inDb > -60;
  if (on){
    const t = nowMs();
    if (t - lastGlowPaint >= 100){
      lastGlowPaint = t; glow = lvl; glowWasOn = true; invalidate("pov");
    }
  } else if (glowWasOn){
    glowWasOn = false; glow = 0; invalidate("pov");      /* one last frame to clear it */
  }
});

/* ==================================================================== */
/*  boot                                                                 */
/* ==================================================================== */
function relayout(){
  const a = sizeCanvas(povCv), b = sizeCanvas(planCv);
  invalidate("both");
}
window.addEventListener("resize", relayout);
try { new ResizeObserver(relayout).observe(document.getElementById("views")); } catch(e){}

buildControls();
selectSource(selSrc, false);
updateAllControls();
updateHud();
updateLevels();
setRaysInitial();
function setRaysInitial(){
  const b = document.getElementById("bRays");
  if (b) b.classList.toggle("on", showRays);
}

/*  The public face for a probe, and for me when something looks wrong. The
    page's state lives inside this closure and is otherwise unreadable, which
    leaves guessing as the only tool. */
window.__TW = {
  state(){ const o = {}; for (const id in V) o[id] = V[id]; return o; },
  setParam(id, v){ setNative(id, v); },       /* as if it came from native: no send */
  scene(){ return scene; },
  render(){
    /*  A frame already asked for has nothing left to do once this has drawn
        everything, so cancel it - which also makes `pending` below mean
        exactly "a redraw is owed", with no stale bookings in it. */
    if (rafId){ try { cancelAnimationFrame(rafId); } catch(e){} rafId = 0; }
    drawPov(); drawPlan();
    dirtyPov = false; dirtyPlan = false;
  },
  errors: window.__err,
  /*  Where the plan actually lands on its canvas. A probe that recomputes this
      for itself is a second copy of the layout, and the two drift the first
      time the margins change - which is exactly what happened. */
  planFit(){ if (!PF) PF = planFit(); return { s:PF.s, ox:PF.ox, oy:PF.oy, leg:PF.leg }; },
  /*  The bounds of the vertices the 3D view is ACTUALLY built from, read off
      the buffer rather than recomputed - the picture alone cannot tell a wall
      that moved from a corner-darkening box that moved with it, and a hook
      that reported the polygon would be reporting the intention. Never builds
      anything: a mesh built here and not uploaded would leave the GPU showing
      the one before it. */
  meshBox(){
    if (!M.n) return null;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0; i < M.n; i++){
      const x = M.pos[i*3], y = M.pos[i*3+1];
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    return [x0, y0, x1, y1];
  },
  /*  The room as it is actually being drawn - the engine's polygon when there
      is one, the page's own when there is not - and the split point a probe
      has to aim at to take hold of a broken wall. Both live in this closure
      and are otherwise unreadable. */
  roomPoly(i){ return roomPoly(i).map(p => [p[0], p[1]]); },
  foldPoint(i, k){ return foldPoint(i, k); },
  /*  What the plan WROTE this time round, recorded where the text is drawn.
      A hook that reported what the page meant to draw could say CONCAVE on a
      sheet with nothing on it. */
  planNotes(){ return planNotes.slice(); },
  get draws(){ return drawCount; },
  /*  True when a redraw is owed. The draw counter alone cannot tell a page
      that scheduled nothing from one whose animation frame simply has not
      arrived yet, and headless Chrome does not always produce frames. */
  get pending(){ return !!rafId; },
  get glow(){ return glow; },
  get renderer(){ return glMode; },
  get pitch(){ return pitchDeg; },
  get rays(){ return showRays; },
  /*  The door handles: where they are, what the pointer is on, and what a
      given point on the canvas would pick. The picking lives in this closure
      and is otherwise unreadable from outside, which leaves guessing. */
  get hoverDoor(){ return hoverDoor ? hoverDoor.id : null; },
  get doorAnim(){ return doorAnimActive(); },
  handlePos(id){ const d = DOORS.filter(x => x.id === id)[0]; return d ? handlePos(d) : null; },
  pick(x, y){ const h = pickHandle(x, y); return h ? { id:h.d.id, t:h.t, dist:h.dist } : null; },
  /*  Where a world point lands on the 3D canvas, in CSS pixels relative to
      the page - the inverse of the ray, so a probe can aim at a handle
      without keeping its own copy of the camera. */
  project(p){
    const r = povCv.getBoundingClientRect();
    const yaw = LYAW()*Math.PI/180, pit = pitchDeg*Math.PI/180;
    const cp = Math.cos(pit), sp = Math.sin(pit);
    const f  = [Math.cos(yaw)*cp, Math.sin(yaw)*cp, sp];
    const rt = [Math.sin(yaw), -Math.cos(yaw), 0];
    const up = crs(rt, f);
    const e = [LX(), LY(), EAR_Z];
    const v = [p[0]-e[0], p[1]-e[1], p[2]-e[2]];
    const z = dot3(v, f);
    if (z <= 0.01) return null;
    const th = Math.tan(fovDeg*Math.PI/360), asp = r.width / r.height;
    const ndcX = dot3(v, rt) / (z * th * asp);
    const ndcY = dot3(v, up) / (z * th);
    return [r.left + (ndcX*0.5 + 0.5) * r.width, r.top + (0.5 - ndcY*0.5) * r.height];
  },
  get selsrc(){ return selSrc; },
  selectSource(i){ selectSource(i, false); },
  wav(){ return { name:wav.name, playing:wav.playing, seconds:wav.seconds, gain:wav.gain }; },
  bg: { pov:FOG.map(v => Math.round(Math.pow(v, 1/2.2) * 255)), plan:PAPER }
};

/*  Draw once so the panel is never blank, then stop. From here on nothing is
    drawn until something a view depends on actually changes. */
drawPov();
drawPlan();
document.getElementById("glName").textContent = glMode === "webgl2" ? "WEBGL2" : "2D FALLBACK";

/*  Announced on EVERY boot, which clears the processor's "the panel has the
    state" flag - without it a reload the editor never sees leaves the
    processor believing the old acknowledgement and this page waits forever. */
NB.send({ k:"hello" });
</script>
</body>
</html>
