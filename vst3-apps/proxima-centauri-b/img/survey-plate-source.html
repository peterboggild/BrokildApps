<!doctype html>
<meta charset="utf-8">
<title>plate</title>
<style>html,body{margin:0;background:#06070a}canvas{display:block}</style>
<canvas id="c" width="2200" height="1238"></canvas>
<script>
/*  A SURVEY PLATE of Proxima Centauri b, not an artist's impression: a tidally
    locked world under an M-dwarf, with the two recovery sites marked the way a
    field chart marks them — leader lines, a graticule, a terminator arc, and
    nothing decorative that does not carry information.

    Computed, like everything else in this collection. */
const c = document.getElementById("c"), g = c.getContext("2d");
const W = c.width, H = c.height;
const CX = W * 0.52, CY = H * 0.50, R = H * 0.365;

/* ---- deterministic noise ------------------------------------------------ */
let _s = 0xB2311;
function rnd(){ _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; }
function vnoise(x, y, s){                       // cheap value noise
  const xi = Math.floor(x*s), yi = Math.floor(y*s);
  const xf = x*s - xi, yf = y*s - yi;
  const h = (a,b)=>{ let n = (a*374761393 + b*668265263) ^ 0; n = (n ^ (n>>13)) * 1274126177; return ((n ^ (n>>16)) >>> 0)/4294967296; };
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v) + (h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v;
}
function fbm(x,y){ let a=0,amp=.5,s=3; for(let i=0;i<6;i++){ a+=vnoise(x,y,s)*amp; s*=2.07; amp*=.5; } return a; }

/* ---- the void ----------------------------------------------------------- */
g.fillStyle = "#06070a"; g.fillRect(0,0,W,H);
for (let i=0;i<1400;i++){
  const x=rnd()*W, y=rnd()*H, m=rnd();
  const a = m*m*0.75;
  g.fillStyle = "rgba(200,214,230," + a.toFixed(3) + ")";
  const r = m*m*1.5 + .35;
  g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
}

/* ---- the planet --------------------------------------------------------- */
/*  Tidally locked under a cool star: the substellar point is fixed, the
    terminator is a permanent ring, and the night side keeps only the heat the
    atmosphere carries round. The light comes from the upper left. */
const LX = -0.86, LY = -0.30, LZ = 0.41;        // light direction, normalised below
const ll = Math.hypot(LX,LY,LZ);
const img = g.createImageData(Math.ceil(R*2)+4, Math.ceil(R*2)+4);
const ox = Math.floor(CX-R)-2, oy = Math.floor(CY-R)-2;
for (let py=0; py<img.height; py++){
  for (let px=0; px<img.width; px++){
    const X = (px+ox-CX)/R, Y = (py+oy-CY)/R;
    const d2 = X*X+Y*Y;
    const i4 = (py*img.width+px)*4;
    if (d2 > 1.0){ img.data[i4+3]=0; continue; }
    const Z = Math.sqrt(1-d2);
    // surface coordinates for texture
    const lon = Math.atan2(X, Z), lat = Math.asin(Y);
    const t = fbm(lon*0.9+4, lat*1.5+2);
    const t2 = fbm(lon*3.1+11, lat*4.0+7);
    // lambert against the fixed star
    let nd = (X*LX + Y*LY + Z*LZ)/ll;
    const day = Math.max(0, nd);
    // M-dwarf light: deep orange-red, weak blue
    const basalt = 15 + t*20 + t2*9;            // rock albedo (dark basalt)
    const dust   = 0.35 + 0.5*t2;
    let r = basalt*(0.55+0.45*dust), gg = basalt*(0.40+0.28*dust), b = basalt*(0.42+0.16*dust);
    const lit = Math.pow(day, 0.82);
    r  = r*0.14 + lit*(210 + 62*t)*(0.80+0.34*dust);
    gg = gg*0.12 + lit*(94  + 44*t)*(0.74+0.30*dust);
    b  = b*0.17 + lit*(52  + 30*t)*(0.68+0.24*dust);
    // terminator: a thin scattering ring where the atmosphere is edge-lit
    const term = Math.exp(-Math.pow(nd/0.13, 2)) * 1.0;
    r += term*120; gg += term*54; b += term*36;
    // night side keeps a faint transported warmth
    if (nd < 0){ const n = Math.exp(nd*3.4); r += n*17; gg += n*7; b += n*7; }
    // limb darkening + a rim of atmosphere
    const limb = Math.pow(Z, 0.42);
    r*=limb; gg*=limb; b*=limb;
    const rim = Math.exp(-(1-d2)*9.0)*0.85;
    r += rim*90; gg += rim*44; b += rim*40;
    img.data[i4]   = Math.max(0,Math.min(255,r));
    img.data[i4+1] = Math.max(0,Math.min(255,gg));
    img.data[i4+2] = Math.max(0,Math.min(255,b));
    img.data[i4+3] = 255;
  }
}
g.putImageData(img, ox, oy);

/* ---- survey overlay ----------------------------------------------------- */
g.save();
g.beginPath(); g.arc(CX,CY,R,0,6.2832); g.clip();
g.strokeStyle = "rgba(126,214,200,0.17)"; g.lineWidth = 1;
for (let k=-4;k<=4;k++){                        // parallels
  const y = Math.sin(k*Math.PI/10)*R;
  const w = Math.sqrt(Math.max(0,R*R-y*y));
  g.beginPath(); g.ellipse(CX, CY+y, w, w*0.13, 0, 0, 6.2832); g.stroke();
}
for (let k=0;k<12;k++){                          // meridians
  const a = k*Math.PI/12;
  g.beginPath(); g.ellipse(CX, CY, R*Math.abs(Math.cos(a)), R, 0, 0, 6.2832); g.stroke();
}
g.restore();

/* the terminator arc, marked as the chart feature it is */
/*  Drawn where it actually is: the great circle normal to the light, i.e. the
    locus of n.L = 0, projected. Not an ellipse chosen by eye. */
const Lv = [LX/ll, LY/ll, LZ/ll];
let uA = [0,1,0];
const dp = uA[0]*Lv[0]+uA[1]*Lv[1]+uA[2]*Lv[2];
uA = [uA[0]-dp*Lv[0], uA[1]-dp*Lv[1], uA[2]-dp*Lv[2]];
const un = Math.hypot(uA[0],uA[1],uA[2]); uA = uA.map(q=>q/un);
const vA = [Lv[1]*uA[2]-Lv[2]*uA[1], Lv[2]*uA[0]-Lv[0]*uA[2], Lv[0]*uA[1]-Lv[1]*uA[0]];
g.strokeStyle = "rgba(255,206,168,0.62)"; g.lineWidth = 2.0; g.setLineDash([10,8]);
g.beginPath();
let started = false;
for (let i=0;i<=360;i++){
  const a = i*Math.PI/180;
  const px = Math.cos(a)*uA[0] + Math.sin(a)*vA[0];
  const py = Math.cos(a)*uA[1] + Math.sin(a)*vA[1];
  const pz = Math.cos(a)*uA[2] + Math.sin(a)*vA[2];
  if (pz <= 0){ started = false; continue; }
  const X = CX + px*R, Y = CY + py*R;
  if (!started){ g.moveTo(X,Y); started = true; } else g.lineTo(X,Y);
}
g.stroke(); g.setLineDash([]);

/* the disc edge */
g.strokeStyle = "rgba(150,196,190,0.42)"; g.lineWidth = 1.4;
g.beginPath(); g.arc(CX,CY,R,0,6.2832); g.stroke();

/* ---- site indicators ---------------------------------------------------- */
function site(u, v, label, sub, dir, strong){
  //  u,v are disc-relative (-1..1); project onto the sphere for honesty
  const X = u, Y = v, d2 = X*X+Y*Y;
  if (d2 > 1) return;
  const x = CX + X*R, y = CY + Y*R;
  const acc = strong ? "rgba(126,226,208," : "rgba(190,206,214,";
  const a1 = strong ? "1)" : "0.62)";
  g.strokeStyle = acc + a1; g.fillStyle = acc + a1; g.lineWidth = strong ? 2 : 1.3;
  // reticle
  g.beginPath(); g.arc(x,y, strong?13:9, 0, 6.2832); g.stroke();
  g.beginPath(); g.arc(x,y, 2.6, 0, 6.2832); g.fill();
  for (const t of [0, Math.PI/2, Math.PI, 3*Math.PI/2]){
    const r0 = strong?17:12, r1 = strong?25:18;
    g.beginPath();
    g.moveTo(x+Math.cos(t)*r0, y+Math.sin(t)*r0);
    g.lineTo(x+Math.cos(t)*r1, y+Math.sin(t)*r1);
    g.stroke();
  }
  // leader
  const lx = x + dir*118, ly = y - 74;
  g.beginPath(); g.moveTo(x + dir*(strong?26:19), y - 16); g.lineTo(lx, ly); g.lineTo(lx + dir*104, ly); g.stroke();
  g.textAlign = dir > 0 ? "left" : "right";
  const tx = lx + dir*112;
  g.font = "600 27px ui-monospace, Menlo, Consolas, monospace";
  g.fillText(label, tx, ly - 6);
  g.font = "20px ui-monospace, Menlo, Consolas, monospace";
  g.fillStyle = "rgba(168,190,196,0.86)";
  g.fillText(sub, tx, ly + 22);
}
site(-0.47, -0.26, "KELL RILLE",      "B2311.22  ·  day 81",   -1, true);   // day side
site( 0.30,  0.34, "SABIK TERMINATOR","B2311.67  ·  day 204",   1, true);   // on the boundary

/* ---- plate furniture ---------------------------------------------------- */
g.fillStyle = "rgba(126,226,208,0.92)";
g.textAlign = "left";
g.font = "600 34px ui-monospace, Menlo, Consolas, monospace";
g.fillText("PROXIMA CENTAURI b", 64, 78);
g.font = "21px ui-monospace, Menlo, Consolas, monospace";
g.fillStyle = "rgba(168,190,196,0.75)";
g.fillText("SURVEY PLATE  ·  RECOVERY SITES  ·  2 OF 2 RECOVERED", 64, 112);
g.textAlign = "right";
g.fillText("TIDALLY LOCKED  ·  SUBSTELLAR POINT FIXED  ·  TERMINATOR MARKED", W-64, 112);
g.font = "18px ui-monospace, Menlo, Consolas, monospace";
g.fillStyle = "rgba(126,226,208,0.55)";
g.textAlign = "left";
g.fillText("0.0485 AU  ·  11.19 d  ·  M5.5Ve PRIMARY", 64, H-58);
g.textAlign = "right";
g.fillText("FIELD RECORD  B2311", W-64, H-58);
/* scale bar */
g.strokeStyle = "rgba(168,190,196,0.5)"; g.lineWidth = 2;
g.beginPath(); g.moveTo(W-64-260, H-92); g.lineTo(W-64, H-92); g.stroke();
for (const t of [0,0.5,1]){ const x = W-64-260+260*t; g.beginPath(); g.moveTo(x,H-92); g.lineTo(x,H-84); g.stroke(); }
document.title = "ready";
</script>
