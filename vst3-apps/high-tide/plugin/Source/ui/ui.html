<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>High Tide</title>
<script src="bwfx-rack.js"></script>
<style>
/* =============================================================================
   HIGH TIDE - the panel.  "A chart table at night."
   Ground: dark linen.  Fittings: brass.  Water: teal.  Timeline: cream paper.
   Decal hooks (real brass/paper images drop in later): the --decal-* variables
   default to none and are used as the first layer of the relevant backgrounds.
   ============================================================================= */
:root{
  --ground:#0a141c; --ink:#1d2f4a; --paper:#e8dcc0;
  --brass:#c9a24a; --brass-hi:#e8c56a; --brass-dk:#8a6a2a;
  --teal:#1fb5c4; --teal-hi:#6fe3ee; --coral:#ff7a59; --sand:#d9c7a0; --slate:#2a3a48;
  --txt:#cdd6dc; --mut:#7d8d98; --line:rgba(201,162,74,.28);
  /* A hook stays `none` unless the delivered part suits the thing that
     consumes it. --decal-bezel is the header band and the tube ferrules, and a
     ring is neither; the bezel is drawn on the round scope by the overlay.
     --decal-knob is the switch dot, whose colour carries its state. ground and
     paper came back as flat strips with no texture in them. */
  /* A hook stays none unless the delivered part suits what consumes it.
     --decal-bezel is the header band and the tube ferrules, and a ring is
     neither; the bezel is drawn on the round scope by the overlay. --decal-knob
     is the switch dot, whose colour carries its state. The nameplate's
     lettering is cut by the plate's own edge in the artwork. */
  --decal-knob:none; --decal-bezel:none; --decal-nameplate:none;
  --decal-ground:url(decals/ht-ground.png); --decal-paper:url(decals/ht-paper.png);
  --decal-glass:url(decals/ht-glass.png); --decal-wood:url(decals/ht-wood.png);
  --hdr-h:46px; --rail-l:150px; --rail-r:232px;
  --serif:Georgia,"Times New Roman",serif;
  --mono:Consolas,"Cascadia Mono","Lucida Console",monospace;
}
html,body{margin:0;height:100%;background:var(--ground);color:var(--txt);
  font:12px var(--serif);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#deck{position:relative;height:100vh;width:100vw;display:grid;
  grid-template-rows:var(--hdr-h) minmax(0,1fr) auto 30%;
  background-color:var(--ground);
  background-image:var(--decal-ground),
    radial-gradient(ellipse at 50% 15%,rgba(31,181,196,.07),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}

/* ---- header ---------------------------------------------------------------- */
#hdr{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-bottom:1px solid var(--brass-dk);
  background-image:var(--decal-bezel),linear-gradient(#13212c,#0b151d);
  box-shadow:0 1px 0 rgba(232,197,106,.15) inset,0 3px 12px rgba(0,0,0,.5)}
#plate{display:flex;align-items:baseline;gap:10px;padding:2px 12px 2px 8px;
  border:1px solid var(--brass-dk);border-radius:3px;
  background-image:var(--decal-nameplate),linear-gradient(#1c2a36,#0e1a24)}
#plate .np{font:600 19px var(--serif);font-variant:small-caps;letter-spacing:.26em;
  background:linear-gradient(#f0d78c,#c9a24a 55%,#8a6a2a);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-shadow:none}
#plate .np2{font:italic 11px var(--serif);color:var(--mut);letter-spacing:.06em}
#patchname{flex:1;min-width:60px;display:flex;align-items:baseline;gap:8px;overflow:hidden;white-space:nowrap}
#pn{font:italic 14px var(--serif);color:#e6d3a3;overflow:hidden;text-overflow:ellipsis}
#pntag{font:9px var(--mono);color:var(--teal);letter-spacing:.14em;border:1px solid rgba(31,181,196,.4);
  border-radius:2px;padding:0 4px;display:none}
#pntag.on{display:inline-block}
.hgrp{display:flex;align-items:center;gap:5px}
.hsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.hb{font:11px var(--serif);font-variant:small-caps;letter-spacing:.12em;padding:3px 9px;
  border:1px solid var(--brass-dk);border-radius:3px;color:#e6d3a3;
  background:linear-gradient(#1c2a36,#0d161e);box-shadow:0 1px 0 rgba(232,197,106,.12) inset;
  white-space:nowrap}
.hb:hover{color:#fff;border-color:var(--brass)}
.hb.on{color:var(--teal-hi);border-color:var(--teal);box-shadow:0 0 8px rgba(31,181,196,.35)}
.hb.warn:hover{color:#ffb4a0;border-color:var(--coral)}
#globe{width:24px;height:24px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 32%,#3a7f8a,#0d2b31 70%);border:1px solid #2f6c74;color:#7fe6ef}
#globe:hover{box-shadow:0 0 10px rgba(60,190,200,.55)}
#globe .bwfx-globe{width:15px;height:15px}
#build{font:10px var(--mono);color:var(--mut);letter-spacing:.08em;margin-left:4px}

/* ---- the three regions ------------------------------------------------------ */
#main{display:grid;grid-template-columns:var(--rail-l) minmax(0,1fr) var(--rail-r);min-height:0}
#rail-l,#rail-r{overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:thin;scrollbar-color:#3a4a56 transparent}
#rail-l{border-right:1px solid var(--line);padding:8px 8px 12px}
#rail-r{border-left:1px solid var(--line);padding:4px 12px 14px 12px}
#view{position:relative;min-width:0;min-height:0;overflow:hidden;background:#07101a}
#gl,#ov{position:absolute;left:0;top:0;width:100%;height:100%}
#ov{touch-action:none;cursor:crosshair}
#ov.orbit{cursor:grab}
#homebtn{position:absolute;left:10px;top:10px;z-index:3}
#viewtip{position:absolute;left:74px;top:12px;max-width:46%;text-align:left;font:italic 10px var(--serif);color:rgba(205,214,220,.45);pointer-events:none}

/* ---- section titles & the sculpt rail --------------------------------------- */
h3.st{margin:6px 0 6px;font:italic 12px var(--serif);font-variant:small-caps;letter-spacing:.16em;color:var(--brass);
  border-bottom:1px solid var(--line);padding-bottom:2px}
h3.st:first-child{margin-top:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tool{font:10.5px var(--serif);font-variant:small-caps;letter-spacing:.1em;padding:5px 2px;text-align:center;
  border:1px solid rgba(201,162,74,.35);border-radius:3px;color:#d8c9a5;
  background:linear-gradient(#162431,#0d161e)}
.tool:hover{border-color:var(--brass);color:#fff}
.tool.on{color:var(--teal-hi);border-color:var(--teal);background:linear-gradient(#123038,#0b1c22);
  box-shadow:0 0 8px rgba(31,181,196,.3)}
.toolrow{display:flex;gap:4px;margin-top:6px}
.toolrow .tool{flex:1}
.mini{margin:7px 0 2px}
.mini .cn{display:flex;justify-content:space-between;align-items:baseline}
#stamps{display:none;margin-top:6px}
#stamps.on{display:block}
#stamps .stamp{display:block;width:100%;text-align:left;font:10.5px var(--serif);font-variant:small-caps;letter-spacing:.08em;
  padding:3px 6px;color:#c8bda0;border-left:2px solid transparent}
#stamps .stamp:hover{color:#fff}
#stamps .stamp.on{color:var(--teal-hi);border-left-color:var(--teal)}
.sw{display:flex;align-items:center;gap:8px;margin:8px 0 4px;cursor:pointer}
.sw .knob{width:30px;height:15px;border-radius:8px;border:1px solid var(--brass-dk);position:relative;
  background:linear-gradient(#0d161e,#1a2733);flex:none}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;
  background-image:var(--decal-knob),radial-gradient(circle at 35% 35%,var(--brass-hi),var(--brass-dk));transition:left .15s}
.sw.on .knob{border-color:var(--teal);box-shadow:0 0 6px rgba(31,181,196,.35)}
.sw.on .knob::after{left:17px;background-image:var(--decal-knob),radial-gradient(circle at 35% 35%,#8ff,var(--teal))}
.sw .lab{font:11px var(--serif);font-variant:small-caps;letter-spacing:.12em;color:#d8c9a5}
#lockhint{font:italic 10px var(--serif);color:var(--coral);min-height:13px;margin:2px 0 0}
#floornote{font:italic 10px var(--serif);color:var(--mut);margin-top:8px;line-height:1.35}

/* ---- the control rail: tide-gauge tubes ------------------------------------- */
.ctl{margin:5px 0 7px;position:relative}
.ctl .cn{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ctl .nm{font:11.5px var(--serif);font-variant:small-caps;letter-spacing:.08em;color:#d8c9a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl .vl{font:10.5px var(--mono);color:var(--teal-hi);white-space:nowrap}
.tube{position:relative;height:11px;margin:3px 7px 0;border-radius:6px;cursor:ew-resize;
  background:linear-gradient(#070d12,#172431 45%,#0b141c);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.9),0 0 0 1px rgba(201,162,74,.22)}
.tube::before,.tube::after{content:"";position:absolute;top:-2px;bottom:-2px;width:6px;border-radius:2px;
  background-image:var(--decal-bezel),linear-gradient(90deg,var(--brass-dk),var(--brass-hi) 45%,var(--brass-dk))}
.tube::before{left:-7px}.tube::after{right:-7px}
.tube .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:5px;
  background:linear-gradient(#7fe9f1,#1fb5c4 55%,#117a86);box-shadow:0 0 6px rgba(31,181,196,.45)}
.tube .glass{position:absolute;left:5px;right:5px;top:1px;height:3px;border-radius:3px;background:rgba(255,255,255,.13);pointer-events:none}
.tube .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(232,197,106,.45);pointer-events:none;display:none}
.ctl.bipol .tube .zero{display:block}
.ctl.tide .tube{height:26px;border-radius:7px;
  background:linear-gradient(#070d12,#172431 45%,#0b141c),
    repeating-linear-gradient(90deg,transparent 0 9%,rgba(232,197,106,.35) 9% 10%)}
.ctl.tide .tube .fill{top:3px;bottom:3px;border-radius:6px;
  background:linear-gradient(#a8f0f6,#1fb5c4 40%,#0e6d78);
  background-image:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.18) 9% 10%),linear-gradient(#a8f0f6,#1fb5c4 40%,#0e6d78)}
.ctl.tide .tube .glass{top:2px;height:5px}
.ctl.tide .nm{color:var(--teal-hi)}
.seg{display:flex;align-items:center;margin:2px 0 0;border:1px solid rgba(201,162,74,.3);border-radius:3px;
  background:linear-gradient(#0d161e,#131f2a)}
.seg button{width:22px;height:18px;color:var(--brass);font:12px var(--mono)}
.seg button:hover{color:#fff;background:rgba(201,162,74,.12)}
.seg .cur{flex:1;text-align:center;font:10.5px var(--mono);color:var(--teal-hi);letter-spacing:.06em;cursor:ew-resize}

/* ---- timeline & keyboard ---------------------------------------------------- */
#tl{position:relative;min-height:120px;border-top:2px solid var(--brass-dk);
  background-image:var(--decal-paper),linear-gradient(#ebe0c6,#e2d4b5);background-color:var(--paper);
  box-shadow:0 -4px 14px rgba(0,0,0,.5)}
#tlc{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#kbd{height:0;overflow:hidden;position:relative;border-top:1px solid transparent}
#kbd.on{height:82px;border-top-color:var(--brass-dk)}
#keys{position:absolute;left:10px;right:10px;top:6px;bottom:6px}
.key{position:absolute;top:0;bottom:0;border:1px solid #2a3a48;border-radius:0 0 3px 3px;box-sizing:border-box;cursor:pointer;
  background:linear-gradient(#f2ead8,#d9cfb3);}
.key.blk{top:0;height:58%;background:linear-gradient(#2a3a48,#0b141c);border-color:#0a141c;z-index:2;border-radius:0 0 2px 2px}
.key.dn{background:linear-gradient(#8fe6ee,#1fb5c4)}
.key.blk.dn{background:linear-gradient(#1fb5c4,#0e6d78)}
.key i{position:absolute;bottom:3px;left:0;right:0;text-align:center;font:9px var(--mono);color:#556;font-style:normal;pointer-events:none}
.key.blk i{color:#9ab}

/* ---- fly-out menus ------------------------------------------------------------ */
.pmenu{position:fixed;z-index:60;min-width:170px;max-height:70vh;overflow:auto;background:#0f1a24;border:1px solid var(--brass-dk);
  box-shadow:0 8px 28px rgba(0,0,0,.65);padding:4px 0;scrollbar-width:thin}
.pmi{padding:4px 14px 4px 12px;font:11px var(--serif);font-variant:small-caps;letter-spacing:.1em;color:#e6d3a3;cursor:pointer;white-space:nowrap;
  display:flex;justify-content:space-between;gap:12px}
.pmi:hover{background:rgba(31,181,196,.16);color:#fff}
.pmi em{font:italic 10px var(--serif);color:var(--mut)}
.pmfolder::after{content:"\25B8";color:var(--brass)}
.pmdim{color:var(--mut);cursor:default;font-style:italic}
.pmdim:hover{background:none;color:var(--mut)}
.pmsep{height:1px;margin:4px 0;background:var(--line)}

/* ---- splash --------------------------------------------------------------------- */
#splash{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--ground);transition:opacity .4s;pointer-events:none}
#splash.off{opacity:0}
#splash .np{font:600 26px var(--serif);font-variant:small-caps;letter-spacing:.3em;color:var(--brass)}
#splash .sub{font:italic 12px var(--serif);color:var(--mut)}

/* ---- the hints layer: a popup beside the control, never under the pointer -- */
#tip{position:fixed;z-index:400;max-width:290px;pointer-events:none;opacity:0;
  transition:opacity .12s ease;background:linear-gradient(#132433,#0c1721);
  border:1px solid var(--brass-dk);border-radius:5px;padding:8px 11px 9px;
  box-shadow:0 8px 26px rgba(0,0,0,.62),0 0 0 1px rgba(0,0,0,.35);
  font:11.5px/1.42 var(--serif);color:#d8e2e6}
#tip.on{opacity:1}
#tip .tt{font-variant:small-caps;letter-spacing:.13em;font-size:11px;color:var(--brass);
  display:block;margin-bottom:3px}
#tip .tw{display:block;color:#e6eef1}
#tip .th{display:block;color:#9fb3ba;margin-top:4px;font-style:italic}
#tip .tv{display:block;margin-top:6px;padding-top:5px;border-top:1px solid rgba(201,162,74,.22);
  font:10px var(--mono);letter-spacing:.06em;color:var(--teal-hi)}
#tip .tv i{color:var(--mut);font-style:normal}
.pmgrp{padding:6px 12px 2px;font:italic 9.5px var(--serif);letter-spacing:.18em;
  text-transform:uppercase;color:var(--brass-dk);cursor:default}
.pmgrp:hover{background:none}

/* ---- the decals. Each applies only when its image has loaded, so the panel
   without them is exactly the panel that shipped. ------------------------- */
.dec-ground #deck{background-size:auto,auto,auto,auto;
  background-repeat:repeat,no-repeat,repeat,repeat;
  background-blend-mode:normal,screen,normal,normal}
.dec-paper #tl{background-size:auto,auto;background-repeat:repeat,no-repeat}
.dec-glass .tube{background-image:var(--decal-glass);background-size:100% 100%;
  background-repeat:no-repeat}
.dec-glass .tube::before,.dec-glass .tube::after{display:none}
.dec-glass .tube .fill{opacity:.88}
.dec-wood #hdr::after,.dec-wood #tl::before{
  content:"";position:absolute;left:0;right:0;height:5px;z-index:3;
  background-image:var(--decal-wood);background-size:auto 100%;
  background-repeat:repeat-x;pointer-events:none;
  box-shadow:0 1px 3px rgba(0,0,0,.55)}
.dec-wood #hdr::after{bottom:-5px}
.dec-wood #tl::before{top:-5px}
</style>
</head>
<body>
<div id="deck">

  <!-- ===================================================== HEADER ============ -->
  <header id="hdr">
    <div id="plate"><span class="np">High Tide</span><span class="np2">a Brokild synth</span></div>
    <div id="patchname"><span id="pn">&mdash;</span><span id="pntag">json</span></div>
    <div class="hgrp">
      <button class="hb" id="b-factory">Factory</button>
      <button class="hb" id="b-patches">Patches</button>
      <button class="hb" id="b-save">Save</button>
      <button class="hb" id="b-open">Open</button>
      <span class="hsep"></span>
      <button class="hb" id="b-pngin">PNG in</button>
      <button class="hb" id="b-pngout">PNG out</button>
      <button class="hb" id="b-photo">Photo</button>
      <input type="file" id="photofile" accept="image/*" hidden>
      <span class="hsep"></span>
      <button class="hb" id="b-keys">Keys</button>
      <button class="hb on" id="b-hints">Hints</button>
      <button class="hb warn" id="b-panic">Panic</button>
      <button id="globe" title="Brokild World FX" data-bwfx-open></button>
      <span id="build">dev</span>
    </div>
  </header>

  <div id="main">
    <!-- =================================================== LEFT: SCULPT ======= -->
    <aside id="rail-l">
      <h3 class="st">Sculpt</h3>
      <div class="tools" id="tools">
        <button class="tool on" data-tool="push" title="raise with a raised-cosine brush">Push</button>
        <button class="tool" data-tool="pull" title="lower with the brush">Pull</button>
        <button class="tool" data-tool="smooth" title="smooth under the brush">Smooth</button>
        <button class="tool" data-tool="pit" title="dig a narrow pit">Pit</button>
        <button class="tool" data-tool="ridge" title="raise the whole column band">Ridge</button>
        <button class="tool" data-tool="tilt" title="add a slope along z under the band">Tilt</button>
        <button class="tool" data-tool="mirror" title="mirror the column about its floor">Mirror</button>
        <button class="tool" data-tool="stamp" title="drop a known bowl into the band">Stamp</button>
        <button class="tool" data-tool="relief" title="edit R(z) alone: drag the relief strip">Relief</button>
        <button class="tool" data-tool="flatten" title="flatten toward the height under the pointer">Flatten</button>
      </div>
      <div id="stamps">
        <button class="stamp on" data-stamp="sine">Sine bowl</button>
        <button class="stamp" data-stamp="box">Box</button>
        <button class="stamp" data-stamp="pitbowl">Pit bowl</button>
        <button class="stamp" data-stamp="double">Double well</button>
        <button class="stamp" data-stamp="shelf">Shelf</button>
      </div>
      <div class="ctl mini" id="c-radius"><div class="cn"><span class="nm">radius</span><span class="vl" id="v-radius">0.15</span></div>
        <div class="tube" id="t-radius"><div class="fill"></div><div class="glass"></div></div></div>
      <div class="ctl mini" id="c-strength"><div class="cn"><span class="nm">strength</span><span class="vl" id="v-strength">50 %</span></div>
        <div class="tube" id="t-strength"><div class="fill"></div><div class="glass"></div></div></div>
      <div class="sw on" id="sw-lock"><span class="knob"></span><span class="lab">Tune lock</span></div>
      <div id="lockhint"></div>
      <h3 class="st">Terrain</h3>
      <div class="toolrow"><button class="tool" id="b-generate">Generate &#9662;</button></div>
      <div class="toolrow"><button class="tool" id="b-undo" title="Ctrl-Z">Undo</button><button class="tool" id="b-redo" title="Ctrl-Y">Redo</button></div>
      <div id="floornote">brush floor 0.04 x&middot;units &mdash; the ball cannot see anything narrower</div>
    </aside>

    <!-- =================================================== CENTRE: TERRAIN ==== -->
    <div id="view">
      <canvas id="gl"></canvas>
      <canvas id="ov"></canvas>
      <button class="hb" id="homebtn" title="reset the camera">Home</button>
      <div id="viewtip">left-drag sculpts &middot; right-drag / alt-drag orbits &middot; wheel zooms &middot; shift-click strikes a ball</div>
    </div>

    <!-- =================================================== RIGHT: CONTROLS ==== -->
    <aside id="rail-r"></aside>
  </div>

  <!-- ===================================================== KEYBOARD =========== -->
  <div id="kbd"><div id="keys"></div></div>

  <!-- ===================================================== TIMELINE =========== -->
  <div id="tl"><canvas id="tlc"></canvas></div>

  <div id="tip"></div>
<div id="splash"><div class="np">High Tide</div><div class="sub">the chart table is being laid</div></div>
</div>
<script>
window.__err = null;
addEventListener("error", e => { window.__err = (e.message||"")+" @"+(e.lineno||"?"); });
/* ===========================================================================
   0 . the bridge  (PROTOCOL.md section 0)
   =========================================================================== */
const H = {};                                  // event name -> handler (the mock calls these too)
const NB = (() => {
  let q = [], sched = false;
  const flush = () => { sched = false; const b = q; q = [];
    if (window.__MOCK) { try { window.__MOCK.recv(b); } catch (e) { window.__err = "mock: "+e.message; } return; }
    try { window.__JUCE__.backend.emitEvent("hightide", { b }); } catch (e) {} };
  return {
    send(m){ q.push(m); if(!sched){ sched = true; queueMicrotask(flush); } },
    on(n,f){ H[n]=f; try { window.__JUCE__.backend.addEventListener(n,f); } catch(e){} },
    live(){ return !!(window.__JUCE__ && window.__JUCE__.backend); }
  };
})();
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp = (a,b,t) => a+(b-a)*t;
const sstep = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
const TAU = Math.PI*2;
const el = (tag, cls, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };

if (window.BWFX) {
  BWFX.attach({ send: o => { const m = {k:"bwfx"}; for(const k in o) m[k]=o[k]; NB.send(m); } });
  NB.on("bwfx", p => BWFX.onState(p));
}

/* base64 <-> Float32 */
function b64bytes(s){ const bin=atob(s); const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function b64floats(s){ const u=b64bytes(s); return new Float32Array(u.buffer, u.byteOffset, u.byteLength>>2); }
function b64into(s, u8){ const bin=atob(s); const n=Math.min(bin.length,u8.length);

const P = {};                 // id -> {id,name,gloss,kind,v,lo,hi,list,def}
let PIDS = [];
const V = {};                 // id -> normalised value (the page's mirror of the host)
let BUILD = "dev", FACTORY = [], PATCH = {name:"", user:false};

function loadSpecs(list){
  PIDS = [];
  for (const e of list){
    const s = Array.isArray(e) ? {id:e[0],name:e[1],kind:e[2],v:e[3],gloss:e[4]||"",lo:e[5],hi:e[6],list:e[7]} : e;
    const id = s.id; if(!id) continue;
    const had = P[id];
    P[id] = { id, name:s.name||id, gloss:s.gloss||"", kind:(s.kind|0), v:+s.v||0,
              lo: s.lo!==undefined ? +s.lo : (had?had.lo:undefined),
              hi: s.hi!==undefined ? +s.hi : (had?had.hi:undefined),
              list: s.list || (had?had.list:null),
              //  the native side sends the parameter's real default; the first
              //  value seen is only the fallback for the page's own stub table
              def: s.def!==undefined ? +s.def : (had && had.def!==undefined ? had.def : +s.v||0) };
    V[id] = P[id].v; PIDS.push(id);
  }
}
function listOf(id){ const p=P[id]; return (p && p.list && p.list.length) ? p.list : null; }
function listIdx(id){ const l=listOf(id); if(!l) return 0; return clamp(Math.round(V[id]*(l.length-1)),0,l.length-1); }
function intRange(id){ const p=P[id]; const lo = p.lo!==undefined?p.lo:1, hi = p.hi!==undefined?p.hi:4; return [lo,Math.max(lo+1,hi)]; }
function intVal(id){ const [lo,hi]=intRange(id); return lo+Math.round(V[id]*(hi-lo)); }
function hzRange(id){ const p=P[id]; const lo=(p.lo!==undefined&&p.lo>0)?p.lo:0.02, hi=(p.hi!==undefined&&p.hi>lo)?p.hi:20; return [lo,hi]; }
function hzOf(id){ const [lo,hi]=hzRange(id); return lo*Math.pow(hi/lo, V[id]); }
function secOf(v){ return 0.002*Math.pow(4000, clamp(v,0,1)); }
function fmtHz(f){ return f<1 ? f.toFixed(3).replace(/0+$/,"").replace(/\.$/,"")+" Hz" : f<10 ? f.toFixed(2)+" Hz" : f.toFixed(1)+" Hz"; }
function fmtSec(s){ return s<1 ? (s*1000).toFixed(s<0.01?2:1)+" ms" : s.toFixed(2)+" s"; }
function fmt(id, v){
  const p=P[id]; if(!p) return v.toFixed(2); const k=p.kind;
  if (k===KP.LIST){ const l=listOf(id); return l ? l[clamp(Math.round(v*(l.length-1)),0,l.length-1)] : Math.round(v*100)+" %"; }
  if (k===KP.INT){ const [lo,hi]=intRange(id); return String(lo+Math.round(v*(hi-lo))); }
  if (k===KP.BIPOL){ const b=Math.round((v*2-1)*100); return (b>0?"+":"")+b+" %"; }
  if (k===KP.SEMI){ const s=(v*2-1)*12; return (s>=0?"+":"")+s.toFixed(1)+" st"; }
  if (k===KP.HZ){ const [lo,hi]=hzRange(id); return fmtHz(lo*Math.pow(hi/lo,v)); }
  if (k===KP.SEC) return fmtSec(secOf(v));
  return Math.round(v*100)+" %";
}
loadSpecs(SPECS_FALLBACK);

/* ===========================================================================
   2 . the terrain model  (PROTOCOL.md section 3)
   =========================================================================== */
const NX=512, NZ=128, XMIN=-1.5, XMAX=1.5, UMAX=4.0, DX=(XMAX-XMIN)/(NX-1);
const ZLEN=2.4, YS=0.8;                   // display: z spans ZLEN world units, height scaled by YS
let U  = new Float32Array(NX*NZ);         // the terrain, U >= 0
const UE = new Float32Array(NX*NZ);       // the EFFECTIVE terrain (flooded columns lifted to the water line)
const FLOOR = new Int32Array(NZ), REL = new Float32Array(NZ), TEN = new Float32Array(NZ), COLF = new Uint8Array(NZ);
const SCR = new Float32Array(NX*NZ);      // scratch (smooth, photo)
let Rmin=0, Rmax=0, Tabs=0, waterT=0.5;   // waterT: the tide the water is drawn at
const xOf = i => XMIN + i*DX;
const iOf = x => clamp(Math.round((x-XMIN)/DX), 0, NX-1);
const zOf = j => j/(NZ-1);
const jOf = z => clamp(Math.round(z*(NZ-1)), 0, NZ-1);
const dirty = { any:false, i0:NX, i1:-1, j0:NZ, j1:-1 };
let ueDirty = true, tenDirty = true;

function colStats(j){ const o=j*NX; let f=0, m=U[o]; for(let i=1;i<NX;i++){ const u=U[o+i]; if(u<m){ m=u; f=i; } } FLOOR[j]=f; REL[j]=m; }
function reliefRange(){ Rmin=Infinity; Rmax=-Infinity; for(let j=0;j<NZ;j++){ if(REL[j]<Rmin) Rmin=REL[j]; if(REL[j]>Rmax) Rmax=REL[j]; } }
function allStats(){ for(let j=0;j<NZ;j++) colStats(j); reliefRange(); ueDirty=true; tenDirty=true; }
function computeUE(){
  Tabs = Rmin + waterT*(Rmax-Rmin+1e-3);
  for(let j=0;j<NZ;j++){ const o=j*NX; const add=Math.max(REL[j],Tabs)-REL[j]; for(let i=0;i<NX;i++) UE[o+i]=U[o+i]+add; }
  ueDirty=false;
}
function uEffAt(x, z){   // bilinear, z normalised 0..1
  const fx=clamp((x-XMIN)/DX,0,NX-1.0001), fz=clamp(z*(NZ-1),0,NZ-1.0001);
  const i=fx|0, j=fz|0, tx=fx-i, tz=fz-j; const o=j*NX+i;
  return (UE[o]*(1-tx)+UE[o+1]*tx)*(1-tz) + (UE[o+NX]*(1-tx)+UE[o+NX+1]*tx)*tz;
}
/* width of column j at height h above its floor, measured on the raw terrain: x+ - x- (NaN if a side never reaches h) */
function colWidth(j, h){
  const o=j*NX, f=FLOOR[j], R=REL[j], tgt=R+h; let xl=NaN, xr=NaN;
  for(let i=f;i>0;i--){ if(U[o+i-1]>=tgt){ const a=U[o+i], b=U[o+i-1]; const t=b>a?(tgt-a)/(b-a):0; xl=xOf(i)-t*DX; break; } }
  for(let i=f;i<NX-1;i++){ if(U[o+i+1]>=tgt){ const a=U[o+i], b=U[o+i+1]; const t=b>a?(tgt-a)/(b-a):0; xr=xOf(i)+t*DX; break; } }
  return xr-xl;
}
/* departure from the width rule: mean |w/(2 sqrt 2h) - 1| over a dozen heights */
function colTension(j){
  let s=0, n=0;
  for(let k=1;k<=12;k++){ const h=k*0.03; const w=colWidth(j,h); if(w!==w) break; s+=Math.abs(w/(2*Math.sqrt(2*h))-1); n++; }
  TEN[j] = n ? clamp(s/n*2.5, 0, 1) : 0;
}
function allTension(){ for(let j=0;j<NZ;j++) colTension(j); tenDirty=false; }
function markDirty(i0,i1,j0,j1){ dirty.any=true; if(i0<dirty.i0) dirty.i0=i0; if(i1>dirty.i1) dirty.i1=i1; if(j0<dirty.j0) dirty.j0=j0; if(j1>dirty.j1) dirty.j1=j1; }
function columnsChanged(j0,j1){
  for(let j=j0;j<=j1;j++){ colStats(j); colTension(j); }
  reliefRange(); ueDirty=true; GLV.hDirty=true; GLV.cDirty=true;
}
function terrainReplaced(){ allStats(); allTension(); GLV.hDirty=true; GLV.cDirty=true; }

/* ---- TUNE LOCK: rebuild the other wall so that at every height h the width equals 2 sqrt(2h) ----
   side: -1 = the left wall is authoritative (the brush touched it), +1 = the right wall.
   Returns false (and leaves the column alone) when the authoritative wall has a pit or the column is flagged. */
const PIT_EPS = 0.03, TABK = 1024;
const TAB_RD = new Float64Array(TABK+1), TAB_H = new Float64Array(TABK+1);
const PROF_D = new Float64Array(NX), PROF_H = new Float64Array(NX);
function tuneLockColumn(j, side){
  if (COLF[j] & 1) return false;
  colStats(j);
  const o=j*NX, fi=FLOOR[j], R=REL[j], dir = side<0 ? -1 : 1;
  let nP=0, run=0, dip=0;
  for(let k=1;;k++){ const i=fi+dir*k; if(i<0||i>=NX) break; const h=U[o+i]-R;
    if(h<run-1e-6) dip=Math.max(dip,run-h); if(h>run) run=h; PROF_D[nP]=k*DX; PROF_H[nP]=run; nP++; }
  if (dip>PIT_EPS || nP<2) return false;
  const hmax=PROF_H[nP-1], Lmax=PROF_D[nP-1];
  const L = h => { if(h<=0) return 0; if(h>=hmax) return Lmax;
    let lo=0, hi=nP-1; while(lo<hi){ const mid=(lo+hi)>>1; if(PROF_H[mid]>=h) hi=mid; else lo=mid+1; }
    const h1=PROF_H[lo], d1=PROF_D[lo], h0=lo>0?PROF_H[lo-1]:0, d0=lo>0?PROF_D[lo-1]:0;
    return h1>h0 ? d0+(d1-d0)*(h-h0)/(h1-h0) : d1; };
  const nOther = dir>0 ? fi : NX-1-fi; if(nOther<1) return true;
  const dmaxO = nOther*DX;
  const sTop = Math.sqrt(Math.max(hmax, (dmaxO+Lmax)*(dmaxO+Lmax)/8))*1.05 + 0.01;
  let prev=0;
  for(let k=0;k<=TABK;k++){ const s=sTop*k/TABK, h=s*s; let rd=2*Math.sqrt(2*h)-L(h); if(rd<prev) rd=prev; prev=rd; TAB_RD[k]=rd; TAB_H[k]=h; }
  let kk=0;
  for(let n=1;n<=nOther;n++){ const d=n*DX; while(kk<=TABK && TAB_RD[kk]<d) kk++;
    let h; if(kk>TABK) h=TAB_H[TABK]; else if(kk===0) h=0;
    else { const r0=TAB_RD[kk-1], r1=TAB_RD[kk]; h = r1>r0 ? TAB_H[kk-1]+(TAB_H[kk]-TAB_H[kk-1])*(d-r0)/(r1-r0) : TAB_H[kk]; }
    U[o+fi-dir*n] = R+h; }
  return true;
}

/* ===========================================================================
   3 . sculpting: the tools, undo, the generators, the photo
   =========================================================================== */
const SC = { tool:"push", radius:0.15, strength:0.5, lock:true, stamp:"sine", flatH:0 };
const BRUSH_MIN = 0.04;
const brushW = d => d>=1 ? 0 : 0.5*(1+Math.cos(Math.PI*d));
let lockHintT = 0;
function lockHint(msg){ const e=$("#lockhint"); if(e) e.textContent = msg||""; lockHintT = msg ? 90 : 0; }

/* the stamps: profiles about x = 0, floor at 0 */
const STAMPS = {
  sine:   x => 0.5*x*x,
  box:    x => { const a=Math.abs(x); return a<0.45 ? 0 : 0.5*Math.pow((a-0.45)/0.55, 2); },
  pitbowl:x => 0.5*x*x + 0.15*(1-Math.exp(-(x*x)/(0.07*0.07))),
  double: x => 0.5*Math.pow(Math.abs(x)-0.5, 2),
  shelf:  x => x<0.548 ? 0.5*x*x : (x<0.80 ? 0.15 : 0.5*(x-0.25)*(x-0.25)),
  shear:  x => x<0 ? 0.5*(x/0.6)*(x/0.6) : 0.5*(x/1.4)*(x/1.4)
};

/* one dab of a tool at terrain (bx, bz), amplitude amp (U units).  Returns the rect it touched. */
function dab(tool, bx, bz, amp){
  const r = Math.max(SC.radius, BRUSH_MIN), rz = r/ZLEN;
  const j0 = clamp(Math.floor((bz-rz)*(NZ-1)), 0, NZ-1), j1 = clamp(Math.ceil((bz+rz)*(NZ-1)), 0, NZ-1);
  const i0 = clamp(Math.floor((bx-r-XMIN)/DX), 0, NX-1), i1 = clamp(Math.ceil((bx+r-XMIN)/DX), 0, NX-1);
  const wholeRow = (tool==="ridge"||tool==="tilt"||tool==="mirror"||tool==="stamp");
  const a0 = wholeRow ? 0 : i0, a1 = wholeRow ? NX-1 : i1;
  let pitNote = false;
  if (tool==="smooth"){ // blur the band into scratch first
    for(let j=j0;j<=j1;j++){ const o=j*NX; for(let i=i0;i<=i1;i++){
      const jm=Math.max(j-1,0)*NX, jp=Math.min(j+1,NZ-1)*NX, im=Math.max(i-2,0), ip=Math.min(i+2,NX-1);
      SCR[o+i] = (U[o+im]+U[o+Math.max(i-1,0)]+2*U[o+i]+U[o+Math.min(i+1,NX-1)]+U[o+ip])/6*0.6 + (U[jm+i]+U[jp+i])/2*0.4; } }
  }
  for(let j=j0;j<=j1;j++){
    const z=zOf(j), wz=brushW(Math.abs(z-bz)/rz); if(wz<=0) continue; const o=j*NX;
    if (tool==="push" || tool==="pull"){
      const s = tool==="push"?amp:-amp;
      for(let i=i0;i<=i1;i++){ const dx=(xOf(i)-bx)/r, dz=(z-bz)/rz; const w=brushW(Math.sqrt(dx*dx+dz*dz)); if(w>0){ U[o+i]=Math.max(0,U[o+i]+s*w); } }
    } else if (tool==="smooth"){
      const k=clamp(amp*12,0,1);
      for(let i=i0;i<=i1;i++){ const dx=(xOf(i)-bx)/r, dz=(z-bz)/rz; const w=brushW(Math.sqrt(dx*dx+dz*dz)); if(w>0) U[o+i]+= (SCR[o+i]-U[o+i])*w*k; }
    } else if (tool==="pit"){
      const rp=Math.max(BRUSH_MIN, r*0.3), rpz=rp/ZLEN; let touched=false;
      for(let i=i0;i<=i1;i++){ const dx=(xOf(i)-bx)/rp, dz=(z-bz)/rpz; const w=brushW(Math.sqrt(dx*dx+dz*dz)); if(w>0){ U[o+i]=Math.max(0,U[o+i]-amp*2*w); touched=true; } }
      if(touched && Math.abs(z-bz)<rpz){ COLF[j]|=1; pitNote=true; }
    } else if (tool==="flatten"){
      const k=clamp(amp*12,0,1);
      for(let i=i0;i<=i1;i++){ const dx=(xOf(i)-bx)/r, dz=(z-bz)/rz; const w=brushW(Math.sqrt(dx*dx+dz*dz)); if(w>0) U[o+i]=Math.max(0, U[o+i]+(SC.flatH-U[o+i])*w*k); }
    } else if (tool==="ridge"){
      const s=amp*wz; for(let i=0;i<NX;i++) U[o+i]=Math.max(0,U[o+i]+s);
    } else if (tool==="tilt"){
      const s=amp*3*((z-bz)/rz)*wz; for(let i=0;i<NX;i++) U[o+i]=Math.max(0,U[o+i]+s);
    } else if (tool==="mirror"){
      colStats(j); const f=FLOOR[j]; const side = bx>=xOf(f) ? 1 : -1; const k=clamp(amp*12,0,1)*wz;
      for(let n=1;n<NX;n++){ const src=f+side*n, dst=f-side*n; if(src<0||src>=NX||dst<0||dst>=NX) break; U[o+dst]+= (U[o+src]-U[o+dst])*k; }
    } else if (tool==="stamp"){
      const prof=STAMPS[SC.stamp]||STAMPS.sine; colStats(j); const R=REL[j]; const k=clamp(amp*12,0,1)*wz;
      for(let i=0;i<NX;i++){ const t=R+prof(xOf(i)); U[o+i]+= (t-U[o+i])*k; }
      if(k>0.5){ if(SC.stamp==="pitbowl") COLF[j]|=1; else COLF[j]&=~1; }
    }
  }
  /* tune lock after the shape-changing brushes */
  if (SC.lock && (tool==="push"||tool==="pull"||tool==="smooth"||tool==="pit"||tool==="flatten")){
    let skipped=false;
    for(let j=j0;j<=j1;j++){ colStats(j); const side = bx < xOf(FLOOR[j]) ? -1 : 1; if(!tuneLockColumn(j, side)) skipped=true; }
    if(skipped) lockHint("unlocked: pit"); else if(lockHintT>0 && !pitNote) lockHint("");
  }
  const rect = {i0:a0, i1:a1, j0, j1};
  if (SC.lock && !wholeRow) { rect.i0=0; rect.i1=NX-1; }        // the lock may have rewritten the other wall
  markDirty(rect.i0, rect.i1, rect.j0, rect.j1);
  columnsChanged(j0, j1);
  return rect;
}

/* relief: set R at column j (and a little either side) by shifting whole columns */
function reliefSet(z, newR, soft){
  const jc=jOf(z); const n=soft?2:0; let j0=NZ, j1=-1;
  for(let j=Math.max(0,jc-n); j<=Math.min(NZ-1,jc+n); j++){
    const w = n ? 1-Math.abs(j-jc)/(n+1) : 1; colStats(j); const d=(Math.max(0,newR)-REL[j])*w; if(Math.abs(d)<1e-6) continue;

/* ---- undo / redo (terrain snapshots and lanes) ---- */
const HIST=[], REDO=[], HIST_MAX=40;
function snapTerr(){ return {kind:"terr", u:new Float32Array(U), f:new Uint8Array(COLF)}; }
function snapLanes(){ return {kind:"lanes", j:JSON.stringify(LANES)}; }
function pushHist(s){ HIST.push(s); if(HIST.length>HIST_MAX) HIST.shift(); REDO.length=0; }
function restore(s){
  if(s.kind==="terr"){ U.set(s.u); COLF.set(s.f); terrainReplaced(); sendTerrAll(); }
  else { LANES=JSON.parse(s.j); lanesChanged(true); }
}
function undo(){ const s=HIST.pop(); if(!s) return say("nothing to undo"); REDO.push(s.kind==="terr"?snapTerr():snapLanes()); restore(s); say("undo"); }
function redo(){ const s=REDO.pop(); if(!s) return say("nothing to redo"); HIST.push(s.kind==="terr"?snapTerr():snapLanes()); restore(s); say("redo"); }

/* ---- sending ---- */
function sendTerrAll(){ dirty.any=false; dirty.i0=NX; dirty.i1=-1; dirty.j0=NZ; dirty.j1=-1; NB.send({k:"terrAll", d:f32b64(U)}); }
function flushDirty(){
  if(!dirty.any) return; const {i0,i1,j0,j1}=dirty; dirty.any=false; dirty.i0=NX; dirty.i1=-1; dirty.j0=NZ; dirty.j1=-1;
  if(i1<i0||j1<j0) return; const nx=i1-i0+1, nz=j1-j0+1;
  if(nx*nz > NX*NZ*0.6){ NB.send({k:"terrAll", d:f32b64(U)}); return; }
  const t=new Float32Array(nx*nz); for(let j=0;j<nz;j++) t.set(U.subarray((j0+j)*NX+i0, (j0+j)*NX+i0+nx), j*nx);
  NB.send({k:"terr", x0:i0, nx, z0:j0, nz, d:f32b64(t)});
}

/* ---- generators ---- */
function valleyProfiles(){ return [STAMPS.sine, STAMPS.box, STAMPS.shear, STAMPS.pitbowl, STAMPS.double, STAMPS.shelf]; }
function genValleys(rough){
  const profs=valleyProfiles(), n=profs.length, ridges=[0.35,0.22,0.48,0.28,0.4,0.24,0.35];
  const ph=[]; for(let k=0;k<6;k++) ph.push(Math.random()*TAU);
  for(let j=0;j<NZ;j++){
    const z=zOf(j), u=z*n; let k=Math.floor(u); if(k>=n) k=n-1; const fz=u-k;
    /* the pass: within 0.3 of a boundary the profile blends toward the neighbour (0.5 at the boundary itself) */
    let pa=profs[k], pb=profs[k], t=0;
    if(fz>0.7 && k<n-1){ pb=profs[k+1]; t=0.5*sstep((fz-0.7)/0.3); }
    else if(fz<0.3 && k>0){ pb=profs[k-1]; t=0.5*sstep((0.3-fz)/0.3); }
    const b = Math.round(u);                      // the boundary this column is nearest
    const dz = Math.abs(u-b);                     // distance to it, in valley units
    const bump = dz<0.32 ? 0.5-0.5*Math.cos(Math.PI*(1-dz/0.32)) : 0;
    const R = ridges[b]*bump;
    const o=j*NX;
    for(let i=0;i<NX;i++){ const x=xOf(i); let v=pa(x)*(1-t)+pb(x)*t + R;
      if(rough){ v += 0.012*(Math.sin(x*23+ph[0]+z*17)+Math.sin(x*41+ph[1]-z*29)+0.6*Math.sin(x*67+ph[2]+z*51)+Math.sin(z*37+ph[3]+x*11)); }
      U[o+i]=Math.max(0,v); }
    COLF[j] = (profs[k]===STAMPS.pitbowl && t<0.5) ? 1 : 0;
  }
}
function genCascade(){
  for(let j=0;j<NZ;j++){ const z=zOf(j), u=z*6, k=Math.floor(u), fz=u-k; const b=k+(fz>=0.5?1:0); const dz=Math.abs(u-b);
    const R = (b>0 && b<6) ? 0.08*b*(0.5-0.5*Math.cos(Math.PI*Math.max(0,1-dz/0.5))) : 0;
    const o=j*NX; for(let i=0;i<NX;i++) U[o+i]=STAMPS.double(xOf(i))+R; COLF[j]=0; }
}
function genPlain(){ for(let j=0;j<NZ;j++){ const o=j*NX; for(let i=0;i<NX;i++) U[o+i]=0.5*xOf(i)*xOf(i); COLF[j]=0; } }
function generate(name, silent){
  if(!silent) pushHist(snapTerr());
  if(name==="valleys") genValleys(false); else if(name==="cascade") genCascade(); else if(name==="plain") genPlain(); else if(name==="rough") genValleys(true);
  terrainReplaced(); if(!silent) sendTerrAll(); if(!silent) say("terrain: "+name);
}

/* ---- the photograph: luminance rows are bowl profiles ---- */
function photoToTerrain(img){
  const cv=document.createElement("canvas"); cv.width=NX; cv.height=NZ; const g=cv.getContext("2d");
  g.drawImage(img, 0,0, NX, NZ); const d=g.getImageData(0,0,NX,NZ).data;
  let mn=Infinity, mx=-Infinity;
  for(let j=0;j<NZ;j++) for(let i=0;i<NX;i++){ const q=(j*NX+i)*4; const l=(0.2126*d[q]+0.7152*d[q+1]+0.0722*d[q+2])/255; SCR[(NZ-1-j)*NX+i]=l; if(l<mn) mn=l; if(l>mx) mx=l; }
  const sc = mx>mn ? 1.2/(mx-mn) : 0;
  for(let n=0;n<NX*NZ;n++) SCR[n]=(SCR[n]-mn)*sc;
  for(let pass=0;pass<2;pass++){       // a little blur (3x3), twice
    for(let j=0;j<NZ;j++){ const o=j*NX, jm=Math.max(j-1,0)*NX, jp=Math.min(j+1,NZ-1)*NX;
      for(let i=0;i<NX;i++){ const im=Math.max(i-1,0), ip=Math.min(i+1,NX-1);
        U[o+i]=(SCR[o+im]+SCR[o+i]*2+SCR[o+ip])*0.25*0.5 + (SCR[jm+i]+SCR[jp+i])*0.25; } }
    SCR.set(U);
  }
  COLF.fill(0);
  pushHist(snapTerr()); terrainReplaced(); sendTerrAll(); say("photo: "+NZ+" rows became bowls");
}

   =========================================================================== */
const CTL = {};             // id -> {root, fill, val, cur}
let hoverId = null;
function buildRail(){
  const host=$("#rail-r"); host.innerHTML=""; for(const k in CTL) delete CTL[k];
  const placed=new Set();
  const section=(title, ids)=>{
    const list=ids.filter(id=>P[id]); if(!list.length) return;
    const h=el("h3","st",host); h.textContent=title;
    for(const id of list){ placed.add(id); host.appendChild(makeCtl(id)); }
  };
  for(const [t,ids] of SECTIONS) section(t, ids);
  const rest=PIDS.filter(id=>!placed.has(id)); if(rest.length) section("Other", rest);
  for(const id of PIDS) paintCtl(id);
}
function makeCtl(id){
  const p=P[id], k=p.kind; const root=el("div","ctl"); root.dataset.id=id;
  if(k===KP.BIPOL) root.classList.add("bipol"); if(id==="tide") root.classList.add("tide");
  const cn=el("div","cn",root); const nm=el("span","nm",cn); nm.textContent=p.name.toLowerCase(); const vl=el("span","vl",cn);
  const c={root, val:vl};
  if(k===KP.LIST || k===KP.INT){
    const seg=el("div","seg",root); const bl=el("button","",seg); bl.innerHTML="&#9666;"; const cur=el("span","cur",seg); const br=el("button","",seg); br.innerHTML="&#9656;";
    c.cur=cur; root.classList.add("list");
    const step=(d)=>{ if(k===KP.LIST){ const l=listOf(id); if(!l) return; const n=l.length-1; const i=clamp(listIdx(id)+d,0,n); setParam(id, n?i/n:0); }
                      else { const [lo,hi]=intRange(id); const n=hi-lo; const i=clamp(Math.round(V[id]*n)+d,0,n); setParam(id, n?i/n:0); } };
    bl.addEventListener("click", ()=>step(-1)); br.addEventListener("click", ()=>step(1));
    cur.addEventListener("wheel", e=>{ e.preventDefault(); step(e.deltaY>0?1:-1); }, {passive:false});
    cur.addEventListener("dblclick", ()=> setParam(id, p.def));
  } else {
    const tube=el("div","tube",root); const fill=el("div","fill",tube); el("div","glass",tube); el("div","zero",tube);
    c.tube=tube; c.fill=fill;
    bindTube(tube, ()=>V[id], v=>setParam(id,v), ()=>setParam(id,p.def), id);
  }
  root.addEventListener("pointerenter", ()=>{ hoverId=id; sayCtl(id); });
  root.addEventListener("pointerleave", ()=>{ if(hoverId===id){ hoverId=null; sayIdle(); } });
  CTL[id]=c; return root;
}
/* a horizontal gauge: absolute set on press, relative while dragging (shift = fine) */
function bindTube(tube, get, set, reset, id){
  tube.addEventListener("pointerdown", ev=>{
    if(ev.button!==0) return; ev.preventDefault();
    const r=tube.getBoundingClientRect(); let v0=get(), x0=ev.clientX;
    const abs=clamp((ev.clientX-r.left)/r.width,0,1); set(abs); v0=abs; x0=ev.clientX;
    const mv=e=>{ const f=e.shiftKey?0.15:1; set(clamp(v0+(e.clientX-x0)/r.width*f,0,1)); };
    const up=()=>{ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); document.removeEventListener("pointercancel",up); };
    document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up); document.addEventListener("pointercancel",up);
  });
  tube.addEventListener("dblclick", ev=>{ ev.preventDefault(); reset(); });
  tube.addEventListener("wheel", ev=>{ ev.preventDefault(); set(clamp(get()+(ev.deltaY>0?-1:1)*(ev.shiftKey?0.002:0.02),0,1)); }, {passive:false});
}
function paintCtl(id){
  const c=CTL[id]; if(!c) return; const v=V[id], p=P[id];
  c.val.textContent=fmt(id,v);

  else if(c.fill){
    if(p.kind===KP.BIPOL){ const l=Math.min(v,0.5)*100, w=Math.abs(v-0.5)*100; c.fill.style.left=l+"%"; c.fill.style.width=w+"%"; }

function batchDraw(B, prog, mode, setup){

function buildGrid(){
  const B=G.grid; B.n=0; const c=[0.45,0.7,0.75];
  for(let x=-2.5;x<=2.5001;x+=0.25){ const a=(Math.abs(x)<=1.5)?0.10:0.05; lnPush(B,x,0,0.5,c[0],c[1],c[2],a); lnPush(B,x,0,-ZLEN-0.5,c[0],c[1],c[2],a); }
  for(let z=0.5;z>=-ZLEN-0.5001;z-=0.25){ const a=(z<=0&&z>=-ZLEN)?0.10:0.05; lnPush(B,-2.5,0,z,c[0],c[1],c[2],a); lnPush(B,2.5,0,z,c[0],c[1],c[2],a); }

  const e=[[XMIN,0],[XMAX,0],[XMAX,-ZLEN],[XMIN,-ZLEN]]; for(let k=0;k<4;k++){ const p=e[k], q=e[(k+1)%4]; lnPush(B,p[0],0.001,p[1],0.79,0.64,0.29,0.35); lnPush(B,q[0],0.001,q[1],0.79,0.64,0.29,0.35); }
}
function glResize(){

}
function camUpdate(){
  const cp=Math.cos(CAM.pitch), sp=Math.sin(CAM.pitch);
  EYE[0]=CAM.tx+CAM.dist*Math.sin(CAM.yaw)*cp; EYE[1]=CAM.ty+CAM.dist*sp; EYE[2]=CAM.tz+CAM.dist*Math.cos(CAM.yaw)*cp;
  m4persp(M_P, 0.74, GLV.W/Math.max(1,GLV.H), 0.05, 60); m4look(M_V, EYE, [CAM.tx,CAM.ty,CAM.tz], [0,1,0]); m4mul(M_PV,M_P,M_V); m4inv(M_INV,M_PV);

/* pointer (css px) -> terrain point {x, z(0..1), u} by marching the ray against the effective terrain; ground plane outside */
const RAY = {x:0,z:0,u:0,hit:false,ground:false};
function raycast(px,py){
  const nx=px/GLV.cw*2-1, ny=1-py/GLV.ch*2;
  let v=m4xf(M_INV,nx,ny,-1,1); const ax=v[0]/v[3], ay=v[1]/v[3], az=v[2]/v[3];
  v=m4xf(M_INV,nx,ny,1,1); let dx=v[0]/v[3]-ax, dy=v[1]/v[3]-ay, dz=v[2]/v[3]-az; const l=Math.hypot(dx,dy,dz)||1; dx/=l;dy/=l;dz/=l;
  RAY.hit=false; RAY.ground=false;
  const inside=(x,zn)=> x>=XMIN&&x<=XMAX&&zn>=0&&zn<=1;
  let t=0, step=0.035, was=false, tPrev=0;
  for(let n=0;n<600;n++){ t+=step; const x=ax+dx*t, y=ay+dy*t, zn=-(az+dz*t)/ZLEN;
    if(inside(x,zn)){ const h=uEffAt(x,zn)*YS; if(y<h){ // bisect between tPrev and t
        let lo=tPrev, hi=t; for(let k=0;k<12;k++){ const m=(lo+hi)/2; const X=ax+dx*m, Y=ay+dy*m, Z=-(az+dz*m)/ZLEN; if(Y<uEffAt(clamp(X,XMIN,XMAX),clamp(Z,0,1))*YS) hi=m; else lo=m; }
        const m=(lo+hi)/2; RAY.x=clamp(ax+dx*m,XMIN,XMAX); RAY.z=clamp(-(az+dz*m)/ZLEN,0,1); RAY.u=uEffAt(RAY.x,RAY.z); RAY.hit=true; return RAY; } was=true; }
    else if(y<0){ if(dy<0){ const m=-ay/dy; RAY.x=ax+dx*m; RAY.z=-(az+dz*m)/ZLEN; RAY.u=0; RAY.ground=true; return RAY; } break; }
    if(t>30) break; tPrev=t;
  }
  return RAY;
}
function floorX(zn){ const j=jOf(zn); return xOf(FLOOR[j]); }

/* ---- the balls stream, the voices, the wake ---- */
let BALLS=null, lvl=0; const SCOPE_U8=new Uint8Array(1024), SCOPE=new Float32Array(SCOPE_U8.buffer); let scopeOk=false;
const VOICES=new Map();                    // id -> {h, rel, seen}
let wakeId=-1; const WMAX=6000; const WAKE=new Float32Array(WMAX*3); let wakeN=0; let wakeTick=0;
function voicesSounding(){ return !!(BALLS && BALLS.v && BALLS.v.length); }
function onBalls(p){
  BALLS=p; lvl=+p.lvl||0; wakeTick++;
  if(p.scope){ try{ b64into(p.scope, SCOPE_U8); scopeOk=true; }catch(e){} }
  const vs=p.v||[]; let newest=null;
  for(const v of vs){ if(!VOICES.has(v.id)){ VOICES.set(v.id,{h:v.h,rel:-1,seen:wakeTick}); if(!newest||v.age<newest.age) newest=v; }
    const r=VOICES.get(v.id); r.seen=wakeTick; if(r.h===1 && v.h===0) r.rel=v.age; if(v.h===0 && r.rel<0) r.rel=v.age; r.h=v.h; }
  for(const [id,r] of VOICES) if(r.seen!==wakeTick) VOICES.delete(id);
  if(newest && newest.id!==wakeId){ wakeId=newest.id; wakeN=0; }
  const w = vs.find(v=>v.id===wakeId);
  if(w){ const r=VOICES.get(w.id); const side = w.h ? 0 : 1; const age = w.h ? w.age : (w.age-(r&&r.rel>=0?r.rel:w.age));
    if(wakeN>=WMAX){ for(let i=0;i<WMAX/2;i++){ WAKE[i*3]=WAKE[i*6]; WAKE[i*3+1]=WAKE[i*6+1]; WAKE[i*3+2]=WAKE[i*6+2]; } wakeN=WMAX/2; }
    WAKE[wakeN*3]=age; WAKE[wakeN*3+1]=w.z; WAKE[wakeN*3+2]=side; wakeN++; }
  if(vs.length){ const t = (w||vs[0]).tide; if(typeof t==="number") setWater(t); } else setWater(V.tide);
  TL.dirty=true;
}

let T0=performance.now(), tNow=0;
function glDraw(){

  if(ueDirty) computeUE();

  if(GLV.cDirty){ if(tenDirty) allTension(); const c=G.colU8; for(let j=0;j<NZ;j++){ c[j*4]=Math.round(TEN[j]*255); c[j*4+1]=Math.round(clamp(REL[j]/UMAX,0,1)*255); c[j*4+2]=(COLF[j]&1)?255:0; c[j*4+3]=255; }
    gl.bindTexture(gl.TEXTURE_2D,G.texC); gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,NZ,1,gl.RGBA,gl.UNSIGNED_BYTE,c); GLV.cDirty=false; }
  gl.viewport(0,0,GLV.W,GLV.H); gl.clearColor(0.027,0.063,0.102,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.disable(gl.CULL_FACE);

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,G.texH); gl.uniform1i(G.terr.u.uH,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,G.texC); gl.uniform1i(G.terr.u.uCol,1);
  gl.uniformMatrix4fv(G.terr.u.uPV,false,M_PV); gl.uniform1f(G.terr.u.uYS,YS); gl.uniform1f(G.terr.u.uZL,ZLEN); gl.uniform1f(G.terr.u.uXmin,XMIN); gl.uniform1f(G.terr.u.uDX,DX);
  gl.uniform3f(G.terr.u.uLight,LIGHT[0],LIGHT[1],LIGHT[2]); gl.uniform1f(G.terr.u.uTabs,Tabs); gl.uniform1f(G.terr.u.uLockOff,SC.lock?0:1); gl.uniform1f(G.terr.u.uTime,tNow);

/* the per-frame geometry: wake dots, pin stakes, tethers, streaks, balls, brush ring */
function fillScene(){
  PEARLS.length = 0;
  const A=G.spA, B=G.spB, LA=G.lnA, LB=G.lnB, TR=G.tri; A.n=B.n=LA.n=LB.n=TR.n=0;
  /* wake: coral dots along the valley floors */
  if(wakeN>1){ const stride=Math.max(1,Math.ceil(wakeN/700));
    for(let n=0;n<wakeN;n+=stride){ const zn=WAKE[n*3+1]; const x=floorX(zn); const y=wY(uEffAt(x,zn))+0.012; const age=n/wakeN;
      spPush(A,x,y,wZ(zn),0.028,1.0,0.48,0.35,0.35+0.5*age); } }
  /* pins as brass stakes at the right edge */
  const pins=(LANES.pin&&LANES.pin.on)||[], pinsOff=(LANES.pin&&LANES.pin.off)||[];
  const stake=(zn,k,off)=>{ const x=XMAX+0.14, base=wY(uEffAt(XMAX,zn)); const top=base+0.30;
    lnPush(LA,x,0,wZ(zn),0.54,0.42,0.16,0.9); lnPush(LA,x,top,wZ(zn),0.91,0.77,0.42,1.0);
    lnPush(LA,XMAX,base+0.004,wZ(zn),0.79,0.64,0.29,0.55); lnPush(LA,x,base+0.004,wZ(zn),0.79,0.64,0.29,0.55);
    spPush(A,x,top,wZ(zn),0.045,off?0.75:0.93,off?0.55:0.78,off?0.3:0.42,1.0); };
  for(let k=0;k<pins.length;k++) stake(pins[k].v,k,false);
  for(let k=0;k<pinsOff.length;k++) stake(pinsOff[k].v,k,true);
  /* balls */
  if(BALLS && BALLS.v) for(const v of BALLS.v){
    const zn=clamp(+v.z||0,0,1), x=clamp(+v.x||0,XMIN,XMAX), e=clamp(+v.e||0,0,1), xa=Math.max(0,+v.xa||0);
    const y=wY(uEffAt(x,zn));

    if(typeof v.zt==="number"){ const zt=clamp(v.zt,0,1); const n=10; let px=x, py=y+0.01, pz=wZ(zn);
      for(let s=1;s<=n;s++){ const zz=lerp(zn,zt,s/n); const yy=wY(uEffAt(x,zz))+0.01; lnPush(LA,px,py,pz,0.85,0.7,0.35,0.75); px=x; py=yy; pz=wZ(zz); lnPush(LA,px,py,pz,0.85,0.7,0.35,0.75); }
      spPush(A,x,wY(uEffAt(x,zt))+0.012,wZ(zt),0.03,0.9,0.75,0.4,0.9); }
    /* comet streak spanning the swing */
    if(xa>0.005){ const n=14, hw=0.014, x0=clamp(x-xa,XMIN,XMAX), x1=clamp(x+xa,XMIN,XMAX);
      for(let s=0;s<n;s++){ const xa0=lerp(x0,x1,s/n), xa1=lerp(x0,x1,(s+1)/n); const ya=wY(uEffAt(xa0,zn))+0.012, yb=wY(uEffAt(xa1,zn))+0.012;
        const f0=Math.sin(Math.PI*s/n), f1=Math.sin(Math.PI*(s+1)/n); const a0=0.15+0.7*f0*e, a1=0.15+0.7*f1*e; const z0=wZ(zn)-hw, z1=wZ(zn)+hw;
        lnPush(TR,xa0,ya,z0,0.6,0.95,1,a0); lnPush(TR,xa1,yb,z0,0.6,0.95,1,a1); lnPush(TR,xa0,ya,z1,0.6,0.95,1,a0);
        lnPush(TR,xa1,yb,z0,0.6,0.95,1,a1); lnPush(TR,xa1,yb,z1,0.6,0.95,1,a1); lnPush(TR,xa0,ya,z1,0.6,0.95,1,a0); } }

      if(IMG.pearl.ok) PEARLS.push({x:ux, y:wY(uEffAt(ux,uz))+0.025, z:wZ(uz), r:0.036, a:0.88});

  g.arc(cxs,cys,R-4.5, Math.PI*0.78, Math.PI*0.78+Math.PI*1.44*clamp(lvl,0,1)); g.stroke(); g.lineWidth=1;

  else { g.strokeStyle="rgba(201,162,74,.45)"; g.beginPath(); g.arc(cxs,cys,R-4,0,TAU); g.stroke(); }
  g.fillStyle="rgba(205,214,220,.45)"; g.font="9px "+getComputedStyle(document.body).getPropertyValue("--serif");
  g.fillText("scope", cxs-12, cys+R-15);

  g.fillStyle= LED.t>0 ? "#e8c56a" : "rgba(216,201,165,.85)"; g.fillText(msg, 56, Hh-13);

  if(lockHintT>0){ lockHintT--; const s=proj(BR.x, wY(uEffAt(BR.x,BR.z))+0.12, wZ(BR.z)); if(s && BR.show){ g.fillStyle="#ff7a59"; g.font="italic 11px "+getComputedStyle(document.body).getPropertyValue("--serif"); g.fillText("unlocked: pit", s.x+10, s.y); } }

    g.fillStyle="rgba(7,16,26,.78)"; g.fillRect(R.x0-8,R.y0-16,R.x1-R.x0+16,R.y1-R.y0+24); g.strokeStyle="rgba(201,162,74,.5)"; g.strokeRect(R.x0-7.5,R.y0-15.5,R.x1-R.x0+15,R.y1-R.y0+23);

/* ---- pointer on the view: sculpt, orbit, strike, relief ---- */
const BR = { show:false, x:0, z:0.5 };
const STROKE = { on:false, tool:"", last:0, dropped:false, relief:false, orbit:false, ox:0, oy:0, yaw:0, pitch:0 };
function selectTool(name){ SC.tool=name; $$("#tools .tool").forEach(b=>b.classList.toggle("on", b.dataset.tool===name)); $("#stamps").classList.toggle("on", name==="stamp"); say("tool: "+name); }
(function bindView(){
  const ov=$("#ov");
  ov.addEventListener("contextmenu", e=>e.preventDefault());
  ov.addEventListener("pointerdown", ev=>{
    const r=ov.getBoundingClientRect(); const px=ev.clientX-r.left, py=ev.clientY-r.top;
    try{ ov.setPointerCapture(ev.pointerId); }catch(e){}
    if(ev.button===2 || ev.altKey || ev.button===1){ STROKE.orbit=true; STROKE.ox=ev.clientX; STROKE.oy=ev.clientY; STROKE.yaw=CAM.yaw; STROKE.pitch=CAM.pitch; ov.classList.add("orbit"); ev.preventDefault(); return; }
    if(ev.button!==0) return;
    if(SC.tool==="relief"){ const R=reliefRect(); if(px>=R.x0&&px<=R.x1&&py>=R.y0-16&&py<=R.y1+8){ pushHist(snapTerr()); STROKE.relief=true; reliefDrag(px,py); return; } }
    const h=raycast(px,py); if(!h.hit){ BR.show=h.ground; if(h.ground){ BR.x=clamp(h.x,XMIN,XMAX); BR.z=clamp(h.z,0,1); } return; }
    BR.show=true; BR.x=h.x; BR.z=h.z;
    if(ev.shiftKey){ STROKE.dropped=true; NB.send({k:"drop", z:h.z, e:clamp(SC.strength,0.05,1), n:60, on:true}); say("strike at z "+h.z.toFixed(2)); return; }
    pushHist(snapTerr()); STROKE.on=true; STROKE.tool=SC.tool; STROKE.last=performance.now(); SC.flatH=U[jOf(h.z)*NX+iOf(h.x)];
    if(SC.tool==="relief"){ reliefSet(h.z, h.u, true); }
  });
  document.addEventListener("pointermove", ev=>{
    if(STROKE.orbit){ CAM.yaw=STROKE.yaw+(ev.clientX-STROKE.ox)*0.006; CAM.pitch=clamp(STROKE.pitch+(ev.clientY-STROKE.oy)*0.005,0.08,1.45); return; }
    const r=ov.getBoundingClientRect(); const px=ev.clientX-r.left, py=ev.clientY-r.top;
    if(STROKE.relief){ reliefDrag(px,py); return; }
    if(ev.target!==ov && !STROKE.on) return;
    if(px<0||py<0||px>r.width||py>r.height){ if(!STROKE.on) BR.show=false; return; }
    const h=raycast(px,py); if(h.hit||h.ground){ BR.show=true; BR.x=clamp(h.x,XMIN,XMAX); BR.z=clamp(h.z,0,1); } else if(!STROKE.on) BR.show=false;
    if(STROKE.on && STROKE.tool==="relief" && h.hit) reliefSet(h.z, h.u, true);
  });
  const end=()=>{ if(STROKE.orbit){ STROKE.orbit=false; ov.classList.remove("orbit"); }
    if(STROKE.dropped){ STROKE.dropped=false; NB.send({k:"drop", z:BR.z, e:0, n:60, on:false}); }
    if(STROKE.on||STROKE.relief){ STROKE.on=false; STROKE.relief=false; flushDirty(); } };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
  ov.addEventListener("pointerleave", ()=>{ if(!STROKE.on) BR.show=false; });
  ov.addEventListener("wheel", ev=>{ ev.preventDefault(); CAM.dist=clamp(CAM.dist*Math.exp(ev.deltaY*0.0012),1.2,14); }, {passive:false});
  $("#homebtn").addEventListener("click", ()=>{ Object.assign(CAM,HOME); say("camera home"); });
})();
function reliefDrag(px,py){ const R=reliefRect(), sc=reliefScale(); const z=clamp((px-R.x0)/(R.x1-R.x0),0,1); const v=clamp((R.y1-py)/(R.y1-R.y0),0,1)*sc; reliefSet(z,v,true); }
function strokeTick(dt){
  if(!STROKE.on || STROKE.tool==="relief" || !BR.show) return;
  const amp = 0.7*SC.strength*Math.min(dt,0.05);
  dab(STROKE.tool, BR.x, BR.z, amp);

/* ===========================================================================
   6 . the timeline  (cream paper; envelopes, LFOs, and the three point lanes)
   =========================================================================== */
const TL = { dirty:true, zoom:1, W:0, H:0, dpr:1, rows:[], X0:66, gap:12, ON_MAX:8, OFF_MAX:4, hover:null, drag:null };
const LANE_DEF = [
  {id:"amp",  label:"amp",   w:1,   kind:"env", pre:"amp"},
  {id:"mod",  label:"mod",   w:1,   kind:"env", pre:"mod"},
  {id:"lfo1", label:"lfo 1", w:1,   kind:"lfo", pre:"lfo1"},
  {id:"lfo2", label:"lfo 2", w:1,   kind:"lfo", pre:"lfo2"},
  {id:"tide", label:"tide",  w:1.2, kind:"pts", param:"tide"},
  {id:"rock", label:"rock",  w:1.2, kind:"pts", param:"rock"},
  {id:"pin",  label:"pins",  w:4.4, kind:"pts", param:"position"}
];
function emptyLanes(){ return {ver:1, pin:{on:[],off:[],loop:null}, tide:{on:[],off:[],loop:null}, rock:{on:[],off:[],loop:null}}; }
let LANES = emptyLanes();
function normLanes(j){
  const o = (j && typeof j==="object") ? j : {}; const out=Object.assign({}, o); out.ver = o.ver||1;
  for(const id of ["pin","tide","rock"]){ const L=Object.assign({on:[],off:[],loop:null}, o[id]||{});
    const fix=arr=>(Array.isArray(arr)?arr:[]).map(p=>({t:Math.max(0,+p.t||0), v:clamp(+p.v||0,0,1), e:[0,1,2].includes(p.e|0)?(p.e|0):2})).sort((a,b)=>a.t-b.t);
    L.on=fix(L.on); L.off=fix(L.off); L.loop = (L.loop && typeof L.loop.a==="number" && typeof L.loop.b==="number" && L.loop.b>L.loop.a) ? {a:L.loop.a,b:L.loop.b} : null; out[id]=L; }
  return out;
}
let lanesTimer=0;
function lanesChanged(now){ TL.dirty=true; clearTimeout(lanesTimer); const send=()=>NB.send({k:"lanes", j:LANES}); if(now) send(); else lanesTimer=setTimeout(send,50); }
const easeTo=(a,b,u,e)=> e===0 ? (u>=1?b:a) : (e===2 ? lerp(a,b,sstep(u)) : lerp(a,b,clamp(u,0,1)));
function evalOn(L,t,knob){ const pts=L.on; if(!pts.length) return knob;
  if(L.loop && t>=L.loop.a) t=L.loop.a+((t-L.loop.a)%(L.loop.b-L.loop.a));
  if(t<=pts[0].t) return pts[0].v;
  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i]; if(t<=b.t) return easeTo(a.v,b.v,b.t>a.t?(t-a.t)/(b.t-a.t):1,b.e); }
  return pts[pts.length-1].v; }
function evalOff(L,t,v0){ const pts=L.off; if(!pts.length||t<=0) return v0; let pa={t:0,v:v0};
  for(const b of pts){ if(t<=b.t) return easeTo(pa.v,b.v,b.t>pa.t?(t-pa.t)/(b.t-pa.t):1,b.e); pa=b; } return pa.v; }
function envAt(pre,t,offT){ const A=secOf(V[pre+"A"]), D=secOf(V[pre+"D"]), S=V[pre+"S"], R=secOf(V[pre+"R"]);
  if(offT>=0){ const lv=envAt(pre,t,-1); return lv*Math.exp(-4*offT/Math.max(R,0.002)); }
  if(t<A) return t/Math.max(A,1e-4); return S+(1-S)*Math.exp(-4*(t-A)/Math.max(D,0.002)); }
const SYNC_BEATS=[0,16,8,4,2,1,0.5,0.25,1/3,1/6];      // beats at 120 BPM = 0.5 s each
function lfoPeriod(pre){ const si=listIdx(pre+"Sync"); if(si>0 && si<SYNC_BEATS.length) return SYNC_BEATS[si]*0.5; return 1/Math.max(hzOf(pre+"Rate"),1e-3); }
function lfoAt(pre,t){ const per=lfoPeriod(pre), ph=(t/per)%1, sh=listIdx(pre+"Shape"); const amt=V[pre+"Amt"]*2-1; let y;
  if(sh===0) y=Math.sin(ph*TAU); else if(sh===1) y=1-4*Math.abs(ph-0.5); else if(sh===2) y=1-2*ph; else if(sh===3) y=ph<0.5?1:-1;
  else { const c=Math.floor(t/per); y=Math.sin(c*12.9898+78.233)*43758.5453; y=(y-Math.floor(y))*2-1; }
  return y*amt; }
function tlLayout(){
  const W=TL.W, Hh=TL.H; const X0=TL.X0, XR=W-10; const Wt=XR-X0-TL.gap; TL.Won=Wt*(TL.ON_MAX/(TL.ON_MAX+TL.OFF_MAX)); TL.Woff=Wt-TL.Won;
  TL.pps=TL.Won/(TL.ON_MAX/TL.zoom); TL.XM=X0+TL.Won+TL.gap/2; TL.XOff=X0+TL.Won+TL.gap; TL.XR=XR;
  const top=18; const sw=LANE_DEF.reduce((s,l)=>s+l.w,0); let y=top; TL.rows=[];
  for(const l of LANE_DEF){ const h=(Hh-top-4)*l.w/sw; TL.rows.push({def:l, y0:y, y1:y+h}); y+=h; }
}
const onX=t=>TL.X0+t*TL.pps, offX=t=>TL.XOff+t*TL.pps;
const tOn=x=>(x-TL.X0)/TL.pps, tOff=x=>(x-TL.XOff)/TL.pps;
function rowOf(y){ for(const r of TL.rows) if(y>=r.y0&&y<r.y1) return r; return null; }
function rowY(r,v){ return r.y1-4-(clamp(v,0,1))*(r.y1-r.y0-8); }
function rowV(r,y){ return clamp((r.y1-4-y)/(r.y1-r.y0-8),0,1); }
function tlResize(){ const c=$("#tlc"), r=$("#tl").getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=Math.max(1,Math.round(r.width*dpr)), Hh=Math.max(1,Math.round(r.height*dpr)); if(c.width!==W||c.height!==Hh){ c.width=W; c.height=Hh; }
  TL.W=r.width; TL.H=r.height; TL.dpr=dpr; TL.dirty=true; }
function tlDraw(){
  const c=$("#tlc"), g=c.getContext("2d"); g.setTransform(TL.dpr,0,0,TL.dpr,0,0); tlLayout(); const W=TL.W, Hh=TL.H;
  const serif=getComputedStyle(document.body).getPropertyValue("--serif"), mono=getComputedStyle(document.body).getPropertyValue("--mono");
  g.fillStyle="rgba(232,220,192,.94)"; g.fillRect(0,0,W,Hh);
  g.fillStyle="rgba(29,47,74,.05)"; for(let y=0;y<Hh;y+=7) g.fillRect(0,y,W,1);      // laid paper
  const ink="#1d2f4a"; g.strokeStyle="rgba(29,47,74,.35)"; g.lineWidth=1;
  /* ruler */
  const spanOn=TL.ON_MAX/TL.zoom, step = spanOn>=6?1:spanOn>=3?0.5:spanOn>=1.5?0.25:0.1;
  g.font="9px "+mono; g.fillStyle="rgba(29,47,74,.75)";
  for(let t=0;t<=spanOn+1e-6;t+=step){ const x=onX(t); g.fillRect(x,10,1,6); if(Math.abs(t/step-Math.round(t/step))<1e-6 && (step>=1||Math.round(t/step)%2===0)) g.fillText(t%1===0?t+"s":t.toFixed(2).replace(/0+$/,"")+"s", x+2, 9); }
  const spanOff=TL.OFF_MAX/TL.zoom; for(let t=0;t<=spanOff+1e-6;t+=step){ const x=offX(t); g.fillRect(x,10,1,6); if(t>0 && (step>=1||Math.round(t/step)%2===0)) g.fillText("+"+(t%1===0?t:t.toFixed(2).replace(/0+$/,""))+"s", x+2, 9); }
  /* the release marker: a small red flag */
  g.fillStyle="#c0392b"; g.fillRect(TL.XM-0.5,4,1,Hh-6);
  if(IMG.flag.ok) g.drawImage(IMG.flag.img, TL.XM-1.5, 1, 14, 18);
  else { g.beginPath(); g.moveTo(TL.XM,4); g.lineTo(TL.XM+9,8); g.lineTo(TL.XM,12); g.fill(); }
  g.font="italic 9px "+serif; g.fillStyle="#c0392b"; g.save(); g.translate(TL.XM+3,Hh-8); g.rotate(-Math.PI/2); g.fillText("release",0,0); g.restore();
  /* lanes */
  for(const r of TL.rows){
    const d=r.def; g.strokeStyle="rgba(29,47,74,.28)"; g.beginPath(); g.moveTo(0,r.y0+.5); g.lineTo(W,r.y0+.5); g.stroke();
    g.fillStyle="rgba(29,47,74,.06)"; if(d.kind==="pts") g.fillRect(TL.X0,r.y0,TL.XR-TL.X0,r.y1-r.y0);
    g.font="italic 11px "+serif; g.fillStyle=ink; g.fillText(d.label+(d.kind==="lfo"&&listIdx(d.pre+"Sync")>0?" @120":""), 8, r.y0+13);
    if(d.kind==="env"||d.kind==="lfo"){
      const path=(fn)=>{ g.beginPath(); let first=true; for(let x=TL.X0;x<=TL.X0+TL.Won;x+=2){ const y=fn(tOn(x),-1); if(first){ g.moveTo(x,y); first=false; } else g.lineTo(x,y); }
        for(let x=TL.XOff;x<=TL.XR;x+=2){ const y=fn(TL.ON_MAX/TL.zoom, tOff(x)); g.lineTo(x,y); } };
      if(d.kind==="env"){ const amp = d.pre==="mod" ? Math.abs(V.modAmt*2-1) : 1;
        path((t,o)=>rowY(r, envAt(d.pre,t,o)*amp)); g.lineTo(TL.XR,rowY(r,0)); g.lineTo(TL.X0,rowY(r,0)); g.closePath(); g.fillStyle="rgba(29,47,74,.10)"; g.fill();
        path((t,o)=>rowY(r, envAt(d.pre,t,o)*amp)); g.strokeStyle=ink; g.lineWidth=1.2; g.stroke(); g.lineWidth=1;
        if(d.pre==="mod" && V.modAmt<0.5){ g.font="9px "+mono; g.fillStyle="#c0392b"; g.fillText("inverted", TL.X0+4, r.y0+10); }
      } else { const mid=(r.y0+r.y1)/2, half=(r.y1-r.y0)/2-4; g.strokeStyle="rgba(29,47,74,.3)"; g.beginPath(); g.moveTo(TL.X0,mid+.5); g.lineTo(TL.XR,mid+.5); g.stroke();
        path((t,o)=> mid-lfoAt(d.pre, o>=0 ? t+o : t)*half); g.strokeStyle=ink; g.lineWidth=1.1; g.stroke(); g.lineWidth=1;
        g.font="9px "+mono; g.fillStyle="rgba(29,47,74,.6)"; g.fillText((listOf(d.pre+"Shape")||[])[listIdx(d.pre+"Shape")]||"", TL.X0+4, r.y0+10); }
    } else {
      const L=LANES[d.id]; const knob=V[d.param]||0;
      if(!L.on.length && !L.off.length){ g.setLineDash([3,4]); g.strokeStyle="rgba(29,47,74,.45)"; g.beginPath(); g.moveTo(TL.X0,rowY(r,knob)+.5); g.lineTo(TL.XR,rowY(r,knob)+.5); g.stroke(); g.setLineDash([]);
        g.font="italic 9px "+serif; g.fillStyle="rgba(29,47,74,.55)"; g.fillText("knob  "+fmt(d.param,knob), TL.X0+4, rowY(r,knob)-3); }
      else {

  L.off.forEach((p,i)=>{ const dx=offX(p.t)-px, dy=rowY(r,p.v)-py; const d=dx*dx+dy*dy; if(d<bd){ bd=d; best={lane:r.def.id,side:"off",i,row:r}; } });
  return best; }

    const hit=tlHit(x,y);
    if(ev.button===2){ if(hit){ pushHist(snapLanes()); LANES[hit.lane][hit.side].splice(hit.i,1); lanesChanged(); say("point removed"); } return; }
    if(ev.button!==0) return;

  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);

/* Line art in dark ink cannot be seen on a dark panel. The alpha IS the
   drawing, so fill through it with a colour that can. */
function tintStencil(img, colour){
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const x = c.getContext("2d");
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = "source-in";
  x.fillStyle = colour; x.fillRect(0, 0, c.width, c.height);
  return c;
}

function tipKeyFor(node, ev){
  if(!node || !node.closest) return null;
  const ctl = node.closest(".ctl[data-id]"); if(ctl) return [ctl.dataset.id, ctl];
  const tool = node.closest("[data-tool]"); if(tool) return ["tool:"+tool.dataset.tool, tool];
  const st = node.closest("[data-stamp]"); if(st) return ["stamp:"+st.dataset.stamp, st];
  const idn = node.closest("[id]");
  if(idn){
    const id = idn.id;
    if(id==="c-radius") return ["ui:radius", idn];
    if(id==="c-strength") return ["ui:strength", idn];
    if(id==="sw-lock") return ["ui:lock", idn];
    if(id==="b-generate"||id==="b-undo"||id==="b-redo") return ["ui:"+id.slice(2), idn];
    if(id==="globe") return ["btn:globe", idn];
    if(id==="homebtn") return ["btn:home", idn];
    if(id==="patchname"||id==="pn"||id==="pntag") return ["ui:patchname", document.getElementById("patchname")];
    if(id==="kbd"||id==="keys") return ["ui:kbd", document.getElementById("kbd")];
    if(/^b-/.test(id)) return ["btn:"+id.slice(2), idn];
  }
  const tl = node.closest("#tl");
  if(tl && ev){
    const c=$("#tlc"), r=c.getBoundingClientRect(); tlLayout();
    const row=rowOf(ev.clientY-r.top);
    if(row) return ["lane:"+row.def.id, tl];
    return null;
  }
  if(node.closest("#view")) return ["ui:view", $("#view")];
  return null;
}

function tipHTML(key){
  const t = TIPS[key]; if(!t) return null;
  const p = P[key];
  const title = p ? p.name : (key.indexOf(":")>0 ? "" : key);
  let what = t[0] || (p ? (p.gloss||"") : "");
  let html = "";
  if(title) html += '<span class="tt">'+esc(title)+'</span>';
  if(what)  html += '<span class="tw">'+esc(what)+'</span>';
  if(t[1])  html += '<span class="th">'+esc(t[1])+'</span>';
  if(p){
    let v = '<span class="tv">'+esc(fmt(key, V[key]));
    if(p.def!==undefined && Math.abs(p.def-V[key])>1e-6) v += '  <i>default '+esc(fmt(key,p.def))+'</i>';
    html += v+'</span>';
  }
  return html;
}
function esc(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* placed BESIDE the control: the rails push sideways, the header down, the
   timeline up. Never under the pointer, never over the thing explained. */
function tipPlace(node){
  const tip=HINT.el, r=node.getBoundingClientRect();
  tip.style.left="0px"; tip.style.top="0px";                 // measure unclamped
  const w=tip.offsetWidth, h=tip.offsetHeight, M=10;
  let x, y;
  const inL = !!node.closest("#rail-l"), inR = !!node.closest("#rail-r");
  const inH = !!node.closest("#hdr"), inT = !!node.closest("#tl"), inV = !!node.closest("#view");
  if(inL){ const rl=$("#rail-l").getBoundingClientRect(); x=rl.right+M; y=r.top-4; }
  else if(inR){ const rr=$("#rail-r").getBoundingClientRect(); x=rr.left-w-M; y=r.top-4; }
  else if(inH){ x=r.left; y=r.bottom+M; }
  else if(inT){ const rt=$("#tl").getBoundingClientRect(); x=Math.min(r.left+40, innerWidth-w-M); y=rt.top-h-M; }
  else if(inV){ const rv=$("#view").getBoundingClientRect(); x=rv.left+M; y=rv.bottom-h-M; }
  else { x=r.left; y=r.bottom+M; }
  x=clamp(x, M, Math.max(M, innerWidth-w-M));
  y=clamp(y, M, Math.max(M, innerHeight-h-M));
  tip.style.left=Math.round(x)+"px"; tip.style.top=Math.round(y)+"px";
}
function tipShow(key, node){
  const html=tipHTML(key); if(!html) return;
  HINT.el.innerHTML=html; HINT.el.classList.add("on"); tipPlace(node);
}
function tipHide(){ HINT.key=null; HINT.node=null; clearTimeout(HINT.timer); HINT.timer=0; if(HINT.el) HINT.el.classList.remove("on"); }
function setHints(on){
  HINT.on=!!on; try{ localStorage.setItem("highTide.hints", on?"1":"0"); }catch(e){}
  const b=$("#b-hints"); if(b) b.classList.toggle("on", HINT.on);
  if(!HINT.on) tipHide();
  say(HINT.on ? "hints on: hover anything to be told what it is" : "hints off - the line under the terrain still explains what you touch");
}
function initHints(){
  HINT.el=$("#tip");
  $("#b-hints").addEventListener("click", ()=> setHints(!HINT.on));
  $("#b-hints").classList.toggle("on", HINT.on);
  addEventListener("pointermove", ev=>{
    if(!HINT.on || ev.buttons) { if(ev.buttons) tipHide(); return; }
    const hit=tipKeyFor(ev.target, ev);
    const key=hit?hit[0]:null;
    if(key===HINT.key){ return; }
    tipHide();
    if(!key || !TIPS[key]) return;
    HINT.key=key; HINT.node=hit[1];
    HINT.timer=setTimeout(()=>{ if(HINT.on && HINT.key===key) tipShow(key, hit[1]); }, 350);
  }, {passive:true});
  addEventListener("pointerdown", tipHide, {passive:true});
  addEventListener("wheel", tipHide, {passive:true});
  addEventListener("blur", tipHide);
}

function layout(){ glResize(); tlResize(); if(HINT.el && HINT.key && HINT.node) tipPlace(HINT.node); }
function hideSplash(){ const s=$("#splash"); if(s && !s.classList.contains("off")){ s.classList.add("off"); setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); },500); } }
let lastT=performance.now();
function tick(){
  const now=performance.now(); const dt=Math.min(0.1,(now-lastT)/1000); lastT=now; tNow=(now-T0)/1000;
  strokeTick(dt);
  if(STROKE.on) flushDirty();
  if(GLV.ok) glDraw();
  overlayDraw();
  if(TL.dirty) tlDraw();
}
function frame(){
  try { tick(); } catch(e){ window.__err = "frame: "+(e.message||e); }
  requestAnimationFrame(frame);
}
new ResizeObserver(()=>{ layout(); }).observe($("#view"));
new ResizeObserver(()=>{ tlResize(); }).observe($("#tl"));

  gl: ()=>GLV.gl, ledger: ()=>(LED.t>0?LED.msg:idleText()),
  tips: ()=>TIPS, hints: setHints,
  decals: ()=>{ const o={}; for(const k in IMG) o[k]=IMG[k].ok; o._pearls=PEARLS.length; return o; },
  tipAt: (key,node)=>{ tipShow(key, node||document.body); const t=$("#tip").getBoundingClientRect(); return {on:$("#tip").classList.contains("on"), x:t.left, y:t.top, w:t.width, h:t.height, html:$("#tip").innerHTML}; },
  tipHide
};
</script>
